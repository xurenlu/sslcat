id: kafka
name: Apache Kafka
category: database
subcategory: message-queue
tags: [kafka, message-queue, streaming, apache]
description: 分布式流处理平台，适合构建实时数据管道和流应用。
icon: kafka
version: 1.0.0
author: SSLcat Team
website: https://kafka.apache.org/
compose_file: docker-compose.yml

variables:
  - name: KAFKA_VERSION
    type: select
    title: Kafka 版本
    default: "latest"
    options: ["latest", "3.6", "3.5"]
    description: 选择 Kafka 版本
  - name: KAFKA_PORT
    type: number
    title: Kafka 端口
    default: 9092
    min: 1024
    max: 65535
    description: Kafka Broker 端口

services:
  - name: kafka
    type: message-queue
    description: Apache Kafka 消息队列服务
    ports:
      - internal: 9092
        external: null
        public: true
    volumes:
      - name: kafka_data
        path: /var/lib/kafka/data
        mode: rw
    healthcheck:
      type: command
      command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

credentials:
  kafka:
    cluster_id:
      pattern: random
      length: 16

connection_strings:
  kafka: "{{PRIMARY_DOMAIN}}:{{KAFKA_PORT}}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  broker_url: {{PRIMARY_DOMAIN}}:{{KAFKA_PORT}}

