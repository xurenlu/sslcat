id: manga-translator
name: Manga Translator (图片翻译)
category: ai
subcategory: image-translation
tags: [python, ai, image, translation, ocr, manga, gpu]
description: [不可用] 镜像不存在 - 漫画/图片翻译工具，支持 OCR 识别、文本翻译和图片修复，专为漫画优化。
icon: manga-translator
version: 1.0.0
author: SSLcat Team
website: https://github.com/zyddnys/manga-image-translator
compose_file: docker-compose.yml

variables:
  - name: MANGA_TRANSLATOR_VERSION
    type: select
    title: Manga Translator 版本
    default: "latest"
    options: ["latest", "v2.0", "v1.0"]
    description: 选择 Manga Translator 版本
  - name: MANGA_TRANSLATOR_PORT
    type: number
    title: Manga Translator 端口
    default: 5003
    min: 1024
    max: 65535
    description: Manga Translator Web 服务端口

services:
  - name: manga-translator
    type: web
    description: Manga Translator 图片翻译服务
    ports:
      - internal: 5003
        external: null
        public: true
    volumes:
      - name: manga_translator_data
        path: /app/data
        mode: rw
      - name: manga_translator_output
        path: /app/output
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "图片翻译,OCR识别,文本修复,漫画优化"
  gpu_required: true

