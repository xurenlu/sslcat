id: ttrss
name: Tiny Tiny RSS
category: rss
subcategory: reader
tags: [php, postgresql, rss, feed, reader, ttrss]
description: 功能强大的 RSS 阅读器，支持插件扩展，适合重度 RSS 用户。
icon: ttrss
version: 1.0.0
author: SSLcat Team
website: https://tt-rss.org/
compose_file: docker-compose.yml

variables:
  - name: TTRSS_VERSION
    type: select
    title: Tiny Tiny RSS 版本
    default: "latest"
    options: ["latest", "22.12"]
    description: 选择 Tiny Tiny RSS 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: TTRSS_PORT
    type: number
    title: Tiny Tiny RSS 端口
    default: 8080
    min: 1024
    max: 65535
    description: Tiny Tiny RSS Web 服务端口

services:
  - name: ttrss
    type: web
    description: Tiny Tiny RSS 阅读器服务
    depends_on: [postgres]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: ttrss_data
        path: /var/www/ttrss
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_ttrss"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_ttrss"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: password

