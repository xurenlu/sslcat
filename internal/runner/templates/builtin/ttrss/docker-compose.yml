version: '3.8'

services:
  ttrss:
    image: wangqiru/ttrss:{{TTRSS_VERSION}}
    container_name: {{APP_NAME}}_ttrss
    restart: unless-stopped
    ports:
      - "{{TTRSS_PORT}}:80"
    environment:
      SELF_URL_PATH: http://{{PRIMARY_DOMAIN}}/
      DB_HOST: postgres
      DB_USER: {{POSTGRES_USERNAME}}
      DB_PASS: {{POSTGRES_PASSWORD}}
      DB_NAME: {{POSTGRES_DATABASE}}
      ENABLE_PLUGINS: "auth_internal,note"
    volumes:
      - ttrss_data:/var/www/ttrss
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ttrss_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

