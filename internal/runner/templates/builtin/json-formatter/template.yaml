id: json-formatter
name: JSON Formatter & Tools
category: tools
subcategory: developer-tools
tags: [json, formatter, beautifier, developer-tools, json-tools]
description: 在线 JSON 格式化、验证、压缩、美化工具集，支持 JSON 格式化、验证、压缩、美化、转换等功能。
icon: json-formatter
version: 1.0.0
author: SSLcat Team
website: https://jsonformatter.org/
compose_file: docker-compose.yml

variables:
  - name: JSON_FORMATTER_VERSION
    type: select
    title: JSON Formatter 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 JSON Formatter 版本
  - name: JSON_FORMATTER_PORT
    type: number
    title: JSON Formatter 端口
    default: 8080
    min: 1024
    max: 65535
    description: JSON Formatter Web 服务端口
  - name: MAX_INPUT_SIZE
    type: string
    title: 最大输入大小
    default: "10MB"
    description: 最大 JSON 输入大小（如：10MB, 50MB）
    placeholder: "10MB"

services:
  - name: json-formatter
    type: web
    description: JSON Formatter 工具服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: json_formatter_data
        path: /app/temp
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "JSON格式化,JSON验证,JSON压缩,JSON美化,JSON转XML,JSON转CSV,JSON转YAML"

