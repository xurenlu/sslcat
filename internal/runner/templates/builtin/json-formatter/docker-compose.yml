
services:
  json-formatter:
    image: jsonformatter/json-formatter:{{JSON_FORMATTER_VERSION}}
    container_name: {{APP_NAME}}_json_formatter
    restart: unless-stopped
    ports:
      - "{{JSON_FORMATTER_PORT}}:8080"
    environment:
      MAX_INPUT_SIZE: "{{MAX_INPUT_SIZE}}"
      TZ: Asia/Shanghai
    volumes:
      - json_formatter_data:/app/temp
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  json_formatter_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

