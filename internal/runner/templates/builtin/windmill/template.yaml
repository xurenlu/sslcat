id: windmill
name: Windmill (工作流自动化)
category: tools
subcategory: automation
tags: [rust, postgres, automation, workflow, windmill]
description: 现代化工作流自动化平台，支持 Python、TypeScript、Go 等多种语言，可视化工作流设计。
icon: windmill
version: 1.0.0
author: SSLcat Team
website: https://www.windmill.dev/
compose_file: docker-compose.yml

variables:
  - name: WINDMILL_VERSION
    type: select
    title: Windmill 版本
    default: "latest"
    options: ["latest", "v1.300", "v1.299"]
    description: 选择 Windmill 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: WINDMILL_PORT
    type: number
    title: Windmill 端口
    default: 808000
    min: 1024
    max: 65535
    description: Windmill Web 服务端口

services:
  - name: windmill
    type: web
    description: Windmill 工作流自动化服务
    depends_on: [postgres]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: windmill_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_windmill"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_windmill"
  windmill:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "工作流自动化,多语言支持,可视化设计,API集成"

