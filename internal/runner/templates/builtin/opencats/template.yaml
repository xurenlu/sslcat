id: opencats
name: OpenCATS (招聘系统)
category: tools
subcategory: hr
tags: [php, mysql, hr, opencats, recruitment, ats]
description: 开源招聘管理系统（ATS），支持候选人管理、职位发布、面试安排等功能。
icon: opencats
version: 1.0.0
author: SSLcat Team
website: https://www.opencats.org/
compose_file: docker-compose.yml

variables:
  - name: OPENCATS_VERSION
    type: select
    title: OpenCATS 版本
    default: "latest"
    options: ["latest", "v0.9", "v0.8"]
    description: 选择 OpenCATS 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: OPENCATS_PORT
    type: number
    title: OpenCATS 端口
    default: 80
    min: 1024
    max: 65535
    description: OpenCATS Web 服务端口

services:
  - name: opencats
    type: web
    description: OpenCATS 招聘系统服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: opencats_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_opencats"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_opencats"
    root_password:
      pattern: random
      length: 18

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "招聘管理,候选人管理,职位发布,面试安排"
