id: openedx
name: Open edX (在线学习平台)
category: tools
subcategory: hr
tags: [python, postgres, redis, hr, openedx, lms, e-learning]
description: 开源的在线学习平台，edX 的开源版本，支持大规模在线课程、视频学习、作业评估、证书颁发等功能。
icon: openedx
version: 1.0.0
author: SSLcat Team
website: https://open.edx.org/
compose_file: docker-compose.yml

variables:
  - name: OPENEDX_VERSION
    type: select
    title: Open edX 版本
    default: "latest"
    options: ["latest", "nutmeg", "maple"]
    description: 选择 Open edX 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: OPENEDX_PORT
    type: number
    title: Open edX 端口
    default: 808080
    min: 1024
    max: 65535
    description: Open edX Web 服务端口

services:
  - name: openedx
    type: web
    description: Open edX 在线学习平台服务
    depends_on: [postgres, redis]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: openedx_data
        path: /openedx/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_openedx"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_openedx"
  redis:
    password:
      pattern: random
      length: 16
  openedx:
    secret_key:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "大规模在线课程,视频学习,作业评估,证书颁发,学习分析"

