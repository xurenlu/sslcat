
services:
  piwigo:
    image: linuxserver/piwigo:{{PIWIGO_VERSION}}
    container_name: {{APP_NAME}}_piwigo
    restart: unless-stopped
    ports:
      - "{{PIWIGO_PORT}}:80"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    volumes:
      - piwigo_data:/config
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  piwigo_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

