
services:
  transformers:
    image: huggingface/transformers:{{TRANSFORMERS_VERSION}}
    container_name: {{APP_NAME}}_transformers
    restart: unless-stopped
    ports:
      - "{{TRANSFORMERS_PORT}}:8080"
    environment:
      MODEL_NAME: {{MODEL_NAME}}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - transformers_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  transformers_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

