id: transformers
name: Transformers (模型推理服务)
category: ai
subcategory: model-serving
tags: [python, ai, transformers, huggingface, model-serving, gpu]
description: Hugging Face Transformers 模型推理服务，支持多种预训练模型，需要 GPU。
icon: transformers
version: 1.0.0
author: SSLcat Team
website: https://github.com/huggingface/transformers
compose_file: docker-compose.yml

variables:
  - name: TRANSFORMERS_VERSION
    type: select
    title: Transformers 版本
    default: "latest"
    options: ["latest", "v4.35", "v4.34"]
    description: 选择 Transformers 版本
  - name: TRANSFORMERS_PORT
    type: number
    title: Transformers 端口
    default: 808080
    min: 1024
    max: 65535
    description: Transformers API 服务端口
  - name: MODEL_NAME
    type: string
    title: 模型名称
    default: "bert-base-uncased"
    description: 要加载的模型名称（如：bert-base-uncased, gpt2）
    placeholder: "bert-base-uncased"

services:
  - name: transformers
    type: api
    description: Transformers 模型推理服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: transformers_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api"
  features: "模型推理,多种模型,预训练模型,高性能"
  gpu_required: true

