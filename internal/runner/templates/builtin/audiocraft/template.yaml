id: audiocraft
name: AudioCraft (音乐生成)
category: ai
subcategory: music-generation
tags: [python, ai, music-generation, audiocraft, meta, gpu]
description: Meta 开源的音频生成工具，支持音乐生成和音频处理，需要 GPU。
icon: audiocraft
version: 1.0.0
author: SSLcat Team
website: https://github.com/facebookresearch/audiocraft
compose_file: docker-compose.yml

variables:
  - name: AUDIOCRAFT_VERSION
    type: select
    title: AudioCraft 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 AudioCraft 版本
  - name: AUDIOCRAFT_PORT
    type: number
    title: AudioCraft 端口
    default: 808080
    min: 1024
    max: 65535
    description: AudioCraft API 服务端口

services:
  - name: audiocraft
    type: api
    description: AudioCraft 音乐生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: audiocraft_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  features: "音乐生成,音频处理,高质量输出"
  gpu_required: true

