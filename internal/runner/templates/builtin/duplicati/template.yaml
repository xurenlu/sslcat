id: duplicati
name: Duplicati
category: tools
subcategory: backup
tags: [csharp, backup, duplicati]
description: 开源备份工具，支持加密、压缩和多种存储后端。
icon: duplicati
version: 1.0.0
author: SSLcat Team
website: https://www.duplicati.com/
compose_file: docker-compose.yml

variables:
  - name: DUPLICATI_VERSION
    type: select
    title: Duplicati 版本
    default: "latest"
    options: ["latest", "2.0", "2.1"]
    description: 选择 Duplicati 版本
  - name: DUPLICATI_PORT
    type: number
    title: Duplicati 端口
    default: 8200
    min: 1024
    max: 65535
    description: Duplicati Web 服务端口

services:
  - name: duplicati
    type: web
    description: Duplicati 备份服务
    ports:
      - internal: 8200
        external: null
        public: true
    volumes:
      - name: duplicati_data
        path: /config
        mode: rw
      - name: duplicati_backups
        path: /backups
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_password: admin
  features: "加密,压缩,增量备份"

