
services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:{{DUPLICATI_VERSION}}
    container_name: {{APP_NAME}}_duplicati
    restart: unless-stopped
    ports:
      - "{{DUPLICATI_PORT}}:8200"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
    volumes:
      - duplicati_data:/config
      - duplicati_backups:/backups
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  duplicati_data:
    driver: local
  duplicati_backups:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

