id: hedgedoc
name: HedgeDoc
category: collaboration
subcategory: editor
tags: [nodejs, postgresql, markdown, collaboration, hedgedoc]
description: 实时协作的 Markdown 编辑器，支持多人同时编辑，类似 HackMD。
icon: hedgedoc
version: 1.0.0
author: SSLcat Team
website: https://hedgedoc.org/
compose_file: docker-compose.yml

variables:
  - name: HEDGEDOC_VERSION
    type: select
    title: HedgeDoc 版本
    default: "latest"
    options: ["latest", "1.9.9"]
    description: 选择 HedgeDoc 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: HEDGEDOC_PORT
    type: number
    title: HedgeDoc 端口
    default: 3000
    min: 1024
    max: 65535
    description: HedgeDoc Web 服务端口

services:
  - name: hedgedoc
    type: web
    description: HedgeDoc 协作编辑器服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: hedgedoc_data
        path: /hedgedoc/public/uploads
        mode: rw
    healthcheck:
      type: http
      path: /healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_hedgedoc"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_hedgedoc"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

