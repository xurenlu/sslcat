id: qwen
name: Qwen (通义千问)
category: ai
subcategory: llm
tags: [python, ai, llm, qwen, chinese, alibaba, gpu]
description: 阿里云开源的通义千问大语言模型，支持中文对话和多任务处理，需要 GPU。
icon: qwen
version: 1.0.0
author: SSLcat Team
website: https://github.com/QwenLM/Qwen
compose_file: docker-compose.yml

variables:
  - name: QWEN_VERSION
    type: select
    title: Qwen 版本
    default: "latest"
    options: ["latest", "v2.5", "v2.0"]
    description: 选择 Qwen 版本
  - name: QWEN_PORT
    type: number
    title: Qwen 端口
    default: 808000
    min: 1024
    max: 65535
    description: Qwen API 服务端口

services:
  - name: qwen
    type: api
    description: Qwen 中文大模型服务
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: qwen_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/chat"
  features: "中文对话,多任务处理,代码生成,知识问答"
  gpu_required: true

