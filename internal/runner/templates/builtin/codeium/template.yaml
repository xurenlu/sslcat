id: codeium
name: Codeium (AI代码助手)
category: ai
subcategory: code-generation
tags: [nodejs, postgres, ai, code-generation, coding-assistant, codeium]
description: AI 代码助手，支持代码补全、解释和生成，类似 GitHub Copilot。
icon: codeium
version: 1.0.0
author: SSLcat Team
website: https://codeium.com/
compose_file: docker-compose.yml

variables:
  - name: CODEIUM_VERSION
    type: select
    title: Codeium 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Codeium 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: CODEIUM_PORT
    type: number
    title: Codeium 端口
    default: 808080
    min: 1024
    max: 65535
    description: Codeium Web 服务端口
  - name: CODEIUM_API_KEY
    type: string
    title: Codeium API Key
    default: ""
    description: Codeium API 密钥（可选）
    sensitive: true

services:
  - name: codeium
    type: web
    description: Codeium AI 代码助手服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: codeium_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_codeium"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_codeium"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "代码补全,代码解释,代码生成,多语言支持"

