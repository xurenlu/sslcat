id: clip-interrogator
name: CLIP Interrogator (图片描述生成)
category: ai
subcategory: image-analysis
tags: [python, ai, image-analysis, clip, prompt-generation, gpu]
description: 从图片生成详细的文本描述，用于 AI 图片生成提示词，需要 GPU。
icon: clip-interrogator
version: 1.0.0
author: SSLcat Team
website: https://github.com/pharmapsychotic/clip-interrogator
compose_file: docker-compose.yml

variables:
  - name: CLIP_INTERROGATOR_VERSION
    type: select
    title: CLIP Interrogator 版本
    default: "latest"
    options: ["latest", "v2.0", "v1.0"]
    description: 选择 CLIP Interrogator 版本
  - name: CLIP_INTERROGATOR_PORT
    type: number
    title: CLIP Interrogator 端口
    default: 808080
    min: 1024
    max: 65535
    description: CLIP Interrogator API 服务端口

services:
  - name: clip-interrogator
    type: api
    description: CLIP Interrogator 图片描述生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: clip_interrogator_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/interrogate"
  features: "图片描述生成,提示词生成,详细分析"
  gpu_required: true

