version: '3.8'

services:
  clip-interrogator:
    image: clip-interrogator/server:{{CLIP_INTERROGATOR_VERSION}}
    container_name: {{APP_NAME}}_clip_interrogator
    restart: unless-stopped
    ports:
      - "{{CLIP_INTERROGATOR_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - clip_interrogator_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  clip_interrogator_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

