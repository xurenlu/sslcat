id: node-red
name: Node-RED (流程编程)
category: tools
subcategory: automation
tags: [nodejs, automation, iot, node-red, flow-programming]
description: 基于流的编程工具，用于连接硬件设备、API 和服务，特别适合 IoT 应用。
icon: node-red
version: 1.0.0
author: SSLcat Team
website: https://nodered.org/
compose_file: docker-compose.yml

variables:
  - name: NODE_RED_VERSION
    type: select
    title: Node-RED 版本
    default: "latest"
    options: ["latest", "3.0", "2.2"]
    description: 选择 Node-RED 版本
  - name: NODE_RED_PORT
    type: number
    title: Node-RED 端口
    default: 1880
    min: 1024
    max: 65535
    description: Node-RED Web 服务端口

services:
  - name: node-red
    type: web
    description: Node-RED 流程编程服务
    ports:
      - internal: 1880
        external: null
        public: true
    volumes:
      - name: node_red_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  node-red:
    credential_secret:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "流程编程,IoT连接,可视化设计,丰富插件"

