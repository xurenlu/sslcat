version: '3.8'

services:
  node-red:
    image: nodered/node-red:{{NODE_RED_VERSION}}
    container_name: {{APP_NAME}}_node_red
    restart: unless-stopped
    ports:
      - "{{NODE_RED_PORT}}:1880"
    environment:
      NODE_RED_CREDENTIAL_SECRET: {{NODE_RED_SECRET}}
    volumes:
      - node_red_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  node_red_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

