
services:
  jellyfin:
    image: jellyfin/jellyfin:{{JELLYFIN_VERSION}}
    container_name: {{APP_NAME}}_jellyfin
    restart: unless-stopped
    ports:
      - "{{JELLYFIN_PORT}}:8096"
    environment:
      JELLYFIN_PublishedServerUrl: http://{{PRIMARY_DOMAIN}}
      TZ: Asia/Shanghai
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - jellyfin_media:/media
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  jellyfin_config:
    driver: local
  jellyfin_cache:
    driver: local
  jellyfin_media:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

