id: jumpserver
name: JumpServer (堡垒机)
category: tools
subcategory: security
tags: [python, mysql, redis, security, jumpserver, bastion-host]
description: 开源堡垒机，提供安全审计、会话录制、权限管理等功能，支持 SSH、RDP、VNC 等协议。
icon: jumpserver
version: 1.0.0
author: SSLcat Team
website: https://www.jumpserver.org/
compose_file: docker-compose.yml

variables:
  - name: JUMPSERVER_VERSION
    type: select
    title: JumpServer 版本
    default: "latest"
    options: ["latest", "v3.0", "v2.28"]
    description: 选择 JumpServer 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: JUMPSERVER_PORT
    type: number
    title: JumpServer Web 端口
    default: 808080
    min: 1024
    max: 65535
    description: JumpServer Web 服务端口
  - name: JUMPSERVER_SSH_PORT
    type: number
    title: JumpServer SSH 端口
    default: 2222
    min: 1024
    max: 65535
    description: JumpServer SSH 服务端口

services:
  - name: jumpserver
    type: web
    description: JumpServer 堡垒机服务
    depends_on: [mysql, redis]
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 2222
        external: null
        public: true
    volumes:
      - name: jumpserver_data
        path: /opt/jumpserver/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  mysql:
    username:
      pattern: "{app_name}_jumpserver"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_jumpserver"
    root_password:
      pattern: random
      length: 18
  redis:
    password:
      pattern: random
      length: 16
  jumpserver:
    secret_key:
      pattern: random
      length: 50
    bootstrap_token:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin
  supported_protocols: "SSH,RDP,VNC,Telnet"
  features: "堡垒机,安全审计,会话录制,权限管理"
