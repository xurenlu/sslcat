version: '3.8'

services:
  jumpserver:
    image: jumpserver/jms_all:{{JUMPSERVER_VERSION}}
    container_name: {{APP_NAME}}_jumpserver
    restart: unless-stopped
    ports:
      - "{{JUMPSERVER_PORT}}:80"
      - "{{JUMPSERVER_SSH_PORT}}:2222"
    environment:
      SECRET_KEY: {{JUMPSERVER_SECRET_KEY}}
      BOOTSTRAP_TOKEN: {{JUMPSERVER_BOOTSTRAP_TOKEN}}
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: {{MYSQL_USERNAME}}
      DB_PASSWORD: {{MYSQL_PASSWORD}}
      DB_NAME: {{MYSQL_DATABASE}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: {{REDIS_PASSWORD}}
    volumes:
      - jumpserver_data:/opt/jumpserver/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p{{MYSQL_ROOT_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    command: redis-server --requirepass {{REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  jumpserver_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
