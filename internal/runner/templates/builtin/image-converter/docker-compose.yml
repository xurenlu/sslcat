
services:
  image-converter:
    image: libvips/libvips:{{IMAGEMAGICK_VERSION}}
    container_name: {{APP_NAME}}_image_converter
    restart: unless-stopped
    ports:
      - "{{CONVERTER_PORT}}:8080"
    environment:
      MAX_FILE_SIZE: "{{MAX_FILE_SIZE}}"
      QUALITY: "{{QUALITY}}"
      TZ: Asia/Shanghai
    volumes:
      - converter_data:/tmp/converter
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  converter_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

