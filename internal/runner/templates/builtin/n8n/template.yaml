id: n8n
name: N8N (工作流自动化)
category: tools
subcategory: automation
tags: [nodejs, postgres, automation, workflow, n8n, zapier-alternative]
description: 强大的工作流自动化平台，类似 Zapier，支持 400+ 集成，可视化工作流设计。
icon: n8n
version: 1.0.0
author: SSLcat Team
website: https://n8n.io/
compose_file: docker-compose.yml

variables:
  - name: N8N_VERSION
    type: select
    title: N8N 版本
    default: "latest"
    options: ["latest", "1.0", "0.235"]
    description: 选择 N8N 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: N8N_PORT
    type: number
    title: N8N 端口
    default: 5678
    min: 1024
    max: 65535
    description: N8N Web 服务端口
  - name: N8N_USERNAME
    type: string
    title: N8N 用户名
    default: "admin"
    description: N8N 登录用户名
  - name: N8N_PASSWORD
    type: string
    title: N8N 密码
    default: ""
    description: N8N 登录密码
    required: true
    sensitive: true

services:
  - name: n8n
    type: web
    description: N8N 工作流自动化服务
    depends_on: [postgres]
    ports:
      - internal: 5678
        external: null
        public: true
    volumes:
      - name: n8n_data
        path: /home/node/.n8n
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_n8n"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_n8n"
  n8n:
    username:
      pattern: "{N8N_USERNAME}"
    password:
      pattern: "{N8N_PASSWORD}"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: https://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "工作流自动化,400+集成,可视化设计,定时任务"

