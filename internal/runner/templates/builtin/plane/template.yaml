id: plane
name: Plane
category: project
subcategory: issue-tracking
tags: [nextjs, postgresql, redis, project, issue-tracking, plane]
description: 现代化的项目管理工具，类似 Linear，界面简洁美观。
icon: plane
version: 1.0.0
author: SSLcat Team
website: https://plane.so/
compose_file: docker-compose.yml

variables:
  - name: PLANE_VERSION
    type: select
    title: Plane 版本
    default: "latest"
    options: ["latest", "0.20.0"]
    description: 选择 Plane 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: PLANE_PORT
    type: number
    title: Plane 端口
    default: 808000
    min: 1024
    max: 65535
    description: Plane Web 服务端口

services:
  - name: plane-app
    type: web
    description: Plane 项目管理服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: plane_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_plane"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_plane"
  plane:
    secret_key:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

