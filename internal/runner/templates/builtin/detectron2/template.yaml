id: detectron2
name: Detectron2 (物体检测)
category: ai
subcategory: object-detection
tags: [python, ai, object-detection, detectron2, facebook, gpu]
description: Facebook 开源的物体检测和分割框架，支持多种检测任务，需要 GPU。
icon: detectron2
version: 1.0.0
author: SSLcat Team
website: https://github.com/facebookresearch/detectron2
compose_file: docker-compose.yml

variables:
  - name: DETECTRON2_VERSION
    type: select
    title: Detectron2 版本
    default: "latest"
    options: ["latest", "v0.6", "v0.5"]
    description: 选择 Detectron2 版本
  - name: DETECTRON2_PORT
    type: number
    title: Detectron2 端口
    default: 808080
    min: 1024
    max: 65535
    description: Detectron2 API 服务端口

services:
  - name: detectron2
    type: api
    description: Detectron2 物体检测服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: detectron2_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/detect"
  features: "物体检测,实例分割,关键点检测,姿态估计"
  gpu_required: true

