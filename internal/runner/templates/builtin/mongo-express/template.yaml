id: mongo-express
name: mongo-express (MongoDB管理)
category: tools
subcategory: database-admin
tags: [nodejs, mongodb, database-admin, mongo-express]
description: MongoDB Web 管理工具，提供图形化界面管理 MongoDB 数据库。
icon: mongo-express
version: 1.0.0
author: SSLcat Team
website: https://github.com/mongo-express/mongo-express
compose_file: docker-compose.yml

variables:
  - name: MONGO_EXPRESS_VERSION
    type: select
    title: mongo-express 版本
    default: "latest"
    options: ["latest", "1.0", "0.54"]
    description: 选择 mongo-express 版本
  - name: MONGO_EXPRESS_PORT
    type: number
    title: mongo-express 端口
    default: 8081
    min: 1024
    max: 65535
    description: mongo-express Web 服务端口
  - name: MONGODB_HOST
    type: string
    title: MongoDB 主机
    default: "mongo"
    description: MongoDB 服务器地址
    placeholder: "mongo"
  - name: MONGODB_PORT
    type: number
    title: MongoDB 端口
    default: 27017
    min: 1
    max: 65535
    description: MongoDB 服务器端口
  - name: MONGODB_USERNAME
    type: string
    title: MongoDB 用户名
    default: "admin"
    description: MongoDB 登录用户名
  - name: MONGODB_PASSWORD
    type: string
    title: MongoDB 密码
    default: ""
    description: MongoDB 登录密码
    required: true
    sensitive: true
  - name: MONGO_EXPRESS_USERNAME
    type: string
    title: mongo-express 用户名
    default: "admin"
    description: mongo-express Web 界面登录用户名
  - name: MONGO_EXPRESS_PASSWORD
    type: string
    title: mongo-express 密码
    default: ""
    description: mongo-express Web 界面登录密码
    required: true
    sensitive: true

services:
  - name: mongo-express
    type: web
    description: mongo-express MongoDB 管理工具
    ports:
      - internal: 8081
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  mongodb:
    username:
      pattern: "{MONGODB_USERNAME}"
    password:
      pattern: "{MONGODB_PASSWORD}"
  mongo-express:
    username:
      pattern: "{MONGO_EXPRESS_USERNAME}"
    password:
      pattern: "{MONGO_EXPRESS_PASSWORD}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8081
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "MongoDB管理,图形化界面,文档查看,数据导入导出"

