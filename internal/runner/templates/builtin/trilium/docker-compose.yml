version: '3.8'

services:
  trilium:
    image: zadam/trilium:{{TRILIUM_VERSION}}
    container_name: {{APP_NAME}}_trilium
    restart: unless-stopped
    ports:
      - "{{TRILIUM_PORT}}:8080"
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    volumes:
      - trilium_data:/home/node/trilium-data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  trilium_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

