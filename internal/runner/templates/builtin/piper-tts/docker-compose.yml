
services:
  piper-tts:
    image: rhasspy/piper:{{PIPER_TTS_VERSION}}
    container_name: {{APP_NAME}}_piper_tts
    restart: unless-stopped
    ports:
      - "{{PIPER_TTS_PORT}}:5000"
    environment:
      PIPER_MODEL: "{{PIPER_MODEL}}"
    volumes:
      - piper_tts_data:/app/models
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  piper_tts_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

