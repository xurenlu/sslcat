id: appsmith
name: Appsmith (低代码平台)
category: tools
subcategory: low-code
tags: [nodejs, mongodb, redis, low-code, appsmith, internal-tools]
description: 低代码应用构建平台，快速构建内部工具、管理面板和 CRUD 应用。
icon: appsmith
version: 1.0.0
author: SSLcat Team
website: https://www.appsmith.com/
compose_file: docker-compose.yml

variables:
  - name: APPSMITH_VERSION
    type: select
    title: Appsmith 版本
    default: "latest"
    options: ["latest", "v1.9", "v1.8"]
    description: 选择 Appsmith 版本
  - name: MONGODB_VERSION
    type: select
    title: MongoDB 版本
    default: "7"
    options: ["7", "6", "5"]
    description: 选择 MongoDB 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: APPSMITH_PORT
    type: number
    title: Appsmith 端口
    default: 808080
    min: 1024
    max: 65535
    description: Appsmith Web 服务端口

services:
  - name: appsmith
    type: web
    description: Appsmith 低代码平台服务
    depends_on: [mongo, redis]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: appsmith_data
        path: /appsmith-stacks
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mongo
    type: database
    description: MongoDB 数据库服务
    ports:
      - internal: 27017
        external: null
        public: false
    volumes:
      - name: mongo_data
        path: /data/db
        mode: rw
    healthcheck:
      type: command
      command: ["mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  mongo:
    username:
      pattern: "{app_name}_appsmith"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_appsmith"
  redis:
    password:
      pattern: random
      length: 16

connection_strings:
  mongo: "mongodb://{username}:{password}@mongo:27017/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "低代码平台,可视化构建,数据库连接,API集成"

