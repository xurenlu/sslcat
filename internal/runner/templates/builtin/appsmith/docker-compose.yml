version: '3.8'

services:
  appsmith:
    image: appsmith/appsmith-ce:{{APPSMITH_VERSION}}
    container_name: {{APP_NAME}}_appsmith
    restart: unless-stopped
    ports:
      - "{{APPSMITH_PORT}}:80"
    environment:
      APPSMITH_MONGODB_URI: mongodb://{{MONGODB_USERNAME}}:{{MONGODB_PASSWORD}}@mongo:27017/{{MONGODB_DATABASE}}
      APPSMITH_REDIS_URL: redis://:{{REDIS_PASSWORD}}@redis:6379
    volumes:
      - appsmith_data:/appsmith-stacks
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mongo:
    image: mongo:{{MONGODB_VERSION}}
    container_name: {{APP_NAME}}_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: {{MONGODB_USERNAME}}
      MONGO_INITDB_ROOT_PASSWORD: {{MONGODB_PASSWORD}}
      MONGO_INITDB_DATABASE: {{MONGODB_DATABASE}}
    volumes:
      - mongo_data:/data/db
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    command: redis-server --requirepass {{REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  appsmith_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

