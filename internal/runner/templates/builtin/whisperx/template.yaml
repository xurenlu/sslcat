id: whisperx
name: WhisperX (视频翻译)
category: ai
subcategory: video-translation
tags: [python, ai, video, translation, whisperx, gpu]
description: 强大的视频翻译工具，支持语音识别、时间戳对齐和翻译。
icon: whisperx
version: 1.0.0
author: SSLcat Team
website: https://github.com/m-bain/whisperX
compose_file: docker-compose.yml

variables:
  - name: WHISPERX_VERSION
    type: select
    title: WhisperX 版本
    default: "latest"
    options: ["latest", "v3", "v2"]
    description: 选择 WhisperX 版本
  - name: WHISPERX_PORT
    type: number
    title: WhisperX 端口
    default: 8000
    min: 1024
    max: 65535
    description: WhisperX API 服务端口
  - name: WHISPERX_MODEL
    type: select
    title: WhisperX 模型
    default: "large-v2"
    options: ["tiny", "base", "small", "medium", "large-v2", "large-v3"]
    description: 选择 WhisperX 模型大小

services:
  - name: whisperx
    type: api
    description: WhisperX 视频翻译服务
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: whisperx_data
        path: /app/data
        mode: rw
      - name: whisperx_models
        path: /app/models
        mode: rw
    resources:
      gpu: optional
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/translate"
  features: "视频翻译,时间戳对齐,多语言支持"

