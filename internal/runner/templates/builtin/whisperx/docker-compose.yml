
services:
  whisperx:
    image: thomasvvugt/whisperx:{{WHISPERX_VERSION}}
    container_name: {{APP_NAME}}_whisperx
    restart: unless-stopped
    ports:
      - "{{WHISPERX_PORT}}:8000"
    environment:
      WHISPERX_MODEL: "{{WHISPERX_MODEL}}"
    volumes:
      - whisperx_data:/app/data
      - whisperx_models:/app/models
    networks:
      - {{APP_NAME}}_network
    command: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "which", "whisperx"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  whisperx_data:
    driver: local
  whisperx_models:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

