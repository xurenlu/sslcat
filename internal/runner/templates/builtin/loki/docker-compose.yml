
services:
  loki:
    image: grafana/loki:{{LOKI_VERSION}}
    container_name: {{APP_NAME}}_loki
    restart: unless-stopped
    ports:
      - "{{LOKI_PORT}}:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  loki_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

