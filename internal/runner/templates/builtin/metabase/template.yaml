id: metabase
name: Metabase
category: analytics
subcategory: bi
tags: [java, postgresql, analytics, bi, business-intelligence, metabase]
description: 开源商业智能工具，可以连接多种数据源，创建可视化报表和仪表板。
icon: metabase
version: 1.0.0
author: SSLcat Team
website: https://www.metabase.com/
compose_file: docker-compose.yml

variables:
  - name: METABASE_VERSION
    type: select
    title: Metabase 版本
    default: "latest"
    options: ["latest", "v0.49", "v0.48"]
    description: 选择 Metabase 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: METABASE_PORT
    type: number
    title: Metabase 端口
    default: 3000
    min: 1024
    max: 65535
    description: Metabase Web 服务端口

services:
  - name: metabase
    type: web
    description: Metabase BI 平台服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: metabase_data
        path: /metabase-data
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_metabase"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_metabase"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

