
services:
  table-transformer:
    image: table-transformer/server:{{TABLE_TRANSFORMER_VERSION}}
    container_name: {{APP_NAME}}_table_transformer
    restart: unless-stopped
    ports:
      - "{{TABLE_TRANSFORMER_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - table_transformer_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  table_transformer_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

