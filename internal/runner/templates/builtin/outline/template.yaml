id: outline
name: Outline
category: collaboration
subcategory: wiki
tags: [nodejs, postgresql, redis, wiki, documentation, outline]
description: 现代化的团队知识库，界面美观，支持 Markdown 和协作编辑。
icon: outline
version: 1.0.0
author: SSLcat Team
website: https://www.getoutline.com/
compose_file: docker-compose.yml

variables:
  - name: OUTLINE_VERSION
    type: select
    title: Outline 版本
    default: "latest"
    options: ["latest", "0.80.0"]
    description: 选择 Outline 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: OUTLINE_PORT
    type: number
    title: Outline 端口
    default: 3000
    min: 1024
    max: 65535
    description: Outline Web 服务端口

services:
  - name: outline
    type: web
    description: Outline 知识库服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: outline_data
        path: /var/lib/outline/data
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_outline"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_outline"
  outline:
    secret_key:
      pattern: random
      length: 64
    utils_secret:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

