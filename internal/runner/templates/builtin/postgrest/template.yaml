id: postgrest
name: PostgREST (REST API for PostgreSQL)
category: tools
subcategory: database-api
tags: [postgresql, rest-api, database, postgrest, api]
description: 为 PostgreSQL 数据库自动生成 RESTful API，无需编写代码即可通过 HTTP 接口操作数据库。
icon: postgrest
version: 1.0.0
author: SSLcat Team
website: https://postgrest.org/
compose_file: docker-compose.yml

variables:
  - name: POSTGREST_VERSION
    type: select
    title: PostgREST 版本
    default: "latest"
    options: ["latest", "12", "11"]
    description: 选择 PostgREST 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: POSTGREST_PORT
    type: number
    title: PostgREST 端口
    default: 3000
    min: 1024
    max: 65535
    description: PostgREST API 服务端口
  - name: POSTGREST_SCHEMA
    type: string
    title: 数据库 Schema
    default: "public"
    description: 暴露的数据库 Schema 名称
    placeholder: "public"
  - name: POSTGREST_ANON_ROLE
    type: string
    title: 匿名角色
    default: "anon"
    description: 匿名访问的数据库角色名称
    placeholder: "anon"

services:
  - name: postgrest
    type: api
    description: PostgREST API 服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_postgrest"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_postgrest"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  api: "http://{{PRIMARY_DOMAIN}}"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_docs: "http://{{PRIMARY_DOMAIN}}/docs"
  features: "自动REST API,数据库操作,查询过滤,权限控制"

