id: postgrest
name: PostgREST (REST API)
category: tools
subcategory: api
tags: [haskell, postgres, api, postgrest, rest-api]
description: 自动从 PostgreSQL 数据库生成 RESTful API，无需编写代码，直接暴露数据库为 REST API。
icon: postgrest
version: 1.0.0
author: SSLcat Team
website: https://postgrest.org/
compose_file: docker-compose.yml

variables:
  - name: POSTGREST_VERSION
    type: select
    title: PostgREST 版本
    default: "latest"
    options: ["latest", "v12", "v11"]
    description: 选择 PostgREST 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: POSTGREST_PORT
    type: number
    title: PostgREST 端口
    default: 3000
    min: 1024
    max: 65535
    description: PostgREST REST API 端口
  - name: POSTGRES_ANON_ROLE
    type: string
    title: PostgreSQL 匿名角色
    default: "anon"
    description: PostgreSQL 匿名用户角色名称
    placeholder: "anon"

services:
  - name: postgrest
    type: api
    description: PostgREST REST API 服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_postgrest"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_postgrest"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}:3000"
  features: "REST API,自动生成,无需编码,权限控制"
