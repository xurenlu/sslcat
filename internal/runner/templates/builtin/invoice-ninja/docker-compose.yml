
services:
  invoice-ninja:
    image: invoiceninja/invoiceninja:{{INVOICE_NINJA_VERSION}}
    container_name: {{APP_NAME}}_invoice_ninja
    restart: unless-stopped
    ports:
      - "{{INVOICE_NINJA_PORT}}:80"
    environment:
      DB_HOST: mysql
      DB_DATABASE: {{MYSQL_DATABASE}}
      DB_USERNAME: {{MYSQL_USERNAME}}
      DB_PASSWORD: {{MYSQL_PASSWORD}}
      APP_KEY: {{INVOICE_NINJA_APP_KEY}}
      APP_URL: http://{{PRIMARY_DOMAIN}}
    volumes:
      - invoice_ninja_data:/var/www/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p{{MYSQL_ROOT_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  invoice_ninja_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

