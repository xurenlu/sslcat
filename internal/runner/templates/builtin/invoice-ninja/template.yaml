id: invoice-ninja
name: Invoice Ninja (发票管理)
category: tools
subcategory: finance
tags: [php, mysql, finance, invoice, billing]
description: 开源的发票和账单管理系统，支持发票创建、客户管理、在线支付、时间追踪等功能。
icon: invoice-ninja
version: 1.0.0
author: SSLcat Team
website: https://www.invoiceninja.com/
compose_file: docker-compose.yml

variables:
  - name: INVOICE_NINJA_VERSION
    type: select
    title: Invoice Ninja 版本
    default: "latest"
    options: ["latest", "v5.7", "v5.6"]
    description: 选择 Invoice Ninja 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: INVOICE_NINJA_PORT
    type: number
    title: Invoice Ninja 端口
    default: 80
    min: 1024
    max: 65535
    description: Invoice Ninja Web 服务端口

services:
  - name: invoice-ninja
    type: web
    description: Invoice Ninja 发票管理系统服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: invoice_ninja_data
        path: /var/www/app/storage
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_invoice"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_invoice"
    root_password:
      pattern: random
      length: 18
  invoice-ninja:
    app_key:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin@example.com
  default_admin_password: changeme
  features: "发票创建,客户管理,在线支付,时间追踪,报表统计"

