
services:
  komga:
    image: gotson/komga:{{KOMGA_VERSION}}
    container_name: {{APP_NAME}}_komga
    restart: unless-stopped
    ports:
      - "{{KOMGA_PORT}}:25600"
    environment:
      KOMGA_LIBRARY_SCAN_CRON: "0 0 * * *"
      KOMGA_LIBRARY_SCAN_STARTUP: "true"
    volumes:
      - komga_data:/config
      - komga_books:/books
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:25600/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  komga_data:
    driver: local
  komga_books:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

