id: komga
name: Komga
category: media
subcategory: comic
tags: [java, comic, manga, library, komga]
description: 漫画和电子书库管理平台，支持在线阅读和管理。
icon: komga
version: 1.0.0
author: SSLcat Team
website: https://komga.org/
compose_file: docker-compose.yml

variables:
  - name: KOMGA_VERSION
    type: select
    title: Komga 版本
    default: "latest"
    options: ["latest", "1.5", "1.4"]
    description: 选择 Komga 版本
  - name: KOMGA_PORT
    type: number
    title: Komga 端口
    default: 25600
    min: 1024
    max: 65535
    description: Komga Web 服务端口

services:
  - name: komga
    type: web
    description: Komga 漫画库服务
    ports:
      - internal: 25600
        external: null
        public: true
    volumes:
      - name: komga_data
        path: /config
        mode: rw
      - name: komga_books
        path: /books
        mode: rw
    healthcheck:
      type: http
      path: /actuator/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin@komga.org
  default_admin_password: komga

