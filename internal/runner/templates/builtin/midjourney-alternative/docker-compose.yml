version: '3.8'

services:
  midjourney-alternative:
    image: midjourney-alternative/server:{{MIDJOURNEY_ALT_VERSION}}
    container_name: {{APP_NAME}}_midjourney_alternative
    restart: unless-stopped
    ports:
      - "{{MIDJOURNEY_ALT_PORT}}:8080"
    environment:
      OPENAI_API_KEY: {{OPENAI_API_KEY}}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - midjourney_alt_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  midjourney_alt_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

