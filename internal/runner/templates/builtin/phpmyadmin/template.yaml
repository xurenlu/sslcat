id: phpmyadmin
name: phpMyAdmin (MySQL管理)
category: tools
subcategory: database-admin
tags: [php, mysql, database-admin, phpmyadmin]
description: MySQL/MariaDB Web 管理工具，提供图形化界面管理数据库。
icon: phpmyadmin
version: 1.0.0
author: SSLcat Team
website: https://www.phpmyadmin.net/
compose_file: docker-compose.yml

variables:
  - name: PHPMYADMIN_VERSION
    type: select
    title: phpMyAdmin 版本
    default: "latest"
    options: ["latest", "5.2", "5.1"]
    description: 选择 phpMyAdmin 版本
  - name: PHPMYADMIN_PORT
    type: number
    title: phpMyAdmin 端口
    default: 8080
    min: 1024
    max: 65535
    description: phpMyAdmin Web 服务端口
  - name: MYSQL_HOST
    type: string
    title: MySQL 主机
    default: "mysql"
    description: MySQL 服务器地址
    placeholder: "mysql"
  - name: MYSQL_PORT
    type: number
    title: MySQL 端口
    default: 3306
    min: 1
    max: 65535
    description: MySQL 服务器端口
  - name: MYSQL_USERNAME
    type: string
    title: MySQL 用户名
    default: "root"
    description: MySQL 登录用户名
  - name: MYSQL_PASSWORD
    type: string
    title: MySQL 密码
    default: ""
    description: MySQL 登录密码
    required: true
    sensitive: true
  - name: MYSQL_ROOT_PASSWORD
    type: string
    title: MySQL Root 密码
    default: ""
    description: MySQL Root 用户密码（可选）
    sensitive: true

services:
  - name: phpmyadmin
    type: web
    description: phpMyAdmin MySQL 管理工具
    ports:
      - internal: 80
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{MYSQL_USERNAME}"
    password:
      pattern: "{MYSQL_PASSWORD}"
    root_password:
      pattern: "{MYSQL_ROOT_PASSWORD}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "MySQL管理,图形化界面,SQL执行,数据导入导出"

