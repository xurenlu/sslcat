
services:
  openrouter:
    image: openrouter/openrouter-proxy:{{OPENROUTER_VERSION}}
    container_name: {{APP_NAME}}_openrouter
    restart: unless-stopped
    ports:
      - "{{OPENROUTER_PORT}}:8080"
    environment:
      OPENROUTER_API_KEY: {{OPENROUTER_API_KEY}}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
    volumes:
      - openrouter_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  openrouter_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

