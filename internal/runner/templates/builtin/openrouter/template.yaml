id: openrouter
name: OpenRouter Proxy
category: ai
subcategory: api-aggregator
tags: [nodejs, ai, api, openrouter, proxy]
description: OpenRouter API 代理服务，聚合多个 AI 模型提供商。
icon: openrouter
version: 1.0.0
author: SSLcat Team
website: https://openrouter.ai/
compose_file: docker-compose.yml

variables:
  - name: OPENROUTER_VERSION
    type: select
    title: OpenRouter Proxy 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 OpenRouter Proxy 版本
  - name: OPENROUTER_PORT
    type: number
    title: OpenRouter Proxy 端口
    default: 8080
    min: 1024
    max: 65535
    description: OpenRouter Proxy API 服务端口
  - name: OPENROUTER_API_KEY
    type: string
    title: OpenRouter API Key
    default: ""
    description: OpenRouter API 密钥（需要注册获取）
    required: true
    sensitive: true

services:
  - name: openrouter
    type: api
    description: OpenRouter API 代理服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: openrouter_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/v1"
  supported_providers: "OpenAI,Anthropic,Google,Groq,Cohere"
  features: "API聚合,统一接口,多模型支持"

