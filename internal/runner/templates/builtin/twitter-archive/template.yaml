id: twitter-archive
name: Twitter归档工具
category: tools
subcategory: social
tags: [python, postgres, social, twitter-archive, backup]
description: Twitter 数据归档工具，支持导出和备份 Twitter 账号的推文、媒体、关注列表等数据。
icon: twitter-archive
version: 1.0.0
author: SSLcat Team
website: https://github.com/twitter-archive
compose_file: docker-compose.yml

variables:
  - name: TWITTER_ARCHIVE_VERSION
    type: select
    title: Twitter归档工具版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Twitter归档工具版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: TWITTER_ARCHIVE_PORT
    type: number
    title: Twitter归档工具端口
    default: 8080
    min: 1024
    max: 65535
    description: Twitter归档工具 Web 服务端口

services:
  - name: twitter-archive
    type: web
    description: Twitter归档工具服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: twitter_archive_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_twitter_archive"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_twitter_archive"
  twitter-archive:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "数据导出,推文备份,媒体备份,关注列表备份,数据统计"

