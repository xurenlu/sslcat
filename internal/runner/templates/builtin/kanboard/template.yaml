id: kanboard
name: Kanboard
category: project-management
subcategory: kanban
tags: [php, postgres, kanban, kanboard]
description: 简洁的看板工具，专注于任务管理，轻量高效。
icon: kanboard
version: 1.0.0
author: SSLcat Team
website: https://kanboard.org/
compose_file: docker-compose.yml

variables:
  - name: KANBOARD_VERSION
    type: select
    title: Kanboard 版本
    default: "latest"
    options: ["latest", "1.2", "1.1"]
    description: 选择 Kanboard 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: KANBOARD_PORT
    type: number
    title: Kanboard 端口
    default: 808080
    min: 1024
    max: 65535
    description: Kanboard Web 服务端口

services:
  - name: kanboard
    type: web
    description: Kanboard 看板服务
    depends_on: [postgres]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: kanboard_data
        path: /var/www/app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_kanboard"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_kanboard"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin
