
services:
  ombi:
    image: lscr.io/linuxserver/ombi:{{OMBI_VERSION}}
    container_name: {{APP_NAME}}_ombi
    restart: unless-stopped
    ports:
      - "{{OMBI_PORT}}:3579"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    volumes:
      - ombi_data:/config
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3579"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ombi_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

