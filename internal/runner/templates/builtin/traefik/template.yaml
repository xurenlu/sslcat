id: traefik
name: Traefik (反向代理)
category: tools
subcategory: reverse-proxy
tags: [go, reverse-proxy, load-balancer, traefik, ssl]
description: 现代反向代理和负载均衡器，自动 SSL 证书管理，支持 Docker 自动发现。
icon: traefik
version: 1.0.0
author: SSLcat Team
website: https://traefik.io/
compose_file: docker-compose.yml

variables:
  - name: TRAEFIK_VERSION
    type: select
    title: Traefik 版本
    default: "latest"
    options: ["latest", "v3.0", "v2.10"]
    description: 选择 Traefik 版本
  - name: TRAEFIK_PORT
    type: number
    title: Traefik HTTP 端口
    default: 808080
    min: 1
    max: 65535
    description: Traefik HTTP 端口
  - name: TRAEFIK_HTTPS_PORT
    type: number
    title: Traefik HTTPS 端口
    default: 8443HTTPS    min: 1
    max: 65535
    description: Traefik HTTPS 端口
  - name: TRAEFIK_ADMIN_PORT
    type: number
    title: Traefik 管理端口
    default: 808080
    min: 1024
    max: 65535
    description: Traefik Dashboard 端口
  - name: ACME_EMAIL
    type: string
    title: ACME 邮箱
    default: "admin@{{PRIMARY_DOMAIN}}"
    description: Let's Encrypt SSL 证书邮箱
    placeholder: "admin@example.com"

services:
  - name: traefik
    type: proxy
    description: Traefik 反向代理服务
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 443
        external: null
        public: true
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: traefik_data
        path: /letsencrypt
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: "http://{{PRIMARY_DOMAIN}}"
  admin_email: "{{ACME_EMAIL}}"
  dashboard_url: "http://{{PRIMARY_DOMAIN}}:8080"
  features: "反向代理,自动SSL,负载均衡,Docker发现"

