
services:
  web:
    image: jitsi/web:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_web
    restart: unless-stopped
    ports:
      - "{{JITSI_WEB_PORT}}:80"
      - "{{JITSI_HTTPS_PORT}}:443"
    environment:
      ENABLE_WELCOME_PAGE: "true"
      ENABLE_LETSENCRYPT: "false"
      ENABLE_HTTP_REDIRECT: "true"
      ENABLE_TRANSCRIPTIONS: "false"
      DISABLE_HTTPS: "false"
      JVB_BREWERY_MUC: jvbbrewery
      JICOFO_AUTH_USER: focus
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "{{JVB_AUTH_PASSWORD}}"
      JICOFO_AUTH_PASSWORD: "{{JICOFO_AUTH_PASSWORD}}"
      JVB_STUN_SERVERS: stun.l.google.com:19302
      ENABLE_RECORDING: "{{ENABLE_RECORDING}}"
      PUBLIC_URL: "https://{{JITSI_DOMAIN}}"
      TZ: Asia/Shanghai
    volumes:
      - jitsi_web:/config
    depends_on:
      - prosody
      - jvb
      - jicofo
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prosody:
    image: jitsi/prosody:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_prosody
    restart: unless-stopped
    environment:
      AUTH_TYPE: internal
      ENABLE_AUTH: "1"
      ENABLE_GUESTS: "1"
      GLOBAL_MODULES: "presence,roster,ping,disco,external_services"
      XMPP_DOMAIN: "{{JITSI_DOMAIN}}"
      XMPP_AUTH_DOMAIN: "auth.{{JITSI_DOMAIN}}"
      XMPP_GUEST_DOMAIN: "guest.{{JITSI_DOMAIN}}"
      XMPP_MUC_DOMAIN: "muc.{{JITSI_DOMAIN}}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.{{JITSI_DOMAIN}}"
      XMPP_MODULES: "presence,roster,ping,disco,external_services"
      XMPP_RECORDER_DOMAIN: "recorder.{{JITSI_DOMAIN}}"
      JICOFO_COMPONENT_SECRET: "{{JICOFO_COMPONENT_SECRET}}"
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: "{{JICOFO_AUTH_PASSWORD}}"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "{{JVB_AUTH_PASSWORD}}"
      JIBRI_RECORDER_USER: recorder
      JIBRI_RECORDER_PASSWORD: "{{JIBRI_RECORDER_PASSWORD}}"
      TZ: Asia/Shanghai
    volumes:
      - prosody_data:/config
    networks:
      - {{APP_NAME}}_network

  jvb:
    image: jitsi/jvb:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_jvb
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    environment:
      DOCKER_HOST_ADDRESS: "{{JITSI_DOMAIN}}"
      ENABLE_APIS: "rest,colibri"
      XMPP_AUTH_DOMAIN: "auth.{{JITSI_DOMAIN}}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.{{JITSI_DOMAIN}}"
      XMPP_SERVER: prosody
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "{{JVB_AUTH_PASSWORD}}"
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
      JVB_STUN_SERVERS: stun.l.google.com:19302
      JVB_ENABLE_APIS: "rest,colibri"
      TZ: Asia/Shanghai
    depends_on:
      - prosody
    networks:
      - {{APP_NAME}}_network

  jicofo:
    image: jitsi/jicofo:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_jicofo
    restart: unless-stopped
    environment:
      ENABLE_AUTH: "1"
      XMPP_DOMAIN: "{{JITSI_DOMAIN}}"
      XMPP_AUTH_DOMAIN: "auth.{{JITSI_DOMAIN}}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.{{JITSI_DOMAIN}}"
      XMPP_SERVER: prosody
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: "{{JICOFO_AUTH_PASSWORD}}"
      JICOFO_ENABLE_HEALTH_CHECKS: "true"
      TZ: Asia/Shanghai
    depends_on:
      - prosody
    networks:
      - {{APP_NAME}}_network

  jibri:
    image: jitsi/jibri:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_jibri
    restart: unless-stopped
    environment:
      ENABLE_RECORDING: "{{ENABLE_RECORDING}}"
      XMPP_DOMAIN: "{{JITSI_DOMAIN}}"
      XMPP_AUTH_DOMAIN: "auth.{{JITSI_DOMAIN}}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.{{JITSI_DOMAIN}}"
      XMPP_SERVER: prosody
      JIBRI_XMPP_USER: jibri
      JIBRI_XMPP_PASSWORD: "{{JIBRI_XMPP_PASSWORD}}"
      JIBRI_RECORDER_USER: recorder
      JIBRI_RECORDER_PASSWORD: "{{JIBRI_RECORDER_PASSWORD}}"
      TZ: Asia/Shanghai
    depends_on:
      - prosody
      - jvb
    networks:
      - {{APP_NAME}}_network
    profiles:
      - recording

volumes:
  jitsi_web:
    driver: local
  prosody_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

credentials:
  jitsi:
    jvb_auth_password:
      pattern: random
      length: 24
    jicofo_auth_password:
      pattern: random
      length: 24
    jicofo_component_secret:
      pattern: random
      length: 24
    jibri_recorder_password:
      pattern: random
      length: 24
    jibri_xmpp_password:
      pattern: random
      length: 24

