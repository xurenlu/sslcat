id: poste
name: Poste.io (邮件服务器)
category: tools
subcategory: mail-server
tags: [php, mail-server, poste, email, webmail]
description: 完整的邮件服务器解决方案，包含 Web 邮件客户端、管理界面，支持多域名和用户管理。
icon: poste
version: 1.0.0
author: SSLcat Team
website: https://poste.io/
compose_file: docker-compose.yml

variables:
  - name: POSTE_VERSION
    type: select
    title: Poste.io 版本
    default: "latest"
    options: ["latest", "v2.0", "v1.0"]
    description: 选择 Poste.io 版本
  - name: POSTE_HTTP_PORT
    type: number
    title: HTTP 端口
    default: 808080
    min: 1
    max: 65535
    description: HTTP 端口
  - name: POSTE_HTTPS_PORT
    type: number
    title: HTTPS 端口
    default: 8443HTTPS    min: 1
    max: 65535
    description: HTTPS 端口
  - name: POSTE_SMTP_PORT
    type: number
    title: SMTP 端口
    default: 25
    min: 1
    max: 65535
    description: SMTP 邮件发送端口
  - name: POSTE_IMAP_PORT
    type: number
    title: IMAP 端口
    default: 143
    min: 1
    max: 65535
    description: IMAP 邮件接收端口
  - name: POSTE_IMAPS_PORT
    type: number
    title: IMAPS 端口
    default: 993
    min: 1
    max: 65535
    description: IMAPS 加密邮件接收端口
  - name: POSTE_POP3_PORT
    type: number
    title: POP3 端口
    default: 110
    min: 1
    max: 65535
    description: POP3 邮件接收端口
  - name: POSTE_POP3S_PORT
    type: number
    title: POP3S 端口
    default: 995
    min: 1
    max: 65535
    description: POP3S 加密邮件接收端口
  - name: LETSENCRYPT_EMAIL
    type: string
    title: Let's Encrypt 邮箱
    default: "admin@{{PRIMARY_DOMAIN}}"
    description: Let's Encrypt SSL 证书邮箱
    placeholder: "admin@example.com"

services:
  - name: poste
    type: web
    description: Poste.io 邮件服务器
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 443
        external: null
        public: true
      - internal: 25
        external: null
        public: true
      - internal: 143
        external: null
        public: true
      - internal: 993
        external: null
        public: true
      - internal: 110
        external: null
        public: true
      - internal: 995
        external: null
        public: true
    volumes:
      - name: poste_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: "http://{{PRIMARY_DOMAIN}}"
  admin_email: "{{LETSENCRYPT_EMAIL}}"
  features: "邮件服务器,Web邮件客户端,多域名支持,用户管理"
