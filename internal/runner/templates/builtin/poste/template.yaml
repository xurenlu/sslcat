id: poste
name: Poste.io (企业邮箱)
category: tools
subcategory: email
tags: [email, mail-server, poste, enterprise-mail]
description: 现代化的企业邮箱解决方案，基于 Docker，配置简单，功能完整，支持 Web 邮件客户端和管理界面。
icon: poste
version: 1.0.0
author: SSLcat Team
website: https://poste.io/
compose_file: docker-compose.yml

variables:
  - name: POSTE_VERSION
    type: select
    title: Poste.io 版本
    default: "latest"
    options: ["latest", "2.4", "2.3"]
    description: 选择 Poste.io 版本
  - name: POSTE_PORT
    type: number
    title: Poste.io Web HTTP 端口
    default: 80
    min: 1024
    max: 65535
    description: Poste.io Web 界面 HTTP 端口
  - name: POSTE_HTTPS_PORT
    type: number
    title: Poste.io Web HTTPS 端口
    default: 443
    min: 1024
    max: 65535
    description: Poste.io Web 界面 HTTPS 端口
  - name: POSTE_SMTP_PORT
    type: number
    title: SMTP 端口
    default: 25
    min: 1024
    max: 65535
    description: SMTP 服务端口
  - name: POSTE_SMTPS_PORT
    type: number
    title: SMTPS 端口
    default: 465
    min: 1024
    max: 65535
    description: SMTPS 服务端口
  - name: POSTE_SUBMISSION_PORT
    type: number
    title: Submission 端口
    default: 587
    min: 1024
    max: 65535
    description: Submission 服务端口
  - name: POSTE_IMAP_PORT
    type: number
    title: IMAP 端口
    default: 143
    min: 1024
    max: 65535
    description: IMAP 服务端口
  - name: POSTE_IMAPS_PORT
    type: number
    title: IMAPS 端口
    default: 993
    min: 1024
    max: 65535
    description: IMAPS 服务端口
  - name: POSTE_POP3_PORT
    type: number
    title: POP3 端口
    default: 110
    min: 1024
    max: 65535
    description: POP3 服务端口
  - name: POSTE_POP3S_PORT
    type: number
    title: POP3S 端口
    default: 995
    min: 1024
    max: 65535
    description: POP3S 服务端口
  - name: POSTE_DOMAIN
    type: string
    title: 邮件域名
    default: "{{PRIMARY_DOMAIN}}"
    description: 邮件服务器的主域名
    placeholder: "mail.example.com"

services:
  - name: poste
    type: web
    description: Poste.io 邮件服务器
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 443
        external: null
        public: true
      - internal: 25
        external: null
        public: true
      - internal: 465
        external: null
        public: true
      - internal: 587
        external: null
        public: true
      - internal: 143
        external: null
        public: true
      - internal: 993
        external: null
        public: true
      - internal: 110
        external: null
        public: true
      - internal: 995
        external: null
        public: true
    volumes:
      - name: poste_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{POSTE_DOMAIN}}
  webmail_url: "http://{{PRIMARY_DOMAIN}}/webmail"
  admin_url: "http://{{PRIMARY_DOMAIN}}/admin"
  features: "企业邮箱,Web邮件客户端,反垃圾邮件,防病毒,邮件转发,别名管理,自动回复"

