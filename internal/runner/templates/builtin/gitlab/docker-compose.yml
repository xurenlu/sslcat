
services:
  gitlab:
    image: gitlab/gitlab-ce:{{GITLAB_VERSION}}
    container_name: {{APP_NAME}}_gitlab
    restart: unless-stopped
    ports:
      - "{{GITLAB_PORT}}:80"
      - "{{GITLAB_SSH_PORT}}:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://{{PRIMARY_DOMAIN}}'
        gitlab_rails['gitlab_shell_ssh_port'] = {{GITLAB_SSH_PORT}}
        postgresql['shared_buffers'] = "256MB"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  gitlab_config:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

