id: suitecrm
name: SuiteCRM
category: crm
subcategory: crm
tags: [php, mysql, crm, sales, suitecrm]
description: 开源 CRM 系统，功能完整，适合销售和客户关系管理。
icon: suitecrm
version: 1.0.0
author: SSLcat Team
website: https://suitecrm.com/
compose_file: docker-compose.yml

variables:
  - name: SUITECRM_VERSION
    type: select
    title: SuiteCRM 版本
    default: "latest"
    options: ["latest", "8.0", "7.13"]
    description: 选择 SuiteCRM 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: SUITECRM_PORT
    type: number
    title: SuiteCRM 端口
    default: 8080
    min: 1024
    max: 65535
    description: SuiteCRM Web 服务端口

services:
  - name: suitecrm
    type: web
    description: SuiteCRM 系统服务
    depends_on: [mysql]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: suitecrm_data
        path: /bitnami/suitecrm
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_suitecrm"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_suitecrm"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

