version: '3.8'

services:
  pinecone-alternative:
    image: nginx:alpine
    container_name: {{APP_NAME}}_pinecone_alternative
    restart: unless-stopped
    ports:
      - "{{PINECONE_ALT_PORT}}:80"
    environment:
      PINECONE_API_KEY: {{PINECONE_API_KEY}}
    volumes:
      - pinecone_alt_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pinecone_alt_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

