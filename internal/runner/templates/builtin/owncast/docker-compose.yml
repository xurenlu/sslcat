
services:
  owncast:
    image: gabekangas/owncast:{{OWNCAST_VERSION}}
    container_name: {{APP_NAME}}_owncast
    restart: unless-stopped
    ports:
      - "{{OWNCAST_PORT}}:8080"
      - "{{OWNCAST_RTMP_PORT}}:1935"
    environment:
      OWNCAST_STREAMING_KEY: "{{STREAMING_KEY}}"
    volumes:
      - owncast_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  owncast_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

