id: owncast
name: Owncast
category: media
subcategory: streaming
tags: [go, streaming, live-streaming, owncast]
description: 开源直播平台，支持 RTMP 推流，适合自建直播服务。
icon: owncast
version: 1.0.0
author: SSLcat Team
website: https://owncast.online/
compose_file: docker-compose.yml

variables:
  - name: OWNCAST_VERSION
    type: select
    title: Owncast 版本
    default: "latest"
    options: ["latest", "0.1.3"]
    description: 选择 Owncast 版本
  - name: OWNCAST_PORT
    type: number
    title: Owncast Web 端口
    default: 8080
    min: 1024
    max: 65535
    description: Owncast Web 服务端口
  - name: OWNCAST_RTMP_PORT
    type: number
    title: RTMP 推流端口
    default: 1935
    min: 1024
    max: 65535
    description: RTMP 推流服务端口

services:
  - name: owncast
    type: web
    description: Owncast 直播平台服务
    ports:
      - internal: 8080
        external: null
        public: true
      - internal: 1935
        external: null
        public: true
    volumes:
      - name: owncast_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /api/status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  owncast:
    streaming_key:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  rtmp_url: rtmp://{{PRIMARY_DOMAIN}}:{{OWNCAST_RTMP_PORT}}/live

