
services:
  nodebb:
    image: nodebb/nodebb:{{NODEBB_VERSION}}
    container_name: {{APP_NAME}}_nodebb
    restart: unless-stopped
    ports:
      - "{{NODEBB_PORT}}:4567"
    environment:
      NODEBB_URL: "http://{{PRIMARY_DOMAIN}}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
    volumes:
      - nodebb_data:/var/lib/nodebb
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4567"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nodebb_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

