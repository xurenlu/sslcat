id: nodebb
name: NodeBB
category: forum
subcategory: discussion
tags: [nodejs, redis, forum, discussion, nodebb]
description: 基于 Node.js 的现代化论坛平台，实时性强，界面美观。
icon: nodebb
version: 1.0.0
author: SSLcat Team
website: https://nodebb.org/
compose_file: docker-compose.yml

variables:
  - name: NODEBB_VERSION
    type: select
    title: NodeBB 版本
    default: "latest"
    options: ["latest", "3.0", "2.8"]
    description: 选择 NodeBB 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: NODEBB_PORT
    type: number
    title: NodeBB 端口
    default: 4567
    min: 1024
    max: 65535
    description: NodeBB Web 服务端口

services:
  - name: nodebb
    type: web
    description: NodeBB 论坛服务
    depends_on: [redis]
    ports:
      - internal: 4567
        external: null
        public: true
    volumes:
      - name: nodebb_data
        path: /var/lib/nodebb
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

connection_strings:
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

