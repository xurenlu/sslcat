id: kong
name: Kong (API网关)
category: tools
subcategory: api-gateway
tags: [lua, postgres, api-gateway, kong, microservices]
description: 云原生 API 网关和微服务管理平台，支持插件扩展、负载均衡、认证授权等。
icon: kong
version: 1.0.0
author: SSLcat Team
website: https://konghq.com/
compose_file: docker-compose.yml

variables:
  - name: KONG_VERSION
    type: select
    title: Kong 版本
    default: "latest"
    options: ["latest", "3.4", "3.3"]
    description: 选择 Kong 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: KONG_PORT
    type: number
    title: Kong 代理端口
    default: 8000
    min: 1024
    max: 65535
    description: Kong API 代理端口
  - name: KONG_ADMIN_PORT
    type: number
    title: Kong 管理端口
    default: 8001
    min: 1024
    max: 65535
    description: Kong Admin API 端口
  - name: KONG_ADMIN_GUI_PORT
    type: number
    title: Kong 管理界面端口
    default: 8002
    min: 1024
    max: 65535
    description: Kong Admin GUI 端口

services:
  - name: kong
    type: api
    description: Kong API 网关服务
    depends_on: [postgres]
    ports:
      - internal: 8000
        external: null
        public: true
      - internal: 8001
        external: null
        public: true
      - internal: 8002
        external: null
        public: true
    volumes:
      - name: kong_data
        path: /usr/local/kong
        mode: rw
    healthcheck:
      type: command
      command: ["kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_kong"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_kong"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  admin_api: "http://{{PRIMARY_DOMAIN}}:8001"
  admin_gui: "http://{{PRIMARY_DOMAIN}}:8002"
  features: "API网关,负载均衡,插件系统,认证授权"

