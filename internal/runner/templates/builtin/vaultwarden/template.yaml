id: vaultwarden
name: Vaultwarden
category: security
subcategory: password-manager
tags: [rust, postgres, security, password-manager, bitwarden, vaultwarden]
description: Bitwarden 兼容的密码管理器，轻量级、自托管，功能完整。
icon: vaultwarden
version: 1.0.0
author: SSLcat Team
website: https://github.com/dani-garcia/vaultwarden
compose_file: docker-compose.yml

variables:
  - name: VAULTWARDEN_VERSION
    type: select
    title: Vaultwarden 版本
    default: "latest"
    options: ["latest", "1.30", "1.29"]
    description: 选择 Vaultwarden 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: VAULTWARDEN_PORT
    type: number
    title: Vaultwarden 端口
    default: 80
    min: 1024
    max: 65535
    description: Vaultwarden Web 服务端口
  - name: SIGNUPS_ALLOWED
    type: select
    title: 允许注册
    default: "true"
    options: ["true", "false"]
    description: 是否允许新用户注册

services:
  - name: vaultwarden
    type: web
    description: Vaultwarden 密码管理服务
    depends_on: [postgres]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: vaultwarden_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_vaultwarden"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_vaultwarden"
  vaultwarden:
    admin_token:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/admin
  bitwarden_compatible: true

