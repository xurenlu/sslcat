id: replicate-musicgen
name: Replicate MusicGen (音乐生成)
category: ai
subcategory: music-generation
tags: [replicate, ai, music-generation, musicgen, gpu]
description: Replicate 上的 Meta MusicGen 模型，从文本描述生成音乐，需要 GPU。
icon: replicate-musicgen
version: 1.0.0
author: SSLcat Team
website: https://replicate.com/meta/musicgen
compose_file: docker-compose.yml

variables:
  - name: REPLICATE_MUSICGEN_VERSION
    type: select
    title: Replicate Proxy 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Replicate Proxy 版本
  - name: REPLICATE_MUSICGEN_PORT
    type: number
    title: Replicate MusicGen 端口
    default: 808080
    min: 1024
    max: 65535
    description: Replicate MusicGen API 服务端口
  - name: REPLICATE_API_TOKEN
    type: string
    title: Replicate API Token
    default: ""
    description: Replicate API Token（需要注册获取）
    required: true
    sensitive: true

services:
  - name: replicate-musicgen
    type: api
    description: Replicate MusicGen 音乐生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: replicate_musicgen_data
        path: /app/cache
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  replicate-musicgen:
    api_token:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  replicate_model: "meta/musicgen"
  features: "文本生成音乐,高质量音频,多种风格"
  gpu_required: true

