id: seo-tools
name: SEO工具集
category: tools
subcategory: marketing
tags: [nodejs, postgres, redis, marketing, seo, analytics]
description: SEO分析和优化工具集，支持关键词分析、网站SEO检测、排名追踪、竞争对手分析、SEO报告等功能。
icon: seo-tools
version: 1.0.0
author: SSLcat Team
website: https://github.com/seo-tools
compose_file: docker-compose.yml

variables:
  - name: SEO_TOOLS_VERSION
    type: select
    title: SEO工具集版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 SEO工具集版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: SEO_TOOLS_PORT
    type: number
    title: SEO工具集端口
    default: 8080
    min: 1024
    max: 65535
    description: SEO工具集 Web 服务端口

services:
  - name: seo-tools
    type: web
    description: SEO工具集服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: seo_tools_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_seo"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_seo"
  redis:
    password:
      pattern: random
      length: 16
  seo-tools:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "关键词分析,网站SEO检测,排名追踪,竞争对手分析,SEO报告"

