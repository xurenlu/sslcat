
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:{{LIDARR_VERSION}}
    container_name: {{APP_NAME}}_lidarr
    restart: unless-stopped
    ports:
      - "{{LIDARR_PORT}}:8686"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    volumes:
      - lidarr_data:/config
      - lidarr_music:/music
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8686"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  lidarr_data:
    driver: local
  lidarr_music:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

