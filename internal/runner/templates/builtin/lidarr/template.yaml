id: lidarr
name: Lidarr
category: media
subcategory: automation
tags: [csharp, media, automation, music, lidarr]
description: 音乐自动化管理工具，类似 Sonarr，支持自动下载和管理音乐。
icon: lidarr
version: 1.0.0
author: SSLcat Team
website: https://lidarr.audio/
compose_file: docker-compose.yml

variables:
  - name: LIDARR_VERSION
    type: select
    title: Lidarr 版本
    default: "latest"
    options: ["latest", "1.2", "1.1"]
    description: 选择 Lidarr 版本
  - name: LIDARR_PORT
    type: number
    title: Lidarr 端口
    default: 8686
    min: 1024
    max: 65535
    description: Lidarr Web 服务端口

services:
  - name: lidarr
    type: web
    description: Lidarr 音乐管理服务
    ports:
      - internal: 8686
        external: null
        public: true
    volumes:
      - name: lidarr_data
        path: /config
        mode: rw
      - name: lidarr_music
        path: /music
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

