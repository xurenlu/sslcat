id: grafana-dashboard
name: Grafana Dashboard (监控面板)
category: tools
subcategory: monitoring
tags: [go, monitoring, grafana, dashboard, visualization]
description: 强大的监控和可视化面板，支持多种数据源，创建美观的监控仪表板。
icon: grafana-dashboard
version: 1.0.0
author: SSLcat Team
website: https://grafana.com/
compose_file: docker-compose.yml

variables:
  - name: GRAFANA_VERSION
    type: select
    title: Grafana 版本
    default: "latest"
    options: ["latest", "10.2", "10.1"]
    description: 选择 Grafana 版本
  - name: GRAFANA_PORT
    type: number
    title: Grafana 端口
    default: 3000
    min: 1024
    max: 65535
    description: Grafana Web 服务端口
  - name: GRAFANA_USERNAME
    type: string
    title: Grafana 用户名
    default: "admin"
    description: Grafana 管理员用户名
  - name: GRAFANA_PASSWORD
    type: string
    title: Grafana 密码
    default: ""
    description: Grafana 管理员密码
    required: true
    sensitive: true

services:
  - name: grafana
    type: web
    description: Grafana 监控面板服务
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: grafana_data
        path: /var/lib/grafana
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

credentials:
  grafana:
    username:
      pattern: "{GRAFANA_USERNAME}"
    password:
      pattern: "{GRAFANA_PASSWORD}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "监控面板,数据可视化,多种数据源,告警通知"
