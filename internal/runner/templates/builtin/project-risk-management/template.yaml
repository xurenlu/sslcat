id: project-risk-management
name: 项目风险管理系统
category: tools
subcategory: project-management
tags: [php, postgres, project-management, risk-management, project-risk]
description: 项目风险识别和管理系统，支持风险识别、风险评估、风险应对计划、风险监控等功能。
icon: project-risk-management
version: 1.0.0
author: SSLcat Team
website: https://github.com/project-risk-management
compose_file: docker-compose.yml

variables:
  - name: PROJECT_RISK_VERSION
    type: select
    title: 项目风险管理系统版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择项目风险管理系统版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: PROJECT_RISK_PORT
    type: number
    title: 项目风险管理系统端口
    default: 808080
    min: 1024
    max: 65535
    description: 项目风险管理系统 Web 服务端口

services:
  - name: project-risk-management
    type: web
    description: 项目风险管理系统服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: project_risk_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_project_risk"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_project_risk"
  project-risk-management:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "风险识别,风险评估,风险应对计划,风险监控,风险报告"

