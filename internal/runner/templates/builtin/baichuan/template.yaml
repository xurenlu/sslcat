id: baichuan
name: Baichuan (百川大模型)
category: ai
subcategory: llm
tags: [python, ai, llm, baichuan, chinese, gpu]
description: 百川智能开源的中文大语言模型，支持对话、代码和知识问答，需要 GPU。
icon: baichuan
version: 1.0.0
author: SSLcat Team
website: https://github.com/baichuan-inc/Baichuan
compose_file: docker-compose.yml

variables:
  - name: BAICHUAN_VERSION
    type: select
    title: Baichuan 版本
    default: "latest"
    options: ["latest", "v2", "v1"]
    description: 选择 Baichuan 版本
  - name: BAICHUAN_PORT
    type: number
    title: Baichuan 端口
    default: 8000
    min: 1024
    max: 65535
    description: Baichuan API 服务端口

services:
  - name: baichuan
    type: api
    description: Baichuan 中文大模型服务
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: baichuan_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/chat"
  features: "中文对话,代码生成,知识问答,多轮对话"
  gpu_required: true

