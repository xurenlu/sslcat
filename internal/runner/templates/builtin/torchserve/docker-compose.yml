
services:
  torchserve:
    image: pytorch/torchserve:{{TORCHSERVE_VERSION}}
    container_name: {{APP_NAME}}_torchserve
    restart: unless-stopped
    ports:
      - "{{TORCHSERVE_PORT}}:8080"
      - "{{TORCHSERVE_MANAGEMENT_PORT}}:8081"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - torchserve_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  torchserve_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

