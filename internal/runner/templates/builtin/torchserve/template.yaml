id: torchserve
name: TorchServe (PyTorch模型服务)
category: ai
subcategory: model-serving
tags: [python, ai, pytorch, torchserve, model-serving, gpu]
description: PyTorch 官方模型服务框架，高性能模型推理服务，需要 GPU。
icon: torchserve
version: 1.0.0
author: SSLcat Team
website: https://github.com/pytorch/serve
compose_file: docker-compose.yml

variables:
  - name: TORCHSERVE_VERSION
    type: select
    title: TorchServe 版本
    default: "latest"
    options: ["latest", "v0.9", "v0.8"]
    description: 选择 TorchServe 版本
  - name: TORCHSERVE_PORT
    type: number
    title: TorchServe 推理端口
    default: 808080
    min: 1024
    max: 65535
    description: TorchServe 推理 API 端口
  - name: TORCHSERVE_MANAGEMENT_PORT
    type: number
    title: TorchServe 管理端口
    default: 808081
    min: 1024
    max: 65535
    description: TorchServe 管理 API 端口

services:
  - name: torchserve
    type: api
    description: TorchServe PyTorch 模型服务
    ports:
      - internal: 8080
        external: null
        public: true
      - internal: 8081
        external: null
        public: true
    volumes:
      - name: torchserve_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/predictions"
  management_endpoint: "http://{{PRIMARY_DOMAIN}}:8081"
  features: "模型服务,高性能,版本管理,批量推理"
  gpu_required: true

