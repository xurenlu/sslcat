id: clickhouse
name: ClickHouse
category: database
subcategory: analytics
tags: [clickhouse, database, analytics, olap]
description: 高性能列式数据库，专为 OLAP 分析场景设计，查询速度极快。
icon: clickhouse
version: 1.0.0
author: SSLcat Team
website: https://clickhouse.com/
compose_file: docker-compose.yml

variables:
  - name: CLICKHOUSE_VERSION
    type: select
    title: ClickHouse 版本
    default: "latest"
    options: ["latest", "23.11", "23.10"]
    description: 选择 ClickHouse 版本
  - name: CLICKHOUSE_HTTP_PORT
    type: number
    title: ClickHouse HTTP 端口
    default: 8123
    min: 1024
    max: 65535
    description: ClickHouse HTTP API 端口
  - name: CLICKHOUSE_NATIVE_PORT
    type: number
    title: ClickHouse Native 端口
    default: 9000
    min: 1024
    max: 65535
    description: ClickHouse Native 协议端口

services:
  - name: clickhouse
    type: database
    description: ClickHouse 分析数据库服务
    ports:
      - internal: 8123
        external: null
        public: true
      - internal: 9000
        external: null
        public: true
    volumes:
      - name: clickhouse_data
        path: /var/lib/clickhouse
        mode: rw
      - name: clickhouse_logs
        path: /var/log/clickhouse-server
        mode: rw
    healthcheck:
      type: http
      path: /ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  clickhouse:
    username:
      pattern: "default"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_db"

connection_strings:
  clickhouse_http: "http://{{PRIMARY_DOMAIN}}:{{CLICKHOUSE_HTTP_PORT}}"
  clickhouse_native: "clickhouse://{{CLICKHOUSE_USERNAME}}:{{CLICKHOUSE_PASSWORD}}@clickhouse:9000/{{CLICKHOUSE_DATABASE}}"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  http_url: http://{{PRIMARY_DOMAIN}}:{{CLICKHOUSE_HTTP_PORT}}
  native_url: clickhouse://{{CLICKHOUSE_USERNAME}}:{{CLICKHOUSE_PASSWORD}}@{{PRIMARY_DOMAIN}}:{{CLICKHOUSE_NATIVE_PORT}}/{{CLICKHOUSE_DATABASE}}

