id: image-processor
name: Image Processor
category: tools
subcategory: image-processing
tags: [image-processing, image-processor, image-tools]
description: 图片处理工具集，支持压缩、裁剪、格式转换、水印等功能。
icon: image-processor
version: 1.0.0
author: SSLcat Team
website: https://github.com/image-processor
compose_file: docker-compose.yml

variables:
  - name: IMAGE_PROCESSOR_VERSION
    type: select
    title: Image Processor 版本
    default: "latest"
    options: ["latest", "v1", "v2"]
    description: 选择 Image Processor 版本
  - name: IMAGE_PROCESSOR_PORT
    type: number
    title: Image Processor 端口
    default: 808080
    min: 1024
    max: 65535
    description: Image Processor Web 服务端口
  - name: MAX_FILE_SIZE
    type: string
    title: 最大文件大小
    default: "50MB"
    description: 单文件最大处理大小（如：50MB, 100MB）
    placeholder: "50MB"
  - name: SUPPORTED_FORMATS
    type: string
    title: 支持的格式
    default: "jpg,jpeg,png,gif,webp"
    description: 支持的图片格式，用逗号分隔
    placeholder: "jpg,jpeg,png,gif,webp"

services:
  - name: image-processor
    type: web
    description: Image Processor 图片处理服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: image_processor_data
        path: /app/temp
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "压缩,裁剪,格式转换,水印,滤镜"

