
services:
  triton:
    image: nvcr.io/nvidia/tritonserver:{{TRITON_VERSION}}
    container_name: {{APP_NAME}}_triton
    restart: unless-stopped
    ports:
      - "{{TRITON_PORT}}:8000"
      - "{{TRITON_GRPC_PORT}}:8001"
      - "{{TRITON_METRICS_PORT}}:8002"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - triton_data:/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  triton_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

