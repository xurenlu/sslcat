id: triton-inference-server
name: Triton Inference Server (统一模型服务)
category: ai
subcategory: model-serving
tags: [cpp, ai, triton, model-serving, nvidia, gpu]
description: NVIDIA 开源的统一模型服务框架，支持多种框架（TensorFlow、PyTorch、ONNX等），需要 GPU。
icon: triton-inference-server
version: 1.0.0
author: SSLcat Team
website: https://github.com/triton-inference-server/server
compose_file: docker-compose.yml

variables:
  - name: TRITON_VERSION
    type: select
    title: Triton Inference Server 版本
    default: "latest"
    options: ["latest", "23.12", "23.11"]
    description: 选择 Triton Inference Server 版本
  - name: TRITON_PORT
    type: number
    title: Triton HTTP 端口
    default: 8000
    min: 1024
    max: 65535
    description: Triton HTTP API 端口
  - name: TRITON_GRPC_PORT
    type: number
    title: Triton gRPC 端口
    default: 8001
    min: 1024
    max: 65535
    description: Triton gRPC API 端口
  - name: TRITON_METRICS_PORT
    type: number
    title: Triton 指标端口
    default: 8002
    min: 1024
    max: 65535
    description: Triton 指标 API 端口

services:
  - name: triton
    type: api
    description: Triton Inference Server 统一模型服务
    ports:
      - internal: 8000
        external: null
        public: true
      - internal: 8001
        external: null
        public: true
      - internal: 8002
        external: null
        public: true
    volumes:
      - name: triton_data
        path: /models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /v2/health/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/v2"
  grpc_endpoint: "{{PRIMARY_DOMAIN}}:8001"
  features: "统一模型服务,多框架支持,高性能,动态加载"
  gpu_required: true

