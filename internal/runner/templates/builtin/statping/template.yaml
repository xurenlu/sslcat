id: statping
name: Statping (服务监控)
category: tools
subcategory: monitoring
tags: [go, monitoring, uptime, statping, status-page]
description: 服务状态监控和状态页面工具，监控 HTTP、TCP、ICMP 等服务，生成状态页面。
icon: statping
version: 1.0.0
author: SSLcat Team
website: https://github.com/statping/statping
compose_file: docker-compose.yml

variables:
  - name: STATPING_VERSION
    type: select
    title: Statping 版本
    default: "latest"
    options: ["latest", "v0.90", "v0.89"]
    description: 选择 Statping 版本
  - name: STATPING_PORT
    type: number
    title: Statping 端口
    default: 8080
    min: 1024
    max: 65535
    description: Statping Web 服务端口

services:
  - name: statping
    type: web
    description: Statping 服务监控服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: statping_data
        path: /app
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "服务监控,状态页面,HTTP/TCP/ICMP监控,告警通知"
