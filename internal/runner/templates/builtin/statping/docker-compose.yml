version: '3.8'

services:
  statping:
    image: statping/statping:{{STATPING_VERSION}}
    container_name: {{APP_NAME}}_statping
    restart: unless-stopped
    ports:
      - "{{STATPING_PORT}}:8080"
    environment:
      DB_CONN: sqlite
      DB_FILE: /app/statping.db
      ADMIN_USERNAME: {{STATPING_ADMIN_USERNAME}}
      ADMIN_PASSWORD: {{STATPING_ADMIN_PASSWORD}}
      ADMIN_EMAIL: admin@{{PRIMARY_DOMAIN}}
      SITE_URL: http://{{PRIMARY_DOMAIN}}
      TZ: Asia/Shanghai
    volumes:
      - statping_data:/app
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  statping_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

