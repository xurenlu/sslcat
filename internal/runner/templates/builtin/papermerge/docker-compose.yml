
services:
  papermerge:
    image: linuxserver/papermerge:{{PAPERMERGE_VERSION}}
    container_name: {{APP_NAME}}_papermerge
    restart: unless-stopped
    ports:
      - "{{PAPERMERGE_PORT}}:8000"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      PAPERMERGE_DB_HOST: postgres
      PAPERMERGE_DB_NAME: {{POSTGRES_DATABASE}}
      PAPERMERGE_DB_USER: {{POSTGRES_USERNAME}}
      PAPERMERGE_DB_PASSWORD: {{POSTGRES_PASSWORD}}
      PAPERMERGE_SECRET_KEY: {{SECRET_KEY}}
    volumes:
      - papermerge_data:/config
      - papermerge_documents:/documents
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  papermerge_data:
    driver: local
  papermerge_documents:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

