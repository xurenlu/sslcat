id: papermerge
name: Papermerge
category: tools
subcategory: document-management
tags: [python, postgres, document-management, ocr, papermerge]
description: 文档管理系统，支持 OCR 识别、文档分类和搜索。
icon: papermerge
version: 1.0.0
author: SSLcat Team
website: https://www.papermerge.com/
compose_file: docker-compose.yml

variables:
  - name: PAPERMERGE_VERSION
    type: select
    title: Papermerge 版本
    default: "latest"
    options: ["latest", "2.1", "2.0"]
    description: 选择 Papermerge 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: PAPERMERGE_PORT
    type: number
    title: Papermerge 端口
    default: 8000
    min: 1024
    max: 65535
    description: Papermerge Web 服务端口

services:
  - name: papermerge
    type: web
    description: Papermerge 文档管理服务
    depends_on: [postgres]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: papermerge_data
        path: /config
        mode: rw
      - name: papermerge_documents
        path: /documents
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_papermerge"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_papermerge"
  papermerge:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

