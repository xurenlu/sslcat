version: '3.8'

services:
  seq:
    image: datalust/seq:{{SEQ_VERSION}}
    container_name: {{APP_NAME}}_seq
    restart: unless-stopped
    ports:
      - "{{SEQ_PORT}}:80"
      - "{{SEQ_INGESTION_PORT}}:5341"
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINUSERNAME: {{SEQ_USERNAME}}
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: {{SEQ_PASSWORD_HASH}}
    volumes:
      - seq_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  seq_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

