id: seq
name: Seq (结构化日志)
category: tools
subcategory: logging
tags: [csharp, logging, seq, structured-logging]
description: 结构化日志服务器，支持强大的查询、搜索和分析功能，专为 .NET 应用设计。
icon: seq
version: 1.0.0
author: SSLcat Team
website: https://datalust.co/seq
compose_file: docker-compose.yml

variables:
  - name: SEQ_VERSION
    type: select
    title: Seq 版本
    default: "latest"
    options: ["latest", "2024.1", "2023.3"]
    description: 选择 Seq 版本
  - name: SEQ_PORT
    type: number
    title: Seq Web 端口
    default: 80
    min: 1024
    max: 65535
    description: Seq Web UI 端口
  - name: SEQ_INGESTION_PORT
    type: number
    title: Seq 日志接收端口
    default: 5341
    min: 1024
    max: 65535
    description: Seq 日志接收端口
  - name: SEQ_USERNAME
    type: string
    title: Seq 用户名
    default: "admin"
    description: Seq 管理员用户名
  - name: SEQ_PASSWORD_HASH
    type: string
    title: Seq 密码哈希
    default: ""
    description: Seq 管理员密码哈希（可选，留空使用默认密码）
    sensitive: true

services:
  - name: seq
    type: web
    description: Seq 结构化日志服务
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 5341
        external: null
        public: true
    volumes:
      - name: seq_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /api
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

credentials:
  seq:
    username:
      pattern: "{SEQ_USERNAME}"
    password_hash:
      pattern: "{SEQ_PASSWORD_HASH}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  ingestion_url: "http://{{PRIMARY_DOMAIN}}:5341"
  features: "结构化日志,强大查询,实时搜索,日志分析"

