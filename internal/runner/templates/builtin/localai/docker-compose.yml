version: '3.8'

services:
  localai:
    image: localai/localai:{{LOCALAI_VERSION}}
    container_name: {{APP_NAME}}_localai
    restart: unless-stopped
    ports:
      - "{{LOCALAI_PORT}}:8080"
    environment:
      MODELS_PATH: /models
      PRELOAD_MODELS: {{PRELOAD_MODELS}}
    volumes:
      - localai_data:/models
    networks:
      - {{APP_NAME}}_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  localai_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

