id: localai
name: LocalAI
category: ai
subcategory: api
tags: [go, ai, api, localai, openai-compatible, gpu]
description: OpenAI 兼容的本地 AI API 服务器，支持多种开源模型。
icon: localai
version: 1.0.0
author: SSLcat Team
website: https://github.com/go-skynet/LocalAI
compose_file: docker-compose.yml

variables:
  - name: LOCALAI_VERSION
    type: select
    title: LocalAI 版本
    default: "latest"
    options: ["latest", "v1.40", "v1.39"]
    description: 选择 LocalAI 版本
  - name: LOCALAI_PORT
    type: number
    title: LocalAI 端口
    default: 808080
    min: 1024
    max: 65535
    description: LocalAI API 服务端口
  - name: PRELOAD_MODELS
    type: string
    title: 预加载模型
    default: ""
    description: 预加载的模型列表，用逗号分隔（如：gpt-3.5-turbo,llama2）
    placeholder: "gpt-3.5-turbo,llama2"

services:
  - name: localai
    type: api
    description: LocalAI API 服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: localai_data
        path: /models
        mode: rw
    resources:
      gpu: optional
    healthcheck:
      type: http
      path: /ready
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/v1"
  openai_compatible: true
  features: "OpenAI兼容,多模型支持,本地部署"

