version: '3.8'

services:
  scalar:
    image: scalar/scalar-api-reference:{{SCALAR_VERSION}}
    container_name: {{APP_NAME}}_scalar
    restart: unless-stopped
    ports:
      - "{{SCALAR_PORT}}:8080"
    environment:
      SCALAR_SPEC_URL: {{SCALAR_SPEC_URL}}
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  {{APP_NAME}}_network:
    driver: bridge

