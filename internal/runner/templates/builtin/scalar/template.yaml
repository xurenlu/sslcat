id: scalar
name: Scalar (API文档)
category: tools
subcategory: api-docs
tags: [nodejs, api-docs, scalar, openapi, rest-api]
description: 现代化的 OpenAPI 文档生成器，美观的界面，支持交互式 API 文档和测试。
icon: scalar
version: 1.0.0
author: SSLcat Team
website: https://scalar.dev/
compose_file: docker-compose.yml

variables:
  - name: SCALAR_VERSION
    type: select
    title: Scalar 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Scalar 版本
  - name: SCALAR_PORT
    type: number
    title: Scalar 端口
    default: 808080
    min: 1024
    max: 65535
    description: Scalar Web 服务端口
  - name: SCALAR_SPEC_URL
    type: string
    title: OpenAPI 规范 URL
    default: "/openapi.json"
    description: OpenAPI/Swagger 规范文件 URL
    placeholder: "/openapi.json"

services:
  - name: scalar
    type: web
    description: Scalar API 文档服务
    ports:
      - internal: 8080
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "API文档,OpenAPI支持,美观界面,交互式测试"

