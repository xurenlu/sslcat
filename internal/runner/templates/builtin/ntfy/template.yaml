id: ntfy
name: ntfy (推送通知)
category: tools
subcategory: notification
tags: [go, notification, push, ntfy, webhook]
description: 简单的推送通知服务，支持 HTTP、WebSocket、邮件等多种通知方式，无需注册即可使用。
icon: ntfy
version: 1.0.0
author: SSLcat Team
website: https://ntfy.sh/
compose_file: docker-compose.yml

variables:
  - name: NTFY_VERSION
    type: select
    title: ntfy 版本
    default: "latest"
    options: ["latest", "v2.9", "v2.8"]
    description: 选择 ntfy 版本
  - name: NTFY_PORT
    type: number
    title: ntfy 端口
    default: 80
    min: 1024
    max: 65535
    description: ntfy Web 服务端口

services:
  - name: ntfy
    type: web
    description: ntfy 推送通知服务
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: ntfy_data
        path: /var/cache/ntfy
        mode: rw
      - name: ntfy_config
        path: /etc/ntfy
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/docs"
  features: "推送通知,HTTP推送,WebSocket,无需注册"
