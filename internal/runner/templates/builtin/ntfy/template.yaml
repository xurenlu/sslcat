id: ntfy
name: ntfy (推送通知服务)
category: devops
subcategory: notification
tags: [notification, push, alerting, ntfy, devops]
description: 简单的推送通知服务，支持 HTTP、WebSocket、邮件等多种通知方式，适合系统告警、监控通知等场景。
icon: ntfy
version: 1.0.0
author: SSLcat Team
website: https://ntfy.sh/
compose_file: docker-compose.yml

variables:
  - name: NTFY_VERSION
    type: select
    title: ntfy 版本
    default: "latest"
    options: ["latest", "v2", "v1"]
    description: 选择 ntfy 版本
  - name: NTFY_PORT
    type: number
    title: ntfy 端口
    default: 80
    min: 1024
    max: 65535
    description: ntfy Web 服务端口
  - name: NTFY_BASE_URL
    type: string
    title: ntfy 基础 URL
    default: "http://{{PRIMARY_DOMAIN}}"
    description: ntfy 服务的公网访问地址
    placeholder: "http://ntfy.example.com"
  - name: ENABLE_AUTH
    type: bool
    title: 启用认证
    default: true
    description: 是否启用用户认证

services:
  - name: ntfy
    type: web
    description: ntfy 推送通知服务
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: ntfy_data
        path: /var/cache/ntfy
        mode: rw
    healthcheck:
      type: http
      path: /v1/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_url: "http://{{PRIMARY_DOMAIN}}/v1"
  features: "推送通知,HTTP推送,WebSocket推送,邮件通知,主题订阅,认证保护"

