version: '3.8'

services:
  ntfy:
    image: binwiederhier/ntfy:{{NTFY_VERSION}}
    container_name: {{APP_NAME}}_ntfy
    restart: unless-stopped
    ports:
      - "{{NTFY_PORT}}:80"
    environment:
      NTFY_BASE_URL: http://{{PRIMARY_DOMAIN}}
      NTFY_AUTH_DEFAULT_ACCESS: "read-write"
    volumes:
      - ntfy_data:/var/cache/ntfy
      - ntfy_config:/etc/ntfy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ntfy_data:
    driver: local
  ntfy_config:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
