id: limesurvey
name: LimeSurvey
category: tools
subcategory: survey
tags: [php, mysql, survey, questionnaire, limesurvey]
description: 专业调查问卷工具，功能强大，支持多种问题类型和数据分析。
icon: limesurvey
version: 1.0.0
author: SSLcat Team
website: https://www.limesurvey.org/
compose_file: docker-compose.yml

variables:
  - name: LIMESURVEY_VERSION
    type: select
    title: LimeSurvey 版本
    default: "latest"
    options: ["latest", "6.0", "5.6"]
    description: 选择 LimeSurvey 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: LIMESURVEY_PORT
    type: number
    title: LimeSurvey 端口
    default: 80
    min: 1024
    max: 65535
    description: LimeSurvey Web 服务端口

services:
  - name: limesurvey
    type: web
    description: LimeSurvey 调查问卷服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: limesurvey_data
        path: /var/www/html/upload
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_limesurvey"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_limesurvey"
    root_password:
      pattern: random
      length: 20
  limesurvey:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/index.php/admin
  admin_email: admin@{{PRIMARY_DOMAIN}}
  admin_username: admin

