id: waifu-diffusion
name: Waifu Diffusion
category: ai
subcategory: image-generation
tags: [python, ai, image-generation, anime, waifu-diffusion, gpu]
description: 专为动漫风格图片生成优化的 Stable Diffusion 模型，生成效果优秀。
icon: waifu-diffusion
version: 1.0.0
author: SSLcat Team
website: https://github.com/harubaru/waifu-diffusion
compose_file: docker-compose.yml

variables:
  - name: WAIFU_DIFFUSION_VERSION
    type: select
    title: Waifu Diffusion 版本
    default: "latest"
    options: ["latest", "v1.4", "v1.3"]
    description: 选择 Waifu Diffusion 版本
  - name: WAIFU_DIFFUSION_PORT
    type: number
    title: Waifu Diffusion 端口
    default: 7860
    min: 1024
    max: 65535
    description: Waifu Diffusion Web 服务端口

services:
  - name: waifu-diffusion
    type: web
    description: Waifu Diffusion 动漫图片生成服务
    ports:
      - internal: 7860
        external: null
        public: true
    volumes:
      - name: waifu_diffusion_data
        path: /app/models
        mode: rw
      - name: waifu_diffusion_output
        path: /app/output
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "动漫风格,高质量生成,多种模型"
  gpu_required: true

