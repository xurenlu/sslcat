
services:
  waifu-diffusion:
    image: waifu-diffusion/webui:{{WAIFU_DIFFUSION_VERSION}}
    container_name: {{APP_NAME}}_waifu_diffusion
    restart: unless-stopped
    ports:
      - "{{WAIFU_DIFFUSION_PORT}}:7860"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - waifu_diffusion_data:/app/models
      - waifu_diffusion_output:/app/output
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  waifu_diffusion_data:
    driver: local
  waifu_diffusion_output:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

