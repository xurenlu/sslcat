version: '3.8'

services:
  pika:
    image: pika/server:{{PIKA_VERSION}}
    container_name: {{APP_NAME}}_pika
    restart: unless-stopped
    ports:
      - "{{PIKA_PORT}}:8080"
    environment:
      PIKA_API_KEY: {{PIKA_API_KEY}}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - pika_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  pika_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

