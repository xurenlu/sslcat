id: pika
name: Pika (AI视频生成)
category: ai
subcategory: video-generation
tags: [python, ai, video-generation, pika, gpu]
description: Pika AI 视频生成工具，从文本或图片生成高质量视频，需要 GPU。
icon: pika
version: 1.0.0
author: SSLcat Team
website: https://pika.art/
compose_file: docker-compose.yml

variables:
  - name: PIKA_VERSION
    type: select
    title: Pika 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Pika 版本
  - name: PIKA_PORT
    type: number
    title: Pika 端口
    default: 808080
    min: 1024
    max: 65535
    description: Pika API 服务端口
  - name: PIKA_API_KEY
    type: string
    title: Pika API Key
    default: ""
    description: Pika API 密钥（需要注册获取）
    required: true
    sensitive: true

services:
  - name: pika
    type: api
    description: Pika AI 视频生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: pika_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

credentials:
  pika:
    api_key:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  features: "文本转视频,图片转视频,高质量输出"
  gpu_required: true

