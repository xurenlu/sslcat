
services:
  web:
    image: jitsi/web:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_web
    restart: unless-stopped
    ports:
      - "{{JITSI_PORT}}:80"
      - "{{JITSI_HTTPS_PORT}}:443"
    environment:
      ENABLE_AUTH: "1"
      ENABLE_GUESTS: "1"
      ENABLE_LETSENCRYPT: "0"
      ENABLE_HTTP_REDIRECT: "1"
      ENABLE_TRANSCRIPTIONS: "0"
      DISABLE_HTTPS: "0"
      JVB_BREWERY_MUC: jvbbrewery
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: "{{JICOFO_PASSWORD}}"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "{{JVB_PASSWORD}}"
      JVB_STUN_SERVERS: stun.l.google.com:19302,stun1.l.google.com:19302
      JVB_ENABLE_APIS: rest,colibri
      PUBLIC_URL: "https://{{PRIMARY_DOMAIN}}"
      XMPP_DOMAIN: "{{PRIMARY_DOMAIN}}"
      XMPP_AUTH_DOMAIN: "auth.{{PRIMARY_DOMAIN}}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.{{PRIMARY_DOMAIN}}"
      XMPP_GUEST_DOMAIN: "guest.{{PRIMARY_DOMAIN}}"
      XMPP_MUC_DOMAIN: "muc.{{PRIMARY_DOMAIN}}"
      XMPP_RECORDER_DOMAIN: "recorder.{{PRIMARY_DOMAIN}}"
      XMPP_SERVER: xmpp.meet.jitsi
      JVB_PORT: 10000
      JVB_TCP_PORT: 4443
      JVB_TCP_MAPPED_PORT: 4443
    volumes:
      - jitsi_web:/config
    depends_on:
      - prosody
      - jvb
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prosody:
    image: jitsi/prosody:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_prosody
    restart: unless-stopped
    environment:
      AUTH_TYPE: internal
      ENABLE_AUTH: "1"
      ENABLE_GUESTS: "1"
      GLOBAL_MODULES: "module,http,http_alt,http_upload,smacks,websocket,external_services"
      XMPP_DOMAIN: "{{PRIMARY_DOMAIN}}"
      XMPP_AUTH_DOMAIN: "auth.{{PRIMARY_DOMAIN}}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.{{PRIMARY_DOMAIN}}"
      XMPP_GUEST_DOMAIN: "guest.{{PRIMARY_DOMAIN}}"
      XMPP_MUC_DOMAIN: "muc.{{PRIMARY_DOMAIN}}"
      XMPP_RECORDER_DOMAIN: "recorder.{{PRIMARY_DOMAIN}}"
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: "{{JICOFO_PASSWORD}}"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "{{JVB_PASSWORD}}"
      JVB_ENABLE_APIS: rest,colibri
    volumes:
      - prosody_data:/config
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "prosodyctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  jvb:
    image: jitsi/jvb:{{JITSI_VERSION}}
    container_name: {{APP_NAME}}_jitsi_jvb
    restart: unless-stopped
    ports:
      - "{{JVB_PORT}}:10000/udp"
      - "{{JVB_TCP_PORT}}:4443/tcp"
    environment:
      ENABLE_APIS: rest,colibri
      XMPP_AUTH_DOMAIN: "auth.{{PRIMARY_DOMAIN}}"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.{{PRIMARY_DOMAIN}}"
      XMPP_SERVER: xmpp.meet.jitsi
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "{{JVB_PASSWORD}}"
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
      JVB_STUN_SERVERS: stun.l.google.com:19302,stun1.l.google.com:19302
    volumes:
      - jvb_data:/config
    depends_on:
      - prosody
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/about/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  jitsi_web:
    driver: local
  prosody_data:
    driver: local
  jvb_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

