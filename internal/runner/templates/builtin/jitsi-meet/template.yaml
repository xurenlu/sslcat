id: jitsi-meet
name: Jitsi Meet (视频会议)
category: tools
subcategory: collaboration
tags: [nodejs, collaboration, video-conference, jitsi, webrtc]
description: 开源视频会议平台，支持多人视频通话、屏幕分享、录制等功能，无需注册即可使用。
icon: jitsi-meet
version: 1.0.0
author: SSLcat Team
website: https://jitsi.org/
compose_file: docker-compose.yml

variables:
  - name: JITSI_VERSION
    type: select
    title: Jitsi 版本
    default: "latest"
    options: ["latest", "stable-9258", "stable-9257"]
    description: 选择 Jitsi 版本
  - name: JITSI_PORT
    type: number
    title: Jitsi HTTP 端口
    default: 8080
    min: 1
    max: 65535
    description: Jitsi Web HTTP 端口
  - name: JITSI_HTTPS_PORT
    type: number
    title: Jitsi HTTPS 端口
    default: 8443
    min: 1
    max: 65535
    description: Jitsi Web HTTPS 端口
  - name: JVB_PORT
    type: number
    title: Jitsi Video Bridge UDP 端口
    default: 10000
    min: 1024
    max: 65535
    description: Jitsi Video Bridge UDP 端口
  - name: JVB_TCP_PORT
    type: number
    title: Jitsi Video Bridge TCP 端口
    default: 4443
    min: 1024
    max: 65535
    description: Jitsi Video Bridge TCP 端口

services:
  - name: web
    type: web
    description: Jitsi Web 界面服务
    depends_on: [prosody, jvb]
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 443
        external: null
        public: true
    volumes:
      - name: jitsi_web
        path: /config
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: prosody
    type: service
    description: Prosody XMPP 服务器
    volumes:
      - name: prosody_data
        path: /config
        mode: rw
    healthcheck:
      type: command
      command: ["prosodyctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  - name: jvb
    type: service
    description: Jitsi Video Bridge 服务
    depends_on: [prosody]
    ports:
      - internal: 10000
        external: null
        public: true
      - internal: 4443
        external: null
        public: true
    volumes:
      - name: jvb_data
        path: /config
        mode: rw
    healthcheck:
      type: http
      path: /about/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  jitsi:
    jicofo_password:
      pattern: random
      length: 24
    jvb_password:
      pattern: random
      length: 24

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: https://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "视频会议,屏幕分享,录制功能,无需注册"

