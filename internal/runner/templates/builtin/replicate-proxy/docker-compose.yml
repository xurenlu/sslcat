version: '3.8'

services:
  replicate-proxy:
    image: replicate/proxy:{{REPLICATE_PROXY_VERSION}}
    container_name: {{APP_NAME}}_replicate_proxy
    restart: unless-stopped
    ports:
      - "{{REPLICATE_PROXY_PORT}}:8080"
    environment:
      REPLICATE_API_TOKEN: {{REPLICATE_API_TOKEN}}
      REPLICATE_BASE_URL: https://api.replicate.com/v1
      CACHE_ENABLED: "{{CACHE_ENABLED}}"
    volumes:
      - replicate_proxy_data:/app/cache
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  replicate_proxy_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

