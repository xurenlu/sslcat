
services:
  radarr:
    image: lscr.io/linuxserver/radarr:{{RADARR_VERSION}}
    container_name: {{APP_NAME}}_radarr
    restart: unless-stopped
    ports:
      - "{{RADARR_PORT}}:7878"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    volumes:
      - radarr_data:/config
      - radarr_movies:/movies
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7878"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  radarr_data:
    driver: local
  radarr_movies:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

