id: replicate-remove-background
name: Replicate Remove Background (智能抠图)
category: ai
subcategory: image-editing
tags: [replicate, ai, image-editing, remove-background, background-removal]
description: Replicate 上的背景移除模型，智能抠图，无需 GPU。
icon: replicate-remove-background
version: 1.0.0
author: SSLcat Team
website: https://replicate.com/lucataco/remove-background
compose_file: docker-compose.yml

variables:
  - name: REPLICATE_RMBG_VERSION
    type: select
    title: Replicate Proxy 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Replicate Proxy 版本
  - name: REPLICATE_RMBG_PORT
    type: number
    title: Replicate Remove Background 端口
    default: 808080
    min: 1024
    max: 65535
    description: Replicate Remove Background API 服务端口
  - name: REPLICATE_API_TOKEN
    type: string
    title: Replicate API Token
    default: ""
    description: Replicate API Token（需要注册获取）
    required: true
    sensitive: true

services:
  - name: replicate-remove-background
    type: api
    description: Replicate Remove Background 智能抠图服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: replicate_rmbg_data
        path: /app/cache
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  replicate-remove-background:
    api_token:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/remove-background"
  replicate_model: "lucataco/remove-background"
  features: "智能抠图,背景移除,PNG透明背景"

