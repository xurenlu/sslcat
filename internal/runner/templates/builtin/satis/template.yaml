id: satis
name: Satis (Composer私有仓库)
category: tools
subcategory: package-registry
tags: [php, composer, package-registry, satis, private-registry]
description: Composer 私有包仓库，用于管理 PHP 包的私有仓库和镜像。
icon: satis
version: 1.0.0
author: SSLcat Team
website: https://getcomposer.org/doc/articles/handling-private-packages-with-satis.md
compose_file: docker-compose.yml

variables:
  - name: SATIS_VERSION
    type: select
    title: Satis 版本
    default: "latest"
    options: ["latest", "v2.0", "v1.0"]
    description: 选择 Satis 版本
  - name: SATIS_PORT
    type: number
    title: Satis 端口
    default: 8080
    min: 1024
    max: 65535
    description: Satis Web 服务端口

services:
  - name: satis
    type: web
    description: Satis Composer 私有仓库服务
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: satis_data
        path: /satis
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Composer私有仓库,包管理,镜像功能"
