
services:
  satis:
    image: composer/satis:{{SATIS_VERSION}}
    container_name: {{APP_NAME}}_satis
    restart: unless-stopped
    ports:
      - "{{SATIS_PORT}}:80"
    volumes:
      - satis_data:/satis
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  satis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
