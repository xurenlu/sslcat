version: '3.8'

services:
  satis:
    image: composer/satis:{{SATIS_VERSION}}
    container_name: {{APP_NAME}}_satis
    restart: unless-stopped
    ports:
      - "{{SATIS_PORT}}:80"
    environment:
      SATIS_NAME: {{SATIS_NAME}}
      SATIS_HOMEPAGE: {{SATIS_HOMEPAGE}}
      GIT_REPOSITORIES: {{GIT_REPOSITORIES}}
      TZ: Asia/Shanghai
    volumes:
      - satis_data:/satis
    networks:
      - {{APP_NAME}}_network
    command: ["sh", "-c", "satis build /satis/satis.json /satis/web && php -S 0.0.0.0:80 -t /satis/web"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  satis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

