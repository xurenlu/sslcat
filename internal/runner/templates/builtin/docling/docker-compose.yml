
services:
  docling:
    image: docling/server:{{DOCLING_VERSION}}
    container_name: {{APP_NAME}}_docling
    restart: unless-stopped
    ports:
      - "{{DOCLING_PORT}}:8080"
    environment:
      DOCLING_API_KEY: "{{DOCLING_API_KEY}}"
    volumes:
      - docling_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  docling_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

