id: meilisearch
name: Meilisearch
category: database
subcategory: search
tags: [meilisearch, search, search-engine]
description: 快速、易用的搜索引擎，支持即时搜索、拼写纠错等功能。
icon: meilisearch
version: 1.0.0
author: SSLcat Team
website: https://www.meilisearch.com/
compose_file: docker-compose.yml

variables:
  - name: MEILISEARCH_VERSION
    type: select
    title: Meilisearch 版本
    default: "latest"
    options: ["latest", "v1.6", "v1.5"]
    description: 选择 Meilisearch 版本
  - name: MEILISEARCH_PORT
    type: number
    title: Meilisearch 端口
    default: 7700
    min: 1024
    max: 65535
    description: Meilisearch HTTP API 端口

services:
  - name: meilisearch
    type: database
    description: Meilisearch 搜索引擎服务
    ports:
      - internal: 7700
        external: null
        public: true
    volumes:
      - name: meilisearch_data
        path: /meili_data
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  meilisearch:
    master_key:
      pattern: random
      length: 32

connection_strings:
  meilisearch: "http://{{PRIMARY_DOMAIN}}:{{MEILISEARCH_PORT}}"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  api_url: "http://{{PRIMARY_DOMAIN}}:{{MEILISEARCH_PORT}}"
  master_key: "{{MASTER_KEY}}"

