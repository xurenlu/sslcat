
services:
  meilisearch:
    image: getmeili/meilisearch:{{MEILISEARCH_VERSION}}
    container_name: {{APP_NAME}}_meilisearch
    restart: unless-stopped
    ports:
      - "{{MEILISEARCH_PORT}}:7700"
    environment:
      MEILI_MASTER_KEY: {{MASTER_KEY}}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  meilisearch_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

