
services:
  logseq:
    image: ghcr.io/logseq/logseq:{{LOGSEQ_VERSION}}
    container_name: {{APP_NAME}}_logseq
    restart: unless-stopped
    ports:
      - "{{LOGSEQ_PORT}}:3000"
    environment:
      LOGSEQ_APP_USER: {{LOGSEQ_USERNAME}}
      LOGSEQ_APP_PASSWORD: {{LOGSEQ_PASSWORD}}
    volumes:
      - logseq_data:/logseq
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  logseq_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

