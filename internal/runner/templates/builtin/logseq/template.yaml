id: logseq
name: Logseq (大纲笔记)
category: tools
subcategory: note-taking
tags: [clojure, note-taking, outline, logseq, knowledge-management]
description: 大纲式笔记工具，支持双向链接、块引用，适合知识管理和学习笔记。
icon: logseq
version: 1.0.0
author: SSLcat Team
website: https://logseq.com/
compose_file: docker-compose.yml

variables:
  - name: LOGSEQ_VERSION
    type: select
    title: Logseq 版本
    default: "latest"
    options: ["latest", "v0.9", "v0.8"]
    description: 选择 Logseq 版本
  - name: LOGSEQ_PORT
    type: number
    title: Logseq 端口
    default: 3000
    min: 1024
    max: 65535
    description: Logseq Web 服务端口
  - name: LOGSEQ_USERNAME
    type: string
    title: Logseq 用户名
    default: "admin"
    description: Logseq 登录用户名
  - name: LOGSEQ_PASSWORD
    type: string
    title: Logseq 密码
    default: ""
    description: Logseq 登录密码
    required: true
    sensitive: true

services:
  - name: logseq
    type: web
    description: Logseq 大纲笔记服务
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: logseq_data
        path: /logseq
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

credentials:
  logseq:
    username:
      pattern: "{LOGSEQ_USERNAME}"
    password:
      pattern: "{LOGSEQ_PASSWORD}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "大纲笔记,双向链接,块引用,知识图谱"

