
services:
  flarum:
    image: mondedie/flarum:{{FLARUM_VERSION}}
    container_name: {{APP_NAME}}_flarum
    restart: unless-stopped
    ports:
      - "{{FLARUM_PORT}}:8888"
    environment:
      UID: 1000
      GID: 1000
      DEBUG: "false"
      FORUM_URL: "http://{{PRIMARY_DOMAIN}}"
      DB_HOST: mysql
      DB_NAME: "{{MYSQL_DATABASE}}"
      DB_USER: "{{MYSQL_USERNAME}}"
      DB_PASS: "{{MYSQL_PASSWORD}}"
      DB_PREF: flarum_
      FLARUM_ADMIN_USER: admin
      FLARUM_ADMIN_PASS: "{{ADMIN_PASSWORD}}"
      FLARUM_ADMIN_MAIL: "admin@{{PRIMARY_DOMAIN}}"
      FLARUM_TITLE: "{{FLARUM_TITLE}}"
    volumes:
      - flarum_data:/flarum/app/public
      - flarum_extensions:/flarum/app/extensions
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{MYSQL_ROOT_PASSWORD}}"
      MYSQL_DATABASE: "{{MYSQL_DATABASE}}"
      MYSQL_USER: "{{MYSQL_USERNAME}}"
      MYSQL_PASSWORD: "{{MYSQL_PASSWORD}}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

volumes:
  flarum_data:
    driver: local
  flarum_extensions:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

