id: flarum
name: Flarum
category: forum
subcategory: discussion
tags: [php, mysql, forum, discussion, flarum]
description: 简洁现代的论坛平台，界面美观，易于使用。
icon: flarum
version: 1.0.0
author: SSLcat Team
website: https://flarum.org/
compose_file: docker-compose.yml

variables:
  - name: FLARUM_VERSION
    type: select
    title: Flarum 版本
    default: "latest"
    options: ["latest", "v1.8.0"]
    description: 选择 Flarum 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: FLARUM_PORT
    type: number
    title: Flarum 端口
    default: 8888
    min: 1024
    max: 65535
    description: Flarum Web 服务端口
  - name: FLARUM_TITLE
    type: string
    title: 论坛标题
    default: "My Flarum Forum"
    description: 论坛显示标题

services:
  - name: flarum
    type: web
    description: Flarum 论坛服务
    depends_on: [mysql]
    ports:
      - internal: 8888
        external: null
        public: true
    volumes:
      - name: flarum_data
        path: /flarum/app/public
        mode: rw
      - name: flarum_extensions
        path: /flarum/app/extensions
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_flarum"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_flarum"
    root_password:
      pattern: random
      length: 20
  flarum:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

