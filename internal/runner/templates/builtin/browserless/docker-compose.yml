
services:
  browserless:
    image: browserless/chrome:{{BROWSERLESS_VERSION}}
    container_name: {{APP_NAME}}_browserless
    restart: unless-stopped
    ports:
      - "{{BROWSERLESS_PORT}}:3000"
    environment:
      TOKEN: {{BROWSERLESS_TOKEN}}
      CONCURRENT: {{BROWSERLESS_CONCURRENT}}
      MAX_CONCURRENT: {{BROWSERLESS_MAX_CONCURRENT}}
    volumes:
      - browserless_data:/app/.local-data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  browserless_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
