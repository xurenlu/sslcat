version: '3.8'

services:
  browserless:
    image: browserless/chrome:{{BROWSERLESS_VERSION}}
    container_name: {{APP_NAME}}_browserless
    restart: unless-stopped
    ports:
      - "{{BROWSERLESS_PORT}}:3000"
    environment:
      TOKEN: {{BROWSERLESS_TOKEN}}
      MAX_CONCURRENT: {{MAX_CONCURRENT_SESSIONS}}
      MAX_QUEUE: {{MAX_QUEUE_SIZE}}
      TZ: Asia/Shanghai
    volumes:
      - browserless_data:/app/data
    networks:
      - {{APP_NAME}}_network
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  browserless_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

