id: browserless
name: Browserless (无头浏览器)
category: tools
subcategory: automation
tags: [nodejs, automation, browserless, puppeteer, headless-browser]
description: 无头浏览器服务，支持 Puppeteer、Playwright 等，用于网页截图、PDF 生成、爬虫等场景。
icon: browserless
version: 1.0.0
author: SSLcat Team
website: https://www.browserless.io/
compose_file: docker-compose.yml

variables:
  - name: BROWSERLESS_VERSION
    type: select
    title: Browserless 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Browserless 版本
  - name: BROWSERLESS_PORT
    type: number
    title: Browserless 端口
    default: 3000
    min: 1024
    max: 65535
    description: Browserless API 服务端口
  - name: BROWSERLESS_TOKEN
    type: string
    title: Browserless Token
    default: ""
    description: Browserless 访问令牌（可选）
    sensitive: true
  - name: BROWSERLESS_CONCURRENT
    type: number
    title: 并发数
    default: 10
    min: 1
    max: 100
    description: 最大并发浏览器实例数
  - name: BROWSERLESS_MAX_CONCURRENT
    type: number
    title: 最大并发数
    default: 20
    min: 1
    max: 100
    description: 最大并发连接数

services:
  - name: browserless
    type: api
    description: Browserless 无头浏览器服务
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: browserless_data
        path: /app/.local-data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  browserless:
    token:
      pattern: "{BROWSERLESS_TOKEN}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}:3000"
  features: "无头浏览器,网页截图,PDF生成,爬虫支持"
