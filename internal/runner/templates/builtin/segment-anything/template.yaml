id: segment-anything
name: Segment Anything (图像分割)
category: ai
subcategory: image-segmentation
tags: [python, ai, image-segmentation, sam, meta, gpu]
description: Meta 开源的图像分割模型，可以分割图片中的任何物体，需要 GPU。
icon: segment-anything
version: 1.0.0
author: SSLcat Team
website: https://github.com/facebookresearch/segment-anything
compose_file: docker-compose.yml

variables:
  - name: SEGMENT_ANYTHING_VERSION
    type: select
    title: Segment Anything 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Segment Anything 版本
  - name: SEGMENT_ANYTHING_PORT
    type: number
    title: Segment Anything 端口
    default: 808080
    min: 1024
    max: 65535
    description: Segment Anything API 服务端口

services:
  - name: segment-anything
    type: api
    description: Segment Anything 图像分割服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: segment_anything_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/segment"
  features: "图像分割,物体分割,实例分割,高精度分割"
  gpu_required: true

