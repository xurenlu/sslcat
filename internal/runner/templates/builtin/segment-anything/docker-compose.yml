version: '3.8'

services:
  segment-anything:
    image: segment-anything/server:{{SEGMENT_ANYTHING_VERSION}}
    container_name: {{APP_NAME}}_segment_anything
    restart: unless-stopped
    ports:
      - "{{SEGMENT_ANYTHING_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - segment_anything_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  segment_anything_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

