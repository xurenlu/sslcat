id: webtrees
name: webtrees
category: collaboration
subcategory: genealogy
tags: [php, mysql, genealogy, family-tree, webtrees]
description: 开源家谱管理系统，支持多语言，适合家族历史研究。
icon: webtrees
version: 1.0.0
author: SSLcat Team
website: https://www.webtrees.net/
compose_file: docker-compose.yml

variables:
  - name: WEBTREES_VERSION
    type: select
    title: webtrees 版本
    default: "latest"
    options: ["latest", "2.1", "2.0"]
    description: 选择 webtrees 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: WEBTREES_PORT
    type: number
    title: webtrees 端口
    default: 80
    min: 1024
    max: 65535
    description: webtrees Web 服务端口

services:
  - name: webtrees
    type: web
    description: webtrees 家谱管理服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: webtrees_data
        path: /var/www/html/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_webtrees"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_webtrees"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

