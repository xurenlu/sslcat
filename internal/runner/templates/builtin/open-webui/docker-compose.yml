
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:{{OPEN_WEBUI_VERSION}}
    container_name: {{APP_NAME}}_open_webui
    restart: unless-stopped
    ports:
      - "{{OPEN_WEBUI_PORT}}:3000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: "{{SECRET_KEY}}"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama:{{OLLAMA_VERSION}}
    container_name: {{APP_NAME}}_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - {{APP_NAME}}_network

volumes:
  open_webui_data:
    driver: local
  ollama_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

