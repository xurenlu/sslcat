id: open-webui
name: Open WebUI
category: ai
subcategory: chat
tags: [nodejs, ai, chat, llm, open-webui]
description: 为 Ollama 提供 Web UI，类似 ChatGPT 界面，支持多模型对话。
icon: open-webui
version: 1.0.0
author: SSLcat Team
website: https://github.com/open-webui/open-webui
compose_file: docker-compose.yml

variables:
  - name: OPEN_WEBUI_VERSION
    type: select
    title: Open WebUI 版本
    default: "latest"
    options: ["latest", "v0.2", "v0.1"]
    description: 选择 Open WebUI 版本
  - name: OLLAMA_VERSION
    type: select
    title: Ollama 版本
    default: "latest"
    options: ["latest", "0.1"]
    description: 选择 Ollama 版本
  - name: OPEN_WEBUI_PORT
    type: number
    title: Open WebUI 端口
    default: 3000
    min: 1024
    max: 65535
    description: Open WebUI Web 服务端口

services:
  - name: open-webui
    type: web
    description: Open WebUI 聊天界面服务
    depends_on: [ollama]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: open_webui_data
        path: /app/backend/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: ollama
    type: api
    description: Ollama LLM 服务
    volumes:
      - name: ollama_data
        path: /root/.ollama
        mode: rw

credentials:
  open-webui:
    secret_key:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

