version: '3.8'

services:
  hugo:
    image: klakegg/hugo:{{HUGO_VERSION}}
    container_name: {{APP_NAME}}_hugo
    restart: unless-stopped
    ports:
      - "{{HUGO_PORT}}:1313"
    command: server --bind 0.0.0.0 --baseURL http://{{PRIMARY_DOMAIN}} --appendPort=false
    volumes:
      - hugo_site:/src
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1313"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hugo_site:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

