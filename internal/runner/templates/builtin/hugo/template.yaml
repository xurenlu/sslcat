id: hugo
name: Hugo
category: cms
subcategory: static
tags: [static, hugo, blog, ssg]
description: 快速的静态站点生成器，适合博客和文档网站。
icon: hugo
version: 1.0.0
author: SSLcat Team
website: https://gohugo.io/
compose_file: docker-compose.yml

variables:
  - name: HUGO_VERSION
    type: select
    title: Hugo 版本
    default: "ext-alpine"
    options: ["ext-alpine", "latest", "0.120.0"]
    description: 选择 Hugo 版本
  - name: HUGO_PORT
    type: number
    title: Hugo 端口
    default: 1313
    min: 1024
    max: 65535
    description: Hugo 开发服务器端口

services:
  - name: hugo
    type: web
    description: Hugo 静态站点服务器
    ports:
      - internal: 1313
        external: null
        public: true
    volumes:
      - name: hugo_site
        path: /src
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}

