id: taskcafe
name: TaskCafe (任务管理)
category: tools
subcategory: project-management
tags: [go, postgres, project-management, taskcafe, task-management]
description: 开源任务管理工具，支持看板、列表、日历等多种视图，类似 Trello。
icon: taskcafe
version: 1.0.0
author: SSLcat Team
website: https://github.com/JordanKnott/taskcafe
compose_file: docker-compose.yml

variables:
  - name: TASKCAFE_VERSION
    type: select
    title: TaskCafe 版本
    default: "latest"
    options: ["latest", "v0.3", "v0.2"]
    description: 选择 TaskCafe 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: TASKCAFE_PORT
    type: number
    title: TaskCafe 端口
    default: 3333
    min: 1024
    max: 65535
    description: TaskCafe Web 服务端口

services:
  - name: taskcafe
    type: web
    description: TaskCafe 任务管理服务
    depends_on: [postgres]
    ports:
      - internal: 3333
        external: null
        public: true
    volumes:
      - name: taskcafe_data
        path: /app/uploads
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_taskcafe"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_taskcafe"
  taskcafe:
    jwt_secret:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3333
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "任务管理,看板视图,列表视图,日历视图"
