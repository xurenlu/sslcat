id: taskcafe
name: TaskCafe (任务管理)
category: tools
subcategory: todo
tags: [todo, task-management, taskcafe, kanban, gtd]
description: 现代化的任务管理工具，支持看板视图、列表视图，界面美观，功能完整。
icon: taskcafe
version: 1.0.0
author: SSLcat Team
website: https://github.com/jordanshumway/taskcafe
compose_file: docker-compose.yml

variables:
  - name: TASKCAFE_VERSION
    type: select
    title: TaskCafe 版本
    default: "latest"
    options: ["latest", "v0.3", "v0.2"]
    description: 选择 TaskCafe 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: TASKCAFE_PORT
    type: number
    title: TaskCafe 端口
    default: 3333
    min: 1024
    max: 65535
    description: TaskCafe Web 服务端口

services:
  - name: taskcafe
    type: web
    description: TaskCafe 任务管理服务
    depends_on: [postgres]
    ports:
      - internal: 3333
        external: null
        public: true
    volumes:
      - name: taskcafe_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_taskcafe"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_taskcafe"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "任务管理,看板视图,列表视图,项目分类,标签系统,截止日期,优先级,评论功能"

