id: jasper
name: Jasper AI Writer
category: ai
subcategory: writing
tags: [nodejs, postgres, ai, writing, marketing, content-generation]
description: AI 营销文案写作工具，支持博客、广告、邮件等多种营销内容生成。
icon: jasper
version: 1.0.0
author: SSLcat Team
website: https://www.jasper.ai/
compose_file: docker-compose.yml

variables:
  - name: JASPER_VERSION
    type: select
    title: Jasper 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Jasper 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: JASPER_PORT
    type: number
    title: Jasper 端口
    default: 3000
    min: 1024
    max: 65535
    description: Jasper Web 服务端口
  - name: OPENAI_API_KEY
    type: string
    title: OpenAI API Key
    default: ""
    description: OpenAI API 密钥（可选）
    sensitive: true
  - name: JASPER_API_KEY
    type: string
    title: Jasper API Key
    default: ""
    description: Jasper API 密钥（可选）
    sensitive: true

services:
  - name: jasper
    type: web
    description: Jasper AI 写作服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: jasper_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_jasper"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_jasper"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "营销文案,博客写作,广告文案,邮件内容"

