id: replicate-shape-e
name: Replicate Shap-E (3D生成)
category: ai
subcategory: 3d-generation
tags: [replicate, ai, 3d-generation, shap-e, gpu]
description: Replicate 上的 OpenAI Shap-E 模型，从文本或图片生成 3D 模型，需要 GPU。
icon: replicate-shape-e
version: 1.0.0
author: SSLcat Team
website: https://replicate.com/openai/shap-e
compose_file: docker-compose.yml

variables:
  - name: REPLICATE_SHAPE_E_VERSION
    type: select
    title: Replicate Proxy 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Replicate Proxy 版本
  - name: REPLICATE_SHAPE_E_PORT
    type: number
    title: Replicate Shap-E 端口
    default: 808080
    min: 1024
    max: 65535
    description: Replicate Shap-E API 服务端口
  - name: REPLICATE_API_TOKEN
    type: string
    title: Replicate API Token
    default: ""
    description: Replicate API Token（需要注册获取）
    required: true
    sensitive: true

services:
  - name: replicate-shape-e
    type: api
    description: Replicate Shap-E 3D 生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: replicate_shape_e_data
        path: /app/cache
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  replicate-shape-e:
    api_token:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  replicate_model: "openai/shap-e"
  features: "3D模型生成,文本转3D,图片转3D"
  gpu_required: true

