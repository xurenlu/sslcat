version: '3.8'

services:
  replicate-shape-e:
    image: replicate/proxy:{{REPLICATE_SHAPE_E_VERSION}}
    container_name: {{APP_NAME}}_replicate_shape_e
    restart: unless-stopped
    ports:
      - "{{REPLICATE_SHAPE_E_PORT}}:8080"
    environment:
      REPLICATE_API_TOKEN: {{REPLICATE_API_TOKEN}}
      REPLICATE_MODEL: openai/shap-e
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - replicate_shape_e_data:/app/cache
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  replicate_shape_e_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

