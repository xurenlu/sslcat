version: '3.8'

services:
  gitea:
    image: gitea/gitea:{{GITEA_VERSION}}
    container_name: {{APP_NAME}}_gitea
    restart: unless-stopped
    ports:
      - "{{GITEA_PORT}}:3000"
      - "{{GITEA_SSH_PORT}}:22"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: {{POSTGRES_DATABASE}}
      GITEA__database__USER: {{POSTGRES_USERNAME}}
      GITEA__database__PASSWD: {{POSTGRES_PASSWORD}}
      GITEA__server__DOMAIN: {{PRIMARY_DOMAIN}}
      GITEA__server__SSH_DOMAIN: {{PRIMARY_DOMAIN}}
      GITEA__server__ROOT_URL: http://{{PRIMARY_DOMAIN}}
    volumes:
      - gitea_data:/data
      - gitea_config:/etc/gitea
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gitea_data:
    driver: local
  gitea_config:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

