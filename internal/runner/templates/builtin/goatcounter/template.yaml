id: goatcounter
name: GoatCounter
category: analytics
subcategory: web-analytics
tags: [go, postgresql, analytics, privacy, goatcounter]
description: 简单、隐私友好的网站分析工具，轻量快速。
icon: goatcounter
version: 1.0.0
author: SSLcat Team
website: https://www.goatcounter.com/
compose_file: docker-compose.yml

variables:
  - name: GOATCOUNTER_VERSION
    type: select
    title: GoatCounter 版本
    default: "latest"
    options: ["latest", "2.5"]
    description: 选择 GoatCounter 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: GOATCOUNTER_PORT
    type: number
    title: GoatCounter 端口
    default: 808080
    min: 1024
    max: 65535
    description: GoatCounter Web 服务端口

services:
  - name: goatcounter
    type: web
    description: GoatCounter 分析服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: goatcounter_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_goatcounter"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_goatcounter"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

