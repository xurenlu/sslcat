id: neural-style-transfer
name: Neural Style Transfer (风格迁移)
category: ai
subcategory: image-editing
tags: [python, ai, image-editing, style-transfer, neural-style, gpu]
description: 神经风格迁移工具，将一张图片的风格应用到另一张图片上，需要 GPU。
icon: neural-style-transfer
version: 1.0.0
author: SSLcat Team
website: https://github.com/neural-style-transfer
compose_file: docker-compose.yml

variables:
  - name: NEURAL_STYLE_TRANSFER_VERSION
    type: select
    title: Neural Style Transfer 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Neural Style Transfer 版本
  - name: NEURAL_STYLE_TRANSFER_PORT
    type: number
    title: Neural Style Transfer 端口
    default: 8080
    min: 1024
    max: 65535
    description: Neural Style Transfer API 服务端口

services:
  - name: neural-style-transfer
    type: api
    description: Neural Style Transfer 风格迁移服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: neural_style_transfer_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/transfer"
  features: "风格迁移,艺术效果,多种风格,高质量输出"
  gpu_required: true

