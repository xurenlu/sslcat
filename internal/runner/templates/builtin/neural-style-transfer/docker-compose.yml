version: '3.8'

services:
  neural-style-transfer:
    image: neural-style-transfer/server:{{NEURAL_STYLE_TRANSFER_VERSION}}
    container_name: {{APP_NAME}}_neural_style_transfer
    restart: unless-stopped
    ports:
      - "{{NEURAL_STYLE_TRANSFER_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - neural_style_transfer_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  neural_style_transfer_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

