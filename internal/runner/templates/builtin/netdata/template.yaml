id: netdata
name: Netdata
category: devops
subcategory: monitoring
tags: [c, monitoring, metrics, real-time, netdata]
description: 实时系统监控工具，性能优秀，适合服务器监控。
icon: netdata
version: 1.0.0
author: SSLcat Team
website: https://www.netdata.cloud/
compose_file: docker-compose.yml

variables:
  - name: NETDATA_VERSION
    type: select
    title: Netdata 版本
    default: "latest"
    options: ["latest", "1.44", "1.43"]
    description: 选择 Netdata 版本
  - name: NETDATA_PORT
    type: number
    title: Netdata 端口
    default: 19999
    min: 1024
    max: 65535
    description: Netdata Web 服务端口

services:
  - name: netdata
    type: web
    description: Netdata 监控服务
    ports:
      - internal: 19999
        external: null
        public: true
    volumes:
      - name: netdata_data
        path: /var/lib/netdata
        mode: rw
      - name: netdata_config
        path: /etc/netdata
        mode: rw
      - name: proc
        path: /host/proc
        mode: ro
      - name: sys
        path: /host/sys
        mode: ro
      - name: docker_sock
        path: /var/run/docker.sock
        mode: ro
    healthcheck:
      type: http
      path: /api/v1/info
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

