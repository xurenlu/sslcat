
services:
  replicate-stable-video:
    image: replicate/proxy:{{REPLICATE_STABLE_VIDEO_VERSION}}
    container_name: {{APP_NAME}}_replicate_stable_video
    restart: unless-stopped
    ports:
      - "{{REPLICATE_STABLE_VIDEO_PORT}}:8080"
    environment:
      REPLICATE_API_TOKEN: {{REPLICATE_API_TOKEN}}
      REPLICATE_MODEL: stability-ai/stable-video-diffusion
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - replicate_stable_video_data:/app/cache
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  replicate_stable_video_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

