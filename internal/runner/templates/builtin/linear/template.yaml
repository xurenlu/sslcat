id: linear
name: Linear (Bug 管理)
category: project
subcategory: issue-tracking
tags: [bug-tracking, issue-management, linear, project-management]
description: 现代化的 Bug 管理和项目管理工具，界面简洁美观，支持快速创建和追踪问题。
icon: linear
version: 1.0.0
author: SSLcat Team
website: https://linear.app/
compose_file: docker-compose.yml

variables:
  - name: LINEAR_VERSION
    type: select
    title: Linear 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Linear 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: LINEAR_PORT
    type: number
    title: Linear 端口
    default: 3000
    min: 1024
    max: 65535
    description: Linear Web 服务端口
  - name: LINEAR_SECRET_KEY
    type: string
    title: Linear Secret Key
    default: ""
    description: Linear 密钥（留空将自动生成）
    sensitive: true

services:
  - name: linear-web
    type: web
    description: Linear Web 服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: linear_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: linear-worker
    type: worker
    description: Linear 后台任务处理服务
    depends_on: [linear-web]

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_linear"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_linear"
  linear:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Bug管理,问题追踪,项目管理,看板视图,快速搜索"

