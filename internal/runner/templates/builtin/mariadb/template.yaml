id: mariadb
name: MariaDB
category: database
subcategory: relational
tags: [mariadb, mysql, database, sql]
description: MySQL 的开源替代品，完全兼容 MySQL，性能优秀。
icon: mariadb
version: 1.0.0
author: SSLcat Team
website: https://mariadb.org/
compose_file: docker-compose.yml

variables:
  - name: MARIADB_VERSION
    type: select
    title: MariaDB 版本
    default: "latest"
    options: ["latest", "11.2", "11.1", "10.11"]
    description: 选择 MariaDB 版本
  - name: MARIADB_PORT
    type: number
    title: MariaDB 端口
    default: 3306
    min: 1024
    max: 65535
    description: MariaDB 服务端口

services:
  - name: mariadb
    type: database
    description: MariaDB 数据库服务
    ports:
      - internal: 3306
        external: null
        public: true
    volumes:
      - name: mariadb_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mariadb:
    username:
      pattern: "{app_name}_user"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_db"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mariadb: "mysql://{username}:{password}@mariadb:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  admin_user: root
  admin_password: {{MARIADB_ROOT_PASSWORD}}

