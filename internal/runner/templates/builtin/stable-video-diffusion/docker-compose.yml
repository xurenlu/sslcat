version: '3.8'

services:
  stable-video-diffusion:
    image: stability-ai/stable-video-diffusion:{{STABLE_VIDEO_DIFFUSION_VERSION}}
    container_name: {{APP_NAME}}_stable_video_diffusion
    restart: unless-stopped
    ports:
      - "{{STABLE_VIDEO_DIFFUSION_PORT}}:7860"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - stable_video_diffusion_data:/app/models
      - stable_video_diffusion_output:/app/output
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  stable_video_diffusion_data:
    driver: local
  stable_video_diffusion_output:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

