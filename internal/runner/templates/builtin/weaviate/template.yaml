id: weaviate
name: Weaviate (向量数据库)
category: database
subcategory: vector-database
tags: [go, database, vector-database, weaviate]
description: 开源向量数据库，支持多种向量化模型，专为 AI 应用设计。
icon: weaviate
version: 1.0.0
author: SSLcat Team
website: https://weaviate.io/
compose_file: docker-compose.yml

variables:
  - name: WEAVIATE_VERSION
    type: select
    title: Weaviate 版本
    default: "latest"
    options: ["latest", "v1.24", "v1.23"]
    description: 选择 Weaviate 版本
  - name: WEAVIATE_PORT
    type: number
    title: Weaviate 端口
    default: 8080
    min: 1024
    max: 65535
    description: Weaviate API 服务端口

services:
  - name: weaviate
    type: database
    description: Weaviate 向量数据库服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: weaviate_data
        path: /var/lib/weaviate
        mode: rw
    healthcheck:
      type: http
      path: /v1/.well-known/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/v1"
  features: "向量搜索,多种向量化模型,GraphQL API,高性能"

