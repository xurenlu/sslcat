
services:
  dalle-mini:
    image: dalle-mini/server:{{DALLE_MINI_VERSION}}
    container_name: {{APP_NAME}}_dalle_mini
    restart: unless-stopped
    ports:
      - "{{DALLE_MINI_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - dalle_mini_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  dalle_mini_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

