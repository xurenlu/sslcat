id: dalle-mini
name: DALL-E Mini (图片生成)
category: ai
subcategory: image-generation
tags: [python, ai, image-generation, dalle-mini, gpu]
description: DALL-E Mini 开源图片生成模型，从文本生成图片，需要 GPU。
icon: dalle-mini
version: 1.0.0
author: SSLcat Team
website: https://github.com/borisdayma/dalle-mini
compose_file: docker-compose.yml

variables:
  - name: DALLE_MINI_VERSION
    type: select
    title: DALL-E Mini 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 DALL-E Mini 版本
  - name: DALLE_MINI_PORT
    type: number
    title: DALL-E Mini 端口
    default: 808080
    min: 1024
    max: 65535
    description: DALL-E Mini API 服务端口

services:
  - name: dalle-mini
    type: api
    description: DALL-E Mini 图片生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: dalle_mini_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  features: "文本转图片,快速生成,多种风格"
  gpu_required: true

