id: bookstack
name: BookStack
category: collaboration
subcategory: wiki
tags: [php, mysql, wiki, documentation, bookstack]
description: 简单的 Wiki 和文档平台，界面美观，适合团队知识管理。
icon: bookstack
version: 1.0.0
author: SSLcat Team
website: https://www.bookstackapp.com/
compose_file: docker-compose.yml

variables:
  - name: BOOKSTACK_VERSION
    type: select
    title: BookStack 版本
    default: "latest"
    options: ["latest", "23.12"]
    description: 选择 BookStack 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: BOOKSTACK_PORT
    type: number
    title: BookStack 端口
    default: 808080
    min: 1024
    max: 65535
    description: BookStack Web 服务端口

services:
  - name: bookstack
    type: web
    description: BookStack Wiki 服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: bookstack_data
        path: /config
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_bookstack"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_bookstack"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin@admin.com
  default_admin_password: password

