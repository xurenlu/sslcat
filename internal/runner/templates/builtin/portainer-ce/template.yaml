id: portainer-ce
name: Portainer CE (容器管理)
category: tools
subcategory: container-management
tags: [go, docker, container-management, portainer, docker-ui]
description: Docker 和 Kubernetes 的 Web 管理界面，可视化容器管理、镜像管理、网络管理等。
icon: portainer-ce
version: 1.0.0
author: SSLcat Team
website: https://www.portainer.io/
compose_file: docker-compose.yml

variables:
  - name: PORTAINER_VERSION
    type: select
    title: Portainer 版本
    default: "latest"
    options: ["latest", "2.20", "2.19"]
    description: 选择 Portainer 版本
  - name: PORTAINER_PORT
    type: number
    title: Portainer Web 端口
    default: 9000
    min: 1024
    max: 65535
    description: Portainer Web UI 端口
  - name: PORTAINER_AGENT_PORT
    type: number
    title: Portainer Agent 端口
    default: 8000
    min: 1024
    max: 65535
    description: Portainer Agent 端口

services:
  - name: portainer
    type: web
    description: Portainer 容器管理服务
    ports:
      - internal: 9000
        external: null
        public: true
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: portainer_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /api/status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:9000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "容器管理,镜像管理,网络管理,可视化界面"

