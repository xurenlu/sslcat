id: seafile
name: Seafile
category: collaboration
subcategory: file-sharing
tags: [python, mysql, file-sharing, collaboration, seafile]
description: 企业级文件同步和共享平台，支持文件版本控制和协作。
icon: seafile
version: 1.0.0
author: SSLcat Team
website: https://www.seafile.com/
compose_file: docker-compose.yml

variables:
  - name: SEAFILE_VERSION
    type: select
    title: Seafile 版本
    default: "latest"
    options: ["latest", "11.0", "10.0"]
    description: 选择 Seafile 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: SEAFILE_PORT
    type: number
    title: Seafile 端口
    default: 808080
    min: 1024
    max: 65535
    description: Seafile Web 服务端口

services:
  - name: seafile
    type: web
    description: Seafile 文件共享服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: seafile_data
        path: /shared
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_seafile"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_seafile"
    root_password:
      pattern: random
      length: 20
  seafile:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

