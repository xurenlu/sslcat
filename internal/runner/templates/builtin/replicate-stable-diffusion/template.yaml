id: replicate-stable-diffusion
name: Replicate Stable Diffusion
category: ai
subcategory: image-generation
tags: [replicate, ai, image-generation, stable-diffusion, gpu]
description: Replicate 上的 Stable Diffusion 模型，高质量图片生成，需要 GPU。
icon: replicate-stable-diffusion
version: 1.0.0
author: SSLcat Team
website: https://replicate.com/stability-ai/stable-diffusion
compose_file: docker-compose.yml

variables:
  - name: REPLICATE_SD_VERSION
    type: select
    title: Replicate Proxy 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Replicate Proxy 版本
  - name: REPLICATE_SD_PORT
    type: number
    title: Replicate SD 端口
    default: 808080
    min: 1024
    max: 65535
    description: Replicate Stable Diffusion API 服务端口
  - name: REPLICATE_API_TOKEN
    type: string
    title: Replicate API Token
    default: ""
    description: Replicate API Token（需要注册获取）
    required: true
    sensitive: true

services:
  - name: replicate-sd
    type: api
    description: Replicate Stable Diffusion 图片生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: replicate_sd_data
        path: /app/cache
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  replicate-sd:
    api_token:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  replicate_model: "stability-ai/stable-diffusion"
  features: "高质量图片生成,多种风格,快速生成"
  gpu_required: true

