
services:
  replicate-sd:
    image: nginx:alpine
    container_name: {{APP_NAME}}_replicate_sd
    restart: unless-stopped
    ports:
      - "{{REPLICATE_SD_PORT}}:80"
    environment:
      REPLICATE_API_TOKEN: "{{REPLICATE_API_TOKEN}}"
      REPLICATE_MODEL: stability-ai/stable-diffusion
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - replicate_sd_data:/app/cache
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  replicate_sd_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

