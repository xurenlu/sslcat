version: '3.8'

services:
  word-to-pdf:
    image: gotenberg/gotenberg:{{LIBREOFFICE_VERSION}}
    container_name: {{APP_NAME}}_word_to_pdf
    restart: unless-stopped
    ports:
      - "{{CONVERTER_PORT}}:3000"
    command: ["gotenberg", "--api-timeout=300s"]
    environment:
      MAX_FILE_SIZE: {{MAX_FILE_SIZE}}
      TIMEOUT_SECONDS: {{TIMEOUT_SECONDS}}
      TZ: Asia/Shanghai
    volumes:
      - converter_data:/tmp/converter
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  converter_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

