id: send
name: Send
category: tools
subcategory: file-sharing
tags: [nodejs, redis, file-sharing, encrypted, send]
description: 加密文件分享服务，支持密码保护和过期时间设置。
icon: send
version: 1.0.0
author: SSLcat Team
website: https://github.com/timvisee/send
compose_file: docker-compose.yml

variables:
  - name: SEND_VERSION
    type: select
    title: Send 版本
    default: "latest"
    options: ["latest", "v5", "v4"]
    description: 选择 Send 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: SEND_PORT
    type: number
    title: Send 端口
    default: 1443
    min: 1024
    max: 65535
    description: Send Web 服务端口

services:
  - name: send
    type: web
    description: Send 加密文件分享服务
    depends_on: [redis]
    ports:
      - internal: 1443
        external: null
        public: true
    volumes:
      - name: send_data
        path: /uploads
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

connection_strings:
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

