version: '3.8'

services:
  magento:
    image: markoshust/magento:{{MAGENTO_VERSION}}
    container_name: {{APP_NAME}}_magento
    restart: unless-stopped
    ports:
      - "{{MAGENTO_PORT}}:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
      MAGENTO_URL: http://{{PRIMARY_DOMAIN}}
      MAGENTO_ADMIN_FIRSTNAME: Admin
      MAGENTO_ADMIN_LASTNAME: User
      MAGENTO_ADMIN_EMAIL: admin@{{PRIMARY_DOMAIN}}
      MAGENTO_ADMIN_USERNAME: admin
      MAGENTO_ADMIN_PASSWORD: {{ADMIN_PASSWORD}}
    volumes:
      - magento_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  magento_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

