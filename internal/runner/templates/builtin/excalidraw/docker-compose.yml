
services:
  excalidraw:
    image: excalidraw/excalidraw:{{EXCALIDRAW_VERSION}}
    container_name: {{APP_NAME}}_excalidraw
    restart: unless-stopped
    ports:
      - "{{EXCALIDRAW_PORT}}:80"
    environment:
      REACT_APP_BACKEND_V1_GET_URL: /api/v1
      REACT_APP_BACKEND_V2_GET_URL: /api/v2
      REACT_APP_BACKEND_V2_POST_URL: /api/v2
    volumes:
      - excalidraw_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  excalidraw_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

