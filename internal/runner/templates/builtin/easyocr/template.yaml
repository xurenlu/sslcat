id: easyocr
name: EasyOCR
category: tools
subcategory: ocr
tags: [python, ocr, text-recognition, easyocr]
description: 简单易用的 OCR 工具，支持 80+ 种语言，识别准确率高。
icon: easyocr
version: 1.0.0
author: SSLcat Team
website: https://github.com/JaidedAI/EasyOCR
compose_file: docker-compose.yml

variables:
  - name: EASYOCR_VERSION
    type: select
    title: EasyOCR 版本
    default: "latest"
    options: ["latest", "1.7", "1.6"]
    description: 选择 EasyOCR 版本
  - name: EASYOCR_PORT
    type: number
    title: EasyOCR 端口
    default: 808080
    min: 1024
    max: 65535
    description: EasyOCR Web 服务端口
  - name: EASYOCR_LANG
    type: string
    title: 支持的语言
    default: "ch_sim,en"
    description: 支持的语言列表，用逗号分隔（如：ch_sim,en,ja,ko）
    placeholder: "ch_sim,en"

services:
  - name: easyocr
    type: web
    description: EasyOCR OCR 服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: easyocr_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  supported_languages: 80+

