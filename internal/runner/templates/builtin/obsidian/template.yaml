id: obsidian
name: Obsidian (知识管理)
category: tools
subcategory: note-taking
tags: [nodejs, note-taking, knowledge-management, obsidian, markdown]
description: 强大的知识管理工具，支持 Markdown、双向链接、插件系统，Notion 的开源替代品。
icon: obsidian
version: 1.0.0
author: SSLcat Team
website: https://obsidian.md/
compose_file: docker-compose.yml

variables:
  - name: OBSIDIAN_VERSION
    type: select
    title: Obsidian 版本
    default: "latest"
    options: ["latest", "v1.5", "v1.4"]
    description: 选择 Obsidian 版本
  - name: OBSIDIAN_PORT
    type: number
    title: Obsidian 端口
    default: 808080
    min: 1024
    max: 65535
    description: Obsidian Web 服务端口
  - name: OBSIDIAN_PASSWORD
    type: string
    title: Obsidian 密码
    default: ""
    description: Obsidian 访问密码
    required: true
    sensitive: true

services:
  - name: obsidian
    type: web
    description: Obsidian 知识管理服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: obsidian_data
        path: /config
        mode: rw
      - name: obsidian_vault
        path: /vault
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

credentials:
  obsidian:
    password:
      pattern: "{OBSIDIAN_PASSWORD}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "知识管理,双向链接,Markdown支持,丰富插件"

