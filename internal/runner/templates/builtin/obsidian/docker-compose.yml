version: '3.8'

services:
  obsidian:
    image: ghcr.io/sytone/obsidian-remote:{{OBSIDIAN_VERSION}}
    container_name: {{APP_NAME}}_obsidian
    restart: unless-stopped
    ports:
      - "{{OBSIDIAN_PORT}}:8080"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      PASSWORD: {{OBSIDIAN_PASSWORD}}
    volumes:
      - obsidian_data:/config
      - obsidian_vault:/vault
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  obsidian_data:
    driver: local
  obsidian_vault:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

