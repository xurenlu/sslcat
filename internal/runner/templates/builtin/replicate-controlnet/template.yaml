id: replicate-controlnet
name: Replicate ControlNet (精确图片生成)
category: ai
subcategory: image-generation
tags: [replicate, ai, image-generation, controlnet, gpu]
description: Replicate 上的 ControlNet 模型，通过控制条件精确生成图片，需要 GPU。
icon: replicate-controlnet
version: 1.0.0
author: SSLcat Team
website: https://replicate.com/lllyasviel/controlnet
compose_file: docker-compose.yml

variables:
  - name: REPLICATE_CONTROLNET_VERSION
    type: select
    title: Replicate Proxy 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Replicate Proxy 版本
  - name: REPLICATE_CONTROLNET_PORT
    type: number
    title: Replicate ControlNet 端口
    default: 8080
    min: 1024
    max: 65535
    description: Replicate ControlNet API 服务端口
  - name: REPLICATE_API_TOKEN
    type: string
    title: Replicate API Token
    default: ""
    description: Replicate API Token（需要注册获取）
    required: true
    sensitive: true

services:
  - name: replicate-controlnet
    type: api
    description: Replicate ControlNet 精确图片生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: replicate_controlnet_data
        path: /app/cache
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  replicate-controlnet:
    api_token:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  replicate_model: "lllyasviel/controlnet"
  features: "精确控制,姿态控制,边缘检测,深度图控制"
  gpu_required: true

