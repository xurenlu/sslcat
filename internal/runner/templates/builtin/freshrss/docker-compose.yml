
services:
  freshrss:
    image: freshrss/freshrss:{{FRESHRSS_VERSION}}
    container_name: {{APP_NAME}}_freshrss
    restart: unless-stopped
    ports:
      - "{{FRESHRSS_PORT}}:80"
    environment:
      TZ: {{TIMEZONE}}
      CRON_MIN: "*/15"
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  freshrss_data:
    driver: local
  freshrss_extensions:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

