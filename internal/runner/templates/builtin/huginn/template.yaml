id: huginn
name: Huginn (自动化代理)
category: tools
subcategory: automation
tags: [ruby, postgres, automation, ifttt-alternative, huginn]
description: 自动化代理系统，类似 IFTTT，可以监控网站变化、发送通知、执行任务等。
icon: huginn
version: 1.0.0
author: SSLcat Team
website: https://github.com/huginn/huginn
compose_file: docker-compose.yml

variables:
  - name: HUGINN_VERSION
    type: select
    title: Huginn 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Huginn 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: HUGINN_PORT
    type: number
    title: Huginn 端口
    default: 3000
    min: 1024
    max: 65535
    description: Huginn Web 服务端口

services:
  - name: huginn
    type: web
    description: Huginn 自动化代理服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: huginn_data
        path: /var/www/mysite
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_huginn"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_huginn"
  huginn:
    secret_key_base:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: password
  features: "自动化代理,网站监控,任务调度,通知发送"

