
services:
  dozzle:
    image: amir20/dozzle:{{DOZZLE_VERSION}}
    container_name: {{APP_NAME}}_dozzle
    restart: unless-stopped
    ports:
      - "{{DOZZLE_PORT}}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  {{APP_NAME}}_network:
    driver: bridge
