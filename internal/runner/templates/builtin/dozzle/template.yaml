id: dozzle
name: Dozzle (Docker日志)
category: tools
subcategory: monitoring
tags: [go, docker, monitoring, dozzle, logs]
description: Docker 容器日志查看工具，实时查看和管理 Docker 容器日志，无需 SSH。
icon: dozzle
version: 1.0.0
author: SSLcat Team
website: https://dozzle.dev/
compose_file: docker-compose.yml

variables:
  - name: DOZZLE_VERSION
    type: select
    title: Dozzle 版本
    default: "latest"
    options: ["latest", "v4.0", "v3.0"]
    description: 选择 Dozzle 版本
  - name: DOZZLE_PORT
    type: number
    title: Dozzle 端口
    default: 808080
    min: 1024
    max: 65535
    description: Dozzle Web 服务端口

services:
  - name: dozzle
    type: web
    description: Dozzle Docker 日志查看服务
    ports:
      - internal: 8080
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Docker日志,实时查看,日志搜索,容器管理"
