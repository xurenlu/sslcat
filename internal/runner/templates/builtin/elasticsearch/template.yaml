id: elasticsearch
name: Elasticsearch
category: database
subcategory: search
tags: [elasticsearch, search, nosql, database]
description: 强大的搜索引擎和数据分析平台，支持全文搜索、日志分析等。
icon: elasticsearch
version: 1.0.0
author: SSLcat Team
website: https://www.elastic.co/elasticsearch/
compose_file: docker-compose.yml

variables:
  - name: ELASTICSEARCH_VERSION
    type: select
    title: Elasticsearch 版本
    default: "8.11.0"
    options: ["8.11.0", "8.10.0", "7.17.0"]
    description: 选择 Elasticsearch 版本
  - name: ELASTICSEARCH_PORT
    type: number
    title: Elasticsearch 端口
    default: 9200
    min: 1024
    max: 65535
    description: Elasticsearch HTTP API 端口

services:
  - name: elasticsearch
    type: database
    description: Elasticsearch 搜索引擎服务
    ports:
      - internal: 9200
        external: null
        public: true
    volumes:
      - name: elasticsearch_data
        path: /usr/share/elasticsearch/data
        mode: rw
    healthcheck:
      type: http
      path: /_cluster/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  api_url: "http://{PRIMARY_DOMAIN}"
  cluster_name: "{app_name}_cluster"

