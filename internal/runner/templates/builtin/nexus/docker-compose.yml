version: '3.8'

services:
  nexus:
    image: sonatype/nexus3:{{NEXUS_VERSION}}
    container_name: {{APP_NAME}}_nexus
    restart: unless-stopped
    ports:
      - "{{NEXUS_PORT}}:8081"
    environment:
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  nexus_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

