id: powerdns
name: PowerDNS (DNS服务器)
category: tools
subcategory: dns
tags: [cpp, mysql, dns, powerdns, dns-server]
description: 强大的 DNS 服务器，支持多种后端存储，提供 API 接口管理 DNS 记录。
icon: powerdns
version: 1.0.0
author: SSLcat Team
website: https://www.powerdns.com/
compose_file: docker-compose.yml

variables:
  - name: POWERDNS_VERSION
    type: select
    title: PowerDNS 版本
    default: "latest"
    options: ["latest", "4.8", "4.7"]
    description: 选择 PowerDNS 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: POWERDNS_PORT
    type: number
    title: PowerDNS DNS 端口
    default: 53
    min: 1
    max: 65535
    description: PowerDNS DNS 服务端口
  - name: POWERDNS_API_PORT
    type: number
    title: PowerDNS API 端口
    default: 8081
    min: 1024
    max: 65535
    description: PowerDNS API 管理端口

services:
  - name: powerdns
    type: service
    description: PowerDNS DNS 服务器
    depends_on: [mysql]
    ports:
      - internal: 53
        external: null
        public: true
      - internal: 8081
        external: null
        public: true
    volumes:
      - name: powerdns_data
        path: /var/lib/powerdns
        mode: rw
    healthcheck:
      type: command
      command: ["pdns_control", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_powerdns"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_powerdns"
    root_password:
      pattern: random
      length: 18
  powerdns:
    api_key:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8081
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}:8081/api"
  dns_server: "{{PRIMARY_DOMAIN}}:53"
  features: "DNS服务器,API管理,多种后端,高性能"
