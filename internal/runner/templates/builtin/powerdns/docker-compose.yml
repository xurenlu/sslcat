
services:
  powerdns:
    image: powerdns/pdns-master:{{POWERDNS_VERSION}}
    container_name: {{APP_NAME}}_powerdns
    restart: unless-stopped
    ports:
      - "{{POWERDNS_PORT}}:53"
      - "{{POWERDNS_PORT}}:53/udp"
      - "{{POWERDNS_API_PORT}}:8081"
    environment:
      PDNS_gmysql_host: mysql
      PDNS_gmysql_port: 3306
      PDNS_gmysql_user: {{MYSQL_USERNAME}}
      PDNS_gmysql_password: {{MYSQL_PASSWORD}}
      PDNS_gmysql_dbname: {{MYSQL_DATABASE}}
      PDNS_api: "yes"
      PDNS_api_key: {{POWERDNS_API_KEY}}
    volumes:
      - powerdns_data:/var/lib/powerdns
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "pdns_control", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p{{MYSQL_ROOT_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  powerdns_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
