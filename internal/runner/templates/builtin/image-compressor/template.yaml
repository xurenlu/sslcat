id: image-compressor
name: Image Compressor
category: tools
subcategory: image-processing
tags: [image, compression, optimize, squoosh, imagemin]
description: 智能图片压缩工具，支持多种格式的图片压缩优化，在保持质量的同时减小文件大小。
icon: image-compressor
version: 1.0.0
author: SSLcat Team
website: https://squoosh.app/
compose_file: docker-compose.yml

variables:
  - name: COMPRESSOR_VERSION
    type: select
    title: 压缩工具版本
    default: "latest"
    options: ["latest", "v1", "v2"]
    description: 选择图片压缩工具版本
  - name: COMPRESSOR_PORT
    type: number
    title: 压缩服务端口
    default: 8080
    min: 1024
    max: 65535
    description: 图片压缩服务端口
  - name: MAX_FILE_SIZE
    type: string
    title: 最大文件大小
    default: "50MB"
    description: 单文件最大处理大小（如：50MB, 100MB）
    placeholder: "50MB"
  - name: COMPRESSION_LEVEL
    type: select
    title: 压缩级别
    default: "medium"
    options: ["low", "medium", "high", "ultra"]
    description: 选择压缩级别（low=高质量大文件，ultra=低质量小文件）
  - name: PRESERVE_METADATA
    type: bool
    title: 保留元数据
    default: false
    description: 是否保留图片的 EXIF 等元数据信息

services:
  - name: image-compressor
    type: web
    description: 图片压缩服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: compressor_data
        path: /tmp/compressor
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "智能压缩,批量压缩,质量对比,格式优化"
  supported_formats: "PNG,JPEG,JPG,WEBP,AVIF,GIF"

