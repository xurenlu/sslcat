
services:
  image-compressor:
    image: ghcr.io/cyberduck/squoosh-cli:{{COMPRESSOR_VERSION}}
    container_name: {{APP_NAME}}_image_compressor
    restart: unless-stopped
    ports:
      - "{{COMPRESSOR_PORT}}:8080"
    environment:
      MAX_FILE_SIZE: {{MAX_FILE_SIZE}}
      COMPRESSION_LEVEL: {{COMPRESSION_LEVEL}}
      PRESERVE_METADATA: {{PRESERVE_METADATA}}
      TZ: Asia/Shanghai
    volumes:
      - compressor_data:/tmp/compressor
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  compressor_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

