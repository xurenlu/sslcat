id: readarr
name: Readarr
category: media
subcategory: ebook
tags: [csharp, ebook, automation, readarr]
description: 电子书自动化管理工具，类似 Sonarr，支持自动下载和管理。
icon: readarr
version: 1.0.0
author: SSLcat Team
website: https://readarr.com/
compose_file: docker-compose.yml

variables:
  - name: READARR_VERSION
    type: select
    title: Readarr 版本
    default: "latest"
    options: ["latest", "0.3", "0.2"]
    description: 选择 Readarr 版本
  - name: READARR_PORT
    type: number
    title: Readarr 端口
    default: 8787
    min: 1024
    max: 65535
    description: Readarr Web 服务端口

services:
  - name: readarr
    type: web
    description: Readarr 电子书管理服务
    ports:
      - internal: 8787
        external: null
        public: true
    volumes:
      - name: readarr_data
        path: /config
        mode: rw
      - name: readarr_books
        path: /books
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

