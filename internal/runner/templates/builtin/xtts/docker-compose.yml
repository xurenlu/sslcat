
services:
  xtts:
    image: ghcr.io/coqui-ai/xtts:{{XTTS_VERSION}}
    container_name: {{APP_NAME}}_xtts
    restart: unless-stopped
    ports:
      - "{{XTTS_PORT}}:8000"
    environment:
      XTTS_MODEL: "{{XTTS_MODEL}}"
      XTTS_LANG: "{{XTTS_LANG}}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - xtts_data:/app/models
      - xtts_clones:/app/clones
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  xtts_data:
    driver: local
  xtts_clones:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

