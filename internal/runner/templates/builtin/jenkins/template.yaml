id: jenkins
name: Jenkins
category: devops
subcategory: ci-cd
tags: [java, ci-cd, automation, jenkins]
description: 开源 CI/CD 平台，功能强大，支持持续集成和持续部署。
icon: jenkins
version: 1.0.0
author: SSLcat Team
website: https://www.jenkins.io/
compose_file: docker-compose.yml

variables:
  - name: JENKINS_VERSION
    type: select
    title: Jenkins 版本
    default: "lts"
    options: ["lts", "latest", "lts-jdk17"]
    description: 选择 Jenkins 版本
  - name: JENKINS_PORT
    type: number
    title: Jenkins Web 端口
    default: 8080
    min: 1024
    max: 65535
    description: Jenkins Web 服务端口
  - name: JENKINS_AGENT_PORT
    type: number
    title: Jenkins Agent 端口
    default: 50000
    min: 1024
    max: 65535
    description: Jenkins Agent 通信端口

services:
  - name: jenkins
    type: web
    description: Jenkins CI/CD 服务
    ports:
      - internal: 8080
        external: null
        public: true
      - internal: 50000
        external: null
        public: true
    volumes:
      - name: jenkins_data
        path: /var/jenkins_home
        mode: rw
    healthcheck:
      type: http
      path: /login
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_password: 查看容器日志获取初始管理员密码

