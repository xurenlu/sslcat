id: opencart
name: OpenCart
category: ecommerce
subcategory: shop
tags: [php, mysql, ecommerce, shop, opencart]
description: 开源电商平台，界面美观，适合中小型在线商店。
icon: opencart
version: 1.0.0
author: SSLcat Team
website: https://www.opencart.com/
compose_file: docker-compose.yml

variables:
  - name: OPENCART_VERSION
    type: select
    title: OpenCart 版本
    default: "latest"
    options: ["latest", "4.0"]
    description: 选择 OpenCart 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: OPENCART_PORT
    type: number
    title: OpenCart 端口
    default: 808080
    min: 1024
    max: 65535
    description: OpenCart Web 服务端口

services:
  - name: opencart
    type: web
    description: OpenCart 电商平台服务
    depends_on: [mysql]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: opencart_data
        path: /bitnami/opencart
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_opencart"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_opencart"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/admin

