id: yi
name: Yi (零一万物大模型)
category: ai
subcategory: llm
tags: [python, ai, llm, yi, chinese, 01-ai, gpu]
description: 零一万物开源的大语言模型，支持中英文对话和多任务处理，需要 GPU。
icon: yi
version: 1.0.0
author: SSLcat Team
website: https://github.com/01-ai/Yi
compose_file: docker-compose.yml

variables:
  - name: YI_VERSION
    type: select
    title: Yi 版本
    default: "latest"
    options: ["latest", "v1.5", "v1.0"]
    description: 选择 Yi 版本
  - name: YI_PORT
    type: number
    title: Yi 端口
    default: 808000
    min: 1024
    max: 65535
    description: Yi API 服务端口

services:
  - name: yi
    type: api
    description: Yi 大语言模型服务
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: yi_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/chat"
  features: "中英文对话,多任务处理,代码生成,知识问答"
  gpu_required: true

