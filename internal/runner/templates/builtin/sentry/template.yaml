id: sentry
name: Sentry
category: project
subcategory: error-tracking
tags: [python, postgresql, redis, error-tracking, monitoring, sentry]
description: 错误监控和性能追踪平台，帮助开发者快速定位和修复问题。
icon: sentry
version: 1.0.0
author: SSLcat Team
website: https://sentry.io/
compose_file: docker-compose.yml

variables:
  - name: SENTRY_VERSION
    type: select
    title: Sentry 版本
    default: "latest"
    options: ["latest", "24.1", "23.12"]
    description: 选择 Sentry 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: SENTRY_PORT
    type: number
    title: Sentry 端口
    default: 9000
    min: 1024
    max: 65535
    description: Sentry Web 服务端口

services:
  - name: sentry-web
    type: web
    description: Sentry Web 服务
    depends_on: [postgres, redis]
    ports:
      - internal: 9000
        external: null
        public: true
    volumes:
      - name: sentry_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /_health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: sentry-worker
    type: worker
    description: Sentry 后台任务处理服务
    depends_on: [sentry-web]

  - name: sentry-cron
    type: cron
    description: Sentry 定时任务服务
    depends_on: [sentry-web]

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_sentry"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_sentry"
  sentry:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

