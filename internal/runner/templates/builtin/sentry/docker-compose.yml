
services:
  sentry-web:
    image: getsentry/sentry:{{SENTRY_VERSION}}
    container_name: {{APP_NAME}}_sentry_web
    restart: unless-stopped
    ports:
      - "{{SENTRY_PORT}}:9000"
    environment:
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_USER: {{POSTGRES_USERNAME}}
      SENTRY_DB_PASSWORD: {{POSTGRES_PASSWORD}}
      SENTRY_DB_NAME: {{POSTGRES_DATABASE}}
      SENTRY_REDIS_HOST: redis
      SENTRY_SECRET_KEY: {{SECRET_KEY}}
      SENTRY_URL_PREFIX: http://{{PRIMARY_DOMAIN}}
    volumes:
      - sentry_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    command: run web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  sentry-worker:
    image: getsentry/sentry:{{SENTRY_VERSION}}
    container_name: {{APP_NAME}}_sentry_worker
    restart: unless-stopped
    environment:
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_USER: {{POSTGRES_USERNAME}}
      SENTRY_DB_PASSWORD: {{POSTGRES_PASSWORD}}
      SENTRY_DB_NAME: {{POSTGRES_DATABASE}}
      SENTRY_REDIS_HOST: redis
      SENTRY_SECRET_KEY: {{SECRET_KEY}}
    volumes:
      - sentry_data:/data
    depends_on:
      - sentry-web
    networks:
      - {{APP_NAME}}_network
    command: run worker

  sentry-cron:
    image: getsentry/sentry:{{SENTRY_VERSION}}
    container_name: {{APP_NAME}}_sentry_cron
    restart: unless-stopped
    environment:
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_USER: {{POSTGRES_USERNAME}}
      SENTRY_DB_PASSWORD: {{POSTGRES_PASSWORD}}
      SENTRY_DB_NAME: {{POSTGRES_DATABASE}}
      SENTRY_REDIS_HOST: redis
      SENTRY_SECRET_KEY: {{SECRET_KEY}}
    volumes:
      - sentry_data:/data
    depends_on:
      - sentry-web
    networks:
      - {{APP_NAME}}_network
    command: run cron

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sentry_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

