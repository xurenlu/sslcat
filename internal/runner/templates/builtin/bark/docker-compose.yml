
services:
  bark:
    image: ghcr.io/suno-ai/bark:{{BARK_VERSION}}
    container_name: {{APP_NAME}}_bark
    restart: unless-stopped
    ports:
      - "{{BARK_PORT}}:8000"
    environment:
      BARK_MODEL: "{{BARK_MODEL}}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - bark_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  bark_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

