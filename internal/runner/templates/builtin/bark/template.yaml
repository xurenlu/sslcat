id: bark
name: Bark
category: ai
subcategory: tts
tags: [python, ai, tts, text-to-speech, bark, gpu]
description: 高质量文本转语音服务，支持情感表达和音乐生成。
icon: bark
version: 1.0.0
author: SSLcat Team
website: https://github.com/suno-ai/bark
compose_file: docker-compose.yml

variables:
  - name: BARK_VERSION
    type: select
    title: Bark 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Bark 版本
  - name: BARK_PORT
    type: number
    title: Bark 端口
    default: 808000
    min: 1024
    max: 65535
    description: Bark API 服务端口
  - name: BARK_MODEL
    type: string
    title: Bark 模型
    default: "suno/bark"
    description: 使用的 Bark 模型
    placeholder: "suno/bark"

services:
  - name: bark
    type: api
    description: Bark 文本转语音服务
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: bark_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  features: "高质量语音,情感表达,音乐生成"
  gpu_required: true

