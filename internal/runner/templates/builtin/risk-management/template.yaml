id: risk-management
name: 风险管理系统
category: tools
subcategory: compliance
tags: [php, postgres, redis, risk-management, compliance, enterprise-risk]
description: 企业风险管理系统，支持风险识别、风险评估、风险应对、风险监控、风险报告等功能。
icon: risk-management
version: 1.0.0
author: SSLcat Team
website: https://github.com/risk-management
compose_file: docker-compose.yml

variables:
  - name: RISK_VERSION
    type: select
    title: 风险管理系统版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择风险管理系统版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: RISK_PORT
    type: number
    title: 风险管理系统端口
    default: 8080
    min: 1024
    max: 65535
    description: 风险管理系统 Web 服务端口

services:
  - name: risk-management
    type: web
    description: 风险管理系统服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: risk_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_risk"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_risk"
  redis:
    password:
      pattern: random
      length: 16
  risk-management:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "风险识别,风险评估,风险应对,风险监控,风险报告"

