
services:
  kutt:
    image: kutt/kutt:{{KUTT_VERSION}}
    container_name: {{APP_NAME}}_kutt
    restart: unless-stopped
    ports:
      - "{{KUTT_PORT}}:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: {{POSTGRES_DATABASE}}
      DB_USER: {{POSTGRES_USERNAME}}
      DB_PASSWORD: {{POSTGRES_PASSWORD}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEFAULT_DOMAIN: {{PRIMARY_DOMAIN}}
      SECRET_KEY: {{SECRET_KEY}}
    volumes:
      - kutt_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kutt_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

