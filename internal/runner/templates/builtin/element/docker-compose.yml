
services:
  element-web:
    image: vectorim/element-web:{{ELEMENT_VERSION}}
    container_name: {{APP_NAME}}_element_web
    restart: unless-stopped
    ports:
      - "{{ELEMENT_PORT}}:80"
    environment:
      DEFAULT_SERVER_NAME: {{MATRIX_SERVER_NAME}}
      INTEGRATION_MANAGER_URL: ""
    volumes:
      - element_data:/app
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  element_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

