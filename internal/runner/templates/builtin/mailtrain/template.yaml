id: mailtrain
name: Mailtrain (邮件营销)
category: tools
subcategory: marketing
tags: [nodejs, postgres, redis, marketing, email-marketing, newsletter]
description: 开源的邮件营销平台，支持邮件列表管理、邮件模板、邮件发送、订阅管理、统计分析等功能。
icon: mailtrain
version: 1.0.0
author: SSLcat Team
website: https://github.com/Mailtrain-org/mailtrain
compose_file: docker-compose.yml

variables:
  - name: MAILTRAIN_VERSION
    type: select
    title: Mailtrain 版本
    default: "latest"
    options: ["latest", "v2.0", "v1.0"]
    description: 选择 Mailtrain 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: MAILTRAIN_PORT
    type: number
    title: Mailtrain 端口
    default: 3000
    min: 1024
    max: 65535
    description: Mailtrain Web 服务端口

services:
  - name: mailtrain
    type: web
    description: Mailtrain 邮件营销服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: mailtrain_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_mailtrain"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_mailtrain"
  redis:
    password:
      pattern: random
      length: 16
  mailtrain:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "邮件列表管理,邮件模板,邮件发送,订阅管理,统计分析"

