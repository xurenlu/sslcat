id: taiga
name: Taiga
category: project
subcategory: agile
tags: [python, postgresql, rabbitmq, redis, project, agile, taiga]
description: 开源敏捷项目管理工具，支持 Scrum 和 Kanban，界面美观。
icon: taiga
version: 1.0.0
author: SSLcat Team
website: https://www.taiga.io/
compose_file: docker-compose.yml

variables:
  - name: TAIGA_VERSION
    type: select
    title: Taiga 版本
    default: "latest"
    options: ["latest", "7.0", "6.5"]
    description: 选择 Taiga 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: RABBITMQ_VERSION
    type: select
    title: RabbitMQ 版本
    default: "3-management-alpine"
    options: ["3-management-alpine", "3-management", "latest"]
    description: 选择 RabbitMQ 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: TAIGA_PORT
    type: number
    title: Taiga 端口
    default: 80
    min: 1024
    max: 65535
    description: Taiga Web 服务端口

services:
  - name: taiga-front
    type: web
    description: Taiga 前端服务
    depends_on: [taiga-back]
    ports:
      - internal: 80
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: taiga-back
    type: api
    description: Taiga 后端 API 服务
    depends_on: [postgres, rabbitmq, redis]
    volumes:
      - name: taiga_back_data
        path: /taiga-back/media
        mode: rw
      - name: taiga_back_static
        path: /taiga-back/static
        mode: rw

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: rabbitmq
    type: message-queue
    description: RabbitMQ 消息队列服务
    ports:
      - internal: 5672
        external: null
        public: false
      - internal: 15672
        external: null
        public: false
    volumes:
      - name: rabbitmq_data
        path: /var/lib/rabbitmq
        mode: rw
    healthcheck:
      type: command
      command: ["rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_taiga"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_taiga"
  rabbitmq:
    username:
      pattern: "{app_name}_taiga"
    password:
      pattern: random
      length: 16
  taiga:
    secret_key:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  rabbitmq: "amqp://{{RABBITMQ_USERNAME}}:{{RABBITMQ_PASSWORD}}@rabbitmq:5672/"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

