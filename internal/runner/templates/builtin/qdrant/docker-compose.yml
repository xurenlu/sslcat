
services:
  qdrant:
    image: qdrant/qdrant:{{QDRANT_VERSION}}
    container_name: {{APP_NAME}}_qdrant
    restart: unless-stopped
    ports:
      - "{{QDRANT_PORT}}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  qdrant_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

