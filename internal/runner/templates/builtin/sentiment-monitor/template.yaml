id: sentiment-monitor
name: 舆情监控系统
category: tools
subcategory: monitoring
tags: [python, postgres, redis, elasticsearch, sentiment-analysis, public-opinion]
description: 舆情监控和分析系统，实时监控网络舆情，支持情感分析、关键词提取、趋势分析等功能。
icon: sentiment-monitor
version: 1.0.0
author: SSLcat Team
website: https://github.com/sentiment-monitor
compose_file: docker-compose.yml

variables:
  - name: SENTIMENT_VERSION
    type: select
    title: 舆情监控版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择舆情监控系统版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: ELASTICSEARCH_VERSION
    type: select
    title: Elasticsearch 版本
    default: "8.11.0"
    options: ["8.11.0", "8.10", "7.17"]
    description: 选择 Elasticsearch 版本
  - name: SENTIMENT_PORT
    type: number
    title: 舆情监控端口
    default: 808080
    min: 1024
    max: 65535
    description: 舆情监控 Web 服务端口

services:
  - name: sentiment-monitor
    type: web
    description: 舆情监控系统服务
    depends_on: [postgres, redis, elasticsearch]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: sentiment_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  - name: elasticsearch
    type: database
    description: Elasticsearch 搜索引擎服务
    ports:
      - internal: 9200
        external: null
        public: false
    volumes:
      - name: elasticsearch_data
        path: /usr/share/elasticsearch/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

credentials:
  postgres:
    username:
      pattern: "{app_name}_sentiment"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_sentiment"
  redis:
    password:
      pattern: random
      length: 16
  sentiment-monitor:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"
  elasticsearch: "http://elasticsearch:9200"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "舆情监控,情感分析,关键词提取,趋势分析,实时监控"

