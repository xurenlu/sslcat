
services:
  sentiment-monitor:
    image: nginx:alpine
    container_name: {{APP_NAME}}_sentiment_monitor
    restart: unless-stopped
    ports:
      - "{{SENTIMENT_PORT}}:80"
    volumes:
      - sentiment_data:/usr/share/nginx/html
    depends_on:
      - postgres
      - redis
      - elasticsearch
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "{{POSTGRES_DATABASE}}"
      POSTGRES_USER: "{{POSTGRES_USERNAME}}"
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    command: redis-server --requirepass {{REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:{{ELASTICSEARCH_VERSION}}
    container_name: {{APP_NAME}}_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  sentiment_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

