id: github-actions-runner
name: GitHub Actions Runner (CI/CD)
category: tools
subcategory: ci-cd
tags: [docker, ci-cd, github-actions, runner, self-hosted]
description: 自托管 GitHub Actions Runner，在私有服务器上运行 GitHub Actions 工作流。
icon: github-actions-runner
version: 1.0.0
author: SSLcat Team
website: https://github.com/actions/runner
compose_file: docker-compose.yml

variables:
  - name: GITHUB_RUNNER_VERSION
    type: select
    title: GitHub Runner 版本
    default: "latest"
    options: ["latest", "v2.311", "v2.310"]
    description: 选择 GitHub Runner 版本
  - name: RUNNER_NAME
    type: string
    title: Runner 名称
    default: "{{APP_NAME}}-runner"
    description: GitHub Actions Runner 名称
    placeholder: "my-runner"
  - name: RUNNER_TOKEN
    type: string
    title: Runner Token
    default: ""
    description: GitHub Actions Runner Token（从 GitHub 仓库设置中获取）
    required: true
    sensitive: true
  - name: RUNNER_REPOSITORY_URL
    type: string
    title: 仓库 URL
    default: ""
    description: GitHub 仓库 URL（如：https://github.com/username/repo）
    required: true
    placeholder: "https://github.com/username/repo"
  - name: RUNNER_LABELS
    type: string
    title: Runner 标签
    default: "self-hosted,linux,x64"
    description: Runner 标签，用逗号分隔
    placeholder: "self-hosted,linux,x64"

services:
  - name: github-actions-runner
    type: worker
    description: GitHub Actions Runner 服务
    volumes:
      - name: github_runner_data
        path: /tmp/runner-work
        mode: rw
    healthcheck:
      type: command
      command: ["ps", "aux"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: ""
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "GitHub Actions,自托管Runner,CI/CD,工作流执行"
