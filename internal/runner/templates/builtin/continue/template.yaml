id: continue
name: Continue (AI代码编辑器)
category: ai
subcategory: code-generation
tags: [nodejs, postgres, ai, code-editor, coding-assistant, continue]
description: 开源 AI 代码编辑器，支持 VS Code 插件，提供智能代码补全和生成。
icon: continue
version: 1.0.0
author: SSLcat Team
website: https://continue.dev/
compose_file: docker-compose.yml

variables:
  - name: CONTINUE_VERSION
    type: select
    title: Continue 版本
    default: "latest"
    options: ["latest", "v0.15", "v0.14"]
    description: 选择 Continue 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: CONTINUE_PORT
    type: number
    title: Continue 端口
    default: 3000
    min: 1024
    max: 65535
    description: Continue Web 服务端口
  - name: OPENAI_API_KEY
    type: string
    title: OpenAI API Key
    default: ""
    description: OpenAI API 密钥（可选）
    sensitive: true
  - name: ANTHROPIC_API_KEY
    type: string
    title: Anthropic API Key
    default: ""
    description: Anthropic API 密钥（可选）
    sensitive: true

services:
  - name: continue
    type: web
    description: Continue AI 代码编辑器服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: continue_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_continue"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_continue"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "代码补全,代码生成,VS Code集成,多模型支持"

