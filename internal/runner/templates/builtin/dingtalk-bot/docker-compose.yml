
services:
  dingtalk-bot:
    image: dingtalk-bot/server:{{DINGTALK_BOT_VERSION}}
    container_name: {{APP_NAME}}_dingtalk_bot
    restart: unless-stopped
    ports:
      - "{{DINGTALK_BOT_PORT}}:8080"
    environment:
      DATABASE_URL: postgres://{{POSTGRES_USERNAME}}:{{POSTGRES_PASSWORD}}@postgres:5432/{{POSTGRES_DATABASE}}
      DINGTALK_APP_KEY: {{DINGTALK_APP_KEY}}
      DINGTALK_APP_SECRET: {{DINGTALK_APP_SECRET}}
      SECRET_KEY: {{DINGTALK_BOT_SECRET_KEY}}
    volumes:
      - dingtalk_bot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dingtalk_bot_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

