id: employee-directory
name: Employee Directory
category: tools
subcategory: hr
tags: [nodejs, postgres, hr, employee-directory]
description: 员工通讯录和目录管理系统，支持组织架构和员工信息管理。
icon: employee-directory
version: 1.0.0
author: SSLcat Team
website: https://github.com/employee-directory
compose_file: docker-compose.yml

variables:
  - name: EMPLOYEE_DIRECTORY_VERSION
    type: select
    title: Employee Directory 版本
    default: "latest"
    options: ["latest", "v1", "v2"]
    description: 选择 Employee Directory 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: EMPLOYEE_DIRECTORY_PORT
    type: number
    title: Employee Directory 端口
    default: 3000
    min: 1024
    max: 65535
    description: Employee Directory Web 服务端口

services:
  - name: employee-directory
    type: web
    description: Employee Directory 员工目录服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: employee_directory_data
        path: /app/uploads
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_employee"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_employee"
  employee-directory:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

