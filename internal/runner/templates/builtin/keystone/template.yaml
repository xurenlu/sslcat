id: keystone
name: Keystone
category: cms
subcategory: headless
tags: [nodejs, postgresql, cms, headless, keystone]
description: Node.js 无头 CMS，提供强大的内容管理和 API。
icon: keystone
version: 1.0.0
author: SSLcat Team
website: https://keystonejs.com/
compose_file: docker-compose.yml

variables:
  - name: KEYSTONE_VERSION
    type: select
    title: Keystone 版本
    default: "latest"
    options: ["latest", "6.0"]
    description: 选择 Keystone 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: KEYSTONE_PORT
    type: number
    title: Keystone 端口
    default: 3000
    min: 1024
    max: 65535
    description: Keystone Web 服务端口

services:
  - name: keystone
    type: web
    description: Keystone CMS 服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: keystone_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_keystone"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_keystone"
  keystone:
    session_secret:
      pattern: random
      length: 32
    cookie_secret:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/admin

