id: chroma
name: Chroma (向量数据库)
category: database
subcategory: vector-database
tags: [python, database, vector-database, chroma]
description: 开源向量数据库，专为 AI 应用设计，简单易用，支持 Python/JavaScript SDK。
icon: chroma
version: 1.0.0
author: SSLcat Team
website: https://www.trychroma.com/
compose_file: docker-compose.yml

variables:
  - name: CHROMA_VERSION
    type: select
    title: Chroma 版本
    default: "latest"
    options: ["latest", "v0.4", "v0.3"]
    description: 选择 Chroma 版本
  - name: CHROMA_PORT
    type: number
    title: Chroma 端口
    default: 808000
    min: 1024
    max: 65535
    description: Chroma API 服务端口

services:
  - name: chroma
    type: database
    description: Chroma 向量数据库服务
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: chroma_data
        path: /chroma/chroma
        mode: rw
    healthcheck:
      type: http
      path: /api/v1/heartbeat
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/v1"
  features: "向量搜索,简单易用,Python/JS SDK,持久化存储"

