id: todolist
name: TodoList (待办事项)
category: tools
subcategory: project-management
tags: [nodejs, postgres, project-management, todolist, todo]
description: 简洁的待办事项管理工具，支持任务列表、优先级、截止日期等功能。
icon: todolist
version: 1.0.0
author: SSLcat Team
website: https://github.com/m1k1o/todolist
compose_file: docker-compose.yml

variables:
  - name: TODOLIST_VERSION
    type: select
    title: TodoList 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 TodoList 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: TODOLIST_PORT
    type: number
    title: TodoList 端口
    default: 808080
    min: 1024
    max: 65535
    description: TodoList Web 服务端口

services:
  - name: todolist
    type: web
    description: TodoList 待办事项服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: todolist_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_todolist"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_todolist"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "待办事项,任务管理,优先级,截止日期"
