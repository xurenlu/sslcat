id: replicate-animatediff
name: Replicate AnimateDiff (视频生成)
category: ai
subcategory: video-generation
tags: [replicate, ai, video-generation, animatediff, gpu]
description: Replicate 上的 AnimateDiff 模型，从图片生成动画视频，需要 GPU。
icon: replicate-animatediff
version: 1.0.0
author: SSLcat Team
website: https://replicate.com/lucataco/animatediff
compose_file: docker-compose.yml

variables:
  - name: REPLICATE_ANIMATEDIFF_VERSION
    type: select
    title: Replicate Proxy 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Replicate Proxy 版本
  - name: REPLICATE_ANIMATEDIFF_PORT
    type: number
    title: Replicate AnimateDiff 端口
    default: 8080
    min: 1024
    max: 65535
    description: Replicate AnimateDiff API 服务端口
  - name: REPLICATE_API_TOKEN
    type: string
    title: Replicate API Token
    default: ""
    description: Replicate API Token（需要注册获取）
    required: true
    sensitive: true

services:
  - name: replicate-animatediff
    type: api
    description: Replicate AnimateDiff 视频生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: replicate_animatediff_data
        path: /app/cache
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  replicate-animatediff:
    api_token:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  replicate_model: "lucataco/animatediff"
  features: "图片转视频,动画生成,高质量输出"
  gpu_required: true

