id: immich
name: Immich
category: media
subcategory: photo
tags: [nodejs, postgresql, redis, photo, gallery, immich]
description: 自托管照片和视频库，类似 Google Photos，支持 AI 功能。
icon: immich
version: 1.0.0
author: SSLcat Team
website: https://immich.app/
compose_file: docker-compose.yml

variables:
  - name: IMMICH_VERSION
    type: select
    title: Immich 版本
    default: "latest"
    options: ["latest", "v1.100", "v1.99"]
    description: 选择 Immich 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: IMMICH_PORT
    type: number
    title: Immich API 端口
    default: 3001
    min: 1024
    max: 65535
    description: Immich API 服务端口
  - name: IMMICH_WEB_PORT
    type: number
    title: Immich Web 端口
    default: 3000
    min: 1024
    max: 65535
    description: Immich Web UI 端口

services:
  - name: immich-server
    type: api
    description: Immich API 服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3001
        external: null
        public: true
    volumes:
      - name: immich_upload
        path: /usr/src/app/upload
        mode: rw
      - name: immich_model_cache
        path: /app/model-cache
        mode: rw
    healthcheck:
      type: http
      path: /api/server-info/ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: immich-web
    type: web
    description: Immich Web UI 服务
    depends_on: [immich-server]
    ports:
      - internal: 3000
        external: null
        public: true

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_immich"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_immich"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:{{IMMICH_WEB_PORT}}
  api_url: http://{{PRIMARY_DOMAIN}}:{{IMMICH_PORT}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

