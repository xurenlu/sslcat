id: discourse
name: Discourse
category: forum
subcategory: discussion
tags: [ruby, postgresql, redis, forum, discussion, discourse]
description: 现代化的论坛平台，功能强大，适合社区讨论。
icon: discourse
version: 1.0.0
author: SSLcat Team
website: https://www.discourse.org/
compose_file: docker-compose.yml

variables:
  - name: DISCOURSE_VERSION
    type: select
    title: Discourse 版本
    default: "latest"
    options: ["latest", "3.1.0"]
    description: 选择 Discourse 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: DISCOURSE_PORT
    type: number
    title: Discourse 端口
    default: 3000
    min: 1024
    max: 65535
    description: Discourse Web 服务端口
  - name: DISCOURSE_SITENAME
    type: string
    title: 站点名称
    default: "My Discourse Forum"
    description: 论坛显示名称

services:
  - name: discourse
    type: web
    description: Discourse 论坛服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: discourse_data
        path: /bitnami/discourse
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_discourse"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_discourse"
  redis:
    password:
      pattern: random
      length: 16
  discourse:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{{REDIS_PASSWORD}}@redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

