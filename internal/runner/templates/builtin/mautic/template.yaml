id: mautic
name: Mautic (营销自动化)
category: tools
subcategory: marketing
tags: [php, mysql, marketing, automation, email-marketing]
description: 开源的营销自动化平台，支持邮件营销、营销活动管理、线索管理、营销分析等功能。
icon: mautic
version: 1.0.0
author: SSLcat Team
website: https://www.mautic.org/
compose_file: docker-compose.yml

variables:
  - name: MAUTIC_VERSION
    type: select
    title: Mautic 版本
    default: "latest"
    options: ["latest", "5.0", "4.4"]
    description: 选择 Mautic 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: MAUTIC_PORT
    type: number
    title: Mautic 端口
    default: 808080
    min: 1024
    max: 65535
    description: Mautic Web 服务端口

services:
  - name: mautic
    type: web
    description: Mautic 营销自动化服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: mautic_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_mautic"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_mautic"
    root_password:
      pattern: random
      length: 18

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "邮件营销,营销活动管理,线索管理,营销分析,自动化工作流"

