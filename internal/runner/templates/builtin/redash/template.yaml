id: redash
name: Redash
category: analytics
subcategory: bi
tags: [python, postgresql, redis, analytics, bi, redash]
description: 开源数据可视化平台，支持 SQL 查询和多种数据源连接。
icon: redash
version: 1.0.0
author: SSLcat Team
website: https://redash.io/
compose_file: docker-compose.yml

variables:
  - name: REDASH_VERSION
    type: select
    title: Redash 版本
    default: "latest"
    options: ["latest", "11.0", "10.1"]
    description: 选择 Redash 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: REDASH_PORT
    type: number
    title: Redash 端口
    default: 5000
    min: 1024
    max: 65535
    description: Redash Web 服务端口

services:
  - name: redash
    type: web
    description: Redash BI 平台服务
    depends_on: [postgres, redis]
    ports:
      - internal: 5000
        external: null
        public: true
    volumes:
      - name: redash_data
        path: /app
        mode: rw
    healthcheck:
      type: http
      path: /ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_redash"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_redash"
  redash:
    cookie_secret:
      pattern: random
      length: 32
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

