version: '3.8'

services:
  mantisbt:
    image: vimagick/mantisbt:{{MANTISBT_VERSION}}
    container_name: {{APP_NAME}}_mantisbt
    restart: unless-stopped
    ports:
      - "{{MANTISBT_PORT}}:80"
    environment:
      MANTIS_DB_HOST: mysql
      MANTIS_DB_NAME: {{MYSQL_DATABASE}}
      MANTIS_DB_USER: {{MYSQL_USERNAME}}
      MANTIS_DB_PASS: {{MYSQL_PASSWORD}}
      MANTIS_ADMIN_USERNAME: administrator
      MANTIS_ADMIN_PASSWORD: {{ADMIN_PASSWORD}}
      MANTIS_ADMIN_EMAIL: admin@{{PRIMARY_DOMAIN}}
    volumes:
      - mantisbt_data:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mantisbt_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

