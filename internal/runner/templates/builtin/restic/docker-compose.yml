
services:
  restic:
    image: restic/restic:{{RESTIC_VERSION}}
    container_name: {{APP_NAME}}_restic
    restart: unless-stopped
    ports:
      - "{{RESTIC_PORT}}:8000"
    environment:
      RESTIC_REPOSITORY: {{RESTIC_REPOSITORY}}
      RESTIC_PASSWORD: {{RESTIC_PASSWORD}}
    volumes:
      - restic_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  restic_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

