id: tesseract-ocr
name: Tesseract OCR
category: tools
subcategory: ocr
tags: [c, ocr, text-recognition, tesseract]
description: 开源 OCR 引擎，支持 100+ 种语言，适合文档识别和文字提取。
icon: tesseract-ocr
version: 1.0.0
author: SSLcat Team
website: https://github.com/tesseract-ocr/tesseract
compose_file: docker-compose.yml

variables:
  - name: TESSERACT_VERSION
    type: select
    title: Tesseract 版本
    default: "latest"
    options: ["latest", "4.1", "4.0"]
    description: 选择 Tesseract 版本
  - name: TESSERACT_PORT
    type: number
    title: Tesseract OCR 端口
    default: 808080
    min: 1024
    max: 65535
    description: Tesseract OCR Web 服务端口

services:
  - name: tesseract-ocr
    type: web
    description: Tesseract OCR 服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: tesseract_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  supported_languages: 100+

