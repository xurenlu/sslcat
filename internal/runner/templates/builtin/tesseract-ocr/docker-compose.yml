
services:
  tesseract-ocr:
    image: tesseractshadow/tesseract4re:{{TESSERACT_VERSION}}
    container_name: {{APP_NAME}}_tesseract_ocr
    restart: unless-stopped
    ports:
      - "{{TESSERACT_PORT}}:8080"
    environment:
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/4.00/tessdata
    volumes:
      - tesseract_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  tesseract_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

