version: '3.8'

services:
  filebrowser:
    image: filebrowser/filebrowser:{{FILEBROWSER_VERSION}}
    container_name: {{APP_NAME}}_filebrowser
    restart: unless-stopped
    ports:
      - "{{FILEBROWSER_PORT}}:80"
    environment:
      FB_DATABASE: /database/filebrowser.db
    volumes:
      - filebrowser_data:/srv
      - filebrowser_database:/database
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  filebrowser_data:
    driver: local
  filebrowser_database:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

