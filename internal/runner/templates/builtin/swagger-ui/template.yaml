id: swagger-ui
name: Swagger UI (API文档)
category: tools
subcategory: api-docs
tags: [nodejs, api-docs, swagger, openapi, rest-api]
description: Swagger UI API 文档可视化工具，支持 OpenAPI/Swagger 规范，交互式 API 文档。
icon: swagger-ui
version: 1.0.0
author: SSLcat Team
website: https://swagger.io/tools/swagger-ui/
compose_file: docker-compose.yml

variables:
  - name: SWAGGER_UI_VERSION
    type: select
    title: Swagger UI 版本
    default: "latest"
    options: ["latest", "v5.0", "v4.20"]
    description: 选择 Swagger UI 版本
  - name: SWAGGER_UI_PORT
    type: number
    title: Swagger UI 端口
    default: 808080
    min: 1024
    max: 65535
    description: Swagger UI Web 服务端口

services:
  - name: swagger-ui
    type: web
    description: Swagger UI API 文档服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: swagger_ui_data
        path: /app
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "API文档,OpenAPI支持,交互式测试,可视化展示"

