
services:
  swagger-ui:
    image: swaggerapi/swagger-ui:{{SWAGGER_UI_VERSION}}
    container_name: {{APP_NAME}}_swagger_ui
    restart: unless-stopped
    ports:
      - "{{SWAGGER_UI_PORT}}:8080"
    environment:
      SWAGGER_JSON: /app/swagger.json
      BASE_URL: /
    volumes:
      - swagger_ui_data:/app
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  swagger_ui_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

