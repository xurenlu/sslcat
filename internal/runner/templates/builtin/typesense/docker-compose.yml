
services:
  typesense:
    image: typesense/typesense:{{TYPESENSE_VERSION}}
    container_name: {{APP_NAME}}_typesense
    restart: unless-stopped
    ports:
      - "{{TYPESENSE_PORT}}:8108"
    environment:
      TYPESENSE_API_KEY: {{API_KEY}}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  typesense_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

