id: news-site-generator
name: 新闻站生成器
category: tools
subcategory: cms
tags: [php, postgres, redis, news, cms, media, journalism]
description: 专业的新闻/媒体站快速生成工具，支持新闻发布、分类管理、标签系统、RSS订阅、评论系统、搜索功能、媒体库管理等功能。
icon: news-site-generator
version: 1.0.0
author: SSLcat Team
website: https://github.com/news-site-generator
compose_file: docker-compose.yml

variables:
  - name: NEWS_SITE_VERSION
    type: select
    title: 新闻站生成器版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择新闻站生成器版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: NEWS_SITE_PORT
    type: number
    title: 新闻站生成器端口
    default: 8080
    min: 1024
    max: 65535
    description: 新闻站生成器 Web 服务端口
  - name: ENABLE_RSS
    type: select
    title: 启用RSS订阅
    default: "true"
    options: ["true", "false"]
    description: 是否启用RSS订阅功能
  - name: ENABLE_COMMENTS
    type: select
    title: 启用评论系统
    default: "true"
    options: ["true", "false"]
    description: 是否启用评论系统
  - name: ENABLE_SEARCH
    type: select
    title: 启用搜索功能
    default: "true"
    options: ["true", "false"]
    description: 是否启用全文搜索功能

services:
  - name: news-site-generator
    type: web
    description: 新闻站生成器服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: news_site_data
        path: /app/data
        mode: rw
      - name: news_site_uploads
        path: /app/uploads
        mode: rw
      - name: news_site_media
        path: /app/media
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_news_site"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_news_site"
  redis:
    password:
      pattern: random
      length: 16
  news-site-generator:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "新闻发布,分类管理,标签系统,RSS订阅,评论系统,搜索功能,媒体库管理,多作者支持,定时发布"

