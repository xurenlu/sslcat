version: '3.8'

services:
  codegeex:
    image: codegeex/server:{{CODEGEEX_VERSION}}
    container_name: {{APP_NAME}}_codegeex
    restart: unless-stopped
    ports:
      - "{{CODEGEEX_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - codegeex_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  codegeex_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

