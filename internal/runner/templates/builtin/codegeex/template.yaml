id: codegeex
name: CodeGeeX (AI代码生成)
category: ai
subcategory: code-generation
tags: [python, ai, code-generation, codegeex, gpu]
description: 多语言 AI 代码生成模型，支持 20+ 种编程语言，需要 GPU。
icon: codegeex
version: 1.0.0
author: SSLcat Team
website: https://codegeex.cn/
compose_file: docker-compose.yml

variables:
  - name: CODEGEEX_VERSION
    type: select
    title: CodeGeeX 版本
    default: "latest"
    options: ["latest", "v2.0", "v1.0"]
    description: 选择 CodeGeeX 版本
  - name: CODEGEEX_PORT
    type: number
    title: CodeGeeX 端口
    default: 8080
    min: 1024
    max: 65535
    description: CodeGeeX API 服务端口

services:
  - name: codegeex
    type: api
    description: CodeGeeX AI 代码生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: codegeex_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/generate"
  supported_languages: "20+种编程语言"
  features: "代码生成,代码补全,代码解释,多语言支持"
  gpu_required: true

