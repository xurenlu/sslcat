id: formspree
name: Formspree
category: tools
subcategory: form
tags: [go, postgres, form, formspree]
description: 开源表单后端服务，支持多种表单类型和邮件通知。
icon: formspree
version: 1.0.0
author: SSLcat Team
website: https://formspree.io/
compose_file: docker-compose.yml

variables:
  - name: FORMSPREE_VERSION
    type: select
    title: Formspree 版本
    default: "latest"
    options: ["latest", "v2", "v1"]
    description: 选择 Formspree 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: FORMSPREE_PORT
    type: number
    title: Formspree 端口
    default: 808080
    min: 1024
    max: 65535
    description: Formspree Web 服务端口

services:
  - name: formspree
    type: web
    description: Formspree 表单服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: formspree_data
        path: /app/uploads
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_formspree"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_formspree"
  formspree:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

