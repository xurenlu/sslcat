id: rollbar
name: Rollbar (错误追踪)
category: tools
subcategory: error-tracking
tags: [python, postgres, redis, error-tracking, rollbar, bug-tracking]
description: 错误追踪和监控平台，实时捕获和追踪应用错误，支持多种编程语言和框架。
icon: rollbar
version: 1.0.0
author: SSLcat Team
website: https://rollbar.com/
compose_file: docker-compose.yml

variables:
  - name: ROLLBAR_VERSION
    type: select
    title: Rollbar 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Rollbar 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: ROLLBAR_PORT
    type: number
    title: Rollbar 端口
    default: 8000
    min: 1024
    max: 65535
    description: Rollbar Web 服务端口

services:
  - name: rollbar
    type: web
    description: Rollbar 错误追踪服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: rollbar_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_rollbar"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_rollbar"
  redis:
    password:
      pattern: random
      length: 16
  rollbar:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "错误追踪,实时监控,多语言支持,告警通知"
