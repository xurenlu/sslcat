id: rollbar
name: Rollbar (前端错误跟踪)
category: project
subcategory: error-tracking
tags: [javascript, error-tracking, monitoring, rollbar, frontend]
description: 专业的前端错误跟踪和监控平台，支持 JavaScript、React、Vue、Angular 等前端框架的错误收集和分析。
icon: rollbar
version: 1.0.0
author: SSLcat Team
website: https://rollbar.com/
compose_file: docker-compose.yml

variables:
  - name: ROLLBAR_VERSION
    type: select
    title: Rollbar 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Rollbar 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: ROLLBAR_PORT
    type: number
    title: Rollbar 端口
    default: 8000
    min: 1024
    max: 65535
    description: Rollbar Web 服务端口
  - name: ROLLBAR_SECRET_KEY
    type: string
    title: Rollbar Secret Key
    default: ""
    description: Rollbar 密钥（留空将自动生成）
    sensitive: true

services:
  - name: rollbar-web
    type: web
    description: Rollbar Web 服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: rollbar_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: rollbar-worker
    type: worker
    description: Rollbar 后台任务处理服务
    depends_on: [rollbar-web]

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_rollbar"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_rollbar"
  rollbar:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"
  api: "http://{{PRIMARY_DOMAIN}}/api"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api"
  features: "前端错误跟踪,实时监控,错误分析,用户追踪,性能监控"
  supported_frameworks: "JavaScript,React,Vue,Angular,Node.js"

