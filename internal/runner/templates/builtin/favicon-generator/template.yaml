id: favicon-generator
name: Favicon & Icon Generator
category: tools
subcategory: icon-generation
tags: [favicon, icon, generator, png, ico, web-app]
description: 专业的图标生成工具，支持生成 favicon、iOS/Android 应用图标、多尺寸图标等多种格式。
icon: favicon-generator
version: 1.0.0
author: SSLcat Team
website: https://realfavicongenerator.net/
compose_file: docker-compose.yml

variables:
  - name: GENERATOR_VERSION
    type: select
    title: 图标生成器版本
    default: "latest"
    options: ["latest", "v1", "v2"]
    description: 选择图标生成器版本
  - name: GENERATOR_PORT
    type: number
    title: 生成服务端口
    default: 8080
    min: 1024
    max: 65535
    description: 图标生成服务端口
  - name: MAX_FILE_SIZE
    type: string
    title: 最大文件大小
    default: "10MB"
    description: 输入图片最大大小（如：10MB, 20MB）
    placeholder: "10MB"
  - name: DEFAULT_SIZES
    type: string
    title: 默认生成尺寸
    default: "16x16,32x32,48x48,64x64,128x128,256x256,512x512"
    description: 默认生成的图标尺寸，用逗号分隔（如：16x16,32x32）
    placeholder: "16x16,32x32,48x48"
  - name: SUPPORT_PLATFORMS
    type: string
    title: 支持的平台
    default: "web,ios,android"
    description: 支持的平台，用逗号分隔（web,ios,android,windows,macos）
    placeholder: "web,ios,android"

services:
  - name: favicon-generator
    type: web
    description: 图标生成服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: generator_data
        path: /tmp/generator
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Favicon生成,多尺寸图标,iOS图标,Android图标,批量生成"
  supported_formats: "PNG,JPEG,JPG,SVG,ICO"
  supported_platforms: "Web,iOS,Android,Windows,macOS"

