version: '3.8'

services:
  favicon-generator:
    image: realfavicongenerator/favicon-generator:{{GENERATOR_VERSION}}
    container_name: {{APP_NAME}}_favicon_generator
    restart: unless-stopped
    ports:
      - "{{GENERATOR_PORT}}:8080"
    environment:
      MAX_FILE_SIZE: {{MAX_FILE_SIZE}}
      DEFAULT_SIZES: {{DEFAULT_SIZES}}
      SUPPORT_PLATFORMS: {{SUPPORT_PLATFORMS}}
      TZ: Asia/Shanghai
    volumes:
      - generator_data:/tmp/generator
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  generator_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

