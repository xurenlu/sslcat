id: talkyard
name: Talkyard
category: forum
subcategory: discussion
tags: [scala, postgresql, redis, forum, discussion, talkyard]
description: 现代化的论坛和问答平台，类似 Stack Overflow，界面美观。
icon: talkyard
version: 1.0.0
author: SSLcat Team
website: https://www.talkyard.io/
compose_file: docker-compose.yml

variables:
  - name: TALKYARD_VERSION
    type: select
    title: Talkyard 版本
    default: "latest"
    options: ["latest", "0.10", "0.9"]
    description: 选择 Talkyard 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: TALKYARD_PORT
    type: number
    title: Talkyard 端口
    default: 9000
    min: 1024
    max: 65535
    description: Talkyard Web 服务端口

services:
  - name: talkyard
    type: web
    description: Talkyard 论坛服务
    depends_on: [postgres, redis]
    ports:
      - internal: 9000
        external: null
        public: true
    volumes:
      - name: talkyard_data
        path: /opt/talkyard/uploads
        mode: rw
    healthcheck:
      type: http
      path: /-/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_talkyard"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_talkyard"
  talkyard:
    site_id:
      pattern: random
      length: 16

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

