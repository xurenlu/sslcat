id: stable-diffusion-inpainting
name: Stable Diffusion Inpainting (图片修复)
category: ai
subcategory: image-editing
tags: [python, ai, image-editing, inpainting, stable-diffusion, gpu]
description: Stable Diffusion 图片修复工具，智能填充和修复图片中的缺失部分，需要 GPU。
icon: stable-diffusion-inpainting
version: 1.0.0
author: SSLcat Team
website: https://github.com/AUTOMATIC1111/stable-diffusion-webui
compose_file: docker-compose.yml

variables:
  - name: SD_INPAINTING_VERSION
    type: select
    title: Stable Diffusion WebUI 版本
    default: "latest"
    options: ["latest", "v1.6", "v1.5"]
    description: 选择 Stable Diffusion WebUI 版本
  - name: SD_INPAINTING_PORT
    type: number
    title: Stable Diffusion Inpainting 端口
    default: 7860
    min: 1024
    max: 65535
    description: Stable Diffusion Inpainting Web 服务端口

services:
  - name: stable-diffusion-inpainting
    type: web
    description: Stable Diffusion Inpainting 图片修复服务
    ports:
      - internal: 7860
        external: null
        public: true
    volumes:
      - name: sd_inpainting_data
        path: /config
        mode: rw
      - name: sd_inpainting_models
        path: /models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "图片修复,智能填充,内容感知,高质量修复"
  gpu_required: true

