version: '3.8'

services:
  pdftk:
    image: mnuessler/pdftk:{{PDFTK_VERSION}}
    container_name: {{APP_NAME}}_pdftk
    restart: unless-stopped
    ports:
      - "{{PDFTK_PORT}}:8080"
    volumes:
      - pdftk_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pdftk_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

