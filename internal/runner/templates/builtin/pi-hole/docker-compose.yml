version: '3.8'

services:
  pihole:
    image: pihole/pihole:{{PIHOLE_VERSION}}
    container_name: {{APP_NAME}}_pihole
    restart: unless-stopped
    ports:
      - "{{PIHOLE_PORT}}:80"
      - "{{PIHOLE_DNS_PORT}}:53/tcp"
      - "{{PIHOLE_DNS_PORT}}:53/udp"
    environment:
      TZ: Asia/Shanghai
      WEBPASSWORD: {{PIHOLE_PASSWORD}}
      DNS1: 8.8.8.8
      DNS2: 8.8.4.4
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pihole_data:
    driver: local
  pihole_dnsmasq:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

