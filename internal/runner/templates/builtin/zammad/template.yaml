id: zammad
name: Zammad
category: support
subcategory: helpdesk
tags: [ruby, postgresql, redis, elasticsearch, support, helpdesk, zammad]
description: 开源客服系统，功能完整，支持工单管理、知识库、多渠道沟通。
icon: zammad
version: 1.0.0
author: SSLcat Team
website: https://zammad.org/
compose_file: docker-compose.yml

variables:
  - name: ZAMMAD_VERSION
    type: select
    title: Zammad 版本
    default: "latest"
    options: ["latest", "6.2.0"]
    description: 选择 Zammad 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: ELASTICSEARCH_VERSION
    type: select
    title: Elasticsearch 版本
    default: "8.11.0"
    options: ["8.11.0", "8.10.0", "7.17.0"]
    description: 选择 Elasticsearch 版本
  - name: ZAMMAD_PORT
    type: number
    title: Zammad 端口
    default: 8080
    min: 1024
    max: 65535
    description: Zammad Web 服务端口

services:
  - name: zammad
    type: web
    description: Zammad 客服系统服务
    depends_on: [postgres, redis, elasticsearch]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: zammad_data
        path: /opt/zammad
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  - name: elasticsearch
    type: search
    description: Elasticsearch 搜索引擎服务
    ports:
      - internal: 9200
        external: null
        public: false
    volumes:
      - name: elasticsearch_data
        path: /usr/share/elasticsearch/data
        mode: rw
    healthcheck:
      type: http
      path: /_cluster/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

credentials:
  postgres:
    username:
      pattern: "{app_name}_zammad"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_zammad"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"
  elasticsearch: "http://elasticsearch:9200"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

