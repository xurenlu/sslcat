id: redoc
name: ReDoc (API文档)
category: tools
subcategory: api-docs
tags: [nodejs, api-docs, redoc, openapi, rest-api]
description: 现代化的 OpenAPI 文档生成器，美观的三栏式布局，支持交互式 API 文档。
icon: redoc
version: 1.0.0
author: SSLcat Team
website: https://github.com/Redocly/redoc
compose_file: docker-compose.yml

variables:
  - name: REDOC_VERSION
    type: select
    title: ReDoc 版本
    default: "latest"
    options: ["latest", "v2.1", "v2.0"]
    description: 选择 ReDoc 版本
  - name: REDOC_PORT
    type: number
    title: ReDoc 端口
    default: 808080
    min: 1024
    max: 65535
    description: ReDoc Web 服务端口
  - name: SPEC_URL
    type: string
    title: OpenAPI 规范 URL
    default: "/openapi.json"
    description: OpenAPI/Swagger 规范文件 URL
    placeholder: "/openapi.json"

services:
  - name: redoc
    type: web
    description: ReDoc API 文档服务
    ports:
      - internal: 8080
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "API文档,OpenAPI支持,美观界面,交互式展示"

