
services:
  redoc:
    image: redocly/redoc:{{REDOC_VERSION}}
    container_name: {{APP_NAME}}_redoc
    restart: unless-stopped
    ports:
      - "{{REDOC_PORT}}:8080"
    environment:
      SPEC_URL: {{SPEC_URL}}
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  {{APP_NAME}}_network:
    driver: bridge

