
services:
  wiki:
    image: requarks/wiki:{{WIKIJS_VERSION}}
    container_name: {{APP_NAME}}_wiki
    restart: unless-stopped
    ports:
      - "{{WIKIJS_PORT}}:3000"
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: "{{POSTGRES_USERNAME}}"
      DB_PASS: "{{POSTGRES_PASSWORD}}"
      DB_NAME: "{{POSTGRES_DATABASE}}"
      NODE_ENV: production
    volumes:
      - wiki_data:/var/wiki/data
      - wiki_assets:/var/wiki/assets
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "{{POSTGRES_DATABASE}}"
      POSTGRES_USER: "{{POSTGRES_USERNAME}}"
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  wiki_data:
    driver: local
  wiki_assets:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

