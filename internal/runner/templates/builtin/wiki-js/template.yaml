id: wiki-js
name: Wiki.js
category: collaboration
subcategory: wiki
tags: [nodejs, postgresql, wiki, documentation, wiki-js]
description: 现代化的 Wiki 平台，支持 Markdown、可视化编辑、权限管理等。
icon: wiki-js
version: 1.0.0
author: SSLcat Team
website: https://js.wiki/
compose_file: docker-compose.yml

variables:
  - name: WIKIJS_VERSION
    type: select
    title: Wiki.js 版本
    default: "latest"
    options: ["latest", "2.5", "2.4"]
    description: 选择 Wiki.js 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: WIKIJS_PORT
    type: number
    title: Wiki.js 端口
    default: 3000
    min: 1024
    max: 65535
    description: Wiki.js Web 服务端口

services:
  - name: wiki
    type: web
    description: Wiki.js 知识库服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: wiki_data
        path: /var/wiki/data
        mode: rw
      - name: wiki_assets
        path: /var/wiki/assets
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_wiki"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_wiki"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

