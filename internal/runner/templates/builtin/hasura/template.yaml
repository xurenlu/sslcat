id: hasura
name: Hasura GraphQL Engine
category: tools
subcategory: database-api
tags: [graphql, postgresql, database, hasura, api]
description: 强大的 GraphQL 引擎，为 PostgreSQL 数据库自动生成 GraphQL API，支持实时订阅和权限管理。
icon: hasura
version: 1.0.0
author: SSLcat Team
website: https://hasura.io/
compose_file: docker-compose.yml

variables:
  - name: HASURA_VERSION
    type: select
    title: Hasura 版本
    default: "latest"
    options: ["latest", "v2.36", "v2.35"]
    description: 选择 Hasura GraphQL Engine 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: HASURA_PORT
    type: number
    title: Hasura 端口
    default: 8080
    min: 1024
    max: 65535
    description: Hasura GraphQL Engine 服务端口
  - name: HASURA_ADMIN_SECRET
    type: string
    title: Hasura Admin Secret
    default: ""
    description: Hasura 管理员密钥（留空将自动生成）
    sensitive: true

services:
  - name: hasura
    type: api
    description: Hasura GraphQL Engine 服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    healthcheck:
      type: http
      path: /healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_hasura"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_hasura"
  hasura:
    admin_secret:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  graphql: "http://{{PRIMARY_DOMAIN}}/v1/graphql"
  console: "http://{{PRIMARY_DOMAIN}}/console"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  graphql_endpoint: "http://{{PRIMARY_DOMAIN}}/v1/graphql"
  console_url: "http://{{PRIMARY_DOMAIN}}/console"
  features: "GraphQL API,实时订阅,权限管理,数据库操作,自动生成Schema"

