id: hasura
name: Hasura (GraphQL引擎)
category: tools
subcategory: api
tags: [haskell, postgres, api, hasura, graphql]
description: 即时 GraphQL API 引擎，自动从 PostgreSQL 数据库生成 GraphQL API，支持实时订阅。
icon: hasura
version: 1.0.0
author: SSLcat Team
website: https://hasura.io/
compose_file: docker-compose.yml

variables:
  - name: HASURA_VERSION
    type: select
    title: Hasura 版本
    default: "latest"
    options: ["latest", "v2.36", "v2.35"]
    description: 选择 Hasura 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: HASURA_PORT
    type: number
    title: Hasura 端口
    default: 8080
    min: 1024
    max: 65535
    description: Hasura GraphQL API 端口

services:
  - name: hasura
    type: api
    description: Hasura GraphQL 引擎服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: hasura_data
        path: /hasura-data
        mode: rw
    healthcheck:
      type: http
      path: /healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_hasura"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_hasura"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  console_url: "http://{{PRIMARY_DOMAIN}}:8080/console"
  graphql_endpoint: "http://{{PRIMARY_DOMAIN}}:8080/v1/graphql"
  features: "GraphQL API,自动生成,实时订阅,权限控制"
