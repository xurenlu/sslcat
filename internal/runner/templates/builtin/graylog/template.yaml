id: graylog
name: Graylog (日志管理)
category: tools
subcategory: logging
tags: [java, mongodb, elasticsearch, logging, graylog, log-management]
description: 强大的日志管理和分析平台，支持日志收集、搜索、分析和告警。
icon: graylog
version: 1.0.0
author: SSLcat Team
website: https://www.graylog.org/
compose_file: docker-compose.yml

variables:
  - name: GRAYLOG_VERSION
    type: select
    title: Graylog 版本
    default: "latest"
    options: ["latest", "5.2", "5.1"]
    description: 选择 Graylog 版本
  - name: MONGODB_VERSION
    type: select
    title: MongoDB 版本
    default: "7"
    options: ["7", "6", "5"]
    description: 选择 MongoDB 版本
  - name: ELASTICSEARCH_VERSION
    type: select
    title: Elasticsearch 版本
    default: "8.11.0"
    options: ["8.11.0", "8.10", "7.17"]
    description: 选择 Elasticsearch 版本
  - name: GRAYLOG_PORT
    type: number
    title: Graylog Web 端口
    default: 9000
    min: 1024
    max: 65535
    description: Graylog Web UI 端口
  - name: GRAYLOG_SYSLOG_PORT
    type: number
    title: Graylog Syslog 端口
    default: 514
    min: 1
    max: 65535
    description: Graylog Syslog 接收端口

services:
  - name: graylog
    type: web
    description: Graylog 日志管理服务
    depends_on: [mongo, elasticsearch]
    ports:
      - internal: 9000
        external: null
        public: true
      - internal: 514
        external: null
        public: true
    volumes:
      - name: graylog_data
        path: /usr/share/graylog/data
        mode: rw
    healthcheck:
      type: http
      path: /api
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: mongo
    type: database
    description: MongoDB 数据库服务
    ports:
      - internal: 27017
        external: null
        public: false
    volumes:
      - name: mongo_data
        path: /data/db
        mode: rw
    healthcheck:
      type: command
      command: ["mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: elasticsearch
    type: database
    description: Elasticsearch 搜索引擎服务
    ports:
      - internal: 9200
        external: null
        public: false
    volumes:
      - name: elasticsearch_data
        path: /usr/share/elasticsearch/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

credentials:
  mongo:
    username:
      pattern: "{app_name}_graylog"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_graylog"
  graylog:
    root_password_sha2:
      pattern: random
      length: 64
    secret:
      pattern: random
      length: 32

connection_strings:
  mongo: "mongodb://{username}:{password}@mongo:27017/{database}"
  elasticsearch: "http://elasticsearch:9200"

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:9000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin
  features: "日志管理,日志搜索,日志分析,告警通知"

