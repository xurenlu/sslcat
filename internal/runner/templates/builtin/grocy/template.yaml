id: grocy
name: Grocy
category: collaboration
subcategory: household
tags: [php, mysql, household, inventory, grocy]
description: 家庭库存管理系统，支持食品、工具、任务等管理，适合家庭使用。
icon: grocy
version: 1.0.0
author: SSLcat Team
website: https://grocy.info/
compose_file: docker-compose.yml

variables:
  - name: GROCY_VERSION
    type: select
    title: Grocy 版本
    default: "latest"
    options: ["latest", "4.0", "3.3"]
    description: 选择 Grocy 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: GROCY_PORT
    type: number
    title: Grocy 端口
    default: 80
    min: 1024
    max: 65535
    description: Grocy Web 服务端口

services:
  - name: grocy
    type: web
    description: Grocy 家庭管理系统服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: grocy_data
        path: /config
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_grocy"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_grocy"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

