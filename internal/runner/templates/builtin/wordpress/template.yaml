id: wordpress
name: WordPress
category: cms
subcategory: blog
tags: [php, mysql, cms, blog, wordpress]
description: 世界最流行的 CMS 平台，支持博客、网站和在线商店。包含 MySQL 数据库和可选的 Redis 缓存。
icon: wordpress
version: 1.0.0
author: SSLcat Team
website: https://wordpress.org/
compose_file: docker-compose.yml

variables:
  - name: WORDPRESS_VERSION
    type: select
    title: WordPress 版本
    default: "6.4.3"
    options: ["latest", "6.4.3", "6.3.2", "6.2.2"]
    description: 选择 WordPress 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: ENABLE_REDIS_CACHE
    type: bool
    title: 启用 Redis 缓存
    default: false
    description: 启用 Redis 缓存以提升性能
  - name: WORDPRESS_PORT
    type: number
    title: WordPress 端口
    default: 808080
    min: 1024
    max: 65535
    description: WordPress Web 服务端口

services:
  - name: wordpress
    type: web
    description: WordPress Web 服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: wordpress_data
        path: /var/www/html
        mode: rw
      - name: wordpress_uploads
        path: /var/www/html/wp-content/uploads
        mode: rw
    environment:
      required:
        - WORDPRESS_DB_HOST
        - WORDPRESS_DB_USER
        - WORDPRESS_DB_PASSWORD
        - WORDPRESS_DB_NAME
    healthcheck:
      type: http
      path: /wp-login.php
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_wp"
      prefix: ""
      suffix: ""
    password:
      pattern: random
      length: 18
      charset: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"
    database:
      pattern: "{app_name}_wp"
    root_password:
      pattern: random
      length: 20
      charset: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4&collation=utf8mb4_unicode_ci"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  default_admin_user: admin
  default_admin_email: admin@{{PRIMARY_DOMAIN}}
  install_url: http://{{PRIMARY_DOMAIN}}/wp-admin/install.php

