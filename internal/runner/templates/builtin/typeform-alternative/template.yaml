id: typeform-alternative
name: Typeform Alternative
category: tools
subcategory: form
tags: [form, survey, typeform]
description: Typeform 风格的表单工具，支持动态表单和美观的界面。
icon: typeform
version: 1.0.0
author: SSLcat Team
website: https://www.typeform.com/
compose_file: docker-compose.yml

variables:
  - name: TYPEFORM_VERSION
    type: select
    title: Typeform 版本
    default: "latest"
    options: ["latest", "v2", "v1"]
    description: 选择 Typeform 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: TYPEFORM_PORT
    type: number
    title: Typeform 端口
    default: 8080
    min: 1024
    max: 65535
    description: Typeform Web 服务端口

services:
  - name: typeform
    type: web
    description: Typeform 表单服务
    depends_on: [postgres]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: typeform_data
        path: /app/uploads
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_typeform"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_typeform"
  typeform:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

