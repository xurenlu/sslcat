id: linear-alternative
name: Linear Alternative (项目管理)
category: tools
subcategory: project-management
tags: [nodejs, postgres, redis, project-management, linear-alternative, issue-tracking]
description: Linear 的开源替代品，现代化的项目管理工具，支持 Issue 跟踪、看板、时间线等功能。
icon: linear-alternative
version: 1.0.0
author: SSLcat Team
website: https://github.com/linear-alternative
compose_file: docker-compose.yml

variables:
  - name: LINEAR_ALT_VERSION
    type: select
    title: Linear Alternative 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Linear Alternative 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: LINEAR_ALT_PORT
    type: number
    title: Linear Alternative 端口
    default: 3000
    min: 1024
    max: 65535
    description: Linear Alternative Web 服务端口

services:
  - name: linear-alternative
    type: web
    description: Linear Alternative 项目管理服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: linear_alt_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_linear"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_linear"
  redis:
    password:
      pattern: random
      length: 16

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "项目管理,Issue跟踪,看板视图,时间线视图"

