id: booked
name: Booked (预约系统)
category: tools
subcategory: scheduling
tags: [php, mysql, scheduling, booked, booking, reservation]
description: 开源预约和预订系统，支持资源预约、会议室预订、设备预订等功能。
icon: booked
version: 1.0.0
author: SSLcat Team
website: https://www.bookedscheduler.com/
compose_file: docker-compose.yml

variables:
  - name: BOOKED_VERSION
    type: select
    title: Booked 版本
    default: "latest"
    options: ["latest", "v2.9", "v2.8"]
    description: 选择 Booked 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: BOOKED_PORT
    type: number
    title: Booked 端口
    default: 80
    min: 1024
    max: 65535
    description: Booked Web 服务端口

services:
  - name: booked
    type: web
    description: Booked 预约系统服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: booked_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_booked"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_booked"
    root_password:
      pattern: random
      length: 18

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "预约系统,资源预订,会议室预订,设备预订"
