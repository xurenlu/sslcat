
services:
  glances:
    image: nicolargo/glances:{{GLANCES_VERSION}}
    container_name: {{APP_NAME}}_glances
    restart: unless-stopped
    ports:
      - "{{GLANCES_PORT}}:61208"
    environment:
      GLANCES_OPT: -w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:61208"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  {{APP_NAME}}_network:
    driver: bridge

