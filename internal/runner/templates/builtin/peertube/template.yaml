id: peertube
name: PeerTube
category: media
subcategory: video
tags: [nodejs, postgresql, redis, video, youtube-alternative, peertube]
description: 去中心化的视频平台，类似 YouTube，支持联邦网络。
icon: peertube
version: 1.0.0
author: SSLcat Team
website: https://joinpeertube.org/
compose_file: docker-compose.yml

variables:
  - name: PEERTUBE_VERSION
    type: select
    title: PeerTube 版本
    default: "latest"
    options: ["latest", "6.0", "5.3"]
    description: 选择 PeerTube 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: PEERTUBE_PORT
    type: number
    title: PeerTube 端口
    default: 9000
    min: 1024
    max: 65535
    description: PeerTube Web 服务端口

services:
  - name: peertube
    type: web
    description: PeerTube 视频平台服务
    depends_on: [postgres, redis]
    ports:
      - internal: 9000
        external: null
        public: true
    volumes:
      - name: peertube_data
        path: /app/storage
        mode: rw
    healthcheck:
      type: http
      path: /api/v1/config
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_peertube"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_peertube"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

