id: posthog
name: PostHog (产品分析)
category: tools
subcategory: analytics
tags: [python, postgres, redis, analytics, posthog, product-analytics]
description: 开源产品分析平台，支持事件追踪、用户分析、功能标志、会话录制等功能。
icon: posthog
version: 1.0.0
author: SSLcat Team
website: https://posthog.com/
compose_file: docker-compose.yml

variables:
  - name: POSTHOG_VERSION
    type: select
    title: PostHog 版本
    default: "latest"
    options: ["latest", "1.50", "1.49"]
    description: 选择 PostHog 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: POSTHOG_PORT
    type: number
    title: PostHog 端口
    default: 808000
    min: 1024
    max: 65535
    description: PostHog Web 服务端口

services:
  - name: posthog
    type: web
    description: PostHog 产品分析服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: posthog_data
        path: /code
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_posthog"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_posthog"
  redis:
    password:
      pattern: random
      length: 16
  posthog:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "产品分析,事件追踪,用户分析,功能标志,会话录制"
