version: '3.8'

services:
  posthog:
    image: posthog/posthog:{{POSTHOG_VERSION}}
    container_name: {{APP_NAME}}_posthog
    restart: unless-stopped
    ports:
      - "{{POSTHOG_PORT}}:8000"
    environment:
      POSTHOG_DB_NAME: {{POSTGRES_DATABASE}}
      POSTHOG_POSTGRES_HOST: postgres
      POSTHOG_POSTGRES_DATABASE: {{POSTGRES_DATABASE}}
      POSTHOG_POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTHOG_POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
      POSTHOG_REDIS_HOST: redis
      POSTHOG_SECRET_KEY: {{POSTHOG_SECRET_KEY}}
    volumes:
      - posthog_data:/code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    command: redis-server --requirepass {{REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  posthog_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
