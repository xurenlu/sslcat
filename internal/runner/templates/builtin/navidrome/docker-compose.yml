
services:
  navidrome:
    image: deluan/navidrome:{{NAVIDROME_VERSION}}
    container_name: {{APP_NAME}}_navidrome
    restart: unless-stopped
    ports:
      - "{{NAVIDROME_PORT}}:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
    volumes:
      - navidrome_data:/data
      - music_data:/music:ro
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  navidrome_data:
    driver: local
  music_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

