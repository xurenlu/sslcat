id: navidrome
name: Navidrome
category: media
subcategory: music
tags: [go, music, streaming, navidrome]
description: 开源音乐服务器，支持 Subsonic API，适合自建音乐流媒体服务。
icon: navidrome
version: 1.0.0
author: SSLcat Team
website: https://www.navidrome.org/
compose_file: docker-compose.yml

variables:
  - name: NAVIDROME_VERSION
    type: select
    title: Navidrome 版本
    default: "latest"
    options: ["latest", "0.52.0"]
    description: 选择 Navidrome 版本
  - name: NAVIDROME_PORT
    type: number
    title: Navidrome 端口
    default: 4533
    min: 1024
    max: 65535
    description: Navidrome Web 服务端口

services:
  - name: navidrome
    type: web
    description: Navidrome 音乐服务器
    ports:
      - internal: 4533
        external: null
        public: true
    volumes:
      - name: navidrome_data
        path: /data
        mode: rw
      - name: music_data
        path: /music
        mode: ro
    healthcheck:
      type: http
      path: /ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

