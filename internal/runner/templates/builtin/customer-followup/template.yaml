id: customer-followup
name: 客户跟单系统
category: tools
subcategory: crm
tags: [php, postgres, redis, crm, customer-followup, sales]
description: 专业的客户跟单管理系统，支持客户管理、跟进记录、商机管理、合同管理、销售报表等功能。
icon: customer-followup
version: 1.0.0
author: SSLcat Team
website: https://github.com/customer-followup
compose_file: docker-compose.yml

variables:
  - name: FOLLOWUP_VERSION
    type: select
    title: 客户跟单系统版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择客户跟单系统版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: FOLLOWUP_PORT
    type: number
    title: 客户跟单系统端口
    default: 8080
    min: 1024
    max: 65535
    description: 客户跟单系统 Web 服务端口

services:
  - name: customer-followup
    type: web
    description: 客户跟单系统服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: followup_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_followup"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_followup"
  redis:
    password:
      pattern: random
      length: 16
  customer-followup:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "客户管理,跟进记录,商机管理,合同管理,销售报表,客户分析"

