
services:
  rapidoc:
    image: rapidoc/rapidoc:{{RAPIDOC_VERSION}}
    container_name: {{APP_NAME}}_rapidoc
    restart: unless-stopped
    ports:
      - "{{RAPIDOC_PORT}}:8080"
    environment:
      RAPIDOC_SPEC_URL: {{RAPIDOC_SPEC_URL}}
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  {{APP_NAME}}_network:
    driver: bridge

