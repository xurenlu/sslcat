id: rapidoc
name: RapiDoc (API文档)
category: tools
subcategory: api-docs
tags: [nodejs, api-docs, rapidoc, openapi, rest-api]
description: 现代化的 OpenAPI 文档查看器，支持三栏式布局，交互式 API 文档。
icon: rapidoc
version: 1.0.0
author: SSLcat Team
website: https://rapidocweb.com/
compose_file: docker-compose.yml

variables:
  - name: RAPIDOC_VERSION
    type: select
    title: RapiDoc 版本
    default: "latest"
    options: ["latest", "v10.0", "v9.0"]
    description: 选择 RapiDoc 版本
  - name: RAPIDOC_PORT
    type: number
    title: RapiDoc 端口
    default: 8080
    min: 1024
    max: 65535
    description: RapiDoc Web 服务端口
  - name: RAPIDOC_SPEC_URL
    type: string
    title: OpenAPI 规范 URL
    default: "/openapi.json"
    description: OpenAPI/Swagger 规范文件 URL
    placeholder: "/openapi.json"

services:
  - name: rapidoc
    type: web
    description: RapiDoc API 文档服务
    ports:
      - internal: 8080
        external: null
        public: true
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "API文档,OpenAPI支持,三栏布局,交互式展示"

