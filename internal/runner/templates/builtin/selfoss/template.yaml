id: selfoss
name: Selfoss
category: rss
subcategory: reader
tags: [php, rss, feed, reader, selfoss]
description: 简单的 RSS 阅读器，界面简洁，适合个人使用。
icon: selfoss
version: 1.0.0
author: SSLcat Team
website: https://selfoss.aditu.de/
compose_file: docker-compose.yml

variables:
  - name: SELFOSS_VERSION
    type: select
    title: Selfoss 版本
    default: "latest"
    options: ["latest", "2.20"]
    description: 选择 Selfoss 版本
  - name: SELFOSS_PORT
    type: number
    title: Selfoss 端口
    default: 8888
    min: 1024
    max: 65535
    description: Selfoss Web 服务端口

services:
  - name: selfoss
    type: web
    description: Selfoss RSS 阅读器服务
    ports:
      - internal: 8888
        external: null
        public: true
    volumes:
      - name: selfoss_data
        path: /var/www/selfoss/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: password

