
services:
  onlyoffice:
    image: onlyoffice/documentserver:{{ONLYOFFICE_VERSION}}
    container_name: {{APP_NAME}}_onlyoffice
    restart: unless-stopped
    ports:
      - "{{ONLYOFFICE_PORT}}:80"
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_NAME: {{POSTGRES_DATABASE}}
      DB_USER: {{POSTGRES_USERNAME}}
      DB_PWD: {{POSTGRES_PASSWORD}}
      JWT_SECRET: {{ONLYOFFICE_JWT_SECRET}}
      JWT_ENABLED: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  onlyoffice_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
