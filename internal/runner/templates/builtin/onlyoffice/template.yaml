id: onlyoffice
name: OnlyOffice (文档协作)
category: tools
subcategory: collaboration
tags: [nodejs, postgres, collaboration, onlyoffice, document-editor]
description: 在线文档协作平台，支持Word、Excel、PowerPoint在线编辑，实时协作，类似Google Docs。
icon: onlyoffice
version: 1.0.0
author: SSLcat Team
website: https://www.onlyoffice.com/
compose_file: docker-compose.yml

variables:
  - name: ONLYOFFICE_VERSION
    type: select
    title: OnlyOffice 版本
    default: "latest"
    options: ["latest", "7.5", "7.4"]
    description: 选择 OnlyOffice 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: ONLYOFFICE_PORT
    type: number
    title: OnlyOffice 端口
    default: 808080
    min: 1024
    max: 65535
    description: OnlyOffice Web 服务端口

services:
  - name: onlyoffice
    type: web
    description: OnlyOffice 文档协作服务
    depends_on: [postgres]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: onlyoffice_data
        path: /var/www/onlyoffice/Data
        mode: rw
    healthcheck:
      type: http
      path: /healthcheck
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_onlyoffice"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_onlyoffice"
  onlyoffice:
    jwt_secret:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Word编辑,Excel编辑,PowerPoint编辑,实时协作,文档共享"
