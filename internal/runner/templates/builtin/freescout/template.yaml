id: freescout
name: FreeScout
category: support
subcategory: helpdesk
tags: [php, mysql, support, helpdesk, freescout]
description: 开源客服系统，类似 Help Scout，功能完整，适合团队使用。
icon: freescout
version: 1.0.0
author: SSLcat Team
website: https://freescout.net/
compose_file: docker-compose.yml

variables:
  - name: FREESCOUT_VERSION
    type: select
    title: FreeScout 版本
    default: "latest"
    options: ["latest", "2.0"]
    description: 选择 FreeScout 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: FREESCOUT_PORT
    type: number
    title: FreeScout 端口
    default: 80
    min: 1024
    max: 65535
    description: FreeScout Web 服务端口

services:
  - name: freescout
    type: web
    description: FreeScout 客服系统服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: freescout_data
        path: /var/www/html/storage
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_freescout"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_freescout"
    root_password:
      pattern: random
      length: 20
  freescout:
    app_key:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

