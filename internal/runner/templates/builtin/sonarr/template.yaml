id: sonarr
name: Sonarr
category: media
subcategory: automation
tags: [csharp, media, automation, tv, sonarr]
description: 电视剧自动化管理工具，支持自动下载和管理电视剧。
icon: sonarr
version: 1.0.0
author: SSLcat Team
website: https://sonarr.tv/
compose_file: docker-compose.yml

variables:
  - name: SONARR_VERSION
    type: select
    title: Sonarr 版本
    default: "latest"
    options: ["latest", "4.0", "3.0"]
    description: 选择 Sonarr 版本
  - name: SONARR_PORT
    type: number
    title: Sonarr 端口
    default: 8989
    min: 1024
    max: 65535
    description: Sonarr Web 服务端口

services:
  - name: sonarr
    type: web
    description: Sonarr 电视剧管理服务
    ports:
      - internal: 8989
        external: null
        public: true
    volumes:
      - name: sonarr_data
        path: /config
        mode: rw
      - name: sonarr_tv
        path: /tv
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

