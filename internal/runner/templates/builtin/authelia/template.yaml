id: authelia
name: Authelia
category: security
subcategory: authentication
tags: [go, postgres, security, authentication, sso, authelia]
description: 开源身份验证和授权服务器，支持 2FA、SSO 和细粒度访问控制。
icon: authelia
version: 1.0.0
author: SSLcat Team
website: https://www.authelia.com/
compose_file: docker-compose.yml

variables:
  - name: AUTHELIA_VERSION
    type: select
    title: Authelia 版本
    default: "latest"
    options: ["latest", "4.38", "4.37"]
    description: 选择 Authelia 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: AUTHELIA_PORT
    type: number
    title: Authelia 端口
    default: 9091
    min: 1024
    max: 65535
    description: Authelia Web 服务端口

services:
  - name: authelia
    type: web
    description: Authelia 身份验证服务
    depends_on: [postgres]
    ports:
      - internal: 9091
        external: null
        public: true
    volumes:
      - name: authelia_data
        path: /config
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_authelia"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_authelia"
  authelia:
    jwt_secret:
      pattern: random
      length: 32
    session_secret:
      pattern: random
      length: 32
    encryption_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "2FA,SSO,访问控制"

