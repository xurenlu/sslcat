version: '3.8'

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:{{VICTORIAMETRICS_VERSION}}
    container_name: {{APP_NAME}}_victoriametrics
    restart: unless-stopped
    ports:
      - "{{VICTORIAMETRICS_PORT}}:8428"
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--httpListenAddr=:8428'
      - '--retentionPeriod=12'
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  victoriametrics_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

