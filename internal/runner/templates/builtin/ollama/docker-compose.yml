version: '3.8'

services:
  ollama:
    image: ollama/ollama:{{OLLAMA_VERSION}}
    container_name: {{APP_NAME}}_ollama
    restart: unless-stopped
    ports:
      - "{{OLLAMA_PORT}}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

