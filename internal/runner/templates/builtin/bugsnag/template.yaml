id: bugsnag
name: Bugsnag (错误监控)
category: tools
subcategory: error-tracking
tags: [ruby, postgres, redis, error-tracking, bugsnag, bug-monitoring]
description: 错误监控和追踪平台，实时捕获应用错误，支持多种编程语言，提供详细的错误报告。
icon: bugsnag
version: 1.0.0
author: SSLcat Team
website: https://www.bugsnag.com/
compose_file: docker-compose.yml

variables:
  - name: BUGSNAG_VERSION
    type: select
    title: Bugsnag 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Bugsnag 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: BUGSNAG_PORT
    type: number
    title: Bugsnag 端口
    default: 3000
    min: 1024
    max: 65535
    description: Bugsnag Web 服务端口

services:
  - name: bugsnag
    type: web
    description: Bugsnag 错误监控服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: bugsnag_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_bugsnag"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_bugsnag"
  redis:
    password:
      pattern: random
      length: 16
  bugsnag:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "错误监控,实时追踪,多语言支持,详细报告"
