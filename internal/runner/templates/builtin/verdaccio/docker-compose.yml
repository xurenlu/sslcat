
services:
  verdaccio:
    image: verdaccio/verdaccio:{{VERDACCIO_VERSION}}
    container_name: {{APP_NAME}}_verdaccio
    restart: unless-stopped
    ports:
      - "{{VERDACCIO_PORT}}:4873"
    environment:
      VERDACCIO_PROTOCOL: http
    volumes:
      - verdaccio_data:/verdaccio/storage
      - verdaccio_config:/verdaccio/conf
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4873"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  verdaccio_data:
    driver: local
  verdaccio_config:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
