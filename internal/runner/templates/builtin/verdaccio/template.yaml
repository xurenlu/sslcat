id: verdaccio
name: Verdaccio (NPM私有仓库)
category: tools
subcategory: package-registry
tags: [nodejs, npm, package-registry, verdaccio, private-registry]
description: 轻量级私有 NPM 包仓库，支持代理公共包和私有包管理。
icon: verdaccio
version: 1.0.0
author: SSLcat Team
website: https://verdaccio.org/
compose_file: docker-compose.yml

variables:
  - name: VERDACCIO_VERSION
    type: select
    title: Verdaccio 版本
    default: "latest"
    options: ["latest", "5.15", "5.14"]
    description: 选择 Verdaccio 版本
  - name: VERDACCIO_PORT
    type: number
    title: Verdaccio 端口
    default: 4873
    min: 1024
    max: 65535
    description: Verdaccio NPM 仓库端口

services:
  - name: verdaccio
    type: web
    description: Verdaccio NPM 私有仓库服务
    ports:
      - internal: 4873
        external: null
        public: true
    volumes:
      - name: verdaccio_data
        path: /verdaccio/storage
        mode: rw
      - name: verdaccio_config
        path: /verdaccio/conf
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:4873
  admin_email: admin@{{PRIMARY_DOMAIN}}
  registry_url: "http://{{PRIMARY_DOMAIN}}:4873"
  features: "NPM私有仓库,包代理,私有包管理,轻量级"
