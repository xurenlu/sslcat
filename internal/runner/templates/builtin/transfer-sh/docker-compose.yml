
services:
  transfer-sh:
    image: dutchcoders/transfer.sh:{{TRANSFER_SH_VERSION}}
    container_name: {{APP_NAME}}_transfer_sh
    restart: unless-stopped
    ports:
      - "{{TRANSFER_SH_PORT}}:8080"
    environment:
      PROVIDER: local
      BASEDIR: /tmp/transfers
    volumes:
      - transfer_sh_data:/tmp/transfers
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  transfer_sh_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

