id: kimai
name: Kimai (时间追踪)
category: tools
subcategory: project-management
tags: [php, postgres, project-management, kimai, time-tracking]
description: 开源的时间追踪工具，支持项目时间记录、工时统计、客户计费、报表生成等功能。
icon: kimai
version: 1.0.0
author: SSLcat Team
website: https://www.kimai.org/
compose_file: docker-compose.yml

variables:
  - name: KIMAI_VERSION
    type: select
    title: Kimai 版本
    default: "latest"
    options: ["latest", "2.1", "2.0"]
    description: 选择 Kimai 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: KIMAI_PORT
    type: number
    title: Kimai 端口
    default: 808001
    min: 1024
    max: 65535
    description: Kimai Web 服务端口
  - name: KIMAI_ADMIN_EMAIL
    type: string
    title: Kimai 管理员邮箱
    default: "admin@{{PRIMARY_DOMAIN}}"
    description: Kimai 管理员邮箱
    placeholder: "admin@example.com"
  - name: KIMAI_ADMIN_PASSWORD
    type: string
    title: Kimai 管理员密码
    default: ""
    description: Kimai 管理员密码
    required: true
    sensitive: true

services:
  - name: kimai
    type: web
    description: Kimai 时间追踪服务
    depends_on: [postgres]
    ports:
      - internal: 8001
        external: null
        public: true
    volumes:
      - name: kimai_data
        path: /opt/kimai/var
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_kimai"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_kimai"
  kimai:
    admin_email:
      pattern: "{KIMAI_ADMIN_EMAIL}"
    admin_password:
      pattern: "{KIMAI_ADMIN_PASSWORD}"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: "http://{{PRIMARY_DOMAIN}}:8001"
  admin_email: "{{KIMAI_ADMIN_EMAIL}}"
  features: "项目时间记录,工时统计,客户计费,报表生成,时间追踪"

