id: plausible
name: Plausible
category: analytics
subcategory: web-analytics
tags: [elixir, postgresql, clickhouse, analytics, privacy, plausible]
description: 隐私友好的网站分析工具，轻量快速，符合 GDPR。
icon: plausible
version: 1.0.0
author: SSLcat Team
website: https://plausible.io/
compose_file: docker-compose.yml

variables:
  - name: PLAUSIBLE_VERSION
    type: select
    title: Plausible 版本
    default: "latest"
    options: ["latest", "2.0.0"]
    description: 选择 Plausible 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: CLICKHOUSE_VERSION
    type: select
    title: ClickHouse 版本
    default: "latest"
    options: ["latest", "23.11"]
    description: 选择 ClickHouse 版本
  - name: PLAUSIBLE_PORT
    type: number
    title: Plausible 端口
    default: 808000
    min: 1024
    max: 65535
    description: Plausible Web 服务端口

services:
  - name: plausible
    type: web
    description: Plausible 分析服务
    depends_on: [postgres, clickhouse]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: plausible_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: clickhouse
    type: database
    description: ClickHouse 分析数据库服务
    ports:
      - internal: 8123
        external: null
        public: false
    volumes:
      - name: clickhouse_data
        path: /var/lib/clickhouse
        mode: rw
    healthcheck:
      type: http
      path: /ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_plausible"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_plausible"
  clickhouse:
    database:
      pattern: "{app_name}_plausible"
  plausible:
    secret_key_base:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  clickhouse: "http://clickhouse:8123/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

