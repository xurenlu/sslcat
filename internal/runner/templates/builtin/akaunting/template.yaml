id: akaunting
name: Akaunting (会计软件)
category: tools
subcategory: finance
tags: [php, mysql, finance, accounting, bookkeeping]
description: 开源的会计软件，适合中小企业，支持会计科目、凭证管理、财务报表、银行对账等功能。
icon: akaunting
version: 1.0.0
author: SSLcat Team
website: https://akaunting.com/
compose_file: docker-compose.yml

variables:
  - name: AKAUNTING_VERSION
    type: select
    title: Akaunting 版本
    default: "latest"
    options: ["latest", "3.0", "2.1"]
    description: 选择 Akaunting 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: AKAUNTING_PORT
    type: number
    title: Akaunting 端口
    default: 80
    min: 1024
    max: 65535
    description: Akaunting Web 服务端口

services:
  - name: akaunting
    type: web
    description: Akaunting 会计软件服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: akaunting_data
        path: /var/www/html/storage
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_akaunting"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_akaunting"
    root_password:
      pattern: random
      length: 18
  akaunting:
    app_key:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "会计科目,凭证管理,财务报表,银行对账,税务管理"

