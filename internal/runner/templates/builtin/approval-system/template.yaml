id: approval-system
name: Approval System
category: tools
subcategory: workflow
tags: [workflow, approval, approval-system]
description: 简单审批系统，支持请假、报销、采购等审批流程。
icon: approval-system
version: 1.0.0
author: SSLcat Team
website: https://github.com/approval-system
compose_file: docker-compose.yml

variables:
  - name: APPROVAL_SYSTEM_VERSION
    type: select
    title: Approval System 版本
    default: "latest"
    options: ["latest", "v1", "v2"]
    description: 选择 Approval System 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: APPROVAL_SYSTEM_PORT
    type: number
    title: Approval System 端口
    default: 8080
    min: 1024
    max: 65535
    description: Approval System Web 服务端口

services:
  - name: approval-system
    type: web
    description: Approval System 审批系统服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: approval_system_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_approval"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_approval"
  approval-system:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

