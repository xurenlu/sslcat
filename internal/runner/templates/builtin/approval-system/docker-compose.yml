version: '3.8'

services:
  approval-system:
    image: approval-system/app:{{APPROVAL_SYSTEM_VERSION}}
    container_name: {{APP_NAME}}_approval_system
    restart: unless-stopped
    ports:
      - "{{APPROVAL_SYSTEM_PORT}}:8080"
    environment:
      DATABASE_URL: postgres://{{POSTGRES_USERNAME}}:{{POSTGRES_PASSWORD}}@postgres:5432/{{POSTGRES_DATABASE}}
      SECRET_KEY: {{SECRET_KEY}}
    volumes:
      - approval_system_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  approval_system_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

