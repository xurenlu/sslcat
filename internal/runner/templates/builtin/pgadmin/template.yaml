id: pgadmin
name: pgAdmin (PostgreSQL管理)
category: tools
subcategory: database-admin
tags: [python, postgresql, database-admin, pgadmin]
description: PostgreSQL 数据库 Web 管理工具，提供图形化界面管理 PostgreSQL 数据库。
icon: pgadmin
version: 1.0.0
author: SSLcat Team
website: https://www.pgadmin.org/
compose_file: docker-compose.yml

variables:
  - name: PGADMIN_VERSION
    type: select
    title: pgAdmin 版本
    default: "latest"
    options: ["latest", "8.0", "7.8"]
    description: 选择 pgAdmin 版本
  - name: PGADMIN_PORT
    type: number
    title: pgAdmin 端口
    default: 80
    min: 1024
    max: 65535
    description: pgAdmin Web 服务端口
  - name: PGADMIN_EMAIL
    type: string
    title: pgAdmin 邮箱
    default: "admin@{{PRIMARY_DOMAIN}}"
    description: pgAdmin 登录邮箱
    placeholder: "admin@example.com"
  - name: PGADMIN_PASSWORD
    type: string
    title: pgAdmin 密码
    default: ""
    description: pgAdmin 登录密码
    required: true
    sensitive: true

services:
  - name: pgadmin
    type: web
    description: pgAdmin PostgreSQL 管理工具
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: pgadmin_data
        path: /var/lib/pgadmin
        mode: rw
    healthcheck:
      type: http
      path: /misc/ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

credentials:
  pgadmin:
    email:
      pattern: "{PGADMIN_EMAIL}"
    password:
      pattern: "{PGADMIN_PASSWORD}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: {{PGADMIN_EMAIL}}
  features: "PostgreSQL管理,图形化界面,SQL执行,数据导入导出"

