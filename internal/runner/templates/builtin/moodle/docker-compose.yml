
services:
  moodle:
    image: bitnami/moodle:{{MOODLE_VERSION}}
    container_name: {{APP_NAME}}_moodle
    restart: unless-stopped
    ports:
      - "{{MOODLE_PORT}}:8080"
    environment:
      MOODLE_DATABASE_HOST: postgres
      MOODLE_DATABASE_PORT_NUMBER: 5432
      MOODLE_DATABASE_USER: "{{POSTGRES_USERNAME}}"
      MOODLE_DATABASE_PASSWORD: "{{POSTGRES_PASSWORD}}"
      MOODLE_DATABASE_NAME: "{{POSTGRES_DATABASE}}"
      MOODLE_USERNAME: "{{MOODLE_USERNAME}}"
      MOODLE_PASSWORD: "{{MOODLE_PASSWORD}}"
      MOODLE_EMAIL: "{{MOODLE_EMAIL}}"
    volumes:
      - moodle_data:/bitnami/moodle
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "{{POSTGRES_DATABASE}}"
      POSTGRES_USER: "{{POSTGRES_USERNAME}}"
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  moodle_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

