
services:
  unstructured:
    image: unstructured-io/unstructured:{{UNSTRUCTURED_VERSION}}
    container_name: {{APP_NAME}}_unstructured
    restart: unless-stopped
    ports:
      - "{{UNSTRUCTURED_PORT}}:8000"
    environment:
      UNSTRUCTURED_API_KEY: "{{UNSTRUCTURED_API_KEY}}"
    volumes:
      - unstructured_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  unstructured_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

