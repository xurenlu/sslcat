id: rabbitmq
name: RabbitMQ
category: database
subcategory: message-queue
tags: [rabbitmq, message-queue, amqp, messaging]
description: 开源消息队列系统，支持 AMQP 协议，适合微服务架构。
icon: rabbitmq
version: 1.0.0
author: SSLcat Team
website: https://www.rabbitmq.com/
compose_file: docker-compose.yml

variables:
  - name: RABBITMQ_VERSION
    type: select
    title: RabbitMQ 版本
    default: "3-management-alpine"
    options: ["3-management-alpine", "3-management", "latest"]
    description: 选择 RabbitMQ 版本
  - name: RABBITMQ_PORT
    type: number
    title: RabbitMQ AMQP 端口
    default: 5672
    min: 1024
    max: 65535
    description: RabbitMQ AMQP 协议端口
  - name: RABBITMQ_MANAGEMENT_PORT
    type: number
    title: RabbitMQ 管理界面端口
    default: 15672
    min: 1024
    max: 65535
    description: RabbitMQ Web 管理界面端口

services:
  - name: rabbitmq
    type: message-queue
    description: RabbitMQ 消息队列服务
    ports:
      - internal: 5672
        external: null
        public: true
      - internal: 15672
        external: null
        public: true
    volumes:
      - name: rabbitmq_data
        path: /var/lib/rabbitmq
        mode: rw
    healthcheck:
      type: command
      command: ["rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  rabbitmq:
    username:
      pattern: "{app_name}_user"
    password:
      pattern: random
      length: 16

connection_strings:
  rabbitmq: "amqp://{{RABBITMQ_USERNAME}}:{{RABBITMQ_PASSWORD}}@rabbitmq:5672/"
  rabbitmq_management: "http://{{PRIMARY_DOMAIN}}:{{RABBITMQ_MANAGEMENT_PORT}}"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  management_url: "http://{{PRIMARY_DOMAIN}}:{{RABBITMQ_MANAGEMENT_PORT}}"
  default_user: "{{RABBITMQ_USERNAME}}"
  default_password: "{{RABBITMQ_PASSWORD}}"

