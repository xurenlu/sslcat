id: regex-tester
name: Regex Tester (正则表达式测试工具)
category: tools
subcategory: developer-tools
tags: [regex, regular-expression, tester, developer-tools]
description: 在线正则表达式测试工具，支持实时匹配、高亮显示、多语言正则语法、常用正则模板。
icon: regex-tester
version: 1.0.0
author: SSLcat Team
website: https://regex101.com/
compose_file: docker-compose.yml

variables:
  - name: REGEX_TESTER_VERSION
    type: select
    title: Regex Tester 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Regex Tester 版本
  - name: REGEX_TESTER_PORT
    type: number
    title: Regex Tester 端口
    default: 808080
    min: 1024
    max: 65535
    description: Regex Tester Web 服务端口

services:
  - name: regex-tester
    type: web
    description: Regex Tester 正则表达式测试工具服务
    ports:
      - internal: 8080
        external: null
        public: true
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "正则测试,实时匹配,高亮显示,多语言支持,常用模板,分组捕获"

