version: '3.8'

services:
  openproject:
    image: openproject/community:{{OPENPROJECT_VERSION}}
    container_name: {{APP_NAME}}_openproject
    restart: unless-stopped
    ports:
      - "{{OPENPROJECT_PORT}}:80"
    environment:
      OPENPROJECT_HOST__NAME: {{PRIMARY_DOMAIN}}
      OPENPROJECT_HTTPS: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      SECRET_KEY_BASE: {{SECRET_KEY_BASE}}
    volumes:
      - openproject_data:/var/openproject/assets
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  openproject_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

