version: '3.8'

services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:{{CALIBRE_WEB_VERSION}}
    container_name: {{APP_NAME}}_calibre_web
    restart: unless-stopped
    ports:
      - "{{CALIBRE_WEB_PORT}}:8083"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - calibre_web_data:/config
      - calibre_books:/books
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  calibre_web_data:
    driver: local
  calibre_books:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

