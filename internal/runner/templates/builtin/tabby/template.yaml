id: tabby
name: Tabby (自托管代码助手)
category: ai
subcategory: code-generation
tags: [rust, ai, code-generation, tabby, gpu]
description: 自托管的 AI 代码助手，类似 GitHub Copilot，支持本地部署，需要 GPU。
icon: tabby
version: 1.0.0
author: SSLcat Team
website: https://tabby.tabbyml.com/
compose_file: docker-compose.yml

variables:
  - name: TABBY_VERSION
    type: select
    title: Tabby 版本
    default: "latest"
    options: ["latest", "v0.5", "v0.4"]
    description: 选择 Tabby 版本
  - name: TABBY_PORT
    type: number
    title: Tabby 端口
    default: 808080
    min: 1024
    max: 65535
    description: Tabby API 服务端口
  - name: TABBY_API_KEY
    type: string
    title: Tabby API Key
    default: ""
    description: Tabby API 密钥（可选）
    sensitive: true

services:
  - name: tabby
    type: api
    description: Tabby AI 代码助手服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: tabby_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

credentials:
  tabby:
    api_key:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api"
  features: "代码补全,自托管,隐私保护,多语言支持"
  gpu_required: true

