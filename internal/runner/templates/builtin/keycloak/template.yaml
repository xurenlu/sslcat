id: keycloak
name: Keycloak
category: security
subcategory: authentication
tags: [java, postgres, security, authentication, sso, keycloak]
description: 企业级身份和访问管理解决方案，支持 SSO、OAuth2、SAML。
icon: keycloak
version: 1.0.0
author: SSLcat Team
website: https://www.keycloak.org/
compose_file: docker-compose.yml

variables:
  - name: KEYCLOAK_VERSION
    type: select
    title: Keycloak 版本
    default: "latest"
    options: ["latest", "23.0", "22.0"]
    description: 选择 Keycloak 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: KEYCLOAK_PORT
    type: number
    title: Keycloak 端口
    default: 808080
    min: 1024
    max: 65535
    description: Keycloak Web 服务端口

services:
  - name: keycloak
    type: web
    description: Keycloak 身份管理服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: keycloak_data
        path: /opt/keycloak/data
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_keycloak"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_keycloak"
  keycloak:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/admin
  admin_email: admin@{{PRIMARY_DOMAIN}}
  admin_username: admin
  features: "SSO,OAuth2,SAML,LDAP"

