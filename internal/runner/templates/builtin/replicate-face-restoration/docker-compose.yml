
services:
  replicate-face-restoration:
    image: replicate/proxy:{{REPLICATE_FACE_RESTORE_VERSION}}
    container_name: {{APP_NAME}}_replicate_face_restoration
    restart: unless-stopped
    ports:
      - "{{REPLICATE_FACE_RESTORE_PORT}}:8080"
    environment:
      REPLICATE_API_TOKEN: {{REPLICATE_API_TOKEN}}
      REPLICATE_MODEL: logerzhu/face-restoration
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - replicate_face_restore_data:/app/cache
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  replicate_face_restore_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

