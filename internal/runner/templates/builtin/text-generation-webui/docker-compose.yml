
services:
  text-generation-webui:
    image: atinoda/text-generation-webui:{{TEXT_GENERATION_WEBUI_VERSION}}
    container_name: {{APP_NAME}}_text_generation_webui
    restart: unless-stopped
    ports:
      - "{{TEXT_GENERATION_WEBUI_PORT}}:7860"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - text_generation_webui_data:/app/models
      - text_generation_webui_characters:/app/characters
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  text_generation_webui_data:
    driver: local
  text_generation_webui_characters:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

