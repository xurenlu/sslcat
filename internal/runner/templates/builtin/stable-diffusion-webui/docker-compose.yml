version: '3.8'

services:
  stable-diffusion-webui:
    image: lscr.io/linuxserver/stable-diffusion-webui:{{SD_WEBUI_VERSION}}
    container_name: {{APP_NAME}}_stable_diffusion_webui
    restart: unless-stopped
    ports:
      - "{{SD_WEBUI_PORT}}:7860"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
    volumes:
      - sd_webui_data:/config
      - sd_webui_models:/models
    networks:
      - {{APP_NAME}}_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  sd_webui_data:
    driver: local
  sd_webui_models:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

