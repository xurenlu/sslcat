
services:
  stable-diffusion-webui:
    image: universonic/stable-diffusion-webui:{{SD_WEBUI_VERSION}}
    container_name: {{APP_NAME}}_stable_diffusion_webui
    restart: unless-stopped
    ports:
      - "{{SD_WEBUI_PORT}}:7860"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - sd_webui_data:/config
      - sd_webui_models:/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  sd_webui_data:
    driver: local
  sd_webui_models:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

