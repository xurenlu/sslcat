id: yourls
name: YOURLS
category: tools
subcategory: url-shortener
tags: [php, mysql, url-shortener, short-link, yourls]
description: 自托管短链接服务，功能完整，支持统计和插件扩展。
icon: yourls
version: 1.0.0
author: SSLcat Team
website: https://yourls.org/
compose_file: docker-compose.yml

variables:
  - name: YOURLS_VERSION
    type: select
    title: YOURLS 版本
    default: "latest"
    options: ["latest", "1.9", "1.8"]
    description: 选择 YOURLS 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: YOURLS_PORT
    type: number
    title: YOURLS 端口
    default: 808080
    min: 1024
    max: 65535
    description: YOURLS Web 服务端口

services:
  - name: yourls
    type: web
    description: YOURLS 短链接服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: yourls_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_yourls"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_yourls"
    root_password:
      pattern: random
      length: 20
  yourls:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/admin
  admin_email: admin@{{PRIMARY_DOMAIN}}
  admin_username: admin

