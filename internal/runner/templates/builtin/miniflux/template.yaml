id: miniflux
name: Miniflux
category: rss
subcategory: reader
tags: [go, postgresql, rss, feed, reader, miniflux]
description: 极简的 RSS 阅读器，轻量快速，界面简洁。
icon: miniflux
version: 1.0.0
author: SSLcat Team
website: https://miniflux.app/
compose_file: docker-compose.yml

variables:
  - name: MINIFLUX_VERSION
    type: select
    title: Miniflux 版本
    default: "latest"
    options: ["latest", "2.1.2"]
    description: 选择 Miniflux 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: MINIFLUX_PORT
    type: number
    title: Miniflux 端口
    default: 8080
    min: 1024
    max: 65535
    description: Miniflux Web 服务端口

services:
  - name: miniflux
    type: web
    description: Miniflux RSS 阅读器服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: miniflux_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_miniflux"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_miniflux"
  miniflux:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_username: admin

