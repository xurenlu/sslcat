id: prowlarr
name: Prowlarr
category: media
subcategory: automation
tags: [csharp, media, automation, indexer, prowlarr]
description: 索引器管理工具，为 Sonarr、Radarr 等提供统一的索引器管理。
icon: prowlarr
version: 1.0.0
author: SSLcat Team
website: https://prowlarr.com/
compose_file: docker-compose.yml

variables:
  - name: PROWLARR_VERSION
    type: select
    title: Prowlarr 版本
    default: "latest"
    options: ["latest", "1.10", "1.9"]
    description: 选择 Prowlarr 版本
  - name: PROWLARR_PORT
    type: number
    title: Prowlarr 端口
    default: 9696
    min: 1024
    max: 65535
    description: Prowlarr Web 服务端口

services:
  - name: prowlarr
    type: web
    description: Prowlarr 索引器管理服务
    ports:
      - internal: 9696
        external: null
        public: true
    volumes:
      - name: prowlarr_data
        path: /config
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

