
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:{{PROWLARR_VERSION}}
    container_name: {{APP_NAME}}_prowlarr
    restart: unless-stopped
    ports:
      - "{{PROWLARR_PORT}}:9696"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    volumes:
      - prowlarr_data:/config
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9696"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  prowlarr_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

