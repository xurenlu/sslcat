
services:
  iredmail:
    image: iredmail/mariadb:{{IREDMAIL_VERSION}}
    container_name: {{APP_NAME}}_iredmail
    restart: unless-stopped
    ports:
      - "{{IREDMAIL_PORT}}:80"
      - "{{IREDMAIL_HTTPS_PORT}}:443"
      - "{{IREDMAIL_SMTP_PORT}}:25"
      - "{{IREDMAIL_SMTPS_PORT}}:465"
      - "{{IREDMAIL_SUBMISSION_PORT}}:587"
      - "{{IREDMAIL_IMAP_PORT}}:143"
      - "{{IREDMAIL_IMAPS_PORT}}:993"
    environment:
      HOSTNAME: {{PRIMARY_DOMAIN}}
      FIRST_MAIL_DOMAIN: {{PRIMARY_DOMAIN}}
      FIRST_MAIL_DOMAIN_ADMIN_PASSWORD: {{ADMIN_PASSWORD}}
    volumes:
      - iredmail_data:/var/vmail
      - iredmail_mysql:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  iredmail_data:
    driver: local
  iredmail_mysql:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

