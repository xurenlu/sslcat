id: shopware
name: Shopware
category: ecommerce
subcategory: shop
tags: [php, mysql, ecommerce, shop, shopware]
description: 德国开源电商平台，功能强大，适合欧洲市场。
icon: shopware
version: 1.0.0
author: SSLcat Team
website: https://www.shopware.com/
compose_file: docker-compose.yml

variables:
  - name: SHOPWARE_VERSION
    type: select
    title: Shopware 版本
    default: "latest"
    options: ["latest", "6.5", "6.4"]
    description: 选择 Shopware 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: SHOPWARE_PORT
    type: number
    title: Shopware 端口
    default: 8080
    min: 1024
    max: 65535
    description: Shopware Web 服务端口

services:
  - name: shopware
    type: web
    description: Shopware 电商平台服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: shopware_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_shopware"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_shopware"
    root_password:
      pattern: random
      length: 20
  shopware:
    app_secret:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/admin
  admin_email: admin@{{PRIMARY_DOMAIN}}

