version: '3.8'

services:
  speech-translator:
    image: speech-translator/server:{{SPEECH_TRANSLATOR_VERSION}}
    container_name: {{APP_NAME}}_speech_translator
    restart: unless-stopped
    ports:
      - "{{SPEECH_TRANSLATOR_PORT}}:8080"
    environment:
      DEFAULT_SRC_LANG: {{DEFAULT_SRC_LANG}}
      DEFAULT_TGT_LANG: {{DEFAULT_TGT_LANG}}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - speech_translator_data:/app/data
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  speech_translator_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

