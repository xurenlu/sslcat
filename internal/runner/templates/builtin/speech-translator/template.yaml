id: speech-translator
name: Speech Translator (语音翻译)
category: ai
subcategory: speech-translation
tags:
  - python
  - ai
  - speech
  - translation
  - real-time
  - gpu
description: "[不可用] 镜像不存在 - 实时语音翻译服务，支持语音识别、翻译和语音合成。"
icon: speech-translator
version: 1.0.0
author: SSLcat Team
website: https://github.com/speech-translator
compose_file: docker-compose.yml

variables:
  - name: SPEECH_TRANSLATOR_VERSION
    type: select
    title: Speech Translator 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Speech Translator 版本
  - name: SPEECH_TRANSLATOR_PORT
    type: number
    title: Speech Translator 端口
    default: 8080
    min: 1024
    max: 65535
    description: Speech Translator API 服务端口
  - name: DEFAULT_SRC_LANG
    type: string
    title: 默认源语言
    default: "zh"
    description: 默认源语言代码（如：zh, en, ja）
    placeholder: "zh"
  - name: DEFAULT_TGT_LANG
    type: string
    title: 默认目标语言
    default: "en"
    description: 默认目标语言代码（如：en, ja, ko）
    placeholder: "en"

services:
  - name: speech-translator
    type: api
    description: Speech Translator 语音翻译服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: speech_translator_data
        path: /app/data
        mode: rw
    resources:
      gpu: optional
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/translate"
  features: "实时翻译,语音识别,语音合成,多语言"

