
services:
  espocrm:
    image: espocrm/espocrm:{{ESPCRM_VERSION}}
    container_name: {{APP_NAME}}_espocrm
    restart: unless-stopped
    ports:
      - "{{ESPCRM_PORT}}:80"
    environment:
      ESPOCRM_DATABASE_HOST: mysql
      ESPOCRM_DATABASE_NAME: "{{MYSQL_DATABASE}}"
      ESPOCRM_DATABASE_USER: "{{MYSQL_USERNAME}}"
      ESPOCRM_DATABASE_PASSWORD: "{{MYSQL_PASSWORD}}"
    volumes:
      - espocrm_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{MYSQL_ROOT_PASSWORD}}"
      MYSQL_DATABASE: "{{MYSQL_DATABASE}}"
      MYSQL_USER: "{{MYSQL_USERNAME}}"
      MYSQL_PASSWORD: "{{MYSQL_PASSWORD}}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

volumes:
  espocrm_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

