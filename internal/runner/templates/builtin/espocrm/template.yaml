id: espocrm
name: EspoCRM
category: crm
subcategory: crm
tags: [php, mysql, crm, sales, espocrm]
description: 现代化的开源 CRM 系统，界面美观，功能完整。
icon: espocrm
version: 1.0.0
author: SSLcat Team
website: https://www.espocrm.com/
compose_file: docker-compose.yml

variables:
  - name: ESPCRM_VERSION
    type: select
    title: EspoCRM 版本
    default: "latest"
    options: ["latest", "8.0", "7.5"]
    description: 选择 EspoCRM 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: ESPCRM_PORT
    type: number
    title: EspoCRM 端口
    default: 80
    min: 1024
    max: 65535
    description: EspoCRM Web 服务端口

services:
  - name: espocrm
    type: web
    description: EspoCRM 系统服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: espocrm_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_espocrm"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_espocrm"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

