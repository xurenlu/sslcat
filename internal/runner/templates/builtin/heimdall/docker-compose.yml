version: '3.8'

services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:{{HEIMDALL_VERSION}}
    container_name: {{APP_NAME}}_heimdall
    restart: unless-stopped
    ports:
      - "{{HEIMDALL_PORT}}:80"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
    volumes:
      - heimdall_data:/config
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  heimdall_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

