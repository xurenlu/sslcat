
services:
  pleroma:
    image: pleroma/pleroma:{{PLEROMA_VERSION}}
    container_name: {{APP_NAME}}_pleroma
    restart: unless-stopped
    ports:
      - "{{PLEROMA_PORT}}:4000"
    environment:
      POSTGRES_DBNAME: {{POSTGRES_DATABASE}}
      POSTGRES_USERNAME: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
      POSTGRES_HOST: postgres
      SECRET_KEY_BASE: {{PLEROMA_SECRET_KEY}}
      INSTANCE_NAME: {{PLEROMA_INSTANCE_NAME}}
      INSTANCE_EMAIL: {{PLEROMA_INSTANCE_EMAIL}}
    volumes:
      - pleroma_data:/var/lib/pleroma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/instance"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pleroma_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

