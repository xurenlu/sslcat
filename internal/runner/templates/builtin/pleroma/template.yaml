id: pleroma
name: Pleroma (Twitter替代)
category: tools
subcategory: social
tags: [elixir, postgres, social, pleroma, mastodon-alternative, twitter-alternative]
description: 轻量级的联邦社交网络服务器，Mastodon 的替代品，支持 ActivityPub 协议，资源占用更少。
icon: pleroma
version: 1.0.0
author: SSLcat Team
website: https://pleroma.social/
compose_file: docker-compose.yml

variables:
  - name: PLEROMA_VERSION
    type: select
    title: Pleroma 版本
    default: "latest"
    options: ["latest", "2.5", "2.4"]
    description: 选择 Pleroma 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: PLEROMA_PORT
    type: number
    title: Pleroma 端口
    default: 4000
    min: 1024
    max: 65535
    description: Pleroma Web 服务端口
  - name: PLEROMA_INSTANCE_NAME
    type: string
    title: 实例名称
    default: "{{PRIMARY_DOMAIN}}"
    description: Pleroma 实例名称
    placeholder: "My Pleroma Instance"
  - name: PLEROMA_INSTANCE_EMAIL
    type: string
    title: 实例邮箱
    default: "admin@{{PRIMARY_DOMAIN}}"
    description: Pleroma 实例管理员邮箱
    placeholder: "admin@example.com"

services:
  - name: pleroma
    type: web
    description: Pleroma 社交网络服务
    depends_on: [postgres]
    ports:
      - internal: 4000
        external: null
        public: true
    volumes:
      - name: pleroma_data
        path: /var/lib/pleroma
        mode: rw
    healthcheck:
      type: http
      path: /api/v1/instance
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_pleroma"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_pleroma"
  pleroma:
    secret_key_base:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: "http://{{PRIMARY_DOMAIN}}:4000"
  admin_email: "{{PLEROMA_INSTANCE_EMAIL}}"
  features: "联邦社交网络,ActivityPub协议,轻量级,Twitter替代"

