
services:
  syncthing:
    image: syncthing/syncthing:{{SYNCTHING_VERSION}}
    container_name: {{APP_NAME}}_syncthing
    restart: unless-stopped
    ports:
      - "{{SYNCTHING_PORT}}:8384"
      - "{{SYNCTHING_SYNC_PORT}}:22000"
      - "{{SYNCTHING_DISCOVERY_PORT}}:21027/udp"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
    volumes:
      - syncthing_data:/var/syncthing
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8384"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  syncthing_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

