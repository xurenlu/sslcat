id: dormitory-management
name: 宿舍管理系统
category: tools
subcategory: hr
tags: [php, postgres, hr, dormitory, accommodation]
description: 企业宿舍管理系统，支持宿舍分配、入住管理、退宿管理、费用结算等功能。
icon: dormitory-management
version: 1.0.0
author: SSLcat Team
website: https://github.com/dormitory-management
compose_file: docker-compose.yml

variables:
  - name: DORMITORY_VERSION
    type: select
    title: 宿舍管理系统版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择宿舍管理系统版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: DORMITORY_PORT
    type: number
    title: 宿舍管理系统端口
    default: 808080
    min: 1024
    max: 65535
    description: 宿舍管理系统 Web 服务端口

services:
  - name: dormitory
    type: web
    description: 宿舍管理系统服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: dormitory_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_dormitory"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_dormitory"
  dormitory:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "宿舍分配,入住管理,退宿管理,费用结算,房间管理"

