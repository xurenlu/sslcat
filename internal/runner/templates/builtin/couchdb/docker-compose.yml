
services:
  couchdb:
    image: couchdb:{{COUCHDB_VERSION}}
    container_name: {{APP_NAME}}_couchdb
    restart: unless-stopped
    ports:
      - "{{COUCHDB_PORT}}:5984"
    environment:
      COUCHDB_USER: {{COUCHDB_USERNAME}}
      COUCHDB_PASSWORD: {{COUCHDB_PASSWORD}}
      COUCHDB_SECRET: {{COUCHDB_SECRET}}
    volumes:
      - couchdb_data:/opt/couchdb/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  couchdb_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

