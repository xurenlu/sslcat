
services:
  harbor-core:
    image: goharbor/harbor-core:v2.10.0
    container_name: {{APP_NAME}}_harbor_core
    restart: unless-stopped
    ports:
      - "{{HARBOR_PORT}}:8080"
    environment:
      CORE_SECRET: {{CORE_SECRET}}
      JOBSERVICE_SECRET: {{JOBSERVICE_SECRET}}
      EXT_ENDPOINT: http://{{PRIMARY_DOMAIN}}
      DATABASE_TYPE: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: {{POSTGRES_USERNAME}}
      DATABASE_PASSWORD: {{POSTGRES_PASSWORD}}
      DATABASE_DATABASE: {{POSTGRES_DATABASE}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - harbor_data:/var/lib/harbor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v2.0/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  harbor_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

