id: harbor
name: Harbor
category: devops
subcategory: registry
tags: [go, postgresql, redis, docker, registry, harbor]
description: 企业级 Docker 镜像仓库，支持镜像扫描、权限管理等功能。
icon: harbor
version: 1.0.0
author: SSLcat Team
website: https://goharbor.io/
compose_file: docker-compose.yml

variables:
  - name: HARBOR_VERSION
    type: select
    title: Harbor 版本
    default: "latest"
    options: ["latest", "v2.10", "v2.9"]
    description: 选择 Harbor 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: HARBOR_PORT
    type: number
    title: Harbor 端口
    default: 8080
    min: 1024
    max: 65535
    description: Harbor Web 服务端口

services:
  - name: harbor-core
    type: web
    description: Harbor 镜像仓库核心服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: harbor_data
        path: /var/lib/harbor
        mode: rw
    healthcheck:
      type: http
      path: /api/v2.0/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_harbor"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_harbor"
  harbor:
    core_secret:
      pattern: random
      length: 32
    jobservice_secret:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: "http://{{PRIMARY_DOMAIN}}"
  registry_url: "{{PRIMARY_DOMAIN}}"
  admin_email: "admin@{{PRIMARY_DOMAIN}}"
  default_admin_user: admin
  default_admin_password: Harbor12345

