id: planka
name: Planka (看板管理)
category: tools
subcategory: project-management
tags: [nodejs, postgres, project-management, planka, kanban, trello-alternative]
description: Trello 的开源替代品，看板式项目管理工具，支持卡片、列表、标签等功能。
icon: planka
version: 1.0.0
author: SSLcat Team
website: https://planka.app/
compose_file: docker-compose.yml

variables:
  - name: PLANKA_VERSION
    type: select
    title: Planka 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Planka 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: PLANKA_PORT
    type: number
    title: Planka 端口
    default: 3000
    min: 1024
    max: 65535
    description: Planka Web 服务端口

services:
  - name: planka
    type: web
    description: Planka 看板管理服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: planka_data
        path: /app/public/attachments
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_planka"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_planka"
  planka:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "看板管理,卡片管理,列表管理,标签功能"
