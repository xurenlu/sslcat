id: planka
name: Planka (看板任务管理)
category: tools
subcategory: todo
tags: [todo, kanban, task-management, planka, trello-alternative]
description: 开源的看板任务管理工具，类似 Trello，支持卡片、列表、看板等功能，界面美观。
icon: planka
version: 1.0.0
author: SSLcat Team
website: https://planka.app/
compose_file: docker-compose.yml

variables:
  - name: PLANKA_VERSION
    type: select
    title: Planka 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Planka 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: PLANKA_PORT
    type: number
    title: Planka 端口
    default: 1337
    min: 1024
    max: 65535
    description: Planka Web 服务端口

services:
  - name: planka-web
    type: web
    description: Planka Web 服务
    depends_on: [postgres, redis]
    ports:
      - internal: 1337
        external: null
        public: true
    volumes:
      - name: planka_data
        path: /app/public/attachments
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: planka-worker
    type: worker
    description: Planka 后台任务处理服务
    depends_on: [planka-web]

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_planka"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_planka"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "看板管理,卡片管理,列表管理,项目协作,附件上传,评论功能,标签系统"

