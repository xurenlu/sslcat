id: tandoor
name: Tandoor Recipes
category: collaboration
subcategory: recipe
tags: [python, postgresql, redis, recipe, cooking, tandoor]
description: 开源食谱管理应用，支持导入、分享和管理食谱。
icon: tandoor
version: 1.0.0
author: SSLcat Team
website: https://tandoor.dev/
compose_file: docker-compose.yml

variables:
  - name: TANDOOR_VERSION
    type: select
    title: Tandoor 版本
    default: "latest"
    options: ["latest", "1.6", "1.5"]
    description: 选择 Tandoor 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: TANDOOR_PORT
    type: number
    title: Tandoor 端口
    default: 808080
    min: 1024
    max: 65535
    description: Tandoor Web 服务端口

services:
  - name: tandoor
    type: web
    description: Tandoor 食谱管理服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: tandoor_data
        path: /app/mediafiles
        mode: rw
      - name: tandoor_static
        path: /app/staticfiles
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_tandoor"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_tandoor"
  tandoor:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

