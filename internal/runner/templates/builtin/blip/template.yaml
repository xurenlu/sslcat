id: blip
name: BLIP (图片理解)
category: ai
subcategory: image-analysis
tags: [python, ai, image-analysis, blip, vision-language, gpu]
description: Salesforce 开源的视觉语言模型，支持图片描述、问答和检索，需要 GPU。
icon: blip
version: 1.0.0
author: SSLcat Team
website: https://github.com/salesforce/BLIP
compose_file: docker-compose.yml

variables:
  - name: BLIP_VERSION
    type: select
    title: BLIP 版本
    default: "latest"
    options: ["latest", "v2.0", "v1.0"]
    description: 选择 BLIP 版本
  - name: BLIP_PORT
    type: number
    title: BLIP 端口
    default: 8080
    min: 1024
    max: 65535
    description: BLIP API 服务端口

services:
  - name: blip
    type: api
    description: BLIP 图片理解服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: blip_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/caption"
  features: "图片描述,图片问答,视觉检索,多模态理解"
  gpu_required: true

