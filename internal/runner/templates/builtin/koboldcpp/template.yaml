id: koboldcpp
name: KoboldCpp (本地LLM API)
category: ai
subcategory: llm
tags: [cpp, ai, llm, koboldcpp, local-llm, gpu]
description: 高性能本地 LLM API 服务器，兼容 OpenAI API，支持多种模型，推荐 GPU。
icon: koboldcpp
version: 1.0.0
author: SSLcat Team
website: https://github.com/LostRuins/koboldcpp
compose_file: docker-compose.yml

variables:
  - name: KOBOLDCPP_VERSION
    type: select
    title: KoboldCpp 版本
    default: "latest"
    options: ["latest", "v1.60", "v1.59"]
    description: 选择 KoboldCpp 版本
  - name: KOBOLDCPP_PORT
    type: number
    title: KoboldCpp 端口
    default: 5001
    min: 1024
    max: 65535
    description: KoboldCpp API 服务端口

services:
  - name: koboldcpp
    type: api
    description: KoboldCpp 本地 LLM API 服务
    ports:
      - internal: 5001
        external: null
        public: true
    volumes:
      - name: koboldcpp_data
        path: /app/models
        mode: rw
    resources:
      gpu: optional
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/v1"
  openai_compatible: true
  features: "本地LLM,OpenAI兼容,高性能,隐私保护"
  gpu_recommended: true

