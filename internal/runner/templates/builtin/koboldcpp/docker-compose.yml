version: '3.8'

services:
  koboldcpp:
    image: koboldcpp/koboldcpp:{{KOBOLDCPP_VERSION}}
    container_name: {{APP_NAME}}_koboldcpp
    restart: unless-stopped
    ports:
      - "{{KOBOLDCPP_PORT}}:5001"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - koboldcpp_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  koboldcpp_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

