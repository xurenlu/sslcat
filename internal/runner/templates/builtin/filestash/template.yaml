id: filestash
name: Filestash
category: tools
subcategory: file-management
tags: [go, file-management, filestash]
description: 现代化的文件管理器，支持多种存储后端，界面美观。
icon: filestash
version: 1.0.0
author: SSLcat Team
website: https://www.filestash.app/
compose_file: docker-compose.yml

variables:
  - name: FILESTASH_VERSION
    type: select
    title: Filestash 版本
    default: "latest"
    options: ["latest", "0.54", "0.53"]
    description: 选择 Filestash 版本
  - name: FILESTASH_PORT
    type: number
    title: Filestash 端口
    default: 8334
    min: 1024
    max: 65535
    description: Filestash Web 服务端口

services:
  - name: filestash
    type: web
    description: Filestash 文件管理服务
    ports:
      - internal: 8334
        external: null
        public: true
    volumes:
      - name: filestash_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

