version: '3.8'

services:
  redmine:
    image: redmine:{{REDMINE_VERSION}}
    container_name: {{APP_NAME}}_redmine
    restart: unless-stopped
    ports:
      - "{{REDMINE_PORT}}:3000"
    environment:
      REDMINE_DB_MYSQL: mysql
      REDMINE_DB_DATABASE: {{MYSQL_DATABASE}}
      REDMINE_DB_USERNAME: {{MYSQL_USERNAME}}
      REDMINE_DB_PASSWORD: {{MYSQL_PASSWORD}}
      REDMINE_SECRET_KEY_BASE: {{SECRET_KEY_BASE}}
      REDMINE_PLUGINS_MIGRATE: "true"
    volumes:
      - redmine_data:/usr/src/redmine/files
      - redmine_plugins:/usr/src/redmine/plugins
      - redmine_themes:/usr/src/redmine/public/themes
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

volumes:
  redmine_data:
    driver: local
  redmine_plugins:
    driver: local
  redmine_themes:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

