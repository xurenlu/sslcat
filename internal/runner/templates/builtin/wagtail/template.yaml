id: wagtail
name: Wagtail
category: cms
subcategory: enterprise
tags: [python, postgresql, cms, django, wagtail]
description: 基于 Django 的企业级 CMS，适合构建复杂的内容管理系统。
icon: wagtail
version: 1.0.0
author: SSLcat Team
website: https://wagtail.org/
compose_file: docker-compose.yml

variables:
  - name: WAGTAIL_VERSION
    type: select
    title: Wagtail 版本
    default: "latest"
    options: ["latest", "5.2", "5.1"]
    description: 选择 Wagtail 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: WAGTAIL_PORT
    type: number
    title: Wagtail 端口
    default: 8000
    min: 1024
    max: 65535
    description: Wagtail Web 服务端口

services:
  - name: wagtail
    type: web
    description: Wagtail CMS 服务
    depends_on: [postgres]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: wagtail_data
        path: /app/media
        mode: rw
      - name: wagtail_static
        path: /app/static
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_wagtail"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_wagtail"
  wagtail:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_url: http://{{PRIMARY_DOMAIN}}/admin

