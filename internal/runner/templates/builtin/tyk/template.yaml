id: tyk
name: Tyk (API网关)
category: tools
subcategory: api-gateway
tags: [go, mongodb, redis, api-gateway, tyk, microservices]
description: 开源 API 网关和 API 管理平台，支持限流、认证、监控等功能。
icon: tyk
version: 1.0.0
author: SSLcat Team
website: https://tyk.io/
compose_file: docker-compose.yml

variables:
  - name: TYK_VERSION
    type: select
    title: Tyk 版本
    default: "latest"
    options: ["latest", "v5.3", "v5.2"]
    description: 选择 Tyk 版本
  - name: MONGODB_VERSION
    type: select
    title: MongoDB 版本
    default: "7"
    options: ["7", "6", "5"]
    description: 选择 MongoDB 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: TYK_PORT
    type: number
    title: Tyk Gateway 端口
    default: 808080
    min: 1024
    max: 65535
    description: Tyk API Gateway 端口

services:
  - name: tyk-gateway
    type: api
    description: Tyk API Gateway 服务
    depends_on: [redis, mongo]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: tyk_data
        path: /opt/tyk-gateway
        mode: rw
    healthcheck:
      type: http
      path: /hello
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  - name: mongo
    type: database
    description: MongoDB 数据库服务
    ports:
      - internal: 27017
        external: null
        public: false
    volumes:
      - name: mongo_data
        path: /data/db
        mode: rw
    healthcheck:
      type: command
      command: ["mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mongo:
    username:
      pattern: "{app_name}_tyk"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_tyk"
  redis:
    password:
      pattern: random
      length: 16
  tyk:
    secret:
      pattern: random
      length: 32

connection_strings:
  mongo: "mongodb://{username}:{password}@mongo:27017/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "API网关,限流控制,认证授权,API监控"

