
services:
  tyk-gateway:
    image: tykio/tyk-gateway:{{TYK_VERSION}}
    container_name: {{APP_NAME}}_tyk_gateway
    restart: unless-stopped
    ports:
      - "{{TYK_PORT}}:8080"
    environment:
      TYK_GW_SECRET: {{TYK_SECRET}}
      TYK_GW_STORAGE_HOST: redis
      TYK_GW_STORAGE_PORT: 6379
      TYK_GW_STORAGE_PASSWORD: {{REDIS_PASSWORD}}
      TYK_GW_DBAPPCONFOPTIONS_CONNECTIONSTRING: mongodb://{{MONGODB_USERNAME}}:{{MONGODB_PASSWORD}}@mongo:27017/{{MONGODB_DATABASE}}
    volumes:
      - tyk_data:/opt/tyk-gateway
    depends_on:
      - redis
      - mongo
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    command: redis-server --requirepass {{REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:{{MONGODB_VERSION}}
    container_name: {{APP_NAME}}_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: {{MONGODB_USERNAME}}
      MONGO_INITDB_ROOT_PASSWORD: {{MONGODB_PASSWORD}}
      MONGO_INITDB_DATABASE: {{MONGODB_DATABASE}}
    volumes:
      - mongo_data:/data/db
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  tyk_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

