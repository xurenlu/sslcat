
services:
  pdf-tools:
    image: pdf-tools/server:{{PDF_TOOLS_VERSION}}
    container_name: {{APP_NAME}}_pdf_tools
    restart: unless-stopped
    ports:
      - "{{PDF_TOOLS_PORT}}:8080"
    environment:
      PDF_TOOLS_MAX_FILE_SIZE: {{MAX_FILE_SIZE}}
    volumes:
      - pdf_tools_data:/app/temp
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pdf_tools_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

