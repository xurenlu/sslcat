version: '3.8'

services:
  stoplight:
    image: stoplight/prism:{{STOPLIGHT_VERSION}}
    container_name: {{APP_NAME}}_stoplight
    restart: unless-stopped
    ports:
      - "{{STOPLIGHT_PORT}}:4010"
    environment:
      SPEC_URL: {{STOPLIGHT_SPEC_URL}}
    volumes:
      - stoplight_data:/app/specs
    networks:
      - {{APP_NAME}}_network
    command: mock -h 0.0.0.0 -p 4010 {{STOPLIGHT_SPEC_URL}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4010"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  stoplight_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

