version: '3.8'

services:
  remove-bg:
    image: danielgatis/rembg:{{REMOVE_BG_VERSION}}
    container_name: {{APP_NAME}}_remove_bg
    restart: unless-stopped
    ports:
      - "{{REMOVE_BG_PORT}}:5000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - remove_bg_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  remove_bg_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

