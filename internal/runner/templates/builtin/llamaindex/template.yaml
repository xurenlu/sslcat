id: llamaindex
name: LlamaIndex (RAG框架)
category: ai
subcategory: framework
tags: [python, postgres, ai, framework, rag, llamaindex]
description: LlamaIndex RAG 应用开发框架，支持文档索引、向量搜索和问答系统。
icon: llamaindex
version: 1.0.0
author: SSLcat Team
website: https://github.com/run-llama/llama_index
compose_file: docker-compose.yml

variables:
  - name: LLAMAINDEX_VERSION
    type: select
    title: LlamaIndex 版本
    default: "latest"
    options: ["latest", "v0.9", "v0.8"]
    description: 选择 LlamaIndex 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: LLAMAINDEX_PORT
    type: number
    title: LlamaIndex 端口
    default: 8080
    min: 1024
    max: 65535
    description: LlamaIndex API 服务端口
  - name: OPENAI_API_KEY
    type: string
    title: OpenAI API Key
    default: ""
    description: OpenAI API 密钥（可选）
    sensitive: true

services:
  - name: llamaindex
    type: api
    description: LlamaIndex RAG 框架服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: llamaindex_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_llamaindex"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_llamaindex"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api"
  features: "文档索引,向量搜索,问答系统,RAG应用"

