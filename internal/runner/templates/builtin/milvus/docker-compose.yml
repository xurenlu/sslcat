version: '3.8'

services:
  milvus:
    image: milvusdb/milvus:{{MILVUS_VERSION}}
    container_name: {{APP_NAME}}_milvus
    restart: unless-stopped
    ports:
      - "{{MILVUS_PORT}}:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19530"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  etcd:
    image: quay.io/coreos/etcd:{{ETCD_VERSION}}
    container_name: {{APP_NAME}}_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_data:/etcd
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:{{MINIO_VERSION}}
    container_name: {{APP_NAME}}_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: {{MINIO_ROOT_USER}}
      MINIO_ROOT_PASSWORD: {{MINIO_ROOT_PASSWORD}}
    volumes:
      - minio_data:/data
    networks:
      - {{APP_NAME}}_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

volumes:
  milvus_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

