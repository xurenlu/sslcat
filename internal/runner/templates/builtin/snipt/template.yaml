id: snipt
name: Snipt (代码片段管理)
category: tools
subcategory: developer-tools
tags: [code-snippets, gist-alternative, developer-tools, snipt]
description: 自托管的代码片段管理工具，类似 Gist，支持代码高亮、标签分类、搜索等功能。
icon: snipt
version: 1.0.0
author: SSLcat Team
website: https://github.com/nicksergeant/snipt
compose_file: docker-compose.yml

variables:
  - name: SNIPT_VERSION
    type: select
    title: Snipt 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Snipt 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: SNIPT_PORT
    type: number
    title: Snipt 端口
    default: 8000
    min: 1024
    max: 65535
    description: Snipt Web 服务端口
  - name: SNIPT_SECRET_KEY
    type: string
    title: Snipt Secret Key
    default: ""
    description: Snipt 密钥（留空将自动生成）
    sensitive: true

services:
  - name: snipt
    type: web
    description: Snipt 代码片段管理服务
    depends_on: [postgres]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: snipt_data
        path: /app/media
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_snipt"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_snipt"
  snipt:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "代码片段管理,代码高亮,标签分类,搜索功能,公开/私有片段,多语言支持"

