id: influxdb
name: InfluxDB
category: database
subcategory: time-series
tags: [influxdb, database, time-series, metrics]
description: 时间序列数据库，专为监控和 IoT 数据设计，查询速度快。
icon: influxdb
version: 1.0.0
author: SSLcat Team
website: https://www.influxdata.com/
compose_file: docker-compose.yml

variables:
  - name: INFLUXDB_VERSION
    type: select
    title: InfluxDB 版本
    default: "latest"
    options: ["latest", "2.7", "2.6"]
    description: 选择 InfluxDB 版本
  - name: INFLUXDB_PORT
    type: number
    title: InfluxDB 端口
    default: 808086
    min: 1024
    max: 65535
    description: InfluxDB HTTP API 端口

services:
  - name: influxdb
    type: database
    description: InfluxDB 时间序列数据库服务
    ports:
      - internal: 8086
        external: null
        public: true
    volumes:
      - name: influxdb_data
        path: /var/lib/influxdb2
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  influxdb:
    username:
      pattern: "{app_name}_user"
    password:
      pattern: random
      length: 18
    org:
      pattern: "{app_name}_org"
    bucket:
      pattern: "{app_name}_bucket"
    token:
      pattern: random
      length: 32

connection_strings:
  influxdb: "http://{{PRIMARY_DOMAIN}}:{{INFLUXDB_PORT}}"

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  api_url: "http://{{PRIMARY_DOMAIN}}:{{INFLUXDB_PORT}}"
  org: "{{INFLUXDB_ORG}}"
  bucket: "{{INFLUXDB_BUCKET}}"

