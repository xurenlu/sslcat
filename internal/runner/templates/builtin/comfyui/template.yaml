id: comfyui
name: ComfyUI
category: ai
subcategory: image-generation
tags: [python, ai, image-generation, comfyui, workflow, gpu]
description: 节点式 AI 图片生成工具，支持复杂工作流和自定义节点。
icon: comfyui
version: 1.0.0
author: SSLcat Team
website: https://github.com/comfyanonymous/ComfyUI
compose_file: docker-compose.yml

variables:
  - name: COMFYUI_VERSION
    type: select
    title: ComfyUI 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 ComfyUI 版本
  - name: COMFYUI_PORT
    type: number
    title: ComfyUI 端口
    default: 8188
    min: 1024
    max: 65535
    description: ComfyUI Web 服务端口

services:
  - name: comfyui
    type: web
    description: ComfyUI AI 图片生成服务
    ports:
      - internal: 8188
        external: null
        public: true
    volumes:
      - name: comfyui_data
        path: /app/models
        mode: rw
      - name: comfyui_output
        path: /app/output
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  gpu_required: true
  features: "节点式工作流,自定义节点,批量生成"

