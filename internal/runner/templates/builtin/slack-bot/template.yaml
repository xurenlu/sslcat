id: slack-bot
name: Slack机器人
category: tools
subcategory: integration
tags: [nodejs, postgres, slack, bot, integration]
description: Slack 机器人服务，支持消息推送、Slash命令、交互式消息、Webhook 等功能。
icon: slack-bot
version: 1.0.0
author: SSLcat Team
website: https://api.slack.com/
compose_file: docker-compose.yml

variables:
  - name: SLACK_BOT_VERSION
    type: select
    title: Slack机器人版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Slack机器人版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: SLACK_BOT_PORT
    type: number
    title: Slack机器人端口
    default: 808080
    min: 1024
    max: 65535
    description: Slack机器人 Web 服务端口
  - name: SLACK_BOT_TOKEN
    type: string
    title: Bot Token
    default: ""
    description: Slack Bot Token（xoxb-开头）
    required: true
    sensitive: true
    placeholder: "xoxb-xxxxxxxxxxxx"
  - name: SLACK_SIGNING_SECRET
    type: string
    title: Signing Secret
    default: ""
    description: Slack Signing Secret
    required: true
    sensitive: true

services:
  - name: slack-bot
    type: web
    description: Slack机器人服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: slack_bot_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_slack"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_slack"
  slack-bot:
    secret_key:
      pattern: random
      length: 32
    bot_token:
      pattern: "{SLACK_BOT_TOKEN}"
    signing_secret:
      pattern: "{SLACK_SIGNING_SECRET}"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "消息推送,Slash命令,交互式消息,Webhook,消息模板"

