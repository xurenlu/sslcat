id: apache-superset
name: Apache Superset (商业智能)
category: tools
subcategory: analytics
tags: [python, postgres, redis, analytics, bi, business-intelligence]
description: 现代化的商业智能（BI）平台，支持数据可视化、SQL查询、报表生成、数据探索等功能。
icon: apache-superset
version: 1.0.0
author: SSLcat Team
website: https://superset.apache.org/
compose_file: docker-compose.yml

variables:
  - name: SUPERSET_VERSION
    type: select
    title: Apache Superset 版本
    default: "latest"
    options: ["latest", "3.0", "2.1"]
    description: 选择 Apache Superset 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: SUPERSET_PORT
    type: number
    title: Apache Superset 端口
    default: 808088
    min: 1024
    max: 65535
    description: Apache Superset Web 服务端口

services:
  - name: superset
    type: web
    description: Apache Superset 商业智能服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8088
        external: null
        public: true
    volumes:
      - name: superset_data
        path: /app/superset_home
        mode: rw
    healthcheck:
      type: http
      path: /health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_superset"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_superset"
  redis:
    password:
      pattern: random
      length: 16
  superset:
    secret_key:
      pattern: random
      length: 64

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8088
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin
  features: "数据可视化,SQL查询,报表生成,数据探索,仪表板"

