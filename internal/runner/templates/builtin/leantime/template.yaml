id: leantime
name: Leantime
category: project-management
subcategory: project-management
tags: [php, mysql, project-management, leantime]
description: 开源项目管理和协作工具，支持看板、时间跟踪和报告。
icon: leantime
version: 1.0.0
author: SSLcat Team
website: https://leantime.io/
compose_file: docker-compose.yml

variables:
  - name: LEANTIME_VERSION
    type: select
    title: Leantime 版本
    default: "latest"
    options: ["latest", "2.4", "2.3"]
    description: 选择 Leantime 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: LEANTIME_PORT
    type: number
    title: Leantime 端口
    default: 80
    min: 1024
    max: 65535
    description: Leantime Web 服务端口

services:
  - name: leantime
    type: web
    description: Leantime 项目管理服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: leantime_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_leantime"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_leantime"
    root_password:
      pattern: random
      length: 20
  leantime:
    session_password:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

