
services:
  mathpix:
    image: mathpix/mathpix-api:{{MATHPIX_VERSION}}
    container_name: {{APP_NAME}}_mathpix
    restart: unless-stopped
    ports:
      - "{{MATHPIX_PORT}}:8080"
    environment:
      MATHPIX_APP_ID: "{{MATHPIX_APP_ID}}"
      MATHPIX_APP_KEY: "{{MATHPIX_APP_KEY}}"
    volumes:
      - mathpix_data:/app/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mathpix_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

