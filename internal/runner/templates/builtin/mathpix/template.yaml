id: mathpix
name: Mathpix
category: tools
subcategory: formula-recognition
tags: [formula-recognition, mathpix, ocr]
description: 数学公式识别服务，支持 LaTeX 输出，适合学术和教育场景。
icon: mathpix
version: 1.0.0
author: SSLcat Team
website: https://mathpix.com/
compose_file: docker-compose.yml

variables:
  - name: MATHPIX_VERSION
    type: select
    title: Mathpix 版本
    default: "latest"
    options: ["latest", "v2", "v1"]
    description: 选择 Mathpix 版本
  - name: MATHPIX_PORT
    type: number
    title: Mathpix 端口
    default: 8080
    min: 1024
    max: 65535
    description: Mathpix API 服务端口
  - name: MATHPIX_APP_ID
    type: string
    title: Mathpix App ID
    default: ""
    description: Mathpix API App ID（需要注册获取）
    required: true
  - name: MATHPIX_APP_KEY
    type: string
    title: Mathpix App Key
    default: ""
    description: Mathpix API App Key（需要注册获取）
    required: true
    sensitive: true

services:
  - name: mathpix
    type: web
    description: Mathpix 公式识别服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: mathpix_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_docs: https://docs.mathpix.com/

