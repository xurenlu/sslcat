id: paperless-ngx
name: Paperless NGX
category: collaboration
subcategory: document-management
tags: [python, postgresql, redis, document, management, paperless]
description: 无纸化文档管理系统，支持 OCR 和智能分类，适合个人和团队使用。
icon: paperless-ngx
version: 1.0.0
author: SSLcat Team
website: https://paperless-ngx.readthedocs.io/
compose_file: docker-compose.yml

variables:
  - name: PAPERLESS_VERSION
    type: select
    title: Paperless NGX 版本
    default: "latest"
    options: ["latest", "2.9", "2.8"]
    description: 选择 Paperless NGX 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: PAPERLESS_PORT
    type: number
    title: Paperless NGX 端口
    default: 8000
    min: 1024
    max: 65535
    description: Paperless NGX Web 服务端口

services:
  - name: paperless-ngx
    type: web
    description: Paperless NGX 文档管理服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: paperless_data
        path: /usr/src/paperless/data
        mode: rw
      - name: paperless_media
        path: /usr/src/paperless/media
        mode: rw
      - name: paperless_export
        path: /usr/src/paperless/export
        mode: rw
      - name: paperless_consume
        path: /usr/src/paperless/consume
        mode: rw
    healthcheck:
      type: http
      path: /api/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_paperless"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_paperless"
  paperless:
    secret_key:
      pattern: random
      length: 50

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

