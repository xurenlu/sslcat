id: paperless-ngx
name: Paperless-ngx (无纸化办公)
category: tools
subcategory: document-management
tags: [python, postgres, redis, document-management, ocr, paperless]
description: 无纸化办公系统，自动 OCR 识别、分类和搜索文档，支持 PDF、图片等多种格式。
icon: paperless-ngx
version: 1.0.0
author: SSLcat Team
website: https://github.com/paperless-ngx/paperless-ngx
compose_file: docker-compose.yml

variables:
  - name: PAPERLESS_NGX_VERSION
    type: select
    title: Paperless-ngx 版本
    default: "latest"
    options: ["latest", "2.0", "1.10"]
    description: 选择 Paperless-ngx 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: PAPERLESS_NGX_PORT
    type: number
    title: Paperless-ngx 端口
    default: 808000
    min: 1024
    max: 65535
    description: Paperless-ngx Web 服务端口

services:
  - name: paperless-ngx
    type: web
    description: Paperless-ngx 无纸化办公服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: paperless_ngx_data
        path: /usr/src/paperless/data
        mode: rw
      - name: paperless_ngx_media
        path: /usr/src/paperless/media
        mode: rw
      - name: paperless_ngx_export
        path: /usr/src/paperless/export
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_paperless"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_paperless"
  redis:
    password:
      pattern: random
      length: 16
  paperless-ngx:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin
  features: "OCR识别,文档分类,全文搜索,标签管理"
