id: wekan
name: Wekan
category: project-management
subcategory: kanban
tags: [nodejs, mongodb, kanban, wekan, trello-alternative]
description: 开源看板工具，类似 Trello，支持多用户协作。
icon: wekan
version: 1.0.0
author: SSLcat Team
website: https://wekan.github.io/
compose_file: docker-compose.yml

variables:
  - name: WEKAN_VERSION
    type: select
    title: Wekan 版本
    default: "latest"
    options: ["latest", "7.0", "6.0"]
    description: 选择 Wekan 版本
  - name: MONGO_VERSION
    type: select
    title: MongoDB 版本
    default: "7"
    options: ["7", "6", "5"]
    description: 选择 MongoDB 版本
  - name: WEKAN_PORT
    type: number
    title: Wekan 端口
    default: 808080
    min: 1024
    max: 65535
    description: Wekan Web 服务端口

services:
  - name: wekan
    type: web
    description: Wekan 看板服务
    depends_on: [mongo]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: wekan_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  - name: mongo
    type: database
    description: MongoDB 数据库服务
    ports:
      - internal: 27017
        external: null
        public: false
    volumes:
      - name: mongo_data
        path: /data/db
        mode: rw
    healthcheck:
      type: command
      command: ["mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mongo:
    username:
      pattern: "{app_name}_wekan"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_wekan"

connection_strings:
  mongo: "mongodb://{username}:{password}@mongo:27017/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin
