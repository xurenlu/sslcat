
services:
  wekan:
    image: wekanteam/wekan:{{WEKAN_VERSION}}
    container_name: {{APP_NAME}}_wekan
    restart: unless-stopped
    ports:
      - "{{WEKAN_PORT}}:8080"
    environment:
      ROOT_URL: "http://{{PRIMARY_DOMAIN}}"
      MONGO_URL: "mongodb://{{MONGO_USERNAME}}:{{MONGO_PASSWORD}}@mongo:27017/{{MONGO_DATABASE}}"
    volumes:
      - wekan_data:/data
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mongo:
    image: mongo:{{MONGO_VERSION}}
    container_name: {{APP_NAME}}_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "{{MONGO_USERNAME}}"
      MONGO_INITDB_ROOT_PASSWORD: "{{MONGO_PASSWORD}}"
      MONGO_INITDB_DATABASE: "{{MONGO_DATABASE}}"
    volumes:
      - mongo_data:/data/db
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  wekan_data:
    driver: local
  mongo_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
