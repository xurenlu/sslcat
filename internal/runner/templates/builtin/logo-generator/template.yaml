id: logo-generator
name: Logo Generator (Logo生成)
category: ai
subcategory: design
tags: [nodejs, postgres, ai, design, logo-generation]
description: AI Logo 生成工具，从文本描述生成专业 Logo 设计。
icon: logo-generator
version: 1.0.0
author: SSLcat Team
website: https://github.com/logo-generator
compose_file: docker-compose.yml

variables:
  - name: LOGO_GENERATOR_VERSION
    type: select
    title: Logo Generator 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 Logo Generator 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: LOGO_GENERATOR_PORT
    type: number
    title: Logo Generator 端口
    default: 808080
    min: 1024
    max: 65535
    description: Logo Generator Web 服务端口
  - name: OPENAI_API_KEY
    type: string
    title: OpenAI API Key
    default: ""
    description: OpenAI API 密钥（可选）
    sensitive: true

services:
  - name: logo-generator
    type: web
    description: Logo Generator Logo 生成服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: logo_generator_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_logo"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_logo"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Logo生成,多种风格,矢量输出,PNG/SVG导出"

