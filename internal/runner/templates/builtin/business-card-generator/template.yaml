id: business-card-generator
name: 商务名片生成器
category: tools
subcategory: design
tags: [nodejs, postgres, redis, design, business-card, namecard, vcard]
description: 专业的商务名片在线生成工具，支持自定义设计、多种模板、二维码集成、导出PDF/PNG、批量生成等功能。
icon: business-card-generator
version: 1.0.0
author: SSLcat Team
website: https://github.com/business-card-generator
compose_file: docker-compose.yml

variables:
  - name: BUSINESS_CARD_VERSION
    type: select
    title: 商务名片生成器版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择商务名片生成器版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: BUSINESS_CARD_PORT
    type: number
    title: 商务名片生成器端口
    default: 808080
    min: 1024
    max: 65535
    description: 商务名片生成器 Web 服务端口
  - name: QR_CODE_ENABLED
    type: select
    title: 启用二维码功能
    default: "true"
    options: ["true", "false"]
    description: 是否启用二维码生成功能

services:
  - name: business-card-generator
    type: web
    description: 商务名片生成器服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: business_card_data
        path: /app/data
        mode: rw
      - name: business_card_templates
        path: /app/templates
        mode: rw
      - name: business_card_exports
        path: /app/exports
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_business_card"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_business_card"
  redis:
    password:
      pattern: random
      length: 16
  business-card-generator:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "在线设计,多种模板,二维码集成,PDF/PNG导出,批量生成,自定义样式,联系人信息管理"

