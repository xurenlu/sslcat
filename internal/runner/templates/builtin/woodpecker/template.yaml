id: woodpecker
name: Woodpecker CI
category: devops
subcategory: ci-cd
tags: [go, postgresql, ci-cd, automation, woodpecker]
description: Drone CI 的开源分支，轻量快速的 CI/CD 平台。
icon: woodpecker
version: 1.0.0
author: SSLcat Team
website: https://woodpecker-ci.org/
compose_file: docker-compose.yml

variables:
  - name: WOODPECKER_VERSION
    type: select
    title: Woodpecker 版本
    default: "latest"
    options: ["latest", "2.0", "1.0"]
    description: 选择 Woodpecker 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: WOODPECKER_PORT
    type: number
    title: Woodpecker 端口
    default: 808000
    min: 1024
    max: 65535
    description: Woodpecker Web 服务端口

services:
  - name: woodpecker-server
    type: web
    description: Woodpecker CI/CD 服务器
    depends_on: [postgres]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: woodpecker_data
        path: /var/lib/woodpecker
        mode: rw
    healthcheck:
      type: http
      path: /healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: woodpecker-agent
    type: worker
    description: Woodpecker CI/CD Agent
    depends_on: [woodpecker-server]
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
        mode: rw

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_woodpecker"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_woodpecker"
  woodpecker:
    agent_secret:
      pattern: random
      length: 32
    gitea_client_id:
      pattern: random
      length: 32
    gitea_client_secret:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

