version: '3.8'

services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:{{WOODPECKER_VERSION}}
    container_name: {{APP_NAME}}_woodpecker_server
    restart: unless-stopped
    ports:
      - "{{WOODPECKER_PORT}}:8000"
    environment:
      WOODPECKER_HOST: http://{{PRIMARY_DOMAIN}}
      WOODPECKER_GITEA_URL: http://{{PRIMARY_DOMAIN}}
      WOODPECKER_GITEA_CLIENT_ID: {{GITEA_CLIENT_ID}}
      WOODPECKER_GITEA_CLIENT_SECRET: {{GITEA_CLIENT_SECRET}}
      WOODPECKER_AGENT_SECRET: {{AGENT_SECRET}}
      WOODPECKER_DATABASE_DRIVER: postgres
      WOODPECKER_DATABASE_DATASOURCE: postgres://{{POSTGRES_USERNAME}}:{{POSTGRES_PASSWORD}}@postgres:5432/{{POSTGRES_DATABASE}}?sslmode=disable
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:{{WOODPECKER_VERSION}}
    container_name: {{APP_NAME}}_woodpecker_agent
    restart: unless-stopped
    environment:
      WOODPECKER_SERVER: http://woodpecker-server:8000
      WOODPECKER_AGENT_SECRET: {{AGENT_SECRET}}
      WOODPECKER_BACKEND: docker
      WOODPECKER_MAX_WORKFLOWS: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - woodpecker-server
    networks:
      - {{APP_NAME}}_network
    privileged: true

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  woodpecker_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

