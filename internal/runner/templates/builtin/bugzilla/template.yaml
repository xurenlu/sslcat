id: bugzilla
name: Bugzilla (Bug追踪)
category: tools
subcategory: bug-tracking
tags: [perl, mysql, bug-tracking, bugzilla, issue-tracking]
description: Mozilla 开源的 Bug 追踪系统，功能强大的缺陷管理和追踪工具。
icon: bugzilla
version: 1.0.0
author: SSLcat Team
website: https://www.bugzilla.org/
compose_file: docker-compose.yml

variables:
  - name: BUGZILLA_VERSION
    type: select
    title: Bugzilla 版本
    default: "latest"
    options: ["latest", "5.4", "5.3"]
    description: 选择 Bugzilla 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: BUGZILLA_PORT
    type: number
    title: Bugzilla 端口
    default: 808080
    min: 1024
    max: 65535
    description: Bugzilla Web 服务端口

services:
  - name: bugzilla
    type: web
    description: Bugzilla Bug追踪服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: bugzilla_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_bugzilla"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_bugzilla"
    root_password:
      pattern: random
      length: 18

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Bug追踪,缺陷管理,工作流,报告统计"
