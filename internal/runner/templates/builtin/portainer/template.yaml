id: portainer
name: Portainer
category: devops
subcategory: docker-management
tags: [go, docker, management, portainer]
description: Docker 容器管理平台，提供 Web UI 管理 Docker 容器和镜像。
icon: portainer
version: 1.0.0
author: SSLcat Team
website: https://www.portainer.io/
compose_file: docker-compose.yml

variables:
  - name: PORTAINER_VERSION
    type: select
    title: Portainer 版本
    default: "latest"
    options: ["latest", "2.20", "2.19"]
    description: 选择 Portainer 版本
  - name: PORTAINER_PORT
    type: number
    title: Portainer 端口
    default: 9000
    min: 1024
    max: 65535
    description: Portainer Web UI 端口

services:
  - name: portainer
    type: web
    description: Portainer Docker 管理服务
    ports:
      - internal: 9000
        external: null
        public: true
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
        mode: rw
      - name: portainer_data
        path: /data
        mode: rw
    healthcheck:
      type: http
      path: /api/system/status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: 首次登录时设置

