id: countly
name: Countly
category: analytics
subcategory: mobile-analytics
tags: [nodejs, mongodb, redis, analytics, mobile, countly]
description: 移动应用和网站分析平台，功能强大，支持实时分析。
icon: countly
version: 1.0.0
author: SSLcat Team
website: https://countly.com/
compose_file: docker-compose.yml

variables:
  - name: COUNTLY_VERSION
    type: select
    title: Countly 版本
    default: "latest"
    options: ["latest", "23.11", "23.10"]
    description: 选择 Countly 版本
  - name: MONGODB_VERSION
    type: select
    title: MongoDB 版本
    default: "latest"
    options: ["latest", "7.0", "6.0"]
    description: 选择 MongoDB 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "7-alpine"]
    description: 选择 Redis 版本
  - name: COUNTLY_PORT
    type: number
    title: Countly 端口
    default: 3001
    min: 1024
    max: 65535
    description: Countly Web 服务端口

services:
  - name: countly-api
    type: web
    description: Countly 分析平台服务
    depends_on: [mongodb, redis]
    ports:
      - internal: 3001
        external: null
        public: true
    volumes:
      - name: countly_data
        path: /var/lib/countly
        mode: rw
    healthcheck:
      type: http
      path: /o
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mongodb
    type: database
    description: MongoDB 数据库服务
    ports:
      - internal: 27017
        external: null
        public: false
    volumes:
      - name: mongodb_data
        path: /data/db
        mode: rw
      - name: mongodb_config
        path: /data/configdb
        mode: rw
    healthcheck:
      type: command
      command: ["mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  mongodb:
    root_username:
      pattern: "admin"
    root_password:
      pattern: random
      length: 18
    username:
      pattern: "{app_name}_countly"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_countly"

connection_strings:
  mongodb: "mongodb://{username}:{password}@mongodb:27017/{database}?authSource=admin"
  redis: "redis://redis:6379/0"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

