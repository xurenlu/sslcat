version: '3.8'

services:
  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    ports:
      - "{{REDIS_PORT}}:6379"
    command: redis-server --requirepass {{REDIS_PASSWORD}} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

