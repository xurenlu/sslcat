version: '3.8'

services:
  snipe-it:
    image: snipe/snipe-it:{{SNIPEIT_VERSION}}
    container_name: {{APP_NAME}}_snipe_it
    restart: unless-stopped
    ports:
      - "{{SNIPEIT_PORT}}:80"
    environment:
      DB_HOST: mysql
      DB_DATABASE: {{MYSQL_DATABASE}}
      DB_USERNAME: {{MYSQL_USERNAME}}
      DB_PASSWORD: {{MYSQL_PASSWORD}}
      APP_URL: http://{{PRIMARY_DOMAIN}}
      APP_ADMIN_EMAIL: {{SNIPEIT_ADMIN_EMAIL}}
      TZ: Asia/Shanghai
    volumes:
      - snipeit_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USERNAME}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
      MYSQL_ROOT_PASSWORD: {{MYSQL_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  snipeit_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

