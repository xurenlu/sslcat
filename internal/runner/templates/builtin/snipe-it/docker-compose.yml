
services:
  snipe-it:
    image: snipe/snipe-it:{{SNIPE_IT_VERSION}}
    container_name: {{APP_NAME}}_snipe_it
    restart: unless-stopped
    ports:
      - "{{SNIPE_IT_PORT}}:80"
    environment:
      DB_HOST: mysql
      DB_DATABASE: "{{MYSQL_DATABASE}}"
      DB_USERNAME: "{{MYSQL_USERNAME}}"
      DB_PASSWORD: "{{MYSQL_PASSWORD}}"
      APP_KEY: "{{SNIPE_IT_APP_KEY}}"
      APP_URL: "http://{{PRIMARY_DOMAIN}}"
    volumes:
      - snipe_it_data:/var/lib/snipeit
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "{{MYSQL_DATABASE}}"
      MYSQL_USER: "{{MYSQL_USERNAME}}"
      MYSQL_PASSWORD: "{{MYSQL_PASSWORD}}"
      MYSQL_ROOT_PASSWORD: "{{MYSQL_ROOT_PASSWORD}}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p{{MYSQL_ROOT_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  snipe_it_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
