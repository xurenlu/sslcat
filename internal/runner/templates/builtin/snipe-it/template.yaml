id: snipe-it
name: Snipe-IT (资产管理)
category: tools
subcategory: asset-management
tags: [php, mysql, asset-management, snipe-it, itam]
description: 开源 IT 资产管理系统，管理硬件、软件、许可证等 IT 资产，支持资产追踪和报告。
icon: snipe-it
version: 1.0.0
author: SSLcat Team
website: https://snipeitapp.com/
compose_file: docker-compose.yml

variables:
  - name: SNIPE_IT_VERSION
    type: select
    title: Snipe-IT 版本
    default: "latest"
    options: ["latest", "v6.0", "v5.4"]
    description: 选择 Snipe-IT 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "5.7", "8.1"]
    description: 选择 MySQL 版本
  - name: SNIPE_IT_PORT
    type: number
    title: Snipe-IT 端口
    default: 808080
    min: 1024
    max: 65535
    description: Snipe-IT Web 服务端口

services:
  - name: snipe-it
    type: web
    description: Snipe-IT 资产管理系统服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: snipe_it_data
        path: /var/lib/snipeit
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

credentials:
  mysql:
    username:
      pattern: "{app_name}_snipe"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_snipe"
    root_password:
      pattern: random
      length: 18
  snipe-it:
    app_key:
      pattern: random
      length: 32

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: password
  features: "资产管理,硬件追踪,软件管理,许可证管理"
