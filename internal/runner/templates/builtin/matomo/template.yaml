id: matomo
name: Matomo
category: analytics
subcategory: web-analytics
tags: [php, mysql, analytics, privacy, matomo]
description: 开源网站分析平台，功能强大，隐私友好，是 Google Analytics 的开源替代品。
icon: matomo
version: 1.0.0
author: SSLcat Team
website: https://matomo.org/
compose_file: docker-compose.yml

variables:
  - name: MATOMO_VERSION
    type: select
    title: Matomo 版本
    default: "latest"
    options: ["latest", "5.0", "4.15"]
    description: 选择 Matomo 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: MATOMO_PORT
    type: number
    title: Matomo 端口
    default: 80
    min: 1024
    max: 65535
    description: Matomo Web 服务端口

services:
  - name: matomo
    type: web
    description: Matomo 分析平台服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: matomo_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /index.php
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_matomo"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_matomo"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  install_url: http://{{PRIMARY_DOMAIN}}/index.php
  admin_email: admin@{{PRIMARY_DOMAIN}}

