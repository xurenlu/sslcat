id: tiddlywiki
name: TiddlyWiki (个人知识库)
category: tools
subcategory: note-taking
tags: [nodejs, note-taking, tiddlywiki, knowledge-base, non-linear]
description: 非线性个人知识库，单文件 Wiki，支持丰富的插件和扩展。
icon: tiddlywiki
version: 1.0.0
author: SSLcat Team
website: https://tiddlywiki.com/
compose_file: docker-compose.yml

variables:
  - name: TIDDLYWIKI_VERSION
    type: select
    title: TiddlyWiki 版本
    default: "latest"
    options: ["latest", "v5.3", "v5.2"]
    description: 选择 TiddlyWiki 版本
  - name: TIDDLYWIKI_PORT
    type: number
    title: TiddlyWiki 端口
    default: 808080
    min: 1024
    max: 65535
    description: TiddlyWiki Web 服务端口
  - name: TIDDLYWIKI_USERNAME
    type: string
    title: TiddlyWiki 用户名
    default: "admin"
    description: TiddlyWiki 登录用户名
  - name: TIDDLYWIKI_PASSWORD
    type: string
    title: TiddlyWiki 密码
    default: ""
    description: TiddlyWiki 登录密码
    required: true
    sensitive: true

services:
  - name: tiddlywiki
    type: web
    description: TiddlyWiki 个人知识库服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: tiddlywiki_data
        path: /var/lib/tiddlywiki
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  tiddlywiki:
    username:
      pattern: "{TIDDLYWIKI_USERNAME}"
    password:
      pattern: "{TIDDLYWIKI_PASSWORD}"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "个人知识库,非线性编辑,丰富插件,单文件Wiki"

