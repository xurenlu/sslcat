
services:
  tiddlywiki:
    image: ghcr.io/linagora/tiddlywiki:{{TIDDLYWIKI_VERSION}}
    container_name: {{APP_NAME}}_tiddlywiki
    restart: unless-stopped
    ports:
      - "{{TIDDLYWIKI_PORT}}:8080"
    environment:
      TW_USERNAME: {{TIDDLYWIKI_USERNAME}}
      TW_PASSWORD: {{TIDDLYWIKI_PASSWORD}}
    volumes:
      - tiddlywiki_data:/var/lib/tiddlywiki
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tiddlywiki_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

