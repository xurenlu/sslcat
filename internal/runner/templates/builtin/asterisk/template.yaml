id: asterisk
name: Asterisk (呼叫中心)
category: tools
subcategory: communication
tags: [c, communication, asterisk, pbx, voip, call-center]
description: 开源的IP电话交换机（PBX）系统，支持VoIP通话、呼叫中心、语音信箱、IVR等功能。
icon: asterisk
version: 1.0.0
author: SSLcat Team
website: https://www.asterisk.org/
compose_file: docker-compose.yml

variables:
  - name: ASTERISK_VERSION
    type: select
    title: Asterisk 版本
    default: "latest"
    options: ["latest", "20", "19"]
    description: 选择 Asterisk 版本
  - name: ASTERISK_SIP_PORT
    type: number
    title: SIP 端口
    default: 5060
    min: 1024
    max: 65535
    description: SIP 协议端口
  - name: ASTERISK_RTP_START
    type: number
    title: RTP 起始端口
    default: 10000
    min: 1024
    max: 65535
    description: RTP 媒体流起始端口
  - name: ASTERISK_RTP_END
    type: number
    title: RTP 结束端口
    default: 20000
    min: 1024
    max: 65535
    description: RTP 媒体流结束端口

services:
  - name: asterisk
    type: service
    description: Asterisk 呼叫中心服务
    ports:
      - internal: 5060
        external: null
        public: true
    volumes:
      - name: asterisk_data
        path: /etc/asterisk
        mode: rw
      - name: asterisk_logs
        path: /var/log/asterisk
        mode: rw
    healthcheck:
      type: command
      command: ["asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: ""
  admin_email: admin@{{PRIMARY_DOMAIN}}
  sip_endpoint: "{{PRIMARY_DOMAIN}}:5060"
  features: "VoIP通话,呼叫中心,语音信箱,IVR,通话录音"

