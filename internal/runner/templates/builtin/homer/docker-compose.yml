
services:
  homer:
    image: b4bz/homer:{{HOMER_VERSION}}
    container_name: {{APP_NAME}}_homer
    restart: unless-stopped
    ports:
      - "{{HOMER_PORT}}:8080"
    volumes:
      - homer_data:/www/assets
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  homer_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

