id: homer
name: Homer
category: tools
subcategory: dashboard
tags: [static, dashboard, homepage, homer]
description: 静态应用启动页，轻量级、快速，支持自定义配置。
icon: homer
version: 1.0.0
author: SSLcat Team
website: https://github.com/bastienwirtz/homer
compose_file: docker-compose.yml

variables:
  - name: HOMER_VERSION
    type: select
    title: Homer 版本
    default: "latest"
    options: ["latest", "v23", "v22"]
    description: 选择 Homer 版本
  - name: HOMER_PORT
    type: number
    title: Homer 端口
    default: 8080
    min: 1024
    max: 65535
    description: Homer Web 服务端口

services:
  - name: homer
    type: web
    description: Homer 应用启动页服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: homer_data
        path: /www/assets
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  static_site: true

