id: ackee
name: Ackee
category: analytics
subcategory: web-analytics
tags: [nodejs, mongodb, analytics, privacy, ackee]
description: 隐私友好的网站分析工具，轻量快速，符合 GDPR。
icon: ackee
version: 1.0.0
author: SSLcat Team
website: https://ackee.electerious.com/
compose_file: docker-compose.yml

variables:
  - name: ACKEE_VERSION
    type: select
    title: Ackee 版本
    default: "latest"
    options: ["latest", "4.0", "3.3"]
    description: 选择 Ackee 版本
  - name: MONGODB_VERSION
    type: select
    title: MongoDB 版本
    default: "latest"
    options: ["latest", "7.0", "6.0"]
    description: 选择 MongoDB 版本
  - name: ACKEE_PORT
    type: number
    title: Ackee 端口
    default: 3000
    min: 1024
    max: 65535
    description: Ackee Web 服务端口

services:
  - name: ackee
    type: web
    description: Ackee 分析服务
    depends_on: [mongodb]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: ackee_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: mongodb
    type: database
    description: MongoDB 数据库服务
    ports:
      - internal: 27017
        external: null
        public: false
    volumes:
      - name: mongodb_data
        path: /data/db
        mode: rw
      - name: mongodb_config
        path: /data/configdb
        mode: rw
    healthcheck:
      type: command
      command: ["mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mongodb:
    root_username:
      pattern: "admin"
    root_password:
      pattern: random
      length: 18
    username:
      pattern: "{app_name}_ackee"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_ackee"
  ackee:
    admin_password:
      pattern: random
      length: 16

connection_strings:
  mongodb: "mongodb://{username}:{password}@mongodb:27017/{database}?authSource=admin"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_username: admin

