
services:
  ackee:
    image: electerious/ackee:{{ACKEE_VERSION}}
    container_name: {{APP_NAME}}_ackee
    restart: unless-stopped
    ports:
      - "{{ACKEE_PORT}}:3000"
    environment:
      ACKEE_MONGODB: "mongodb://{{MONGODB_USERNAME}}:{{MONGODB_PASSWORD}}@mongodb:27017/{{MONGODB_DATABASE}}?authSource=admin"
      ACKEE_USERNAME: admin
      ACKEE_PASSWORD: "{{ADMIN_PASSWORD}}"
    volumes:
      - ackee_data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongodb:
    image: mongo:{{MONGODB_VERSION}}
    container_name: {{APP_NAME}}_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "{{MONGODB_ROOT_USERNAME}}"
      MONGO_INITDB_ROOT_PASSWORD: "{{MONGODB_ROOT_PASSWORD}}"
      MONGO_INITDB_DATABASE: "{{MONGODB_DATABASE}}"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ackee_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

