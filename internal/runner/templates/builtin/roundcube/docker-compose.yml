
services:
  roundcube:
    image: roundcube/roundcubemail:{{ROUNDCUBE_VERSION}}
    container_name: {{APP_NAME}}_roundcube
    restart: unless-stopped
    ports:
      - "{{ROUNDCUBE_PORT}}:80"
    environment:
      ROUNDCUBE_DEFAULT_HOST: "{{MAIL_HOST}}"
      ROUNDCUBE_SMTP_SERVER: "{{SMTP_HOST}}"
      ROUNDCUBE_DB_TYPE: mysql
      ROUNDCUBE_DB_HOST: mysql
      ROUNDCUBE_DB_NAME: "{{MYSQL_DATABASE}}"
      ROUNDCUBE_DB_USER: "{{MYSQL_USERNAME}}"
      ROUNDCUBE_DB_PASSWORD: "{{MYSQL_PASSWORD}}"
    volumes:
      - roundcube_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{MYSQL_ROOT_PASSWORD}}"
      MYSQL_DATABASE: "{{MYSQL_DATABASE}}"
      MYSQL_USER: "{{MYSQL_USERNAME}}"
      MYSQL_PASSWORD: "{{MYSQL_PASSWORD}}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

volumes:
  roundcube_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

