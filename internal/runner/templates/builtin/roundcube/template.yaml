id: roundcube
name: Roundcube
category: tools
subcategory: email
tags: [php, mysql, email, webmail, roundcube]
description: 现代化的 Web 邮件客户端，界面美观，功能完整。
icon: roundcube
version: 1.0.0
author: SSLcat Team
website: https://roundcube.net/
compose_file: docker-compose.yml

variables:
  - name: ROUNDCUBE_VERSION
    type: select
    title: Roundcube 版本
    default: "latest"
    options: ["latest", "1.6", "1.5"]
    description: 选择 Roundcube 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: ROUNDCUBE_PORT
    type: number
    title: Roundcube 端口
    default: 808080
    min: 1024
    max: 65535
    description: Roundcube Web 服务端口
  - name: MAIL_HOST
    type: string
    title: 邮件服务器地址
    default: "mail.{{PRIMARY_DOMAIN}}"
    description: IMAP 邮件服务器地址
  - name: SMTP_HOST
    type: string
    title: SMTP 服务器地址
    default: "mail.{{PRIMARY_DOMAIN}}"
    description: SMTP 服务器地址

services:
  - name: roundcube
    type: web
    description: Roundcube Web 邮件客户端
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: roundcube_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_roundcube"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_roundcube"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}

