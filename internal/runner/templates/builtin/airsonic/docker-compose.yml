version: '3.8'

services:
  airsonic:
    image: airsonic/airsonic:{{AIRSONIC_VERSION}}
    container_name: {{APP_NAME}}_airsonic
    restart: unless-stopped
    ports:
      - "{{AIRSONIC_PORT}}:4040"
    environment:
      JAVA_OPTS: -Xmx512m
      AIRSONIC_HOME: /airsonic
      AIRSONIC_HOST: 0.0.0.0
      AIRSONIC_PORT: 4040
      AIRSONIC_CONTEXT_PATH: /
    volumes:
      - airsonic_data:/airsonic
      - music_data:/music:ro
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4040"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  airsonic_data:
    driver: local
  music_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

