id: adguard-home
name: AdGuard Home (DNS过滤)
category: tools
subcategory: dns
tags: [go, dns, ad-blocker, adguard, network]
description: 网络级广告和追踪拦截器，DNS 服务器，提供详细的统计和过滤规则管理。
icon: adguard-home
version: 1.0.0
author: SSLcat Team
website: https://adguard.com/adguard-home.html
compose_file: docker-compose.yml

variables:
  - name: ADGUARD_VERSION
    type: select
    title: AdGuard Home 版本
    default: "latest"
    options: ["latest", "v0.108", "v0.107"]
    description: 选择 AdGuard Home 版本
  - name: ADGUARD_PORT
    type: number
    title: AdGuard Home Web 端口
    default: 80
    min: 1
    max: 65535
    description: AdGuard Home Web 管理界面端口
  - name: ADGUARD_DNS_PORT
    type: number
    title: AdGuard Home DNS 端口
    default: 53
    min: 1
    max: 65535
    description: AdGuard Home DNS 服务端口
  - name: ADGUARD_DNS_PORT_2
    type: number
    title: AdGuard Home DNS-over-TLS 端口
    default: 853
    min: 1
    max: 65535
    description: AdGuard Home DNS-over-TLS 端口
  - name: ADGUARD_DNS_PORT_3
    type: number
    title: AdGuard Home DNS-over-HTTPS 端口
    default: 3000
    min: 1
    max: 65535
    description: AdGuard Home DNS-over-HTTPS 端口

services:
  - name: adguard-home
    type: web
    description: AdGuard Home DNS 过滤服务
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 53
        external: null
        public: true
      - internal: 853
        external: null
        public: true
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: adguard_data
        path: /opt/adguardhome/work
        mode: rw
      - name: adguard_config
        path: /opt/adguardhome/conf
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  dns_server: "{{PRIMARY_DOMAIN}}:53"
  features: "广告拦截,追踪拦截,DNS服务器,统计报告"

