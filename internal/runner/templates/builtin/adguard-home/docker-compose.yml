version: '3.8'

services:
  adguard-home:
    image: adguard/adguardhome:{{ADGUARD_VERSION}}
    container_name: {{APP_NAME}}_adguard_home
    restart: unless-stopped
    ports:
      - "{{ADGUARD_PORT}}:80"
      - "{{ADGUARD_DNS_PORT}}:53/tcp"
      - "{{ADGUARD_DNS_PORT}}:53/udp"
      - "{{ADGUARD_DNS_PORT_2}}:853/tcp"
      - "{{ADGUARD_DNS_PORT_3}}:3000/tcp"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - adguard_data:/opt/adguardhome/work
      - adguard_config:/opt/adguardhome/conf
    cap_add:
      - NET_ADMIN
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  adguard_data:
    driver: local
  adguard_config:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

