id: sudowrite
name: SudoWrite
category: ai
subcategory: writing
tags: [nodejs, postgres, ai, writing, content-generation, sudowrite]
description: AI 写作助手，支持小说、博客、营销文案等多种写作场景。
icon: sudowrite
version: 1.0.0
author: SSLcat Team
website: https://github.com/sudowrite
compose_file: docker-compose.yml

variables:
  - name: SUDOWRITE_VERSION
    type: select
    title: SudoWrite 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 SudoWrite 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: SUDOWRITE_PORT
    type: number
    title: SudoWrite 端口
    default: 3000
    min: 1024
    max: 65535
    description: SudoWrite Web 服务端口
  - name: OPENAI_API_KEY
    type: string
    title: OpenAI API Key
    default: ""
    description: OpenAI API 密钥（可选）
    sensitive: true
  - name: ANTHROPIC_API_KEY
    type: string
    title: Anthropic API Key
    default: ""
    description: Anthropic API 密钥（可选）
    sensitive: true

services:
  - name: sudowrite
    type: web
    description: SudoWrite AI 写作服务
    depends_on: [postgres]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: sudowrite_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_sudowrite"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_sudowrite"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "小说写作,博客写作,营销文案,内容生成"

