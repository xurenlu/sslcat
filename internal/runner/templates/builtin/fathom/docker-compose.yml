
services:
  fathom:
    image: usefathom/fathom:{{FATHOM_VERSION}}
    container_name: {{APP_NAME}}_fathom
    restart: unless-stopped
    ports:
      - "{{FATHOM_PORT}}:8080"
    environment:
      FATHOM_SERVER_ADDR: ":8080"
      FATHOM_DATABASE_DRIVER: postgres
      FATHOM_DATABASE_NAME: "{{POSTGRES_DATABASE}}"
      FATHOM_DATABASE_USER: "{{POSTGRES_USERNAME}}"
      FATHOM_DATABASE_PASSWORD: "{{POSTGRES_PASSWORD}}"
      FATHOM_DATABASE_HOST: postgres:5432
      FATHOM_SECRET: "{{FATHOM_SECRET}}"
    volumes:
      - fathom_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "{{POSTGRES_DATABASE}}"
      POSTGRES_USER: "{{POSTGRES_USERNAME}}"
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  fathom_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

