version: '3.8'

services:
  librechat:
    image: ghcr.io/danny-avila/librechat:{{LIBRECHAT_VERSION}}
    container_name: {{APP_NAME}}_librechat
    restart: unless-stopped
    ports:
      - "{{LIBRECHAT_PORT}}:3080"
    environment:
      OPENAI_API_KEY: {{OPENAI_API_KEY}}
      ANTHROPIC_API_KEY: {{ANTHROPIC_API_KEY}}
      GOOGLE_API_KEY: {{GOOGLE_API_KEY}}
      DATABASE_URL: mongodb://{{MONGO_USERNAME}}:{{MONGO_PASSWORD}}@mongo:27017/{{MONGO_DATABASE}}
      JWT_SECRET: {{JWT_SECRET}}
      JWT_REFRESH_SECRET: {{JWT_REFRESH_SECRET}}
    volumes:
      - librechat_data:/app/api/data
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mongo:
    image: mongo:{{MONGO_VERSION}}
    container_name: {{APP_NAME}}_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: {{MONGO_USERNAME}}
      MONGO_INITDB_ROOT_PASSWORD: {{MONGO_PASSWORD}}
      MONGO_INITDB_DATABASE: {{MONGO_DATABASE}}
    volumes:
      - mongo_data:/data/db
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  librechat_data:
    driver: local
  mongo_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

