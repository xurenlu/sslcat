id: runwayml
name: RunwayML (视频编辑)
category: ai
subcategory: video-editing
tags: [python, ai, video-editing, runwayml, gpu]
description: RunwayML 视频编辑工具，支持视频生成、编辑和特效，需要 GPU。
icon: runwayml
version: 1.0.0
author: SSLcat Team
website: https://runwayml.com/
compose_file: docker-compose.yml

variables:
  - name: RUNWAYML_VERSION
    type: select
    title: RunwayML 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 RunwayML 版本
  - name: RUNWAYML_PORT
    type: number
    title: RunwayML 端口
    default: 8080
    min: 1024
    max: 65535
    description: RunwayML API 服务端口
  - name: RUNWAYML_API_KEY
    type: string
    title: RunwayML API Key
    default: ""
    description: RunwayML API 密钥（需要注册获取）
    required: true
    sensitive: true

services:
  - name: runwayml
    type: api
    description: RunwayML 视频编辑服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: runwayml_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

credentials:
  runwayml:
    api_key:
      pattern: random
      length: 32

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api"
  features: "视频生成,视频编辑,特效添加,智能剪辑"
  gpu_required: true

