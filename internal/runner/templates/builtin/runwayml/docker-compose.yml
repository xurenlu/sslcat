
services:
  runwayml:
    image: runwayml/server:{{RUNWAYML_VERSION}}
    container_name: {{APP_NAME}}_runwayml
    restart: unless-stopped
    ports:
      - "{{RUNWAYML_PORT}}:8080"
    environment:
      RUNWAYML_API_KEY: {{RUNWAYML_API_KEY}}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - runwayml_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  runwayml_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

