id: hexo
name: Hexo
category: cms
subcategory: blog
tags: [nodejs, blog, static, ssg, hexo]
description: 快速的静态博客生成器，基于 Node.js，适合个人博客。
icon: hexo
version: 1.0.0
author: SSLcat Team
website: https://hexo.io/
compose_file: docker-compose.yml

variables:
  - name: NODE_VERSION
    type: select
    title: Node.js 版本
    default: "20-alpine"
    options: ["20-alpine", "18-alpine", "20"]
    description: 选择 Node.js 版本
  - name: HEXO_PORT
    type: number
    title: Hexo 端口
    default: 4000
    min: 1024
    max: 65535
    description: Hexo 开发服务器端口

services:
  - name: hexo
    type: web
    description: Hexo 博客服务器
    ports:
      - internal: 4000
        external: null
        public: true
    volumes:
      - name: hexo_site
        path: /app
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}

