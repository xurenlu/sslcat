
services:
  hexo:
    image: node:{{NODE_VERSION}}
    container_name: {{APP_NAME}}_hexo
    restart: unless-stopped
    ports:
      - "{{HEXO_PORT}}:4000"
    working_dir: /app
    command: sh -c "npm install -g hexo-cli && hexo server -p 4000 -i 0.0.0.0"
    volumes:
      - hexo_site:/app
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hexo_site:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

