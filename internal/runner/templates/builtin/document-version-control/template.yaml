id: document-version-control
name: 文档版本控制系统
category: tools
subcategory: document-management
tags: [php, postgres, document-management, version-control, document-control]
description: 企业级文档版本控制系统，支持文档版本管理、版本对比、版本回退、文档审批、文档归档等功能。
icon: document-version-control
version: 1.0.0
author: SSLcat Team
website: https://github.com/document-version-control
compose_file: docker-compose.yml

variables:
  - name: DOC_VERSION_VERSION
    type: select
    title: 文档版本控制系统版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择文档版本控制系统版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: DOC_VERSION_PORT
    type: number
    title: 文档版本控制系统端口
    default: 808080
    min: 1024
    max: 65535
    description: 文档版本控制系统 Web 服务端口

services:
  - name: document-version-control
    type: web
    description: 文档版本控制系统服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: doc_version_data
        path: /app/data
        mode: rw
      - name: doc_version_repo
        path: /app/repository
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_doc_version"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_doc_version"
  document-version-control:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "文档版本管理,版本对比,版本回退,文档审批,文档归档"

