id: rvc
name: RVC (中文语音克隆)
category: ai
subcategory: voice-cloning
tags: [python, ai, voice-cloning, rvc, chinese, gpu]
description: 中文语音克隆工具，支持中文语音转换和克隆，效果优秀。
icon: rvc
version: 1.0.0
author: SSLcat Team
website: https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI
compose_file: docker-compose.yml

variables:
  - name: RVC_VERSION
    type: select
    title: RVC 版本
    default: "latest"
    options: ["latest", "v2", "v1"]
    description: 选择 RVC 版本
  - name: RVC_PORT
    type: number
    title: RVC 端口
    default: 7865
    min: 1024
    max: 65535
    description: RVC Web 服务端口

services:
  - name: rvc
    type: web
    description: RVC 中文语音克隆服务
    ports:
      - internal: 7865
        external: null
        public: true
    volumes:
      - name: rvc_data
        path: /app/models
        mode: rw
      - name: rvc_output
        path: /app/output
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "中文语音克隆,语音转换,高质量合成"
  gpu_required: true

