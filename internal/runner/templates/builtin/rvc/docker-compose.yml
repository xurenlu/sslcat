
services:
  rvc:
    image: rvc/rvc-webui:{{RVC_VERSION}}
    container_name: {{APP_NAME}}_rvc
    restart: unless-stopped
    ports:
      - "{{RVC_PORT}}:7865"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - rvc_data:/app/models
      - rvc_output:/app/output
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7865"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  rvc_data:
    driver: local
  rvc_output:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

