id: langchain
name: LangChain (AI应用框架)
category: ai
subcategory: framework
tags: [python, postgres, ai, framework, langchain, llm]
description: LangChain AI 应用开发框架，支持链式调用、工具集成和 RAG 应用开发。
icon: langchain
version: 1.0.0
author: SSLcat Team
website: https://github.com/langchain-ai/langchain
compose_file: docker-compose.yml

variables:
  - name: LANGCHAIN_VERSION
    type: select
    title: LangChain 版本
    default: "latest"
    options: ["latest", "v0.1", "v0.0"]
    description: 选择 LangChain 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: LANGCHAIN_PORT
    type: number
    title: LangChain 端口
    default: 808080
    min: 1024
    max: 65535
    description: LangChain API 服务端口
  - name: OPENAI_API_KEY
    type: string
    title: OpenAI API Key
    default: ""
    description: OpenAI API 密钥（可选）
    sensitive: true
  - name: ANTHROPIC_API_KEY
    type: string
    title: Anthropic API Key
    default: ""
    description: Anthropic API 密钥（可选）
    sensitive: true

services:
  - name: langchain
    type: api
    description: LangChain AI 应用框架服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: langchain_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_langchain"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_langchain"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api"
  features: "链式调用,工具集成,RAG应用,多模型支持"

