
services:
  tensorflow-serving:
    image: tensorflow/serving:{{TENSORFLOW_SERVING_VERSION}}
    container_name: {{APP_NAME}}_tensorflow_serving
    restart: unless-stopped
    ports:
      - "{{TENSORFLOW_SERVING_PORT}}:8501"
    environment:
      MODEL_NAME: {{MODEL_NAME}}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - tensorflow_serving_data:/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8501/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  tensorflow_serving_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

