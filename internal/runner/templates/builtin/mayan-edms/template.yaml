id: mayan-edms
name: Mayan EDMS
category: tools
subcategory: document-management
tags: [python, postgres, redis, document-management, mayan]
description: 企业级文档管理系统，支持版本控制、工作流和 OCR。
icon: mayan-edms
version: 1.0.0
author: SSLcat Team
website: https://www.mayan-edms.com/
compose_file: docker-compose.yml

variables:
  - name: MAYAN_VERSION
    type: select
    title: Mayan EDMS 版本
    default: "latest"
    options: ["latest", "5.0", "4.4"]
    description: 选择 Mayan EDMS 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: MAYAN_PORT
    type: number
    title: Mayan EDMS 端口
    default: 8000
    min: 1024
    max: 65535
    description: Mayan EDMS Web 服务端口

services:
  - name: mayan
    type: web
    description: Mayan EDMS 文档管理服务
    depends_on: [postgres, redis]
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: mayan_data
        path: /var/lib/mayan
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_mayan"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_mayan"
  redis:
    password:
      pattern: random
      length: 16
  mayan:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: admin
  default_admin_password: admin

