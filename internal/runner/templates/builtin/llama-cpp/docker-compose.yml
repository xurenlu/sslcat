version: '3.8'

services:
  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:{{LLAMA_CPP_VERSION}}
    container_name: {{APP_NAME}}_llama_cpp
    restart: unless-stopped
    ports:
      - "{{LLAMA_CPP_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - llama_cpp_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  llama_cpp_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

