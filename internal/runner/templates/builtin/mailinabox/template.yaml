id: mailinabox
name: Mail-in-a-Box (企业邮箱)
category: tools
subcategory: email
tags: [email, mail-server, mailinabox, enterprise-mail]
description: 一键部署的企业邮箱解决方案，包含邮件服务器、DNS 管理、Web 邮件客户端等功能，配置简单。
icon: mailinabox
version: 1.0.0
author: SSLcat Team
website: https://mailinabox.email/
compose_file: docker-compose.yml

variables:
  - name: MAILINABOX_VERSION
    type: select
    title: Mail-in-a-Box 版本
    default: "latest"
    options: ["latest", "v0.60", "v0.59"]
    description: 选择 Mail-in-a-Box 版本
  - name: MAILINABOX_PORT
    type: number
    title: Mail-in-a-Box Web HTTP 端口
    default: 80
    min: 1024
    max: 65535
    description: Mail-in-a-Box Web 界面 HTTP 端口
  - name: MAILINABOX_HTTPS_PORT
    type: number
    title: Mail-in-a-Box Web HTTPS 端口
    default: 443
    min: 1024
    max: 65535
    description: Mail-in-a-Box Web 界面 HTTPS 端口
  - name: MAILINABOX_SMTP_PORT
    type: number
    title: SMTP 端口
    default: 25
    min: 1024
    max: 65535
    description: SMTP 服务端口
  - name: MAILINABOX_SMTPS_PORT
    type: number
    title: SMTPS 端口
    default: 465
    min: 1024
    max: 65535
    description: SMTPS 服务端口
  - name: MAILINABOX_SUBMISSION_PORT
    type: number
    title: Submission 端口
    default: 587
    min: 1024
    max: 65535
    description: Submission 服务端口
  - name: MAILINABOX_IMAP_PORT
    type: number
    title: IMAP 端口
    default: 143
    min: 1024
    max: 65535
    description: IMAP 服务端口
  - name: MAILINABOX_IMAPS_PORT
    type: number
    title: IMAPS 端口
    default: 993
    min: 1024
    max: 65535
    description: IMAPS 服务端口
  - name: MAILINABOX_DOMAIN
    type: string
    title: 邮件域名
    default: "{{PRIMARY_DOMAIN}}"
    description: 邮件服务器的主域名
    placeholder: "mail.example.com"

services:
  - name: mailinabox
    type: web
    description: Mail-in-a-Box 邮件服务器
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 443
        external: null
        public: true
      - internal: 25
        external: null
        public: true
      - internal: 465
        external: null
        public: true
      - internal: 587
        external: null
        public: true
      - internal: 143
        external: null
        public: true
      - internal: 993
        external: null
        public: true
    volumes:
      - name: mailinabox_data
        path: /home/user-data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{MAILINABOX_DOMAIN}}
  admin_url: "http://{{PRIMARY_DOMAIN}}/admin"
  features: "企业邮箱,DNS管理,Web邮件客户端,反垃圾邮件,防病毒,自动SSL证书"

