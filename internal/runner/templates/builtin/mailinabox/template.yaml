id: mailinabox
name: Mail-in-a-Box (邮件服务器)
category: tools
subcategory: mail-server
tags: [python, mail-server, mailinabox, email, dns]
description: 一键式邮件服务器解决方案，自动配置邮件、DNS、SSL 等，适合个人和小型企业。
icon: mailinabox
version: 1.0.0
author: SSLcat Team
website: https://mailinabox.email/
compose_file: docker-compose.yml

variables:
  - name: MAILINABOX_VERSION
    type: select
    title: Mail-in-a-Box 版本
    default: "latest"
    options: ["latest", "v0.54", "v0.53"]
    description: 选择 Mail-in-a-Box 版本
  - name: MAILINABOX_HTTP_PORT
    type: number
    title: HTTP 端口
    default: 8080
    min: 1
    max: 65535
    description: HTTP 端口
  - name: MAILINABOX_HTTPS_PORT
    type: number
    title: HTTPS 端口
    default: 8443    min: 1
    max: 65535
    description: HTTPS 端口
  - name: MAILINABOX_SMTP_PORT
    type: number
    title: SMTP 端口
    default: 25
    min: 1
    max: 65535
    description: SMTP 邮件发送端口
  - name: MAILINABOX_IMAP_PORT
    type: number
    title: IMAP 端口
    default: 143
    min: 1
    max: 65535
    description: IMAP 邮件接收端口
  - name: MAILINABOX_IMAPS_PORT
    type: number
    title: IMAPS 端口
    default: 993
    min: 1
    max: 65535
    description: IMAPS 加密邮件接收端口
  - name: MAILINABOX_POP3_PORT
    type: number
    title: POP3 端口
    default: 110
    min: 1
    max: 65535
    description: POP3 邮件接收端口
  - name: MAILINABOX_POP3S_PORT
    type: number
    title: POP3S 端口
    default: 995
    min: 1
    max: 65535
    description: POP3S 加密邮件接收端口

services:
  - name: mailinabox
    type: web
    description: Mail-in-a-Box 邮件服务器
    ports:
      - internal: 80
        external: null
        public: true
      - internal: 443
        external: null
        public: true
      - internal: 25
        external: null
        public: true
      - internal: 143
        external: null
        public: true
      - internal: 993
        external: null
        public: true
      - internal: 110
        external: null
        public: true
      - internal: 995
        external: null
        public: true
    volumes:
      - name: mailinabox_data
        path: /home/user-data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "邮件服务器,自动配置,DNS管理,SSL证书"
