version: '3.8'

services:
  mailinabox:
    image: mailinabox/mailinabox:{{MAILINABOX_VERSION}}
    container_name: {{APP_NAME}}_mailinabox
    restart: unless-stopped
    ports:
      - "{{MAILINABOX_HTTP_PORT}}:80"
      - "{{MAILINABOX_HTTPS_PORT}}:443"
      - "{{MAILINABOX_SMTP_PORT}}:25"
      - "{{MAILINABOX_IMAP_PORT}}:143"
      - "{{MAILINABOX_IMAPS_PORT}}:993"
      - "{{MAILINABOX_POP3_PORT}}:110"
      - "{{MAILINABOX_POP3S_PORT}}:995"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - mailinabox_data:/home/user-data
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  mailinabox_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge
