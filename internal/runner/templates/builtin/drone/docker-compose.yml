
services:
  drone-server:
    image: drone/drone:{{DRONE_VERSION}}
    container_name: {{APP_NAME}}_drone_server
    restart: unless-stopped
    ports:
      - "{{DRONE_PORT}}:80"
    environment:
      DRONE_GITEA_SERVER: "http://{{PRIMARY_DOMAIN}}"
      DRONE_GITEA_CLIENT_ID: "{{GITEA_CLIENT_ID}}"
      DRONE_GITEA_CLIENT_SECRET: "{{GITEA_CLIENT_SECRET}}"
      DRONE_RPC_SECRET: "{{RPC_SECRET}}"
      DRONE_SERVER_HOST: "{{PRIMARY_DOMAIN}}"
      DRONE_SERVER_PROTO: http
      DRONE_DATABASE_DRIVER: postgres
      DRONE_DATABASE_DATASOURCE: "postgres://{{POSTGRES_USERNAME}}:{{POSTGRES_PASSWORD}}@postgres:5432/{{POSTGRES_DATABASE}}?sslmode=disable"
    volumes:
      - drone_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  drone-runner:
    image: drone/drone-runner-docker:{{DRONE_RUNNER_VERSION}}
    container_name: {{APP_NAME}}_drone_runner
    restart: unless-stopped
    environment:
      DRONE_RPC_PROTO: http
      DRONE_RPC_HOST: drone-server:80
      DRONE_RPC_SECRET: "{{RPC_SECRET}}"
      DRONE_RUNNER_CAPACITY: 2
      DRONE_RUNNER_NAME: {{APP_NAME}}_runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - drone-server
    networks:
      - {{APP_NAME}}_network
    privileged: true

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "{{POSTGRES_DATABASE}}"
      POSTGRES_USER: "{{POSTGRES_USERNAME}}"
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  drone_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

