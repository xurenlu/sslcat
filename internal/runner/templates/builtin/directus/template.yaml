id: directus
name: Directus
category: cms
subcategory: headless
tags: [nodejs, postgresql, cms, headless, api, directus]
description: 开源无头 CMS 和数据平台，提供直观的管理界面和强大的 API。
icon: directus
version: 1.0.0
author: SSLcat Team
website: https://directus.io/
compose_file: docker-compose.yml

variables:
  - name: DIRECTUS_VERSION
    type: select
    title: Directus 版本
    default: "10.8.0"
    options: ["latest", "10.8.0", "10.7.0"]
    description: 选择 Directus 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: DIRECTUS_PORT
    type: number
    title: Directus 端口
    default: 8055
    min: 1024
    max: 65535
    description: Directus Web 服务端口

services:
  - name: directus
    type: web
    description: Directus API 和管理界面
    depends_on: [postgres]
    ports:
      - internal: 8055
        external: null
        public: true
    volumes:
      - name: directus_uploads
        path: /directus/uploads
        mode: rw
      - name: directus_extensions
        path: /directus/extensions
        mode: rw
    healthcheck:
      type: http
      path: /server/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_directus"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_directus"
  directus:
    key:
      pattern: random
      length: 32
    secret:
      pattern: random
      length: 32
    admin_password:
      pattern: random
      length: 16

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"
  directus_api: "http://{{PRIMARY_DOMAIN}}/items"

healthcheck_global:
  timeout: 10m
  interval: 10s

metadata:
  admin_url: http://{{PRIMARY_DOMAIN}}/admin
  api_url: http://{{PRIMARY_DOMAIN}}/items

