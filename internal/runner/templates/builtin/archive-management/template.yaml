id: archive-management
name: 档案管理系统
category: tools
subcategory: document-management
tags: [php, postgres, document-management, archive-management, records-management]
description: 企业档案管理系统，支持档案分类、档案归档、档案检索、档案借阅、档案销毁、档案统计等功能。
icon: archive-management
version: 1.0.0
author: SSLcat Team
website: https://github.com/archive-management
compose_file: docker-compose.yml

variables:
  - name: ARCHIVE_VERSION
    type: select
    title: 档案管理系统版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择档案管理系统版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: ARCHIVE_PORT
    type: number
    title: 档案管理系统端口
    default: 8080
    min: 1024
    max: 65535
    description: 档案管理系统 Web 服务端口

services:
  - name: archive-management
    type: web
    description: 档案管理系统服务
    depends_on: [postgres]
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: archive_data
        path: /app/data
        mode: rw
      - name: archive_files
        path: /app/files
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_archive"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_archive"
  archive-management:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:8080
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "档案分类,档案归档,档案检索,档案借阅,档案销毁,档案统计"

