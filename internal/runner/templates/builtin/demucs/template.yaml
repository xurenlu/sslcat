id: demucs
name: Demucs (音频分离)
category: ai
subcategory: audio-processing
tags: [python, ai, audio-processing, demucs, source-separation, gpu]
description: Meta 开源的音频分离工具，分离人声和背景音乐，需要 GPU。
icon: demucs
version: 1.0.0
author: SSLcat Team
website: https://github.com/facebookresearch/demucs
compose_file: docker-compose.yml

variables:
  - name: DEMUCS_VERSION
    type: select
    title: Demucs 版本
    default: "latest"
    options: ["latest", "v4", "v3"]
    description: 选择 Demucs 版本
  - name: DEMUCS_PORT
    type: number
    title: Demucs 端口
    default: 8080
    min: 1024
    max: 65535
    description: Demucs API 服务端口

services:
  - name: demucs
    type: api
    description: Demucs 音频分离服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: demucs_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/separate"
  features: "音频分离,人声提取,背景音乐分离,高质量分离"
  gpu_required: true

