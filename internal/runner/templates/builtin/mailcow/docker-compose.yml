version: '3.8'

services:
  mailcow:
    image: mailcow/mailcow-dockerized:{{MAILCOW_VERSION}}
    container_name: {{APP_NAME}}_mailcow
    restart: unless-stopped
    ports:
      - "{{MAILCOW_PORT}}:80"
      - "{{MAILCOW_HTTPS_PORT}}:443"
      - "{{MAILCOW_SMTP_PORT}}:25"
      - "{{MAILCOW_SMTPS_PORT}}:465"
      - "{{MAILCOW_SUBMISSION_PORT}}:587"
      - "{{MAILCOW_IMAP_PORT}}:143"
      - "{{MAILCOW_IMAPS_PORT}}:993"
      - "{{MAILCOW_POP3_PORT}}:110"
      - "{{MAILCOW_POP3S_PORT}}:995"
    environment:
      MAILCOW_HOSTNAME: {{PRIMARY_DOMAIN}}
      ADDITIONAL_SAN: ""
      SKIP_LETS_ENCRYPT: "n"
      SKIP_SOLR: "y"
      SKIP_SOGO: "n"
      USE_WATCHDOG: "y"
    volumes:
      - mailcow_data:/var/lib/docker/volumes
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  mailcow_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

