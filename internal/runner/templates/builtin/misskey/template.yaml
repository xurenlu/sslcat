id: misskey
name: Misskey (Twitter替代)
category: tools
subcategory: social
tags: [nodejs, postgres, redis, social, misskey, twitter-alternative]
description: 现代化的联邦社交网络平台，支持 ActivityPub 协议，界面美观，功能丰富，Twitter 的替代品。
icon: misskey
version: 1.0.0
author: SSLcat Team
website: https://misskey-hub.net/
compose_file: docker-compose.yml

variables:
  - name: MISSKEY_VERSION
    type: select
    title: Misskey 版本
    default: "latest"
    options: ["latest", "v13", "v12"]
    description: 选择 Misskey 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: REDIS_VERSION
    type: select
    title: Redis 版本
    default: "7"
    options: ["7", "6", "alpine"]
    description: 选择 Redis 版本
  - name: MISSKEY_PORT
    type: number
    title: Misskey 端口
    default: 3000
    min: 1024
    max: 65535
    description: Misskey Web 服务端口

services:
  - name: misskey
    type: web
    description: Misskey 社交网络服务
    depends_on: [postgres, redis]
    ports:
      - internal: 3000
        external: null
        public: true
    volumes:
      - name: misskey_data
        path: /misskey/files
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  - name: redis
    type: cache
    description: Redis 缓存服务
    ports:
      - internal: 6379
        external: null
        public: false
    volumes:
      - name: redis_data
        path: /data
        mode: rw
    healthcheck:
      type: command
      command: ["redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

credentials:
  postgres:
    username:
      pattern: "{app_name}_misskey"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_misskey"
  redis:
    password:
      pattern: random
      length: 16
  misskey:
    secret_key:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"
  redis: "redis://:{password}@redis:6379/0"

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}:3000
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "联邦社交网络,ActivityPub协议,现代化界面,Twitter替代"

