version: '3.8'

services:
  misskey:
    image: misskey/misskey:{{MISSKEY_VERSION}}
    container_name: {{APP_NAME}}_misskey
    restart: unless-stopped
    ports:
      - "{{MISSKEY_PORT}}:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: {{REDIS_PASSWORD}}
      SECRET_KEY: {{MISSKEY_SECRET_KEY}}
      URL: http://{{PRIMARY_DOMAIN}}:3000
    volumes:
      - misskey_data:/misskey/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:{{REDIS_VERSION}}
    container_name: {{APP_NAME}}_redis
    restart: unless-stopped
    command: redis-server --requirepass {{REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  misskey_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

