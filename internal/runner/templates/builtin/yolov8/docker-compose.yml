
services:
  yolov8:
    image: ultralytics/ultralytics:{{YOLOV8_VERSION}}
    container_name: {{APP_NAME}}_yolov8
    restart: unless-stopped
    ports:
      - "{{YOLOV8_PORT}}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - yolov8_data:/app/models
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  yolov8_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

