id: yolov8
name: YOLOv8 (实时物体检测)
category: ai
subcategory: object-detection
tags: [python, ai, object-detection, yolov8, ultralytics, gpu]
description: 最新的 YOLO 物体检测模型，实时检测图片和视频中的物体，需要 GPU。
icon: yolov8
version: 1.0.0
author: SSLcat Team
website: https://github.com/ultralytics/ultralytics
compose_file: docker-compose.yml

variables:
  - name: YOLOV8_VERSION
    type: select
    title: YOLOv8 版本
    default: "latest"
    options: ["latest", "v8.0", "v8.1"]
    description: 选择 YOLOv8 版本
  - name: YOLOV8_PORT
    type: number
    title: YOLOv8 端口
    default: 808080
    min: 1024
    max: 65535
    description: YOLOv8 API 服务端口

services:
  - name: yolov8
    type: api
    description: YOLOv8 实时物体检测服务
    ports:
      - internal: 8080
        external: null
        public: true
    volumes:
      - name: yolov8_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/detect"
  features: "实时检测,视频检测,高精度识别,80+类别"
  gpu_required: true

