id: wireguard
name: WireGuard (VPN 服务)
category: infrastructure
subcategory: vpn
tags: [vpn, wireguard, security, remote-access, infrastructure]
description: 现代化的 VPN 解决方案，性能优异，配置简单，适合企业内网远程访问和站点间连接。
icon: wireguard
version: 1.0.0
author: SSLcat Team
website: https://www.wireguard.com/
compose_file: docker-compose.yml

variables:
  - name: WIREGUARD_VERSION
    type: select
    title: WireGuard 版本
    default: "latest"
    options: ["latest", "1.0", "0.5"]
    description: 选择 WireGuard 版本
  - name: WIREGUARD_WEBUI_VERSION
    type: select
    title: WireGuard Web UI 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 WireGuard Web UI 版本
  - name: WIREGUARD_WEBUI_PORT
    type: number
    title: Web UI 端口
    default: 51821
    min: 1024
    max: 65535
    description: WireGuard Web 管理界面端口
  - name: WIREGUARD_PORT
    type: number
    title: WireGuard VPN 端口
    default: 51820
    min: 1024
    max: 65535
    description: WireGuard VPN 服务端口（UDP）
  - name: WIREGUARD_DOMAIN
    type: string
    title: VPN 服务器域名
    default: "{{PRIMARY_DOMAIN}}"
    description: VPN 服务器的公网域名或 IP
    placeholder: "vpn.example.com"
  - name: WIREGUARD_SUBNET
    type: string
    title: VPN 子网
    default: "10.8.0.0/24"
    description: VPN 客户端使用的子网段
    placeholder: "10.8.0.0/24"

services:
  - name: wireguard-webui
    type: web
    description: WireGuard Web 管理界面
    depends_on: [wireguard]
    ports:
      - internal: 51821
        external: null
        public: true
    volumes:
      - name: wireguard_config
        path: /config
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  - name: wireguard
    type: service
    description: WireGuard VPN 服务器
    ports:
      - internal: 51820
        external: null
        public: true
        protocol: udp
    volumes:
      - name: wireguard_config
        path: /config
        mode: rw
      - name: wireguard_modules
        path: /lib/modules
        mode: ro
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      type: command
      command: ["ping", "-c", "1", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

credentials:
  wireguard:
    password:
      pattern: random
      length: 16

healthcheck_global:
  timeout: 5m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  webui_url: "http://{{PRIMARY_DOMAIN}}:{{WIREGUARD_WEBUI_PORT}}"
  vpn_endpoint: "{{WIREGUARD_DOMAIN}}:{{WIREGUARD_PORT}}"
  features: "VPN服务,远程访问,站点间连接,客户端管理,配置生成"
  vpn_subnet: "{{WIREGUARD_SUBNET}}"

