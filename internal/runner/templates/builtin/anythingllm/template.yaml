id: anythingllm
name: AnythingLLM
category: ai
subcategory: rag
tags: [nodejs, postgres, ai, rag, llm, anythingllm, chat, chinese]
description: 企业级 RAG 应用，支持文档上传、向量搜索、AI 问答和智能聊天。支持中文界面和中文内容处理。
icon: anythingllm
version: 1.0.0
author: SSLcat Team
website: https://useanything.com/
compose_file: docker-compose.yml

variables:
  - name: ANYTHINGLLM_VERSION
    type: select
    title: AnythingLLM 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.9"]
    description: 选择 AnythingLLM 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: ANYTHINGLLM_PORT
    type: number
    title: AnythingLLM 端口
    default: 3001
    min: 1024
    max: 65535
    description: AnythingLLM Web 服务端口
  - name: OPENAI_API_KEY
    type: string
    title: OpenAI API Key
    default: ""
    description: OpenAI API 密钥（可选，用于 GPT 模型，支持中文）
    sensitive: true
  - name: ANTHROPIC_API_KEY
    type: string
    title: Anthropic API Key
    default: ""
    description: Anthropic API 密钥（可选，用于 Claude 模型）
    sensitive: true
  - name: GOOGLE_API_KEY
    type: string
    title: Google API Key
    default: ""
    description: Google API 密钥（可选，用于 Gemini 模型，支持中文）
    sensitive: true

services:
  - name: anythingllm
    type: web
    description: AnythingLLM RAG 服务
    depends_on: [postgres]
    ports:
      - internal: 3001
        external: null
        public: true
    volumes:
      - name: anythingllm_data
        path: /app/server/storage
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_anythingllm"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_anythingllm"
  anythingllm:
    api_key:
      pattern: random
      length: 32
    jwt_secret:
      pattern: random
      length: 32

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 20m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "RAG,向量搜索,文档问答,智能聊天,中文支持,多模型支持"

