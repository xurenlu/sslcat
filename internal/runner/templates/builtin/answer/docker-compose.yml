
services:
  answer:
    image: answerdev/answer:{{ANSWER_VERSION}}
    container_name: {{APP_NAME}}_answer
    restart: unless-stopped
    ports:
      - "{{ANSWER_PORT}}:9080"
    environment:
      ANSWER_DB_TYPE: mysql
      ANSWER_DB_USERNAME: "{{MYSQL_USERNAME}}"
      ANSWER_DB_PASSWORD: "{{MYSQL_PASSWORD}}"
      ANSWER_DB_HOST: mysql:3306
      ANSWER_DB_NAME: "{{MYSQL_DATABASE}}"
      ANSWER_SITE_URL: "http://{{PRIMARY_DOMAIN}}"
      ANSWER_SITE_NAME: "{{ANSWER_SITE_NAME}}"
      ANSWER_CONTACT_EMAIL: "admin@{{PRIMARY_DOMAIN}}"
    volumes:
      - answer_data:/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:{{MYSQL_VERSION}}
    container_name: {{APP_NAME}}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{MYSQL_ROOT_PASSWORD}}"
      MYSQL_DATABASE: "{{MYSQL_DATABASE}}"
      MYSQL_USER: "{{MYSQL_USERNAME}}"
      MYSQL_PASSWORD: "{{MYSQL_PASSWORD}}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

volumes:
  answer_data:
    driver: local
  mysql_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

