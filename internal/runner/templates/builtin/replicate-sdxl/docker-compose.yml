
services:
  replicate-sdxl:
    image: replicate/proxy:{{REPLICATE_SDXL_VERSION}}
    container_name: {{APP_NAME}}_replicate_sdxl
    restart: unless-stopped
    ports:
      - "{{REPLICATE_SDXL_PORT}}:8080"
    environment:
      REPLICATE_API_TOKEN: "{{REPLICATE_API_TOKEN}}"
      REPLICATE_MODEL: stability-ai/sdxl
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - replicate_sdxl_data:/app/cache
    networks:
      - {{APP_NAME}}_network
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  replicate_sdxl_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

