version: '3.8'

services:
  vikunja:
    image: vikunja/vikunja:{{VIKUNJA_VERSION}}
    container_name: {{APP_NAME}}_vikunja
    restart: unless-stopped
    ports:
      - "{{VIKUNJA_PORT}}:3456"
    environment:
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_USER: {{POSTGRES_USERNAME}}
      VIKUNJA_DATABASE_PASSWORD: {{POSTGRES_PASSWORD}}
      VIKUNJA_DATABASE_DATABASE: {{POSTGRES_DATABASE}}
      VIKUNJA_SERVICE_ROOTPATH: http://{{PRIMARY_DOMAIN}}
    volumes:
      - vikunja_data:/app/vikunja/files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3456/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:{{POSTGRES_VERSION}}
    container_name: {{APP_NAME}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{POSTGRES_DATABASE}}
      POSTGRES_USER: {{POSTGRES_USERNAME}}
      POSTGRES_PASSWORD: {{POSTGRES_PASSWORD}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - {{APP_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  vikunja_data:
    driver: local
  postgres_data:
    driver: local

networks:
  {{APP_NAME}}_network:
    driver: bridge

