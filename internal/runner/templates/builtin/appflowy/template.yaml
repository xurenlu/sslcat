id: appflowy
name: AppFlowy (Notion替代)
category: tools
subcategory: note-taking
tags: [rust, flutter, postgres, note-taking, appflowy, notion-alternative]
description: Notion 的开源替代品，Rust + Flutter 构建，支持文档、数据库、看板等多种视图。
icon: appflowy
version: 1.0.0
author: SSLcat Team
website: https://www.appflowy.io/
compose_file: docker-compose.yml

variables:
  - name: APPFLOWY_VERSION
    type: select
    title: AppFlowy 版本
    default: "latest"
    options: ["latest", "v0.4", "v0.3"]
    description: 选择 AppFlowy 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "16", "14"]
    description: 选择 PostgreSQL 版本
  - name: APPFLOWY_PORT
    type: number
    title: AppFlowy 端口
    default: 8080
    min: 1024
    max: 65535
    description: AppFlowy Web 服务端口

services:
  - name: appflowy
    type: web
    description: AppFlowy Notion 替代服务
    depends_on: [postgres]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: appflowy_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{username}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_appflowy"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_appflowy"

connection_strings:
  postgres: "postgres://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  features: "Notion替代,文档管理,数据库视图,看板视图"

