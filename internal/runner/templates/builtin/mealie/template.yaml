id: mealie
name: Mealie
category: collaboration
subcategory: recipe
tags: [python, postgresql, recipe, cooking, mealie]
description: 现代化的食谱管理应用，界面美观，支持导入和分享食谱。
icon: mealie
version: 1.0.0
author: SSLcat Team
website: https://mealie.io/
compose_file: docker-compose.yml

variables:
  - name: MEALIE_VERSION
    type: select
    title: Mealie 版本
    default: "latest"
    options: ["latest", "v1.0", "v0.7"]
    description: 选择 Mealie 版本
  - name: POSTGRES_VERSION
    type: select
    title: PostgreSQL 版本
    default: "15"
    options: ["15", "14", "16"]
    description: 选择 PostgreSQL 版本
  - name: MEALIE_PORT
    type: number
    title: Mealie 端口
    default: 9000
    min: 1024
    max: 65535
    description: Mealie Web 服务端口

services:
  - name: mealie
    type: web
    description: Mealie 食谱管理服务
    depends_on: [postgres]
    ports:
      - internal: 9000
        external: null
        public: true
    volumes:
      - name: mealie_data
        path: /app/data
        mode: rw
    healthcheck:
      type: http
      path: /api/app/about
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: postgres
    type: database
    description: PostgreSQL 数据库服务
    ports:
      - internal: 5432
        external: null
        public: false
    volumes:
      - name: postgres_data
        path: /var/lib/postgresql/data
        mode: rw
    healthcheck:
      type: command
      command: ["pg_isready", "-U", "{{POSTGRES_USERNAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  postgres:
    username:
      pattern: "{app_name}_mealie"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_mealie"

connection_strings:
  postgres: "postgresql://{username}:{password}@postgres:5432/{database}"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  default_admin_user: changeme@example.com
  default_admin_password: MyPassword123!

