id: chatglm
name: ChatGLM (中文大模型)
category: ai
subcategory: llm
tags: [python, ai, llm, chatglm, chinese, gpu]
description: 智谱 AI 开源的中文对话大模型，支持中文对话和代码生成，需要 GPU。
icon: chatglm
version: 1.0.0
author: SSLcat Team
website: https://github.com/THUDM/ChatGLM
compose_file: docker-compose.yml

variables:
  - name: CHATGLM_VERSION
    type: select
    title: ChatGLM 版本
    default: "latest"
    options: ["latest", "v3", "v2"]
    description: 选择 ChatGLM 版本
  - name: CHATGLM_PORT
    type: number
    title: ChatGLM 端口
    default: 808000
    min: 1024
    max: 65535
    description: ChatGLM API 服务端口

services:
  - name: chatglm
    type: api
    description: ChatGLM 中文大模型服务
    ports:
      - internal: 8000
        external: null
        public: true
    volumes:
      - name: chatglm_data
        path: /app/models
        mode: rw
    resources:
      gpu: required
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

healthcheck_global:
  timeout: 30m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  admin_email: admin@{{PRIMARY_DOMAIN}}
  api_endpoint: "http://{{PRIMARY_DOMAIN}}/api/chat"
  features: "中文对话,代码生成,多轮对话,高质量输出"
  gpu_required: true

