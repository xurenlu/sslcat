id: dolibarr
name: Dolibarr
category: crm
subcategory: erp
tags: [php, mysql, crm, erp, dolibarr]
description: 开源 ERP 和 CRM 系统，功能完整，适合中小企业。
icon: dolibarr
version: 1.0.0
author: SSLcat Team
website: https://www.dolibarr.org/
compose_file: docker-compose.yml

variables:
  - name: DOLIBARR_VERSION
    type: select
    title: Dolibarr 版本
    default: "latest"
    options: ["latest", "19.0", "18.0"]
    description: 选择 Dolibarr 版本
  - name: MYSQL_VERSION
    type: select
    title: MySQL 版本
    default: "8.0"
    options: ["8.0", "8.1", "5.7"]
    description: 选择 MySQL 版本
  - name: DOLIBARR_PORT
    type: number
    title: Dolibarr 端口
    default: 8080
    min: 1024
    max: 65535
    description: Dolibarr Web 服务端口

services:
  - name: dolibarr
    type: web
    description: Dolibarr ERP/CRM 服务
    depends_on: [mysql]
    ports:
      - internal: 80
        external: null
        public: true
    volumes:
      - name: dolibarr_data
        path: /var/www/html
        mode: rw
    healthcheck:
      type: http
      path: /
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  - name: mysql
    type: database
    description: MySQL 数据库服务
    ports:
      - internal: 3306
        external: null
        public: false
    volumes:
      - name: mysql_data
        path: /var/lib/mysql
        mode: rw
    healthcheck:
      type: command
      command: ["mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

credentials:
  mysql:
    username:
      pattern: "{app_name}_dolibarr"
    password:
      pattern: random
      length: 18
    database:
      pattern: "{app_name}_dolibarr"
    root_password:
      pattern: random
      length: 20

connection_strings:
  mysql: "mysql://{username}:{password}@mysql:3306/{database}?charset=utf8mb4"

healthcheck_global:
  timeout: 15m
  interval: 10s

metadata:
  site_url: http://{{PRIMARY_DOMAIN}}
  install_url: http://{{PRIMARY_DOMAIN}}/install
  admin_email: admin@{{PRIMARY_DOMAIN}}

