version: '3.9'

services:
  sslcat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sslcat-backend
    restart: unless-stopped
    platform: linux/arm64/v8
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./docker/config/sslcat.conf:/etc/sslcat/sslcat.conf:ro
      - ./docker/data:/var/lib/sslcat
    networks:
      - sslcat-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  playwright:
    image: mcr.microsoft.com/playwright:v1.55.1-jammy
    container_name: sslcat-playwright
    depends_on:
      - sslcat
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: :99
      CI: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    entrypoint: ["/bin/bash", "-lc"]
    command: "pnpm install && pnpm exec playwright install --with-deps && pnpm test:e2e"
    networks:
      - sslcat-network

networks:
  sslcat-network:
    driver: bridge