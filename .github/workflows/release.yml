name: Release Builds

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: sslcat

jobs:
  # Linux 构建（CGO 启用，支持 SQLite）
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch_tag: linux-amd64
            cc: gcc
          - goarch: arm64
            arch_tag: linux-arm64
            cc: aarch64-linux-gnu-gcc
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Print Go version
        run: go version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Build frontend
        run: |
          cd frontend
          yarn install
          yarn run build
          mkdir -p ../internal/assets/frontend
          cp -r dist/* ../internal/assets/frontend/

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev sqlite3 libsqlite3-dev
          # ARM64 交叉编译工具链
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi

      - name: Build Linux ${{ matrix.goarch }} with CGO
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p build artifacts
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          echo "Building $BIN_NAME for linux/${{ matrix.goarch }} (version=$VERSION) with CGO enabled (SQLite support)"
          echo "Using compiler: $CC"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.build=$GITHUB_RUN_ID" -o build/${BIN_NAME} .

      - name: Package Linux
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          NAME="${BIN_NAME}_${VERSION}_${{ matrix.arch_tag }}"
          tar -C build -czf artifacts/${NAME}.tar.gz ${BIN_NAME}
          ls -lh artifacts

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_tag }}
          path: artifacts/*

  # macOS 构建（CGO 启用，使用 macOS runner）
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch_tag: darwin-amd64
          - goarch: arm64
            arch_tag: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Print Go version
        run: go version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Build frontend
        run: |
          cd frontend
          yarn install
          yarn run build
          mkdir -p ../internal/assets/frontend
          cp -r dist/* ../internal/assets/frontend/

      - name: Install SQLite (macOS)
        run: |
          brew install sqlite3
          # macOS 已经有 Xcode Command Line Tools，无需额外安装 gcc

      - name: Build macOS ${{ matrix.goarch }} with CGO
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p build artifacts
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          echo "Building $BIN_NAME for darwin/${{ matrix.goarch }} (version=$VERSION) with CGO enabled (SQLite support)"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.build=$GITHUB_RUN_ID" -o build/${BIN_NAME} .

      - name: Package macOS
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          NAME="${BIN_NAME}_${VERSION}_${{ matrix.arch_tag }}"
          tar -C build -czf artifacts/${NAME}.tar.gz ${BIN_NAME}
          ls -lh artifacts

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_tag }}
          path: artifacts/*

  # 创建 Release
  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## SSLcat ${{ github.ref_name }}
            
            ### 📦 可用平台
            
            所有平台都启用 **CGO**，完整支持 **SQLite** 数据库！
            
            - **Linux AMD64** - x86_64 服务器（推荐）
            - **Linux ARM64** - ARM 服务器（树莓派、云服务器等）
            - **macOS Intel** - Intel 芯片 Mac
            - **macOS Apple Silicon** - M1/M2/M3 芯片 Mac
            
            ### 🚀 快速安装
            
            ```bash
            # macOS (自动选择架构)
            curl -fsSL https://sslcat.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_darwin-$(uname -m).tar.gz -o sslcat.tgz
            tar -xzf sslcat.tgz && sudo install -m 0755 sslcat /usr/local/bin/sslcat
            
            # Linux AMD64
            curl -fsSL https://sslcat.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-amd64.tar.gz -o sslcat.tgz
            tar -xzf sslcat.tgz && sudo install -m 0755 sslcat /usr/local/bin/sslcat
            
            # Linux ARM64 (树莓派等)
            curl -fsSL https://sslcat.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-arm64.tar.gz -o sslcat.tgz
            tar -xzf sslcat.tgz && sudo install -m 0755 sslcat /usr/local/bin/sslcat
            ```
            
            ### 📥 下载地址
            
            - **GitHub Releases**: https://github.com/xurenlu/sslcat/releases/tag/${{ github.ref_name }}
            - **阿里云OSS镜像**: https://sslcat-releases.oss-cn-hangzhou.aliyuncs.com/releases/${{ github.ref_name }}/
            
            ### 📝 更新日志
            
            详见 [CHANGELOG.md](https://github.com/xurenlu/sslcat/blob/${{ github.ref_name }}/CHANGELOG.md)
            
            ### ✨ 主要特性
            
            - ✅ 所有平台 CGO 启用，完整 SQLite 支持
            - ✅ Git 部署服务器实时日志显示
            - ✅ 自动 SSL 证书申请
            - ✅ Docker 构建优化
            - ✅ 前端配置和翻译修复
            - ✅ 阿里云OSS镜像同步
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # OSS 同步步骤
      - name: Install ossutil
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil

      - name: Configure ossutil
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        run: |
          ossutil config -e $ALIYUN_OSS_ENDPOINT \
                         -i $ALIYUN_ACCESS_KEY_ID \
                         -k $ALIYUN_ACCESS_KEY_SECRET \
                         --language EN

      - name: Upload to Aliyun OSS
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          VERSION=${{ github.ref_name }}
          echo "🚀 Uploading release $VERSION to Aliyun OSS..."
          
          # 上传所有文件到版本目录
          ossutil cp --recursive artifacts/ oss://$ALIYUN_OSS_BUCKET/releases/$VERSION/ \
                     --parallel 10 \
                     --checkpoint-dir /tmp/oss-checkpoint \
                     --retry-times 3
          
          # 创建最新版本的符号链接（复制整个目录）
          ossutil cp --recursive oss://$ALIYUN_OSS_BUCKET/releases/$VERSION/ \
                     oss://$ALIYUN_OSS_BUCKET/latest/ \
                     --update
          
          echo "✅ Successfully uploaded to OSS: oss://$ALIYUN_OSS_BUCKET/releases/$VERSION/"

      - name: Verify OSS upload
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          VERSION=${{ github.ref_name }}
          echo "🔍 Verifying upload for version $VERSION..."
          ossutil ls oss://$ALIYUN_OSS_BUCKET/releases/$VERSION/ \
                     --output-format json | jq -r '.objects[]?.key' | head -10
          echo "✅ OSS upload verification completed"
