name: Release Builds

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: sslcat

jobs:
  # Linux 构建（CGO 启用，支持 SQLite）
  build-linux:
    runs-on: ubuntu-20.04  # 使用 Ubuntu 20.04 确保 GLIBC 2.32 兼容性
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch_tag: linux-amd64
            cc: gcc
          # 临时禁用 ARM64 编译
          # - goarch: arm64
          #   arch_tag: linux-arm64
          #   cc: aarch64-linux-gnu-gcc
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Print Go version
        run: go version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Build frontend
        run: |
          cd frontend
          yarn install
          yarn run build
          mkdir -p ../internal/assets/frontend
          cp -r dist/* ../internal/assets/frontend/

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev sqlite3 libsqlite3-dev
          # ARM64 交叉编译工具链
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi
          # 检查 GLIBC 版本
          echo "当前系统 GLIBC 版本:"
          ldd --version

      - name: Build Linux ${{ matrix.goarch }} with CGO
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p build artifacts
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          echo "Building $BIN_NAME for linux/${{ matrix.goarch }} (version=$VERSION) with CGO enabled (SQLite support)"
          echo "Using compiler: $CC"
          
          # 使用静态链接确保兼容性
          go build -trimpath -ldflags "-s -w -linkmode external -extldflags '-static' -X main.version=$VERSION -X main.build=$GITHUB_RUN_ID" -o build/${BIN_NAME} .
          
          # 验证二进制文件的 GLIBC 依赖
          echo "验证二进制文件的 GLIBC 依赖:"
          objdump -T build/${BIN_NAME} | grep GLIBC || echo "无 GLIBC 依赖（静态链接）"
          ldd build/${BIN_NAME} || echo "静态链接或无 ldd 工具"

      - name: Package Linux
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          NAME="${BIN_NAME}_${VERSION}_${{ matrix.arch_tag }}"
          
          # 创建发布包目录
          mkdir -p release-package
          
          # 复制二进制文件
          cp build/${BIN_NAME} release-package/${BIN_NAME}
          
          # 复制配置文件
          cp sslcat.conf release-package/sslcat.conf
          
          # 复制 systemd 服务文件
          cp sslcat.service release-package/sslcat.service
          
          # 复制安装脚本
          cp install-sslcat.sh release-package/install-sslcat.sh
          chmod +x release-package/install-sslcat.sh
          
          # 复制 Git Hook 脚本
          cp scripts/sslcat-git-hook release-package/sslcat-git-hook
          chmod +x release-package/sslcat-git-hook
          
          # 复制 Git Hook 安装脚本
          cp scripts/install-git-hook.sh release-package/install-git-hook.sh
          chmod +x release-package/install-git-hook.sh
          
          # 创建 README
          echo "# SSLcat Release Package" > release-package/README.md
          echo "" >> release-package/README.md
          echo "## Quick Install" >> release-package/README.md
          echo "" >> release-package/README.md
          echo "1. Extract files: tar -xzf sslcat_*.tar.gz" >> release-package/README.md
          echo "2. Enter directory: cd sslcat_*/" >> release-package/README.md
          echo "3. Run install: sudo ./install-sslcat.sh" >> release-package/README.md
          echo "" >> release-package/README.md
          echo "## Files" >> release-package/README.md
          echo "- sslcat - SSLcat binary" >> release-package/README.md
          echo "- sslcat.conf - Default config" >> release-package/README.md
          echo "- sslcat.service - systemd service" >> release-package/README.md
          echo "- install-sslcat.sh - Install script" >> release-package/README.md
          echo "- sslcat-git-hook - Git Hook script for Dokku-style deployment" >> release-package/README.md
          echo "- install-git-hook.sh - Git Hook installation script" >> release-package/README.md
          echo "- README.md - This file" >> release-package/README.md
          
          # 打包（不保留所有者信息，解压时自动归属于解压用户，避免UID冲突）
          tar -C release-package --no-same-owner -czf artifacts/${NAME}.tar.gz .
          ls -lh artifacts

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_tag }}
          path: artifacts/*

  # macOS 构建（CGO 启用，使用 macOS runner）
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch_tag: darwin-amd64
          - goarch: arm64
            arch_tag: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Print Go version
        run: go version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Build frontend
        run: |
          cd frontend
          yarn install
          yarn run build
          mkdir -p ../internal/assets/frontend
          cp -r dist/* ../internal/assets/frontend/

      - name: Install SQLite (macOS)
        run: |
          brew install sqlite3
          # macOS 已经有 Xcode Command Line Tools，无需额外安装 gcc

      - name: Build macOS ${{ matrix.goarch }} with CGO
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p build artifacts
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          echo "Building $BIN_NAME for darwin/${{ matrix.goarch }} (version=$VERSION) with CGO enabled (SQLite support)"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.build=$GITHUB_RUN_ID" -o build/${BIN_NAME} .

      - name: Package macOS
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          NAME="${BIN_NAME}_${VERSION}_${{ matrix.arch_tag }}"
          
          # 创建发布包目录
          mkdir -p release-package
          
          # 复制二进制文件
          cp build/${BIN_NAME} release-package/${BIN_NAME}
          
          # 复制配置文件
          cp sslcat.conf release-package/sslcat.conf
          
          # 复制 systemd 服务文件（macOS 不需要，但保留用于参考）
          cp sslcat.service release-package/sslcat.service
          
          # 复制安装脚本
          cp install-sslcat.sh release-package/install-sslcat.sh
          chmod +x release-package/install-sslcat.sh
          
          # 复制 Git Hook 脚本
          cp scripts/sslcat-git-hook release-package/sslcat-git-hook
          chmod +x release-package/sslcat-git-hook
          
          # 复制 Git Hook 安装脚本
          cp scripts/install-git-hook.sh release-package/install-git-hook.sh
          chmod +x release-package/install-git-hook.sh
          
          # 创建 macOS 专用 README
          echo "# SSLcat Release Package (macOS)" > release-package/README.md
          echo "" >> release-package/README.md
          echo "## Quick Install" >> release-package/README.md
          echo "" >> release-package/README.md
          echo "1. Extract files: tar -xzf sslcat_*.tar.gz" >> release-package/README.md
          echo "2. Enter directory: cd sslcat_*/" >> release-package/README.md
          echo "3. Run install: sudo ./install-sslcat.sh" >> release-package/README.md
          echo "" >> release-package/README.md
          echo "## Files" >> release-package/README.md
          echo "- sslcat - SSLcat binary" >> release-package/README.md
          echo "- sslcat.conf - Default config" >> release-package/README.md
          echo "- sslcat.service - systemd service (Linux only)" >> release-package/README.md
          echo "- install-sslcat.sh - Install script" >> release-package/README.md
          echo "- sslcat-git-hook - Git Hook script for Dokku-style deployment" >> release-package/README.md
          echo "- install-git-hook.sh - Git Hook installation script" >> release-package/README.md
          echo "- README.md - This file" >> release-package/README.md
          echo "" >> release-package/README.md
          echo "## Manual Start" >> release-package/README.md
          echo "sslcat --config /usr/local/etc/sslcat/sslcat.conf" >> release-package/README.md
          echo "" >> release-package/README.md
          echo "## Access Panel" >> release-package/README.md
          echo "http://localhost:8080/sslcat-panel" >> release-package/README.md
          
          # 打包（不保留所有者信息，解压时自动归属于解压用户，避免UID冲突）
          tar -C release-package --no-same-owner -czf artifacts/${NAME}.tar.gz .
          ls -lh artifacts

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_tag }}
          path: artifacts/*

  # 创建 Release
  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## SSLcat ${{ github.ref_name }}
            
            ### 📦 可用平台
            
            所有平台都启用 **CGO**，完整支持 **SQLite** 数据库！
            
            - **Linux AMD64** - x86_64 服务器（推荐）
            - **Linux ARM64** - ARM 服务器（树莓派、云服务器等）
            - **macOS Intel** - Intel 芯片 Mac
            - **macOS Apple Silicon** - M1/M2/M3 芯片 Mac
            
            ### 🚀 快速安装
            
            ```bash
            # macOS (自动选择架构)
            curl -fsSL https://github.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_darwin-$(uname -m).tar.gz -o sslcat.tgz
            tar -xzf sslcat.tgz && sudo ./install-sslcat.sh
            
            # Linux AMD64  
            curl -fsSL https://github.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-amd64.tar.gz -o sslcat.tgz
            tar -xzf sslcat.tgz && sudo ./install-sslcat.sh
            
            # Linux ARM64 (树莓派等)
            curl -fsSL https://github.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-arm64.tar.gz -o sslcat.tgz
            tar -xzf sslcat.tgz && sudo ./install-sslcat.sh
            ```
            
            > **注意**: 文件权限将自动适配解压用户，以root解压获得root权限
             
            #### 🖥️ 各平台详细下载地址
            
            **Linux AMD64 (x86_64 服务器)**
            ```bash
            # GitHub
            https://github.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-amd64.tar.gz
            # CDN镜像
            https://cdn.wxside.com/xurenlu/sslcat/releases/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-amd64.tar.gz
            ```
            
            **Linux ARM64 (树莓派、ARM服务器)**
            ```bash
            # GitHub
            https://github.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-arm64.tar.gz
            # CDN镜像
            https://cdn.wxside.com/xurenlu/sslcat/releases/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_linux-arm64.tar.gz
            ```
            
            **macOS Intel (Intel芯片Mac)**
            ```bash
            # GitHub
            https://github.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_darwin-amd64.tar.gz
            # CDN镜像
            https://cdn.wxside.com/xurelu/sslcat/releases/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_darwin-amd64.tar.gz
            ```
            
            **macOS Apple Silicon (M1/M2/M3芯片Mac)**
            ```bash
            # GitHub
            https://github.com/xurenlu/sslcat/releases/download/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_darwin-arm64.tar.gz
            # CDN镜像
            https://cdn.wxside.com/xurenlu/sslcat/releases/${{ github.ref_name }}/sslcat_${{ github.ref_name }}_darwin-arm64.tar.gz
            ```
            
            ### 📝 更新日志
            
            详见 [CHANGELOG.md](https://github.com/xurenlu/sslcat/blob/${{ github.ref_name }}/CHANGELOG.md)
            
            ### ✨ 主要特性
            
            - ✅ 所有平台 CGO 启用，完整 SQLite 支持
            - ✅ Git 部署服务器实时日志显示
            - ✅ 自动 SSL 证书申请
            - ✅ Docker 构建优化
            - ✅ 前端配置和翻译修复
            - ✅ CDN镜像同步 (cdn.wxside.com)
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CDN镜像同步步骤 (OSS -> CDN)
      - name: Install ossutil
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil

      - name: Configure ossutil
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        run: |
          ossutil config -e $ALIYUN_OSS_ENDPOINT \
                         -i $ALIYUN_ACCESS_KEY_ID \
                         -k $ALIYUN_ACCESS_KEY_SECRET \
                         --language EN

      - name: Upload to CDN Mirror (OSS)
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          VERSION=${{ github.ref_name }}
          echo "🚀 Uploading release $VERSION to Aliyun OSS..."
          
          # 上传所有文件到版本目录
          ossutil cp --recursive artifacts/ oss://$ALIYUN_OSS_BUCKET/xurenlu/sslcat/releases/$VERSION/ \
                     --parallel 10 \
                     --checkpoint-dir /tmp/oss-checkpoint \
                     --retry-times 3
          
          # 创建最新版本的符号链接（复制整个目录）
          ossutil cp --recursive oss://$ALIYUN_OSS_BUCKET/xurenlu/sslcat/releases/$VERSION/ \
                     oss://$ALIYUN_OSS_BUCKET/latest/ \
                     --update
          
          echo "✅ Successfully uploaded to OSS: oss://$ALIYUN_OSS_BUCKET/xurenlu/sslcat/releases/$VERSION/"

      - name: Verify CDN Mirror upload
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          VERSION=${{ github.ref_name }}
          echo "🔍 Verifying upload for version $VERSION..."
          ossutil ls oss://$ALIYUN_OSS_BUCKET/xurenlu/sslcat/releases/$VERSION/ \
                     --output-format json | jq -r '.objects[]?.key' | head -10
          echo "✅ OSS upload verification completed"
