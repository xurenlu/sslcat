name: Release Builds

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: sslcat

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            arch_tag: linux-amd64
            archive: tar.gz
            ext: ""
          - goos: linux
            goarch: arm64
            arch_tag: linux-arm64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: amd64
            arch_tag: darwin-amd64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: arm64
            arch_tag: darwin-arm64
            archive: tar.gz
            ext: ""
          - goos: windows
            goarch: amd64
            arch_tag: windows-amd64
            archive: zip
            ext: .exe
          - goos: windows
            goarch: arm64
            arch_tag: windows-arm64
            archive: zip
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Print Go version
        run: go version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Build frontend
        run: |
          cd frontend
          yarn install
          yarn run build
          mkdir -p ../internal/assets/frontend
          cp -r dist/* ../internal/assets/frontend/

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev
          # 为不同平台安装交叉编译工具链
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            # macOS 交叉编译需要 osxcross
            sudo apt-get install -y clang llvm-dev libxml2-dev uuid-dev libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libncurses5-dev libncursesw5-dev xz-utils tk-dev libffi-dev liblzma-dev
            # 安装 osxcross
            git clone https://github.com/tpoechtrager/osxcross.git /tmp/osxcross
            cd /tmp/osxcross
            # 下载 macOS SDK (需要从 Apple 开发者网站获取)
            # 这里我们使用一个简化的方法，禁用 CGO 用于 macOS 交叉编译
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            # Windows 交叉编译
            sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
          fi

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # 根据平台设置 CGO 和编译器
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '1' || '0' }}
          # Linux ARM64 交叉编译环境
          CC_aarch64: aarch64-linux-gnu-gcc
          CXX_aarch64: aarch64-linux-gnu-g++
          # Windows 交叉编译环境
          CC_windows: x86_64-w64-mingw32-gcc
          CXX_windows: x86_64-w64-mingw32-g++
        run: |
          mkdir -p build artifacts
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          if [ "${{ matrix.goos }}" = "linux" ]; then
            echo "Building $BIN_NAME for $GOOS/$GOARCH (version=$VERSION) with CGO SQLite"
          else
            echo "Building $BIN_NAME for $GOOS/$GOARCH (version=$VERSION) with pure Go SQLite"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.build=$GITHUB_RUN_ID" -o build/${BIN_NAME}${{ matrix.ext }} .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          NAME="${BIN_NAME}_${VERSION}_${{ matrix.arch_tag }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd build && zip -9 ../artifacts/${NAME}.zip ${BIN_NAME}${{ matrix.ext }})
          else
            tar -C build -czf artifacts/${NAME}.tar.gz ${BIN_NAME}${{ matrix.ext }}
          fi
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_tag }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


