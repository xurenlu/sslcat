name: Build with CGO Support

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*

permissions:
  contents: write

env:
  BIN_NAME: withssl

jobs:
  build-cgo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            arch_tag: linux-amd64
            archive: tar.gz
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev

      - name: Print Go version
        run: go version

      - name: Build with CGO (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p build artifacts
          VERSION="${GITHUB_REF_NAME:-dev}"
          echo "Building $BIN_NAME for $GOOS/$GOARCH (version=$VERSION) with CGO"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.build=$GITHUB_RUN_ID" -o build/${BIN_NAME}${{ matrix.ext }} .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="${BIN_NAME}_${VERSION}_${{ matrix.arch_tag }}_cgo"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd build && zip -9 ../artifacts/${NAME}.zip ${BIN_NAME}${{ matrix.ext }})
          else
            tar -C build -czf artifacts/${NAME}.tar.gz ${BIN_NAME}${{ matrix.ext }}
          fi
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_tag }}-cgo
          path: artifacts/*

  create-release:
    needs: build-cgo
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cgo-build-$(date +%Y%m%d-%H%M%S)
          name: CGO Build $(date +%Y-%m-%d)
          draft: false
          prerelease: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
