name: Sync Releases to Aliyun OSS

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-to-oss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          name: ${{ github.event.release.tag_name }}

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.ALIYUN_OSS_ENDPOINT }} \
                         -i ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
                         -k ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} \
                         --language EN

      - name: Upload to OSS
        run: |
          # 创建版本目录
          VERSION=${{ github.event.release.tag_name }}
          echo "Uploading release $VERSION to OSS..."
          
          # 上传所有文件到版本目录
          ossutil cp -r artifacts/ oss://${{ secrets.ALIYUN_OSS_BUCKET }}/xurenlu/sslcat/releases/$VERSION/ \
                     --parallel 10 \
                     --checkpoint-dir /tmp/oss-checkpoint \
                     --retry-times 3
          
          # 创建最新版本的符号链接（可选）
          ossutil cp oss://${{ secrets.ALIYUN_OSS_BUCKET }}/xurenlu/sslcat/releases/$VERSION/ \
                     oss://${{ secrets.ALIYUN_OSS_BUCKET }}/xurenlu/sslcat/latest/ \
                     --update

      - name: Verify upload
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "Verifying upload for version $VERSION..."
          ossutil ls oss://${{ secrets.ALIYUN_OSS_BUCKET }}/xurenlu/sslcat/releases/$VERSION/ \
                     --output-format json | jq -r '.objects[]?.key' | head -10
