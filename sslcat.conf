{
  "admin": {
    "enable_totp": true,
    "first_run": true,
    "password_file": "/opt/sslcat/data/admin.pass"
  },
  "cluster": {
    "node_id": "8348dd209d71ce1b"
  },
  "compression": {
    "algorithms": [
      "gzip"
    ],
    "excluded_types": [
      ".jpg",
      ".jpeg",
      ".png",
      ".gif",
      ".webp",
      ".ico",
      ".woff",
      ".woff2",
      ".ttf",
      ".eot",
      ".zip",
      ".gz",
      ".br"
    ],
    "level": {
      "brotli": 4,
      "gzip": 1
    },
    "min_size": 1024,
    "types": [
      ".js",
      ".css",
      ".html",
      ".htm",
      ".xml",
      ".json",
      ".txt",
      ".svg",
      ".md"
    ]
  },
  "monitoring": {
    "memory_max_usage_percent": 20,
    "memory_release_cooldown_sec": 300
  },
  "notification": {
    "channels": {
      "email": {
        "enabled": true,
        "method": "resend",
        "resend_from": "noreply@83d.me",
        "resend_to": "xurenlu@gmail.com",
        "sendmail_args": "-t",
        "sendmail_command": "/usr/sbin/sendmail",
        "smtp_port": 587,
        "use_tls": true
      },
      "webhook": {
        "headers": {
          "Content-Type": "application/json"
        },
        "timeout": 10
      }
    },
    "min_notification_level": "info"
  },
  "proxy": {
    "rules": [
      {
        "backends": [
          {
            "enabled": true,
            "host": "localhost",
            "id": "example.com_backend_1",
            "port": 3000,
            "weight": 1
          }
        ],
        "domain": "s.some.com",
        "enabled": true,
        "port": 3000,
        "ssl_only": true,
        "target": "localhost"
      }
    ]
  },
  "security": {
    "block_duration": "5m0s",
    "max_attempts": 1000,
    "max_attempts_5min": 5000
  },
  "server": {
    "enable_https": false,
    "host": "127.0.0.1",
    "port": 8080,
    "port_mode": "custom",
    "shared_cache_max_size_mb": 64
  },
  "ssl": {
    "email": "xurenlu@gmail.com",
    "key_dir": "/opt/sslcat/keys"
  },
  "tunnels": {
    "providers": [
      {
        "auto_start": true,
        "credentials": {
          "api_token": "cf_api_token_placeholder",
          "tunnel_id": "cf_tunnel_id_placeholder"
        },
        "enabled": true,
        "id": "cloudflare-home",
        "name": "Cloudflare @ Home",
        "options": {
          "region": "apac"
        },
        "tunnels": [
          {
            "auto_start": true,
            "id": "home-nas",
            "local_address": "127.0.0.1",
            "local_port": 5001,
            "name": "NAS Console",
            "notes": "Expose Synology via Cloudflare Tunnel",
            "protocol": "https",
            "public_hostname": "nas.example.com"
          }
        ],
        "type": "cloudflare"
      }
    ]
  }
}
