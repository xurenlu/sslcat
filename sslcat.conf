{
  "server": {
    "host": "0.0.0.0",
    "port": 443,
    "debug": false,
    "max_connections": 1000,
    "read_timeout_sec": 30,
    "write_timeout_sec": 30,
    "idle_timeout_sec": 120
  },
  "ssl": {
    "email": "admin@example.com",
    "staging": false,
    "auto_renew": true,
    "certificate_dir": "/opt/sslcat/certs",
    "key_dir": "/opt/sslcat/keys"
  },
  "admin": {
    "username": "admin",
    "password_file": "/opt/sslcat/data/admin.pass",
    "first_run": true,
    "session_timeout": "24h"
  },
  "proxy": {
    "rules": []
  },
  "security": {
    "max_attempts": 3,
    "block_duration": "5m",
    "max_attempts_5min": 10,
    "ip_whitelist": [],
    "ip_blacklist": [],
    "user_agent_validation": true,
    "rate_limiting": {
      "enabled": true,
      "requests_per_minute": 60,
      "burst_size": 10
    }
  },
  "logging": {
    "level": "info",
    "access_log": "/var/log/sslcat/access.log",
    "error_log": "/var/log/sslcat/error.log",
    "security_log": "/var/log/sslcat/security.log"
  }
}