{
  "server": {
    "host": "0.0.0.0",
    "port": 443,
    "debug": true,
    "access_log_enabled": true,
    "access_log_format": "nginx",
    "access_log_path": "./data/access.log",
    "access_log_max_size": 104857600,
    "access_log_max_files": 10,
    "read_timeout_sec": 1800,
    "write_timeout_sec": 1800,
    "idle_timeout_sec": 120,
    "max_upload_bytes": 1073741824
  },
  "ssl": {
    "email": "admin@example.com",
    "staging": true,
    "domains": null,
    "cert_dir": "./data/certs",
    "key_dir": "./data/keys",
    "auto_renew": false,
    "disable_self_signed": false,
    "dns_providers": [],
    "default_dns_provider": "",
    "challenge_methods": [
      "http-01"
    ]
  },
  "admin": {
    "username": "admin",
    "first_run": true,
    "password_file": "./data/admin.pass",
    "enable_totp": false,
    "totp_secret_file": "./data/admin.totp"
  },
  "proxy": {
    "rules": [],
    "unmatched_behavior": "502",
    "unmatched_redirect_url": ""
  },
  "security": {
    "max_attempts": 900,
    "block_duration": "5s",
    "max_attempts_5min": 1000,
    "block_file": "./data/sslcat.block",
    "allowed_user_agents": [
      "Mozilla/",
      "Chrome/",
      "Firefox/",
      "Safari/",
      "Edge/",
      "Opera/",
      "curl/",
      "wget/",
      "PostmanRuntime/",
      "axios/",
      "node-fetch/",
      "python-requests/",
      "Go-http-client/",
      "Java/",
      "Apache-HttpClient/",
      "okhttp/",
      "libwww-perl/",
      "WWW-Mechanize/",
      "LWP::Simple/",
      "HTTP::Request/",
      "urllib/",
      "requests/",
      "httpx/",
      "aiohttp/",
      "Vite"
    ],
    "blocked_user_agents": [],
    "rate_limit_enabled": true,
    "rate_limit_requests_per_minute": 1000,
    "rate_limit_burst": 100,
    "ddos_protection_enabled": true,
    "ddos_max_requests_per_minute": 1000,
    "ddos_block_duration": "5m"
  },
  "notifications": {
    "enabled": false,
    "channels": [],
    "email": {
      "smtp_host": "",
      "smtp_port": 587,
      "smtp_username": "",
      "smtp_password": "",
      "smtp_from": "",
      "smtp_to": "",
      "smtp_use_tls": true
    },
    "slack": {
      "webhook_url": ""
    },
    "webhook": {
      "url": ""
    }
  },
  "compression": {
    "enabled": true,
    "algorithms": ["br", "gzip"],
    "min_size": 1024,
    "gzip_level": 6,
    "brotli_level": 6,
    "types": [
      "text/html",
      "text/css",
      "text/javascript",
      "application/javascript",
      "application/json",
      "image/svg+xml",
      "text/xml",
      "application/xml"
    ]
  },
  "upstream_cache": {
    "enabled": true,
    "cache_dir": "./data/upstream-cache",
    "max_size_bytes": 1073741824,
    "default_ttl_seconds": 3600,
    "respect_upstream": true
  },
  "geoip": {
    "enabled": false,
    "database_path": "./data/geoip/GeoLite2-City.mmdb",
    "update_interval": 168,
    "allow_unknown": true,
    "allowed_countries": [],
    "blocked_countries": []
  },
  "metrics": {
    "enabled": false,
    "prometheus_enabled": false,
    "prometheus_port": 9090,
    "prometheus_path": "/metrics"
  },
  "runners": {
    "git": {
      "enabled": true,
      "repos_dir": "./data/runners/git",
      "max_concurrent": 3,
      "clone_timeout": 300,
      "auto_cleanup": true,
      "cleanup_interval": 7200
    }
  },
  "admin_prefix": "/sslcat-panel2"
}