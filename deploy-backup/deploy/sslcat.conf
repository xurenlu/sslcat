{
  "server": {
    "host": "0.0.0.0",
    "port": 443,
    "debug": false
  },
  "ssl": {
    "email": "your-email@example.com",
    "staging": false,
    "domains": [],
    "cert_dir": "/opt/sslcat/certs",
    "key_dir": "/opt/sslcat/keys",
    "auto_renew": true,
    "disable_self_signed": true
  },
  "admin": {
    "username": "admin",
    "password": "admin*9527",
    "first_run": true
  },
  "proxy": {
    "rules": [
      {
        "domain": "example.com",
        "target": "127.0.0.1",
        "port": 8080,
        "enabled": true,
        "ssl_only": true
      }
    ]
  },
  "security": {
    "max_attempts": 3,
    "block_duration": "1m",
    "max_attempts_5min": 10,
    "block_file": "/opt/sslcat/withssl.block",
    "allowed_user_agents": [
      "Mozilla/",
      "Chrome/",
      "Firefox/",
      "Safari/",
      "Edge/"
    ]
  },
  "notification": {
    "enabled": true,
    "channels": {
      "email": {
        "enabled": true,
        "smtp_host": "smtp.gmail.com",
        "smtp_port": 587,
        "username": "your-email@gmail.com",
        "password": "your-app-password",
        "from": "your-email@gmail.com",
        "to": ["admin@example.com"],
        "use_tls": true
      },
      "webhook": {
        "enabled": false,
        "url": "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK",
        "headers": {
          "Authorization": "Bearer your-token"
        },
        "timeout": 10
      },
      "syslog": {
        "enabled": false,
        "address": "localhost:514",
        "network": "udp"
      },
      "console": {
        "enabled": true
      }
    }
  },
  "admin_prefix": "/sslcat-panel"
}
